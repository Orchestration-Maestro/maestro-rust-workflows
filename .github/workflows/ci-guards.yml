name: CI guards

on:
  workflow_call:
    inputs:
      run-id:
        description: Completed Rust CI run to judge (a merge-group run for the time, shard and slow-test guards); empty runs only the test-time exception check
        type: string
        default: ''
      merge-run-budget-minutes:
        description: Minutes a merge-group run may take before an issue is filed
        type: number
        default: 45
      selection-window:
        description: Completed runs of the same event that make a sustained selection share
        type: number
        default: 10
      selection-share-ceiling-percent:
        description: Median share of workspace test packages selected over the window above which an issue is filed
        type: number
        default: 25
      shard-balance-margin:
        description: Slowest test shard may take at most this multiple of the median shard
        type: number
        default: 1.5
      slow-test-seconds:
        description: Seconds after which nextest flags a test slow; each such test on main gets one issue
        type: number
        default: 30
      slow-issue-limit:
        description: New slow-test issues one run may file (open issues are never filed twice)
        type: number
        default: 10
      hang-limit-seconds:
        description: Longest kill time a nextest override may declare without an open issue
        type: number
        default: 120
      nextest-config:
        description: Path of the caller's nextest configuration
        type: string
        default: .config/nextest.toml

permissions:
  contents: read

jobs:
  exceptions:
    name: Test-time exceptions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test-time exceptions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NEXTEST_CONFIG: ${{ inputs.nextest-config }}
          HANG_LIMIT_SECONDS: ${{ inputs.hang-limit-seconds }}
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tomllib

          def period_seconds(period):
              units = {'ms': 0.001, 's': 1, 'm': 60, 'h': 3600}
              return sum(int(count) * units[unit] for count, unit in re.findall(r'(\d+)(ms|s|m|h)', period))

          def nextest_exceptions(text, hang_seconds):
              """Overrides whose kill time passes the hang limit, with the issues named above their slow-timeout."""
              raise NotImplementedError('nextest_exceptions')

          def exception_findings(exceptions, state_of):
              """One message per exception that names no issue or only closed ones."""
              raise NotImplementedError('exception_findings')

          def main():
              path = pathlib.Path(os.environ['NEXTEST_CONFIG'])
              if not path.is_file():
                  print(f'No {path}: no exceptions to check')
                  return
              def state_of(number):
                  result = subprocess.run(['gh', 'issue', 'view', str(number), '-R', os.environ['REPOSITORY'], '--json', 'state'],
                                          capture_output=True, text=True)
                  if result.returncode:
                      raise RuntimeError(f'gh issue view {number} failed: {result.stderr.strip()}')
                  return json.loads(result.stdout)['state']
              exceptions = nextest_exceptions(path.read_text(encoding='utf-8'), float(os.environ['HANG_LIMIT_SECONDS']))
              messages = exception_findings(exceptions, state_of)
              for message in messages:
                  print(f'::error file={path}::{message}')
              print(f'{len(exceptions)} test-time exceptions, {len(messages)} refused')
              if messages:
                  sys.exit(1)

          if __name__ == '__main__':
              main()

  guards:
    name: Run guards
    if: ${{ inputs.run-id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Judge the run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run-id }}
          BUDGET_MINUTES: ${{ inputs.merge-run-budget-minutes }}
          SELECTION_WINDOW: ${{ inputs.selection-window }}
          SELECTION_CEILING: ${{ inputs.selection-share-ceiling-percent }}
          SHARD_MARGIN: ${{ inputs.shard-balance-margin }}
          SLOW_SECONDS: ${{ inputs.slow-test-seconds }}
          SLOW_ISSUE_LIMIT: ${{ inputs.slow-issue-limit }}
          # Jobs a full run must execute; a trailing * matches a name prefix.
          REQUIRED_CHECKS: >-
            ["Caller declaration", "Format and lint", "Docs", "Build test archive", "Test shard (*",
            "Doctests", "Tests (ubuntu-latest)", "Dependency, source and coverage checks"]
        shell: python
        run: |
          import datetime
          import json
          import os
          import re
          import statistics
          import subprocess
          import sys

          def clean(log):
              log = re.sub(r'\x1b\[[0-9;]*m', '', log)
              return re.sub(r'(?m)^\d{4}-\d\d-\d\dT[\d:.]+Z ', '', log)

          def stamp(value):
              return datetime.datetime.fromisoformat(value)

          def seconds(job):
              if job.get('conclusion') == 'skipped' or not job.get('started_at') or not job.get('completed_at'):
                  return None
              return (stamp(job['completed_at']) - stamp(job['started_at'])).total_seconds()

          def budget_finding(run, jobs, budget):
              """A merge-run over its minutes budget, with the run link and its slowest jobs."""
              minutes = (stamp(run['updated_at']) - stamp(run['run_started_at'])).total_seconds() / 60
              if minutes <= budget:
                  return None
              slowest = sorted(((seconds(job), job['name']) for job in jobs if seconds(job) is not None), reverse=True)[:5]
              listed = '\n'.join(f'- {name}: {took / 60:.1f} min' for took, name in slowest)
              return {'title': f"Merge run over its time budget: run {run['id']}",
                      'body': f"Run: {run['html_url']}\nTook {minutes:.1f} minutes; the budget is {budget:g} minutes.\n\nSlowest jobs:\n{listed}\n"}

          def selection_of(log):
              """Selected and total test packages and the full-suite trigger, as the selection step logs them."""
              raise NotImplementedError('selection_of')

          def selection_finding(rows, ceiling, window):
              """A sustained share: the median over a full window of runs is above the ceiling."""
              raise NotImplementedError('selection_finding')

          def slow_tests(log):
              """Longest slow mark nextest printed for each test."""
              found = {}
              for mark, binary, name in re.findall(r'SLOW \[\s*>\s*([0-9.]+)s\]\s+\([^)]*\)\s+(\S+)\s+(\S+)', clean(log)):
                  test = f'{binary} {name}'
                  found[test] = max(found.get(test, 0), float(mark))
              return found

          def grown_tests(current, previous):
              """The five slow tests that grew most: new, or past a higher slow mark than before."""
              grown = [(test, now, previous.get(test)) for test, now in current.items() if now > previous.get(test, 0)]
              return sorted(grown, key=lambda item: item[1] - (item[2] or 0), reverse=True)[:5]

          def shard_finding(run, jobs, margin, grown):
              """The slowest test shard is beyond the margin over the median; names the tests that grew."""
              took = sorted((seconds(job), job['name']) for job in jobs
                            if job['name'].startswith('Test shard (') and seconds(job) is not None)
              if len(took) < 2:
                  return None
              median = statistics.median(value for value, _ in took)
              slowest, name = took[-1]
              if slowest <= margin * median:
                  return None
              lines = '\n'.join(f"- `{test}`: over {now:g} s now, " + (f'over {before:g} s before' if before else 'not slow before')
                                for test, now, before in grown) or '- no test crossed a higher slow mark'
              return {'title': f"Test shards unbalanced: run {run['id']}",
                      'body': f"Run: {run['html_url']}\n{name} took {slowest / 60:.1f} min against a median shard of {median / 60:.1f} min "
                              f"({slowest / median:.2f} times; the margin is {margin:g}).\n\nSlow tests in that shard that grew:\n{lines}\n"}

          def slow_findings(slow, limit, run):
              """One issue per test that ran past the slow mark."""
              return [{'title': f'Test over {limit:g} seconds: {test}', 'slow': True,
                       'body': f"Run: {run['html_url']}\nNextest flagged this test slow, over {mark:g} seconds. "
                               'Fix the test at its cause; do not raise a timeout.\n'}
                      for test, mark in sorted(slow.items())]

          def required_finding(run, jobs, pinned):
              """Pinned jobs that did not run at all, so a renamed or removed gate cannot pass silently."""
              raise NotImplementedError('required_finding')

          def file_issues(findings, repository, gh, slow_limit):
              """Open an issue for each finding no open issue already carries; returns the titles filed."""
              existing = {item['title'] for item in json.loads(gh('issue', 'list', '-R', repository, '--state', 'open',
                                                                  '--limit', '1000', '--json', 'title'))}
              filed, slow = [], 0
              for finding in findings:
                  if finding['title'] in existing:
                      continue
                  if finding.get('slow'):
                      if slow >= slow_limit:
                          continue
                      slow += 1
                  gh('issue', 'create', '-R', repository, '--title', finding['title'], '--body-file', '-', body=finding['body'])
                  filed.append(finding['title'])
                  existing.add(finding['title'])
              return filed

          def judge(run_id, repository, gh, settings):
              """Every finding for one completed run."""
              def api(path):
                  return json.loads(gh('api', f'repos/{repository}/{path}'))
              def jobs_of(identifier):
                  pages = json.loads(gh('api', '--paginate', '--slurp', f'repos/{repository}/actions/runs/{identifier}/jobs?per_page=100'))
                  return [job for page in pages for job in page['jobs']]
              def log_of(job):
                  return gh('api', '--allow-escape-sequences', f"repos/{repository}/actions/jobs/{job['id']}/logs")
              def shard_slow(jobs):
                  found = {}
                  for job in jobs:
                      if job['name'].startswith('Test shard ('):
                          for test, mark in slow_tests(log_of(job)).items():
                              found[test] = max(found.get(test, 0), mark)
                  return found
              run = api(f'actions/runs/{run_id}')
              if run['status'] != 'completed' or run['conclusion'] == 'cancelled':
                  return []
              jobs = jobs_of(run_id)
              findings = [budget_finding(run, jobs, settings['budget'])]
              on_main = run['event'] in ('merge_group', 'push')
              slow = shard_slow(jobs)
              unbalanced = shard_finding(run, jobs, settings['margin'], [])
              if unbalanced:
                  earlier = [other for other in api(f"actions/workflows/{run['workflow_id']}/runs?event={run['event']}&status=success&per_page=10")['workflow_runs']
                             if other['id'] != run['id'] and other['created_at'] < run['created_at']]
                  previous = shard_slow(jobs_of(earlier[0]['id'])) if earlier else {}
                  unbalanced = shard_finding(run, jobs, settings['margin'], grown_tests(slow, previous))
              findings.append(unbalanced)
              if on_main:
                  findings.extend(slow_findings(slow, settings['slow'], run))
              return [finding for finding in findings if finding]

          def main():
              def gh(*argv, body=None):
                  result = subprocess.run(['gh', *argv], input=body, capture_output=True, text=True)
                  if result.returncode:
                      raise RuntimeError(f'gh {argv[0]} {argv[1]} failed: {result.stderr.strip()}')
                  return result.stdout
              settings = {'budget': float(os.environ['BUDGET_MINUTES']), 'window': int(float(os.environ['SELECTION_WINDOW'])),
                          'ceiling': float(os.environ['SELECTION_CEILING']), 'margin': float(os.environ['SHARD_MARGIN']),
                          'slow': float(os.environ['SLOW_SECONDS']), 'required': json.loads(os.environ['REQUIRED_CHECKS'])}
              repository = os.environ['REPOSITORY']
              try:
                  findings = judge(os.environ['RUN_ID'], repository, gh, settings)
                  filed = file_issues(findings, repository, gh, int(float(os.environ['SLOW_ISSUE_LIMIT'])))
              except (RuntimeError, KeyError, ValueError, OSError) as error:
                  sys.exit(f'CI guards failed: {error}')
              print(f'{len(findings)} findings, {len(filed)} issues filed')
              for title in filed:
                  print(f'Filed: {title}')

          if __name__ == '__main__':
              main()
