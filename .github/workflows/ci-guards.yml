name: CI guards

on:
  workflow_call:
    inputs:
      run-id:
        description: Completed Rust CI run to judge (a merge-group run for the time, shard and slow-test guards); empty runs only the test-time exception check
        type: string
        default: ''
      selection-window:
        description: Completed runs of the same workflow and event, up to and including the judged run, that every guard reads - for the selection share and for the earlier runs searched for a run's baseline
        type: number
        default: 10
      selection-share-ceiling-percent:
        description: Median share of workspace test packages selected over the window above which an issue is filed
        type: number
        default: 25
      shard-balance-margin:
        description: Slowest test shard may take at most this multiple of the median shard
        type: number
        default: 1.5
      slow-test-seconds:
        description: Seconds after which nextest flags a test slow; main's slow tests are listed in one issue
        type: number
        default: 30
      hang-limit-seconds:
        description: Longest kill time a nextest override may declare without an open issue
        type: number
        default: 120
      cache-storage-limit-gib:
        description: The repository's Actions cache storage limit in GiB, as its Actions settings show it; the job token cannot read that setting
        type: number
        default: 10
      nextest-config:
        description: Path of the caller's nextest configuration
        type: string
        default: .config/nextest.toml

permissions:
  contents: read

jobs:
  exceptions:
    name: Test-time exceptions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test-time exceptions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NEXTEST_CONFIG: ${{ inputs.nextest-config }}
          HANG_LIMIT_SECONDS: ${{ inputs.hang-limit-seconds }}
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tomllib

          def period_seconds(period):
              units = {'ms': 0.001, 's': 1, 'm': 60, 'h': 3600}
              return sum(int(count) * units[unit] for count, unit in re.findall(r'(\d+)(ms|s|m|h)', period))

          def nextest_exceptions(text, hang_seconds):
              """Overrides whose kill time passes the hang limit, with the issues named above their slow-timeout."""
              found = []
              for block in re.split(r'(?m)^(?=\[\[profile\.[^\]]+\.overrides\]\])', text)[1:]:
                  lines = block.splitlines()
                  own = []
                  for line in lines:
                      if own and line.startswith('['):
                          break
                      own.append(line)
                  override = tomllib.loads('\n'.join(own))['profile']
                  override = next(iter(override.values()))['overrides'][0]
                  timeout = override.get('slow-timeout')
                  if not isinstance(timeout, dict) or 'terminate-after' not in timeout:
                      continue
                  seconds = period_seconds(timeout['period']) * timeout['terminate-after']
                  if seconds <= hang_seconds:
                      continue
                  at = next(index for index, line in enumerate(own) if line.startswith('slow-timeout'))
                  issues = []
                  for line in reversed(own[:at]):
                      if not line.startswith('#'):
                          break
                      issues = [int(number) for number in re.findall(r'#(\d+)', line)] + issues
                  found.append({'filter': override.get('filter', ''), 'seconds': seconds, 'issues': issues})
              return found

          def exception_findings(exceptions, state_of):
              """One message per exception that names no issue or only closed ones."""
              messages = []
              for item in exceptions:
                  label = f"the {item['seconds']:g}-second exception for {item['filter']}"
                  if not item['issues']:
                      messages.append(f'{label} names no issue; put its issue number in the comment above slow-timeout')
                  elif all(state_of(number) == 'CLOSED' for number in item['issues']):
                      listed = ', '.join(f'#{number}' for number in item['issues'])
                      messages.append(f'{label} is refused: {listed} is closed, so fix the test and remove the exception')
              return messages

          def main():
              path = pathlib.Path(os.environ['NEXTEST_CONFIG'])
              if not path.is_file():
                  print(f'No {path}: no exceptions to check')
                  return
              def state_of(number):
                  result = subprocess.run(['gh', 'issue', 'view', str(number), '-R', os.environ['REPOSITORY'], '--json', 'state'],
                                          capture_output=True, text=True)
                  if result.returncode:
                      raise RuntimeError(f'gh issue view {number} failed: {result.stderr.strip()}')
                  return json.loads(result.stdout)['state']
              exceptions = nextest_exceptions(path.read_text(encoding='utf-8'), float(os.environ['HANG_LIMIT_SECONDS']))
              messages = exception_findings(exceptions, state_of)
              for message in messages:
                  print(f'::error file={path}::{message}')
              print(f'{len(exceptions)} test-time exceptions, {len(messages)} refused')
              if messages:
                  sys.exit(1)

          if __name__ == '__main__':
              main()

  guards:
    name: Run guards
    if: ${{ inputs.run-id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Judge the run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run-id }}
          SELECTION_WINDOW: ${{ inputs.selection-window }}
          SELECTION_CEILING: ${{ inputs.selection-share-ceiling-percent }}
          SHARD_MARGIN: ${{ inputs.shard-balance-margin }}
          SLOW_SECONDS: ${{ inputs.slow-test-seconds }}
          CACHE_STORAGE_LIMIT_GIB: ${{ inputs.cache-storage-limit-gib }}
          # Jobs a full run must execute; a trailing * matches a name prefix.
          REQUIRED_CHECKS: >-
            ["Caller declaration", "Format and lint", "Docs", "Build test archive", "Test shard (*",
            "Doctests", "Tests (ubuntu-latest)", "Dependency, source and coverage checks"]
        shell: python
        run: |
          import datetime
          import json
          import os
          import re
          import statistics
          import subprocess
          import sys

          def clean(log):
              log = re.sub(r'\x1b\[[0-9;]*m', '', log)
              return re.sub(r'(?m)^\d{4}-\d\d-\d\dT[\d:.]+Z ', '', log)

          def stamp(value):
              return datetime.datetime.fromisoformat(value)

          def seconds(job):
              """Seconds of a job or step that ran, None for a skipped one or one without times; a job and a step carry the same fields."""
              if job.get('conclusion') == 'skipped' or not job.get('started_at') or not job.get('completed_at'):
                  return None
              return (stamp(job['completed_at']) - stamp(job['started_at'])).total_seconds()

          def seeds(run):
              """A push to the default branch (`main`), the only run that saves compile snapshots."""
              return run['event'] == 'push' and run['head_branch'] == 'main'

          def watched(run):
              """Merge groups, pull requests and pushes to main gate a merge; CodeQL and other runs do not."""
              return run['name'] != 'CodeQL' and (run['event'] in ('merge_group', 'pull_request') or seeds(run))

          # Per kind of work: the name of the jobs that do it, and how a finding names those jobs and one unit of their work.
          WORK = {'tests': ('Test shard (', 'Test jobs', 'test run'),
                  'compiles': ('Build test archive', 'Build jobs', 'compile unit')}

          WORK = WORK | {f'{kind}-{host}': (f'{prefix}{host} ' if kind == 'tests' else f'{prefix} ({host})', f'{label} ({host})', unit)
                   for host in ('macos-latest', 'windows-latest') for kind, (prefix, label, unit) in list(WORK.items())}

          # The steps of a test shard that run the tests: the only seconds of a shard that count as test work.
          TEST_STEPS = ('Tests', 'Isolated tests')

          def bare(name):
              """A job name with one reusable caller's prefix removed (`suite / Docs` reads as `Docs`); the segment after the last ` / `."""
              return name.rpartition(' / ')[2]

          def kind_of(name):
              """The kind of work a job name measures, None for any other job; a reusable caller's prefix is not part of the name."""
              name = bare(name)
              kind = next((kind for kind, (measuring, _, _) in WORK.items() if name.startswith(measuring)), None)
              host = next((host for host in ('macos-latest', 'windows-latest') if host in name), None)
              return f'{kind}-{host}' if host and kind in ('tests', 'compiles') else kind

          def rated(name):
              """Whether the rate finding already judges the seconds of a timing: the archive build, a shard job and the step of a shard that runs its tests.
              Any other step of a shard is judged for growth like a step of any job; a download there is transfer, never test work."""
              # Behind one reusable caller's prefix the timing reads `caller / job / step`: the job is the first segment a kind recognises.
              parts = name.split(' / ')
              first = next((index for index, part in enumerate(parts) if kind_of(part) is not None), None)
              if first is None:
                  return False
              job, step = parts[first], ' / '.join(parts[first + 1:]) or None
              kind = kind_of(job)
              return (kind or '').startswith(('compiles', 'tests')) and (kind.startswith('compiles') or not step or step in TEST_STEPS)

          RATCHET_TITLE = 'CI time ratchet'

          # The kind of each standing finding: one open issue per kind lists every subject of it while it lasts.
          SLOWER, UNBALANCED, CACHE_FLOOR = ('CI run slower than its baseline', 'Test shards unbalanced',
                                             'Compile cache below its hit-rate floor')

          # The phrase that marks a pass, in a subject's evidence and in the recovery comment.
          PASSED = 'passed this guard'

          def identity(kind, subject):
              """The name of one subject of a kind, `kind: subject`, or the kind alone for a finding without subjects;
              the kind alone titles the issue, and an escalation's kind is built from what departed from the pattern."""
              return kind if subject is None else f'{kind}: {subject}'

          def finding(kind, subject, run, body, labels=()):
              """A guard finding about one subject of a kind. The kind titles the one open issue that lists its subjects;
              the run is evidence, never part of the title."""
              return {'kind': kind, 'subject': subject, 'title': identity(kind, subject), 'run': run['html_url'], 'body': body, 'labels': list(labels)}

          def slow_kind(limit):
              """The kind of a slow-test finding: the limit the test crossed, with the test's own name as its subject."""
              return f'Test over {limit:g} seconds'

          def recovery(kind, run, passed):
              """The subjects of one kind that a run judged and passed, by subject, with the evidence each one's section takes on its open issue,
              and the comment that issue earns when they leave none of its subjects breaching."""
              head = f"Run: {run['html_url']}\n{run['name']} ({run['event']}, {run['head_branch']}) {PASSED}: "
              return {'kind': kind, 'title': kind, 'recovery': True, 'run': run['html_url'],
                      'passed': {subject: f'{head}{text}.' for subject, text in passed.items()},
                      'body': f'{head}every subject listed here has passed.\nClose the issue when the fix is confirmed; the guard never closes it.\n'}

          # GitHub stamps job and step times to the second, 1 s at each boundary, so a work-time gap is measurable only above 2 s per executed job (S7759).
          STAMP_ERROR = 2

          def measurable(gap, units, ran):
              """Whether a gap in seconds per unit, over the units done by this many executed jobs, is more than their stamp error."""
              return gap * units > STAMP_ERROR * ran

          def level_of(run, band, kind):
              """The key of a ratchet level: a run is compared only with runs of its workflow, event and runner band, per kind of work."""
              return f"{run['workflow_id']}/{run['event']}/{band}/{kind}"

          def baseline_of(rates):
              """The median seconds per unit of earlier runs in the level; None below three runs."""
              return statistics.median(rates) if len(rates) >= 3 else None

          def ratchet_issue(repository, gh):
              """The open issue that stores the ratchet, as (number, levels); (None, {}) until the first level is stored."""
              listed = json.loads(gh('issue', 'list', '-R', repository, '--state', 'open', '--search', f'"{RATCHET_TITLE}" in:title',
                                     '--json', 'number,title,body'))
              for item in listed:
                  if item['title'] == RATCHET_TITLE:
                      block = re.search(r'```json\n(.*?)\n```', item['body'], re.DOTALL)
                      if not block:
                          raise RuntimeError(f"issue #{item['number']} holds no ratchet block")
                      return item['number'], json.loads(block[1])['levels']
              return None, {}

          def save_ratchet(repository, gh, number, levels):
              """Write the levels to the ratchet issue, creating the issue on first use."""
              body = ('The CI guards keep the lowest median seconds per unit of work of each level here. Do not edit it by hand: only the guard lowers a level, '
                      'and nothing raises one.\n\n'
                      f"```json\n{json.dumps({'levels': levels}, indent=2, sort_keys=True)}\n```\n")
              if number:
                  gh('issue', 'edit', str(number), '-R', repository, '--body-file', '-', body=body)
              else:
                  gh('issue', 'create', '-R', repository, '--title', RATCHET_TITLE, '--body-file', '-', body=body)

          def executed(jobs):
              """The jobs that ran: not skipped, not cancelled."""
              return [job for job in jobs if seconds(job) is not None and job.get('conclusion') != 'cancelled']

          def job_set(jobs):
              """Names of the jobs that ran: a run is compared only with runs that executed the same ones."""
              return {job['name'] for job in executed(jobs)}

          def work_of(jobs):
              """Seconds during which at least one job of a run was executing: the union of the jobs' start-to-end intervals."""
              total, end = 0.0, None
              for start, finish in sorted((stamp(job['started_at']), stamp(job['completed_at'])) for job in executed(jobs)):
                  if end is None or start > end:
                      total += (finish - start).total_seconds()
                  elif finish > end:
                      total += (finish - end).total_seconds()
                  end = finish if end is None or finish > end else end
              return total

          def wait_of(run, jobs):
              """Seconds of a run's wall time with no job executing: the wait for runners, never CI work.
              The run ends when its last executed job does: its updated_at keeps moving after that, when a check is re-requested."""
              ended = max((stamp(job['completed_at']) for job in executed(jobs)), default=stamp(run['run_started_at']))
              return max((ended - stamp(run['run_started_at'])).total_seconds() - work_of(jobs), 0.0)

          def capacity_finding(run, band, wait, work, prior, waits):
              """A runner wait over the median wait of like-for-like runs by more than 10% and by more than 2 minutes: capacity, not a regression."""
              baseline = baseline_of(waits)
              if not watched(run) or baseline is None or wait <= baseline * 1.10 or wait - baseline <= 120:
                  return None
              return escalation(run, 'runner wait over its median', [f"- {earlier['html_url']}" for earlier in prior],
                                [f'- The run waited {wait / 60:.1f} min for runners against a median wait of {baseline / 60:.1f} min; '
                                 'the limit is the median plus 10% and 2 minutes',
                                 f'- Work time was {work / 60:.1f} min. The time guard judges work per unit, so this is runner capacity, not a regression'], band)

          def band_of(jobs, annotations_of):
              """The runner hardware label of the run's slowest labelled job, the runner that sets its pace."""
              for job in sorted((job for job in jobs if seconds(job) is not None), key=seconds, reverse=True)[:3]:
                  for note in annotations_of(job):
                      found = re.search(r'runner-band: (\S+)', f"{note.get('title') or ''} {note.get('message') or ''}")
                      if found:
                          return found[1]
              return 'unknown'

          def reached(job, step):
              """Whether the job ran the named step to success."""
              return any(item['name'] == step and item.get('conclusion') == 'success' for item in job.get('steps', []))

          def cache_judged(jobs):
              """The jobs that judged their compile cache: the only jobs the floor guard reads."""
              return [job for job in jobs if reached(job, 'Compile cache hit-rate floor')]

          def cache_warnings(job, annotations_of):
              """The floor warnings a job printed for its compile cache, one per shape it compiled."""
              return [note['message'] for note in annotations_of(job) if note.get('title') == 'Compile cache floor']

          def cache_shape(message):
              """The compile cache shape a floor warning names: one shape is one snapshot, so it is the floor's subject."""
              return re.search(r'floor in shape (\S+?):', message)[1]

          def cache_pass_shape(log):
              """The compile cache shape a job's floor step judged and passed, None when the step judged no cache."""
              found = re.search(r'(?m)^Compile cache hit rate [0-9.]+% \(floor [0-9]+%\) in shape (\S+)$', clean(log))
              return found[1] if found else None

          def cache_finding(run, jobs, annotations_of):
              """One finding per compile cache shape that fell under its floor, with every job that judged that shape as evidence."""
              shapes = {}
              for job in cache_judged(jobs):
                  for warning in cache_warnings(job, annotations_of):
                      shapes.setdefault(cache_shape(warning), []).append(f"- {job['name']}: {warning}")
              return [finding(CACHE_FLOOR, shape, run,
                              f"Run: {run['html_url']}\n{run['name']} ({run['event']}, {run['head_branch']})\n\n"
                              + '\n'.join(lines) + '\n')
                      for shape, lines in shapes.items()] or None

          def snapshot_finding(run, jobs, caches):
              """A default-branch run that left compile snapshots unsaved: saves reported without a cache entry, none saved at all, or jobs cancelled before theirs."""
              measuring = [job for job in jobs if reached(job, 'Compile cache statistics')]
              saving = [job for job in jobs if reached(job, 'Save compile cache')]
              # A newer run's snapshot of the same shape and job replaces this run's, which the pruning job then deletes.
              stored = set()
              for cache in caches:
                  held = re.fullmatch(r'(.*-[0-9a-f]{64}-)(\d+)-\d+-(.*)', cache['key'])
                  if held and int(held[2]) >= run['id']:
                      stored.add(held[1] + held[3])
              unfinished = [job['name'] for job in jobs if job.get('conclusion') == 'cancelled']
              lines = []
              if len(stored) < len(saving):
                  lines.append(f'- {len(saving)} jobs reported a saved snapshot but the repository cache holds {len(stored)} for this run or a newer one')
              if measuring and not saving:
                  lines.append(f'- {len(measuring)} jobs measured their compile cache but none saved a snapshot')
              if unfinished:
                  lines.append(f"- The run was cancelled with {len(unfinished)} jobs unfinished: {', '.join(unfinished)}")
              if not lines:
                  return None
              return finding(identity('Escalation', 'default-branch run did not seed its compile snapshots'), None, run,
                             f"Run: {run['html_url']}\n{run['name']} ({run['event']}, {run['head_branch']})\n\n"
                             'What departed from one saved snapshot per seeded shape:\n' + '\n'.join(lines) + '\n', ['escalation'])

          def storage_limit(declared):
              """The declared cache storage limit in GiB; GitHub answers the job token's read of the setting with 403, so the caller states it."""
              limit = float(declared or 0)
              if not limit > 0:
                  raise ValueError(f'cache-storage-limit-gib must be the repository cache storage limit in GiB, a positive number, not {declared!r}')
              return limit

          def usage_finding(run, usage, limit_gb, caches):
              """The repository cache over 90% of its storage limit, with its largest entries by ref."""
              limit, used = limit_gb * 1024**3, usage['active_caches_size_in_bytes']
              if used <= limit * 0.9:
                  return None
              largest = '\n'.join(f"- {cache['ref']}: {cache['size_in_bytes'] / 1024**3:.2f} GiB {cache['key']}"
                                  for cache in sorted(caches, key=lambda cache: cache['size_in_bytes'], reverse=True)[:5])
              return finding('Repository cache above 90% of its limit', None, run,
                             f"Run: {run['html_url']}\n{run['name']} ({run['event']}, {run['head_branch']})\n\n"
                             f"The repository cache holds {used / 1024**3:.2f} GiB in {usage['active_caches_count']} entries against its {limit_gb:g} GiB limit "
                             f"({used / limit:.1%}); the threshold is 90%. Over the limit, GitHub evicts the oldest snapshots.\n\nLargest entries by ref:\n{largest}\n")

          def spread_of(history, pad, ceiling=None):
              """The range of earlier values widened by `pad`, never below zero or above the ceiling; None below three values."""
              if len(history) < 3:
                  return None
              high = max(history) + pad
              return max(min(history) - pad, 0), high if ceiling is None else min(high, ceiling)

          def departure(value, history, pad, ceiling=None):
              """'below' or 'above' when a value is outside the spread of its earlier values, else None."""
              spread = spread_of(history, pad, ceiling)
              if spread is None:
                  return None
              return 'below' if value < spread[0] else 'above' if value > spread[1] else None

          def rate_pad(history):
              """10% of the median of earlier rates: how far a rate may stray from them before it stands out."""
              return 0.10 * statistics.median(history or [0])

          def escalation(run, what, baseline, lines, band=None):
              """An issue for something out of the pattern, with the run, its baseline and what departed from it; each departure is a kind of its own,
              so a repeat rewrites its open issue in place."""
              where = f' on runner band {band}' if band else ''
              return finding(identity('Escalation', what), None, run,
                             f"Run: {run['html_url']}\n{run['name']} ({run['event']}, {run['head_branch']}){where}.\n\n"
                             'Baseline (earlier successful runs of the same workflow and event):\n' + '\n'.join(baseline)
                             + '\n\nWhat departed from it:\n' + '\n'.join(lines) + '\n', ['escalation'])

          def range_findings(run, band, measured, units, ran, prior, prior_measured):
              """Escalations for a rate below its band's normal spread by more than the stamp error (a rate above it is the regression's)
              and for a compile cache hit rate off its usual range."""
              baseline = [f"- {earlier['html_url']}" for earlier in prior]
              found = []
              for kind, (_, _, unit) in WORK.items():
                  history = [rates[kind] for rates in prior_measured if kind in rates]
                  if (kind in measured and departure(measured[kind], history, rate_pad(history)) == 'below'
                          and measurable(baseline_of(history) - measured[kind], units[kind], ran[kind])):
                      low, high = spread_of(history, rate_pad(history))
                      found.append(escalation(run, f'time per {unit} outside its normal spread', baseline,
                                              [f"- {measured[kind]:.2f} s per {unit}, below the band's normal spread of {low:.2f} to {high:.2f} s "
                                               '(the earlier rates, widened by 10%)'], band))
              history = [rates['hit-rate'] for rates in prior_measured if 'hit-rate' in rates]
              side = departure(measured['hit-rate'], history, 10, 100) if 'hit-rate' in measured else None
              if side:
                  low, high = spread_of(history, 10, 100)
                  found.append(escalation(run, 'compile cache hit rate outside its usual range', baseline,
                                          [f"- Compile cache hit rate {measured['hit-rate']:.2f}%, {side} its usual range of {low:.2f}% to {high:.2f}% "
                                           '(the earlier hit rates, widened by 10 points)'], band))
              return found

          def timings(jobs):
              """Seconds of every job that ran and of every step in it that ran, by name."""
              found = {}
              for job in executed(jobs):
                  found[job['name']] = seconds(job)
                  for step in job.get('steps', []):
                      if seconds(step) is not None:
                          found[f"{job['name']} / {step['name']}"] = seconds(step)
              return found

          def shape_finding(run, band, jobs, prior, prior_jobs):
              """Jobs and steps of a successful run that appear, disappear or grow (past the earlier range plus 10% and 30 s) without matching work.
              The seconds a rate judges (see `rated`) are only checked for appearing and disappearing."""
              if run['conclusion'] != 'success' or len(prior_jobs) < 3:
                  return None
              now, before = timings(jobs), [timings(earlier) for earlier in prior_jobs]
              lines = [f'- {name} appeared' for name in sorted(now.keys() - set().union(*before))]
              lines += [f'- {name} disappeared' for name in sorted(set.intersection(*map(set, before)) - now.keys())]
              for name, value in sorted(now.items()):
                  history = [earlier[name] for earlier in before if name in earlier]
                  if not rated(name) and departure(value, history, max(rate_pad(history), 30)) == 'above':
                      lines.append(f'- {name} grew to {value:.0f} s (earlier: {min(history):.0f} to {max(history):.0f} s)')
              if not lines:
                  return None
              return escalation(run, 'jobs or steps changed without matching work', [f"- {earlier['html_url']}" for earlier in prior], lines, band)

          def selection_departure(run, rows):
              """The judged run's test package share when it is outside the usual range of the earlier runs' shares, widened by 10 points."""
              (_, selected, total, trigger), history = rows[0], rows[1:]
              shares = [chosen * 100 / count for _, chosen, count, _ in history]
              share = selected * 100 / total
              side = departure(share, shares, 10, 100)
              if side is None:
                  return None
              low, high = spread_of(shares, 10, 100)
              return escalation(run, 'test selection share outside its usual range',
                                [f'- run {identifier}: {chosen}/{count} packages ({chosen * 100 / count:.0f}%)' for identifier, chosen, count, _ in history],
                                [f'- This run selected {selected}/{total} test packages ({share:.0f}%), {side} the usual range of {low:.0f}% to {high:.0f}%'
                                 + (f', full suite because {trigger}' if trigger else '')])

          def totals_of(jobs, annotations_of):
              """The compile cache hit rate, and the seconds spent, units done and jobs executed per kind of work, from the work-unit annotations of a run's jobs.
              A test shard counts the seconds of its Tests or Isolated tests step, so downloads and setup are not test work; the archive build counts its whole job."""
              found, spent, units, ran = {}, {}, {}, {}
              for job in executed(jobs):
                  kind = kind_of(job['name'])
                  if kind is None:
                      continue
                  took = sum(seconds(step) or 0 for step in job.get('steps', []) if step['name'] in TEST_STEPS) if kind.startswith('tests') else seconds(job)
                  for note in annotations_of(job):
                      if note.get('title') != 'Work units':
                          continue
                      for name, value in re.findall(r'(tests|compiles|hit-rate): ([0-9.]+)', note['message']):
                          if name == 'hit-rate':
                              found[name] = float(value)
                          elif name == kind.split('-', 1)[0] and float(value) > 0:
                              spent[kind] = spent.get(kind, 0) + took
                              units[kind] = units.get(kind, 0) + float(value)
                              ran[kind] = ran.get(kind, 0) + 1
              return found, spent, units, ran

          def measures_of(jobs, annotations_of):
              """Seconds per unit of each kind of work in a run, and its compile cache hit rate."""
              found, spent, units, _ = totals_of(jobs, annotations_of)
              return found | {kind: spent[kind] / units[kind] for kind in spent}

          def rate_finding(run, measured, units, ran, prior, prior_measured, band, ratchet):
              """The breaches and the passes of one run, per kind of work, judged against the lower of the band's recent median and its stored
              ratchet level: a breach when the seconds per unit are more than 10% over it and the gap, over its units, is more than the stamp
              error of the jobs that did them, a pass as (subject, text) otherwise. The kind of work is the subject, never the run."""
              if not watched(run):
                  return [], []
              runs = '\n'.join(f"- {earlier['html_url']}" for earlier in prior)
              found, passed = [], []
              for kind, (_, jobs, unit) in WORK.items():
                  history = [rates[kind] for rates in prior_measured if kind in rates]
                  baseline = baseline_of(history)
                  if baseline is None or kind not in measured:
                      continue
                  baseline = min(baseline, ratchet.get(kind, baseline))
                  rate = measured[kind]
                  if rate > baseline * 1.10 and measurable(rate - baseline, units[kind], ran[kind]):
                      outside = departure(rate, history, rate_pad(history)) == 'above'
                      found.append(finding(SLOWER, f'{jobs} on {band}', run,
                                           f"Run: {run['html_url']}\n{run['name']} ({run['event']}, {run['head_branch']}) on runner band {band}.\n"
                                           'Time per unit of work against the lower of the band\'s recent median and its stored ratchet level:\n\n'
                                           f"- {jobs}: {rate:.2f} s per {unit} against a baseline of {baseline:.2f} s "
                                           f"(+{(rate / baseline - 1) * 100:.0f}%, limit +10%)\n  Ratchet level: `{level_of(run, band, kind)}`\n\n"
                                           f"Latest baseline runs (successful, same workflow, event and runner band):\n{runs}\n",
                                           ['escalation'] if outside else []))
                  else:
                      passed.append((f'{jobs} on {band}',
                                     f'{rate:.2f} s per {unit} against a baseline of {baseline:.2f} s, '
                                     + ('over the 10% limit but not a measurable regression' if rate > baseline * 1.10
                                        else 'inside the 10% limit')))
              return found, passed

          def selection_of(log):
              """Selected and total test packages and the full-suite trigger, as the selection step logs them."""
              log = clean(log)
              count = re.search(r'(?m)^Selected package count: (\d+)/(\d+)$', log)
              if not count:
                  return None
              fallback = re.search(r'(?m)^Full-suite fallback: (.+)$', log)
              return int(count[1]), int(count[2]), fallback[1] if fallback else None

          def selection_finding(run, rows, ceiling, window):
              """A sustained share: the median over a full window of runs is above the ceiling."""
              if len(rows) < window:
                  return None
              shares = [selected * 100 / total for _, selected, total, _ in rows]
              median = statistics.median(shares)
              if median <= ceiling:
                  return None
              listed = '\n'.join(f"- run {run_id}: {selected}/{total} packages ({selected * 100 / total:.0f}%)"
                                 + (f", full suite because {trigger}" if trigger else '')
                                 for run_id, selected, total, trigger in rows)
              return finding('Test selection share above its range', None, run,
                             f"Run: {run['html_url']}\nThe median share of workspace test packages selected over the last {len(rows)} runs is "
                             f'{median:.0f}%; the expected ceiling is {ceiling:g}%.\n\n{listed}\n')

          def test_results(log):
              """Every test a shard's log reports, with its longest slow mark, None when it never crossed one.

              Nextest prints a result line as `<status> [<seconds>] (<bar>) <binary> <test>`; a slow mark is a lower bound, so the longest one stands."""
              found = {}
              for status, mark, binary, name in re.findall(
                      r'(?m)^\s*(?:TRY \d+ )?(PASS|FAIL|SLOW|LEAK)\s+\[\s*(?:>\s*)?([0-9.]+)s\]\s+(?:\([^)]*\)\s+)?(\S+)\s+(\S+)\s*$', clean(log)):
                  test = f'{binary} {name}'
                  if status == 'SLOW':
                      found[test] = max(found.get(test) or 0, float(mark))
                  else:
                      found.setdefault(test, None)
              return found

          def slow_marks(results):
              """The slow tests among a shard's results, with their longest mark."""
              return {test: mark for test, mark in results.items() if mark is not None}

          def shard_phases(log):
              """The fixed phases a shard's log times before its tests: the extraction of its instrumented targets, then each test setup."""
              log = clean(log)
              # The extraction prints minutes once it runs past a minute, as `in 3m 17.20s`.
              extracted = [('extraction of instrumented targets', int(minutes or 0) * 60 + float(took))
                           for minutes, took in re.findall(r'(?m)^\s*Extracted \d+ files to \S+ in (?:(\d+)m )?([0-9.]+)s', log)]
              return extracted + [(f'setup {name}', float(took))
                                  for took, name in re.findall(r'(?m)^\s*SETUP PASS \[\s*([0-9.]+)s\] (\S+):', log)]

          def test_seconds(log):
              """The seconds nextest reports for the shard's tests themselves, None without its summary."""
              found = re.search(r'(?m)^\s*Summary \[\s*([0-9.]+)s\]', clean(log))
              return float(found[1]) if found else None

          def grown_tests(current, previous):
              """The five slow tests that grew most: new, or past a higher slow mark than before."""
              grown = [(test, now, previous.get(test)) for test, now in current.items() if now > previous.get(test, 0)]
              return sorted(grown, key=lambda item: item[1] - (item[2] or 0), reverse=True)[:5]

          def shards_of(jobs):
              """The test shard jobs that ran: the only jobs the balance guard weighs."""
              return [job for job in jobs if (kind_of(job['name']) or '').startswith('tests') and seconds(job) is not None]

          def shard_kinds(jobs):
              """The host of each test shard that ran: a shard is weighed against the shards that ran on its own host."""
              return sorted({kind_of(job['name']) for job in shards_of(jobs)})

          def shards_on(jobs, kind):
              """The test shard jobs of one host that ran."""
              return [job for job in shards_of(jobs) if kind_of(job['name']) == kind]

          def shard_median(jobs, kind):
              """The median seconds of one host's test shards: the shard a balance finding is weighed against; None below two shards."""
              ran = shards_on(jobs, kind)
              return statistics.median(seconds(job) for job in ran) if len(ran) >= 2 else None

          def slowest_shard(jobs, margin):
              """The test shard furthest past the margin over its own host's median, as its job, its seconds and that median; None when every host's shards are balanced."""
              worst = None
              for kind in shard_kinds(jobs):
                  median = shard_median(jobs, kind)
                  if median is None:
                      continue
                  slowest = max(shards_on(jobs, kind), key=seconds)
                  if seconds(slowest) > margin * median and (worst is None or seconds(slowest) / median > worst[1] / worst[2]):
                      worst = (slowest, seconds(slowest), median)
              return worst

          def shard_finding(run, blamed, margin, grown, reading):
              """The finding for a shard past the margin: the slow tests that grew on that shard, then the fixed phases it paid before them.
              Only that shard's own log names its tests and its phases, so neither is another shard's work."""
              job, slowest, median = blamed
              lines = '\n'.join(f"- `{test}`: over {now:g} s now, " + (f'over {before:g} s before' if before else 'not slow before')
                                for test, now, before in grown) or '- no test crossed a higher slow mark'
              phases = [f'- {name}: {took:.1f} s' for name, took in reading['phases']]
              if reading['tests'] is not None:
                  phases.append(f"- its tests: {reading['tests']:.1f} s (the nextest summary)")
              body = (f"Run: {run['html_url']}\n{job['name']} took {slowest / 60:.1f} min against a median shard of {median / 60:.1f} min "
                      f"({slowest / median:.2f} times; the margin is {margin:g}).\n\nSlow tests in that shard that grew:\n{lines}\n")
              if phases:
                  body += '\nFixed phases of that shard:\n' + '\n'.join(phases) + '\n'
              return finding(UNBALANCED, bare(job['name']), run, body)

          def slow_findings(slow, limit, run):
              """One finding per test that ran past the slow mark, each a subject of the one slow-test issue."""
              return [finding(slow_kind(limit), test, run,
                              f"Run: {run['html_url']}\nNextest flagged this test slow, over {mark:g} seconds. "
                              'Fix the test at its cause; do not raise a timeout.\n')
                      for test, mark in sorted(slow.items())]

          def reuses_tests(run, jobs):
              """A main push whose declaration confirmed reuse of this exact commit's merge-queue tests."""
              return seeds(run) and any(bare(job['name']) == 'Caller declaration' and reached(job, 'Reuse merge queue tests') for job in jobs)

          def required_finding(run, jobs, pinned):
              """Pinned jobs that did not run at all, so a renamed or removed gate cannot pass silently.
              The subject is the set of missing checks, never the run id, so a listener keeps one issue, not one per landing."""
              if reuses_tests(run, jobs):
                  pinned = [name for name in pinned if name not in ('Test shard (*', 'Doctests')]
              ran = [bare(job['name']) for job in jobs if job.get('conclusion') in ('success', 'failure')]
              missing = [name for name in pinned if not any(
                  job.startswith(name[:-1]) if name.endswith('*') else job == name for job in ran)]
              if not missing:
                  return None
              return finding('Required checks missing', ', '.join(missing), run,
                             f"Run: {run['html_url']}\nThese pinned jobs did not run: " + ', '.join(f'`{name}`' for name in missing) +
                             '.\nA job was renamed, removed or skipped; restore it or update the pinned list.\n')

          def open_numbers(repository, gh):
              """Every open issue's number by title, lowest first: a guard issue is titled by its kind, and two runs that finished at the same
              moment can open that title twice, so the lowest number holds the kind and the rest are duplicates waiting to be folded in."""
              listed = json.loads(gh('issue', 'list', '-R', repository, '--state', 'open', '--limit', '1000', '--json', 'number,title'))
              numbers = {}
              for item in sorted(listed, key=lambda item: item['number']):
                  numbers.setdefault(item['title'], []).append(item['number'])
              return numbers

          # The opening of every guard issue; one section per subject of its kind follows it.
          LISTED = ('The CI guards rewrite this issue in place on every run that judges one of its subjects, and comment only on a change: '
                    'a new subject, or every subject passing. Close the issue when the fix is confirmed; the guard never closes it.\n')

          # The head of a subject's section: the subject (none for a kind without subjects), its state and the run that first breached it.
          SECTION = re.compile(r'(?m)^(?:### `(?P<subject>[^`\n]+)`\n)?(?P<state>Breaching|Passed), first seen in (?P<first>\S+)\.$')

          def listing_of(number, body):
              """The subjects an open guard issue lists, by subject, as (state, first-seen run, latest evidence).
              A body without one section is not the guard's, so the guard fails rather than overwrite it."""
              body = body.replace('\r\n', '\n')
              heads = list(SECTION.finditer(body))
              if not heads:
                  raise RuntimeError(f'issue #{number} lists no guard subjects; close it, and the next breach of its kind opens a new issue')
              ends = [head.start() for head in heads[1:]] + [len(body)]
              return {head['subject']: (head['state'], head['first'], body[head.end():end].strip()) for head, end in zip(heads, ends)}

          def listing_body(listing):
              """The body of a guard issue: one section per subject, with its state, the run that first breached it and its latest evidence."""
              return LISTED + ''.join(('' if subject is None else f'\n### `{subject}`') + f'\n{state}, first seen in {first}.\n\n{evidence}\n'
                                      for subject, (state, first, evidence) in listing.items())

          # GitHub refuses an issue body over 65,536 characters.
          BODY_LIMIT = 65536

          # GitHub limits a comment to the same 65,536 characters as an issue body, while one write records a section per subject.
          COMMENT_LIMIT = BODY_LIMIT

          def bounded(kind, listing):
              """A listing whose body fits GitHub's limit: subjects that passed leave it, the earliest listed first.
              A subject still breaching is never dropped, so breaching subjects alone past the limit fail the run."""
              after = dict(listing)
              passed = [subject for subject, (state, _, _) in after.items() if state == 'Passed']
              while passed and len(listing_body(after)) > BODY_LIMIT:
                  del after[passed.pop(0)]
              if len(listing_body(after)) > BODY_LIMIT:
                  raise RuntimeError(f'the {kind!r} issue would list more breaching subjects than one issue body holds; fix them and close it')
              return after

          def merged(listing, group):
              """A kind's listing after one run's findings: a breach lists its subject or updates it, keeping the run that first breached it,
              and a pass updates only a subject already listed."""
              after = dict(listing)
              for item in group:
                  if item.get('recovery'):
                      after |= {subject: ('Passed', after[subject][1], evidence) for subject, evidence in item['passed'].items() if subject in after}
                  else:
                      first = after[item['subject']][1] if item['subject'] in after else item['run']
                      after[item['subject']] = ('Breaching', first, item['body'].strip())
              return after

          def change_of(before, after, group):
              """The comment a rewrite earns: the subjects it lists for the first time, or the recovery once no subject that was breaching still is;
              None when only the runs and the numbers changed."""
              new = [subject for subject in after if subject not in before]
              if new:
                  return f"Run: {group[0]['run']}\nNew subjects: " + ', '.join(f'`{subject}`' for subject in new) + '.\n'
              if any(state == 'Breaching' for state, _, _ in before.values()) and all(state == 'Passed' for state, _, _ in after.values()):
                  return next(item['body'] for item in group if item.get('recovery'))
              return None

          # A write records, as a hidden comment, the sections a later run cannot rebuild from the body, and it writes that comment before it
          # writes the body: the subject this write adds, which no body lists yet, and the subject whose state changed since the guard
          # recorded it, so a passed subject the body drops to fit comes back as passed. GitHub has no write that refuses a body built from
          # an older read, so a body alone can lose a subject, while a comment, once written, stays. A repeat breach of a listed subject
          # changes neither, so it adds no comment. The guard posts with the workflow's token, and the reader that reads a record back spells
          # that token's author `github-actions`, so only that login is a record: a marker in anyone else's comment is text.
          RECORD_AUTHOR = 'github-actions'
          RECORD = re.compile(r'<!-- ci-guards record: (?P<sections>.*?) -->')

          def record_comment(sections):
              """The hidden comment that records the sections a write adds: what a later run reads back to rebuild the body."""
              return f'<!-- ci-guards record: {json.dumps({subject or "": list(section) for subject, section in sections.items()})} -->\n'

          def record_comments(sections):
              """The hidden comments that record the sections a write adds, each within GitHub's comment limit: the reader takes them all back
              as one record, so a write that adds more sections than one comment holds posts as many comments as it needs."""
              comments = []
              for subject, section in sections.items():
                  if comments and len(record_comment(comments[-1] | {subject: section})) <= COMMENT_LIMIT:
                      comments[-1][subject] = section
                  else:
                      comments.append({subject: section})
              if any(len(record_comment(comment)) > COMMENT_LIMIT for comment in comments):
                  raise RuntimeError("a subject's section is longer than one issue comment holds; shorten its evidence")
              return [record_comment(comment) for comment in comments]

          def sections_to_record(body, record, listed):
              """The sections a write records: the subject it adds, which no body lists yet, and the subject whose state changed since the
              guard recorded it, so a passed subject the body drops to fit comes back as passed. A subject the body already lists needs no
              entry until its state changes, so a repeat breach of it records nothing."""
              return {subject: section for subject, section in listed.items()
                      if (subject not in body and subject not in record) or (subject in record and record[subject][0] != section[0])}

          def read_back(number, repository, gh):
              """An issue's body sections and the subjects its own record comments hold, the last write's entry winning per subject: the record
              is what the guard rebuilds a body from, and a body without one section is not the guard's, so the guard fails before writing.
              A comment by any other author is not a record, however it is marked."""
              held = json.loads(gh('issue', 'view', str(number), '-R', repository, '--json', 'body,comments'))
              record = {}
              for comment in held['comments']:
                  if (comment.get('author') or {}).get('login') != RECORD_AUTHOR:
                      continue
                  for found in RECORD.finditer(comment['body']):
                      record |= {subject or None: tuple(section) for subject, section in json.loads(found['sections']).items()}
              return listing_of(number, held['body']), record

          def opened(kind, group, repository, gh, made):
              """Open the kind's issue with this run's findings, then look again for a run that finished at the same moment and opened the same
              kind first: the lower number holds the kind, and the duplicate this run opened keeps its own copy of these findings, points at that
              issue, and stays open until a later run folds it in. Returns the number that holds the kind and the number this run opened."""
              after = bounded(kind, merged({}, group))
              labels = list(dict.fromkeys(label for item in group for label in item.get('labels', [])))
              for label in labels:
                  if label not in made:
                      gh('label', 'create', label, '-R', repository, '--force', '--description', 'Out of the pattern: a CI guard found a departure to investigate')
                      made.add(label)
              labelled = [argument for label in labels for argument in ('--label', label)]
              ours = int(gh('issue', 'create', '-R', repository, '--title', kind, *labelled, '--body-file', '-',
                            body=listing_body(after)).strip().rsplit('/', 1)[-1])
              holder = open_numbers(repository, gh).get(kind, [ours])[0]
              if holder != ours:
                  gh('issue', 'comment', str(ours), '-R', repository, '--body-file', '-',
                     body=f'Duplicate of #{holder}: another run judged this kind at the same moment and the lower number holds it.\n')
              return holder, ours

          def file_issues(findings, repository, gh, existing=None):
              """Keep one open issue per kind listing its subjects: open it with the kind's first breach, rewrite it in place on each later run that
              judges one of them, and comment only on a change. Each write records the sections a later run cannot rebuild from the body before
              it writes the body, so a run that wrote a body built from an older read leaves that body behind but never drops a subject: the
              next run rebuilds it from the record. A duplicate holds its run's findings until a later run folds them into the record of the
              issue that holds the kind and only then closes it. A pass with no open issue or listed subject says nothing. Returns the kinds
              opened or rewritten."""
              existing = open_numbers(repository, gh) if existing is None else existing
              kinds = {}
              for finding in findings:
                  kinds.setdefault(finding['kind'], []).append(finding)
              filed, made = [], set()
              for kind, group in kinds.items():
                  numbers = existing.get(kind, [])
                  if numbers:
                      holder, duplicates = numbers[0], numbers[1:]
                  else:
                      # A run that is only passing subjects of a kind with no open issue says nothing and opens nothing.
                      if all(item.get('recovery') for item in group):
                          continue
                      # The issue this run opened holds the body this run just wrote, and it never folds itself in; a run that lost the race
                      # writes its findings onto the issue that holds the kind.
                      holder, ours = opened(kind, group, repository, gh, made)
                      duplicates = []
                      filed.append(kind)
                  body, record = read_back(holder, repository, gh)
                  # The body is the latest full listing, so it wins where it lists a subject, and the record adds the subjects a body built from an
                  # older read left out. A duplicate's own sections join the listing where neither lists them, and the section the kind's issue
                  # already lists stays as it is.
                  before = dict(body)
                  for subject, section in record.items():
                      before.setdefault(subject, section)
                  folded = [read_back(number, repository, gh)[0] for number in duplicates]
                  held = dict(before)
                  for sections in folded:
                      for subject, section in sections.items():
                          held.setdefault(subject, section)
                  listed = merged(held, group)
                  after = bounded(kind, listed)
                  fresh = sections_to_record(body, record, listed)
                  if fresh:
                      # Only a section a later run cannot rebuild from the body is worth a comment: a repeat's evidence updates the body
                      # alone. The records go first, so a body left behind is rebuilt from them and a duplicate's subjects are safe to close over.
                      for record_body in record_comments(fresh):
                          gh('issue', 'comment', str(holder), '-R', repository, '--body-file', '-', body=record_body)
                  if body != after:
                      gh('issue', 'edit', str(holder), '-R', repository, '--body-file', '-', body=listing_body(after))
                      comment = change_of(before, after, group)
                      if comment:
                          gh('issue', 'comment', str(holder), '-R', repository, '--body-file', '-', body=comment)
                      filed.append(kind)
                  for number in duplicates:
                      gh('issue', 'close', str(number), '-R', repository)
              return list(dict.fromkeys(filed))

          def judge(run_id, repository, gh, settings, existing=None):
              """Every finding for one completed run, and a recovery for each open kind with subjects it judged and passed; also lowers the stored ratchet level of the run's band
              when the earlier runs show a lower median. `existing` is `open_numbers`, read once here when a caller has not read it."""
              def api(path):
                  return json.loads(gh('api', f'repos/{repository}/{path}'))
              known = {}
              def jobs_of(identifier):
                  if identifier not in known:
                      pages = json.loads(gh('api', '--paginate', '--slurp', f'repos/{repository}/actions/runs/{identifier}/jobs?per_page=100'))
                      known[identifier] = [job for page in pages for job in page['jobs']]
                  return known[identifier]
              def runs_like(run, status):
                  # A required workflow is not listed under its own id, so list the repository's runs and keep this workflow's earlier ones, newest first.
                  listed = api(f"actions/runs?event={run['event']}&status={status}&per_page=100")['workflow_runs']
                  older = [other for other in listed if other['workflow_id'] == run['workflow_id'] and other['created_at'] < run['created_at']]
                  return sorted(older, key=lambda other: other['created_at'], reverse=True)
              noted = {}
              def annotations_of(job):
                  if job['id'] not in noted:
                      noted[job['id']] = json.loads(gh('api', f"repos/{repository}/check-runs/{job['id']}/annotations"))
                  return noted[job['id']]
              def log_of(job):
                  return gh('api', '--allow-escape-sequences', f"repos/{repository}/actions/jobs/{job['id']}/logs")
              def shard_readings(jobs):
                  # What each test shard's own log measures: its test results, the fixed phases it names, its tests' seconds.
                  found = {}
                  for job in jobs:
                      if (kind_of(job['name']) or '').startswith('tests'):
                          log = log_of(job)
                          found[job['name']] = {'results': test_results(log), 'phases': shard_phases(log), 'tests': test_seconds(log)}
                  return found
              def slow_of(readings):
                  # Every slow test of a run with its longest mark, so the merge never drops a longer mark.
                  found = {}
                  for reading in readings.values():
                      for test, mark in slow_marks(reading['results']).items():
                          found[test] = max(found.get(test, 0), mark)
                  return found
              def tests_of(readings):
                  # Every test a run reported and its slow mark: a test that never crossed one is an identity the run judged.
                  return {test: mark for reading in readings.values() for test, mark in reading['results'].items()}
              def caches_of(query):
                  pages = json.loads(gh('api', '--paginate', '--slurp', f'repos/{repository}/actions/caches?{query}'))
                  return [cache for page in pages for cache in page['actions_caches']]
              run = api(f'actions/runs/{run_id}')
              if run['status'] != 'completed':
                  return []
              jobs = jobs_of(run['id'])
              existing = open_numbers(repository, gh) if existing is None else existing
              passed = {}
              def pass_of(kind, subject, text):
                  # Only a kind with an open issue lists subjects, so only its passes can update one.
                  if kind in existing:
                      passed.setdefault(kind, {}).setdefault(subject, text)
              usage, limit = api('actions/cache/usage'), settings['cache_limit']
              findings = [usage_finding(run, usage, limit, [])]
              if findings[0]:
                  findings = [usage_finding(run, usage, limit, caches_of('sort=size_in_bytes&direction=desc&per_page=100'))]
              if seeds(run):
                  findings.append(snapshot_finding(run, jobs, caches_of(f"ref=refs/heads/{run['head_branch']}&per_page=100")))
              if run['conclusion'] == 'cancelled':
                  return [finding for finding in findings if finding]
              window = settings['window']
              earlier = runs_like(run, 'success')
              if watched(run):
                  band = band_of(jobs, annotations_of)
                  ran = job_set(jobs)
                  prior, like = [], []
                  for other in [other for other in earlier if watched(other)][:window]:
                      other_jobs = jobs_of(other['id'])
                      if band_of(other_jobs, annotations_of) != band:
                          continue
                      if len(prior) < 5 and reuses_tests(run, jobs) == reuses_tests(other, other_jobs):
                          prior.append(other)
                      if len(like) < 5 and job_set(other_jobs) == ran:
                          like.append(other)
                      if len(prior) == 5 and len(like) == 5:
                          break
                  prior.reverse()
                  like.reverse()
                  measured, (units, ran_jobs) = measures_of(jobs, annotations_of), totals_of(jobs, annotations_of)[2:]
                  prior_measured = [measures_of(jobs_of(other['id']), annotations_of) for other in like]
                  medians = {kind: baseline_of([rates[kind] for rates in prior_measured if kind in rates]) for kind in WORK}
                  medians = {kind: value for kind, value in medians.items() if value is not None}
                  if medians:
                      number, levels = ratchet_issue(repository, gh)
                      kept = {kind: levels[level_of(run, band, kind)]['rate'] for kind in medians if level_of(run, band, kind) in levels}
                      rates, rate_passes = rate_finding(run, measured, units, ran_jobs, like, prior_measured, band, kept)
                      findings.extend(rates)
                      for subject, text in rate_passes:
                          pass_of(SLOWER, subject, text)
                      lowered = {level_of(run, band, kind): {'rate': value, 'reason': 'lowest median of the previous five successful runs on the level',
                                                             'run': run['id']}
                                 for kind, value in medians.items() if kind not in kept or value < kept[kind]}
                      if lowered:
                          save_ratchet(repository, gh, number, levels | lowered)
                  findings.extend(range_findings(run, band, measured, units, ran_jobs, like, prior_measured))
                  findings.append(capacity_finding(run, band, wait_of(run, jobs), work_of(jobs), like, [wait_of(other, jobs_of(other['id'])) for other in like]))
                  findings.append(shape_finding(run, band, jobs, prior, [jobs_of(other['id']) for other in prior]))
                  findings.extend(cache_finding(run, jobs, annotations_of) or [])
                  # A pass names its shape only in the job's own log, so the log is read only while a floor issue is open.
                  if CACHE_FLOOR in existing:
                      for job in cache_judged(jobs):
                          shape = cache_pass_shape(log_of(job))
                          if shape:
                              pass_of(CACHE_FLOOR, shape, 'its compile cache hit rate stayed over the floor')
              on_main = run['event'] in ('merge_group', 'push')
              if on_main:
                  findings.append(required_finding(run, jobs, settings['required']))
              shards = shards_of(jobs)
              medians = {kind: shard_median(jobs, kind) for kind in shard_kinds(jobs)}
              blamed = slowest_shard(jobs, settings['margin'])
              for job in shards:
                  # Only a shard inside the margin has recovered: a second shard over it is an imbalance of its own, never a pass.
                  median = medians[kind_of(job['name'])]
                  if median is not None and seconds(job) <= settings['margin'] * median:
                      pass_of(UNBALANCED, bare(job['name']),
                              f'this shard took {seconds(job) / 60:.1f} min, inside {settings["margin"]:g} times the median shard')
              readings = shard_readings(jobs) if blamed or on_main else {}
              unbalanced = None
              if blamed:
                  # Only the blamed shard's own log names its slow tests and its fixed phases; the earlier marks come from the whole run, where a test may sit elsewhere.
                  reading = readings[blamed[0]['name']]
                  previous = slow_of(shard_readings(jobs_of(earlier[0]['id']))) if earlier else {}
                  unbalanced = shard_finding(run, blamed, settings['margin'], grown_tests(slow_marks(reading['results']), previous), reading)
              findings.append(unbalanced)
              if on_main:
                  findings.extend(slow_findings(slow_of(readings), settings['slow'], run))
                  for test, mark in tests_of(readings).items():
                      if mark is None:
                          pass_of(slow_kind(settings['slow']), test, 'this test ran without crossing a slow mark')
              if run['event'] == 'pull_request':
                  rows = []
                  for other in ([run] + [other for other in runs_like(run, 'completed') if other['conclusion'] in ('success', 'failure')])[:window]:
                      declaration = next((job for job in jobs_of(other['id']) if job['name'] == 'Caller declaration'), None)
                      chosen = selection_of(log_of(declaration)) if declaration else None
                      if chosen:
                          rows.append((other['id'], *chosen))
                  findings.append(selection_finding(run, rows, settings['ceiling'], window))
                  if watched(run) and rows and rows[0][0] == run['id']:
                      findings.append(selection_departure(run, rows))
              found = [finding for finding in findings if finding]
              breached = {finding['title'] for finding in found}
              # A subject that breached is never also passed: the run says it is still broken.
              unbroken = {kind: {subject: text for subject, text in subjects.items() if identity(kind, subject) not in breached} for kind, subjects in passed.items()}
              return found + [recovery(kind, run, subjects) for kind, subjects in unbroken.items() if subjects]

          def main():
              def gh(*argv, body=None):
                  result = subprocess.run(['gh', *argv], input=body, capture_output=True, text=True)
                  if result.returncode:
                      raise RuntimeError(f'gh {argv[0]} {argv[1]} failed: {result.stderr.strip()}')
                  return result.stdout
              repository = os.environ['REPOSITORY']
              try:
                  settings = {'window': int(float(os.environ['SELECTION_WINDOW'])),
                              'ceiling': float(os.environ['SELECTION_CEILING']), 'margin': float(os.environ['SHARD_MARGIN']),
                              'slow': float(os.environ['SLOW_SECONDS']), 'cache_limit': storage_limit(os.environ['CACHE_STORAGE_LIMIT_GIB']),
                              'required': json.loads(os.environ['REQUIRED_CHECKS'])}
                  existing = open_numbers(repository, gh)
                  findings = judge(os.environ['RUN_ID'], repository, gh, settings, existing) if os.environ['RUN_ID'] else []
                  filed = file_issues(findings, repository, gh, existing)
              except (RuntimeError, KeyError, ValueError, OSError) as error:
                  sys.exit(f'CI guards failed: {error}')
              print(f'{len(findings)} findings, {len(filed)} issues opened or rewritten')
              for kind in filed:
                  print(f'Written: {kind}')

          if __name__ == '__main__':
              main()
