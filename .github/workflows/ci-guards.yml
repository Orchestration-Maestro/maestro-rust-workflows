name: CI guards

on:
  workflow_call:
    inputs:
      run-id:
        description: Completed Rust CI run to judge (a merge-group run for the time, shard and slow-test guards); empty runs only the test-time exception check
        type: string
        default: ''
      selection-window:
        description: Completed runs of the same workflow and event, up to and including the judged run, that every guard reads - for the selection share and for the earlier runs searched for a run's baseline
        type: number
        default: 10
      selection-share-ceiling-percent:
        description: Median share of workspace test packages selected over the window above which an issue is filed
        type: number
        default: 25
      shard-balance-margin:
        description: Slowest test shard may take at most this multiple of the median shard
        type: number
        default: 1.5
      slow-test-seconds:
        description: Seconds after which nextest flags a test slow; each such test on main gets one issue
        type: number
        default: 30
      hang-limit-seconds:
        description: Longest kill time a nextest override may declare without an open issue
        type: number
        default: 120
      nextest-config:
        description: Path of the caller's nextest configuration
        type: string
        default: .config/nextest.toml
      accept-level:
        description: Ratchet level to set by hand, as listed in the "CI time ratchet" issue; the only way to raise a level
        type: string
        default: ''
      accept-seconds:
        description: Wall time in seconds the accepted level is set to
        type: number
        default: 0
      accept-reason:
        description: Why the level is accepted; recorded in the "CI time ratchet" issue
        type: string
        default: ''

permissions:
  contents: read

jobs:
  exceptions:
    name: Test-time exceptions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test-time exceptions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NEXTEST_CONFIG: ${{ inputs.nextest-config }}
          HANG_LIMIT_SECONDS: ${{ inputs.hang-limit-seconds }}
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tomllib

          def period_seconds(period):
              units = {'ms': 0.001, 's': 1, 'm': 60, 'h': 3600}
              return sum(int(count) * units[unit] for count, unit in re.findall(r'(\d+)(ms|s|m|h)', period))

          def nextest_exceptions(text, hang_seconds):
              """Overrides whose kill time passes the hang limit, with the issues named above their slow-timeout."""
              found = []
              for block in re.split(r'(?m)^(?=\[\[profile\.[^\]]+\.overrides\]\])', text)[1:]:
                  lines = block.splitlines()
                  own = []
                  for line in lines:
                      if own and line.startswith('['):
                          break
                      own.append(line)
                  override = tomllib.loads('\n'.join(own))['profile']
                  override = next(iter(override.values()))['overrides'][0]
                  timeout = override.get('slow-timeout')
                  if not isinstance(timeout, dict) or 'terminate-after' not in timeout:
                      continue
                  seconds = period_seconds(timeout['period']) * timeout['terminate-after']
                  if seconds <= hang_seconds:
                      continue
                  at = next(index for index, line in enumerate(own) if line.startswith('slow-timeout'))
                  issues = []
                  for line in reversed(own[:at]):
                      if not line.startswith('#'):
                          break
                      issues = [int(number) for number in re.findall(r'#(\d+)', line)] + issues
                  found.append({'filter': override.get('filter', ''), 'seconds': seconds, 'issues': issues})
              return found

          def exception_findings(exceptions, state_of):
              """One message per exception that names no issue or only closed ones."""
              messages = []
              for item in exceptions:
                  label = f"the {item['seconds']:g}-second exception for {item['filter']}"
                  if not item['issues']:
                      messages.append(f'{label} names no issue; put its issue number in the comment above slow-timeout')
                  elif all(state_of(number) == 'CLOSED' for number in item['issues']):
                      listed = ', '.join(f'#{number}' for number in item['issues'])
                      messages.append(f'{label} is refused: {listed} is closed, so fix the test and remove the exception')
              return messages

          def main():
              path = pathlib.Path(os.environ['NEXTEST_CONFIG'])
              if not path.is_file():
                  print(f'No {path}: no exceptions to check')
                  return
              def state_of(number):
                  result = subprocess.run(['gh', 'issue', 'view', str(number), '-R', os.environ['REPOSITORY'], '--json', 'state'],
                                          capture_output=True, text=True)
                  if result.returncode:
                      raise RuntimeError(f'gh issue view {number} failed: {result.stderr.strip()}')
                  return json.loads(result.stdout)['state']
              exceptions = nextest_exceptions(path.read_text(encoding='utf-8'), float(os.environ['HANG_LIMIT_SECONDS']))
              messages = exception_findings(exceptions, state_of)
              for message in messages:
                  print(f'::error file={path}::{message}')
              print(f'{len(exceptions)} test-time exceptions, {len(messages)} refused')
              if messages:
                  sys.exit(1)

          if __name__ == '__main__':
              main()

  guards:
    name: Run guards
    if: ${{ inputs.run-id != '' || inputs.accept-level != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Judge the run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run-id }}
          SELECTION_WINDOW: ${{ inputs.selection-window }}
          SELECTION_CEILING: ${{ inputs.selection-share-ceiling-percent }}
          SHARD_MARGIN: ${{ inputs.shard-balance-margin }}
          SLOW_SECONDS: ${{ inputs.slow-test-seconds }}
          ACCEPT_LEVEL: ${{ inputs.accept-level }}
          ACCEPT_SECONDS: ${{ inputs.accept-seconds }}
          ACCEPT_REASON: ${{ inputs.accept-reason }}
          # Jobs a full run must execute; a trailing * matches a name prefix.
          REQUIRED_CHECKS: >-
            ["Caller declaration", "Format and lint", "Docs", "Build test archive", "Test shard (*",
            "Doctests", "Tests (ubuntu-latest)", "Dependency, source and coverage checks"]
        shell: python
        run: |
          import datetime
          import json
          import os
          import re
          import statistics
          import subprocess
          import sys

          def clean(log):
              log = re.sub(r'\x1b\[[0-9;]*m', '', log)
              return re.sub(r'(?m)^\d{4}-\d\d-\d\dT[\d:.]+Z ', '', log)

          def stamp(value):
              return datetime.datetime.fromisoformat(value)

          def seconds(job):
              if job.get('conclusion') == 'skipped' or not job.get('started_at') or not job.get('completed_at'):
                  return None
              return (stamp(job['completed_at']) - stamp(job['started_at'])).total_seconds()

          def wall(run):
              return (stamp(run['updated_at']) - stamp(run['run_started_at'])).total_seconds()

          def watched(run):
              """Merge groups, pull requests and pushes to main gate a merge; CodeQL and other runs do not."""
              return run['name'] != 'CodeQL' and (run['event'] in ('merge_group', 'pull_request')
                                                  or (run['event'] == 'push' and run['head_branch'] == 'main'))

          def job_times(jobs):
              return {job['name']: seconds(job) for job in jobs if seconds(job) is not None and job.get('conclusion') != 'cancelled'}

          RATCHET_TITLE = 'CI time ratchet'

          def level_of(run, band):
              """The key of a ratchet level: a run is compared only with runs of its workflow, event and runner band."""
              return f"{run['workflow_id']}/{run['event']}/{band}"

          def baseline_seconds(durations):
              """The median wall time of earlier runs in the level; None below three runs."""
              return statistics.median(durations) if len(durations) >= 3 else None

          def ratchet_issue(repository, gh):
              """The open issue that stores the ratchet, as (number, levels); (None, {}) until the first level is stored."""
              listed = json.loads(gh('issue', 'list', '-R', repository, '--state', 'open', '--search', f'"{RATCHET_TITLE}" in:title',
                                     '--json', 'number,title,body'))
              for item in listed:
                  if item['title'] == RATCHET_TITLE:
                      block = re.search(r'```json\n(.*?)\n```', item['body'], re.DOTALL)
                      if not block:
                          raise RuntimeError(f"issue #{item['number']} holds no ratchet block")
                      return item['number'], json.loads(block[1])['levels']
              return None, {}

          def save_ratchet(repository, gh, number, levels):
              """Write the levels to the ratchet issue, creating the issue on first use."""
              body = ('The CI guards keep the lowest median wall time of each level here. Do not edit it by hand: the guard lowers a level, '
                      'and only the accept inputs of ci-guards.yml raise one.\n\n'
                      f"```json\n{json.dumps({'levels': levels}, indent=2, sort_keys=True)}\n```\n")
              if number:
                  gh('issue', 'edit', str(number), '-R', repository, '--body-file', '-', body=body)
              else:
                  gh('issue', 'create', '-R', repository, '--title', RATCHET_TITLE, '--body-file', '-', body=body)

          def accept_ratchet(repository, gh, level, seconds, reason, run_id):
              """Set a level by hand, the only way to raise one; it needs the level, a positive duration and a reason."""
              if not level or seconds <= 0 or not reason.strip():
                  raise ValueError('accepting a level needs the level, a positive number of seconds and a reason')
              number, levels = ratchet_issue(repository, gh)
              levels[level] = {'seconds': seconds, 'reason': reason.strip(), 'run': int(run_id)}
              save_ratchet(repository, gh, number, levels)

          def band_of(jobs, annotations_of):
              """The runner hardware label of the run's slowest labelled job, the runner that sets its pace."""
              for job in sorted((job for job in jobs if seconds(job) is not None), key=seconds, reverse=True)[:3]:
                  for note in annotations_of(job):
                      found = re.search(r'runner-band: (\S+)', f"{note.get('title') or ''} {note.get('message') or ''}")
                      if found:
                          return found[1]
              return 'unknown'

          def cache_finding(run, jobs, annotations_of):
              """The warning the compile-cache floor left on the archive build, as one standing issue."""
              for job in jobs:
                  if job['name'] == 'Build test archive':
                      for note in annotations_of(job):
                          if note.get('title') == 'Compile cache floor':
                              return {'title': 'Compile cache below its hit-rate floor', 'comment': True,
                                      'body': f"Run: {run['html_url']}\n{run['name']} ({run['event']}, {run['head_branch']})\n\n{note['message']}\n"}
              return None

          def budget_finding(run, jobs, prior, jobs_of, band, ratchet=None):
              """A run more than 10% over the lower of the band's recent median and its stored ratchet level."""
              baseline = baseline_seconds([wall(earlier) for earlier in prior])
              if not watched(run) or baseline is None:
                  return None
              baseline = baseline if ratchet is None else min(baseline, ratchet)
              took = wall(run)
              if took <= baseline * 1.10:
                  return None
              before = {}
              for earlier in prior:
                  for name, value in job_times(jobs_of(earlier['id'])).items():
                      before.setdefault(name, []).append(value)
              grown = sorted(((value - sum(before[name]) / len(before[name]), name, value)
                              for name, value in job_times(jobs).items() if name in before), reverse=True)[:6]
              listed = '\n'.join(f'- {name}: {value / 60:.1f} min ({change / 60:+.1f} min)' for change, name, value in grown)
              runs = '\n'.join(f"- {earlier['html_url']}" for earlier in prior)
              return {'title': f"CI run slower than its baseline: run {run['id']}",
                      'body': f"Run: {run['html_url']}\n{run['name']} ({run['event']}, {run['head_branch']}) took {took / 60:.1f} min against a baseline "
                              f"of {baseline / 60:.1f} min (+{(took / baseline - 1) * 100:.0f}%, limit +10%) on runner band {band}.\n"
                              f"Ratchet level: `{level_of(run, band)}`\n\n"
                              f"Latest baseline runs (successful, same workflow, event and runner band):\n{runs}\n\n"
                              f"Jobs that grew most (now against their mean in those runs):\n{listed}\n"}

          def selection_of(log):
              """Selected and total test packages and the full-suite trigger, as the selection step logs them."""
              log = clean(log)
              count = re.search(r'(?m)^Selected package count: (\d+)/(\d+)$', log)
              if not count:
                  return None
              fallback = re.search(r'(?m)^Full-suite fallback: (.+)$', log)
              return int(count[1]), int(count[2]), fallback[1] if fallback else None

          def selection_finding(rows, ceiling, window):
              """A sustained share: the median over a full window of runs is above the ceiling."""
              if len(rows) < window:
                  return None
              shares = [selected * 100 / total for _, selected, total, _ in rows]
              median = statistics.median(shares)
              if median <= ceiling:
                  return None
              listed = '\n'.join(f"- run {run_id}: {selected}/{total} packages ({selected * 100 / total:.0f}%)"
                                 + (f", full suite because {trigger}" if trigger else '')
                                 for run_id, selected, total, trigger in rows)
              return {'title': 'Test selection share above its range',
                      'body': f'The median share of workspace test packages selected over the last {len(rows)} runs is '
                              f'{median:.0f}%; the expected ceiling is {ceiling:g}%.\n\n{listed}\n'}

          def slow_tests(log):
              """Longest slow mark nextest printed for each test."""
              found = {}
              for mark, binary, name in re.findall(r'SLOW \[\s*>\s*([0-9.]+)s\]\s+\([^)]*\)\s+(\S+)\s+(\S+)', clean(log)):
                  test = f'{binary} {name}'
                  found[test] = max(found.get(test, 0), float(mark))
              return found

          def grown_tests(current, previous):
              """The five slow tests that grew most: new, or past a higher slow mark than before."""
              grown = [(test, now, previous.get(test)) for test, now in current.items() if now > previous.get(test, 0)]
              return sorted(grown, key=lambda item: item[1] - (item[2] or 0), reverse=True)[:5]

          def shard_finding(run, jobs, margin, grown):
              """The slowest test shard is beyond the margin over the median; names the tests that grew."""
              took = sorted((seconds(job), job['name']) for job in jobs
                            if job['name'].startswith('Test shard (') and seconds(job) is not None)
              if len(took) < 2:
                  return None
              median = statistics.median(value for value, _ in took)
              slowest, name = took[-1]
              if slowest <= margin * median:
                  return None
              lines = '\n'.join(f"- `{test}`: over {now:g} s now, " + (f'over {before:g} s before' if before else 'not slow before')
                                for test, now, before in grown) or '- no test crossed a higher slow mark'
              return {'title': f"Test shards unbalanced: run {run['id']}",
                      'body': f"Run: {run['html_url']}\n{name} took {slowest / 60:.1f} min against a median shard of {median / 60:.1f} min "
                              f"({slowest / median:.2f} times; the margin is {margin:g}).\n\nSlow tests in that shard that grew:\n{lines}\n"}

          def slow_findings(slow, limit, run):
              """One issue per test that ran past the slow mark."""
              return [{'title': f'Test over {limit:g} seconds: {test}',
                       'body': f"Run: {run['html_url']}\nNextest flagged this test slow, over {mark:g} seconds. "
                               'Fix the test at its cause; do not raise a timeout.\n'}
                      for test, mark in sorted(slow.items())]

          def required_finding(run, jobs, pinned):
              """Pinned jobs that did not run at all, so a renamed or removed gate cannot pass silently."""
              ran = [job['name'] for job in jobs if job.get('conclusion') in ('success', 'failure')]
              missing = [name for name in pinned if not any(
                  job.startswith(name[:-1]) if name.endswith('*') else job == name for job in ran)]
              if not missing:
                  return None
              return {'title': f"Required checks missing from run {run['id']}",
                      'body': f"Run: {run['html_url']}\nThese pinned jobs did not run: " + ', '.join(f'`{name}`' for name in missing) +
                              '.\nA job was renamed, removed or skipped; restore it or update the pinned list.\n'}

          def file_issues(findings, repository, gh):
              """Open an issue for each finding no open issue already carries; a finding marked for comment is added to its open issue. Returns the titles filed or commented."""
              existing = {item['title']: item['number'] for item in json.loads(gh('issue', 'list', '-R', repository, '--state', 'open',
                                                                                 '--limit', '1000', '--json', 'number,title'))}
              filed = []
              for finding in findings:
                  title = finding['title']
                  if title not in existing:
                      gh('issue', 'create', '-R', repository, '--title', title, '--body-file', '-', body=finding['body'])
                      existing[title] = None
                  elif finding.get('comment') and existing[title]:
                      gh('issue', 'comment', str(existing[title]), '-R', repository, '--body-file', '-', body=finding['body'])
                  else:
                      continue
                  filed.append(title)
              return filed

          def judge(run_id, repository, gh, settings):
              """Every finding for one completed run; also lowers the stored ratchet level of the run's band when the earlier runs show a lower median."""
              def api(path):
                  return json.loads(gh('api', f'repos/{repository}/{path}'))
              known = {}
              def jobs_of(identifier):
                  if identifier not in known:
                      pages = json.loads(gh('api', '--paginate', '--slurp', f'repos/{repository}/actions/runs/{identifier}/jobs?per_page=100'))
                      known[identifier] = [job for page in pages for job in page['jobs']]
                  return known[identifier]
              def runs_like(run, status):
                  # A required workflow is not listed under its own id, so list the repository's runs and keep this workflow's earlier ones, newest first.
                  listed = api(f"actions/runs?event={run['event']}&status={status}&per_page=100")['workflow_runs']
                  older = [other for other in listed if other['workflow_id'] == run['workflow_id'] and other['created_at'] < run['created_at']]
                  return sorted(older, key=lambda other: other['created_at'], reverse=True)
              def annotations_of(job):
                  return json.loads(gh('api', f"repos/{repository}/check-runs/{job['id']}/annotations"))
              def log_of(job):
                  return gh('api', '--allow-escape-sequences', f"repos/{repository}/actions/jobs/{job['id']}/logs")
              def shard_slow(jobs):
                  found = {}
                  for job in jobs:
                      if job['name'].startswith('Test shard ('):
                          for test, mark in slow_tests(log_of(job)).items():
                              found[test] = max(found.get(test, 0), mark)
                  return found
              run = api(f'actions/runs/{run_id}')
              if run['status'] != 'completed' or run['conclusion'] == 'cancelled':
                  return []
              jobs = jobs_of(run['id'])
              window = settings['window']
              earlier = runs_like(run, 'success')
              findings = []
              if watched(run):
                  band = band_of(jobs, annotations_of)
                  prior = []
                  for other in [other for other in earlier if watched(other)][:window]:
                      if band_of(jobs_of(other['id']), annotations_of) == band:
                          prior.append(other)
                          if len(prior) == 5:
                              break
                  prior.reverse()
                  median = baseline_seconds([wall(other) for other in prior])
                  if median is not None:
                      level = level_of(run, band)
                      number, levels = ratchet_issue(repository, gh)
                      kept = levels.get(level, {}).get('seconds')
                      findings.append(budget_finding(run, jobs, prior, jobs_of, band, kept))
                      if kept is None or median < kept:
                          levels[level] = {'seconds': median, 'reason': 'lowest median of the previous five successful runs on the level', 'run': run['id']}
                          save_ratchet(repository, gh, number, levels)
              on_main = run['event'] in ('merge_group', 'push')
              if on_main:
                  findings.append(required_finding(run, jobs, settings['required']))
                  findings.append(cache_finding(run, jobs, annotations_of))
              unbalanced = shard_finding(run, jobs, settings['margin'], [])
              slow = shard_slow(jobs) if unbalanced or on_main else {}
              if unbalanced:
                  previous = shard_slow(jobs_of(earlier[0]['id'])) if earlier else {}
                  unbalanced = shard_finding(run, jobs, settings['margin'], grown_tests(slow, previous))
              findings.append(unbalanced)
              if on_main:
                  findings.extend(slow_findings(slow, settings['slow'], run))
              rows = []
              for other in ([run] + [other for other in runs_like(run, 'completed') if other['conclusion'] in ('success', 'failure')])[:window]:
                  declaration = next((job for job in jobs_of(other['id']) if job['name'] == 'Caller declaration'), None)
                  chosen = selection_of(log_of(declaration)) if declaration else None
                  if chosen:
                      rows.append((other['id'], *chosen))
              findings.append(selection_finding(rows, settings['ceiling'], window))
              return [finding for finding in findings if finding]

          def main():
              def gh(*argv, body=None):
                  result = subprocess.run(['gh', *argv], input=body, capture_output=True, text=True)
                  if result.returncode:
                      raise RuntimeError(f'gh {argv[0]} {argv[1]} failed: {result.stderr.strip()}')
                  return result.stdout
              settings = {'window': int(float(os.environ['SELECTION_WINDOW'])),
                          'ceiling': float(os.environ['SELECTION_CEILING']), 'margin': float(os.environ['SHARD_MARGIN']),
                          'slow': float(os.environ['SLOW_SECONDS']), 'required': json.loads(os.environ['REQUIRED_CHECKS'])}
              repository = os.environ['REPOSITORY']
              try:
                  if os.environ['ACCEPT_LEVEL']:
                      seconds = float(os.environ['ACCEPT_SECONDS'])
                      accept_ratchet(repository, gh, os.environ['ACCEPT_LEVEL'], seconds, os.environ['ACCEPT_REASON'], os.environ['GITHUB_RUN_ID'])
                      print(f"Accepted {os.environ['ACCEPT_LEVEL']} at {seconds:g} s")
                  findings = judge(os.environ['RUN_ID'], repository, gh, settings) if os.environ['RUN_ID'] else []
                  filed = file_issues(findings, repository, gh)
              except (RuntimeError, KeyError, ValueError, OSError) as error:
                  sys.exit(f'CI guards failed: {error}')
              print(f'{len(findings)} findings, {len(filed)} issues filed')
              for title in filed:
                  print(f'Filed: {title}')

          if __name__ == '__main__':
              main()
