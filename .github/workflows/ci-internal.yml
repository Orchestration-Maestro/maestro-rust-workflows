name: CI self-test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sample:
    name: Sample
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: fixtures/sample
      concurrency-key: sample

  declared:
    name: Declared caller
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: fixtures/declared
      concurrency-key: declared
      test-event: merge_group

  test-tools:
    name: Caller test tools
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: fixtures/test-tools
      concurrency-key: test-tools
      test-event: merge_group

  fuzz:
    name: Fuzz caller
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: fixtures/fuzz
      concurrency-key: fuzz
      fuzz-scan: true

  quality:
    name: Required repository quality
    needs: [sample, declared, test-tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All callers passed every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())

  seams:
    name: Workflow seam proofs
    outputs:
      targets: ${{ steps.cases.outputs.targets }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shared coverage policy
        run: python3 .github/extract-workflow-steps.py
      - name: Content checks at workflow seam
        shell: python
        run: |
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          import textwrap

          root = pathlib.Path.cwd()
          content = (root / '.github/workflows/content.yml').read_text(encoding='utf-8')

          def content_body(name):
              step = next(s for s in content.split('      - name: ')[1:] if s.splitlines()[0] == name)
              block = re.search(r'^        run: \|\n((?:          .*\n|\n)+)', step, re.MULTILINE)
              return textwrap.dedent(block[1]) if block else re.search(r'^        run: (.+)$', step, re.MULTILINE)[1]

          def content_run(name, directory, env=None):
              return subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', content_body(name)], cwd=directory,
                                    env=os.environ | (env or {}), capture_output=True, text=True)

          def content_workflow_delegates_to_caller():
              assert all(re.search(r'^  ' + event + ':', content, re.MULTILINE)
                         for event in ['pull_request', 'merge_group', 'workflow_call'])
              assert re.findall(r'^  ([\w-]+):', content.split('\njobs:\n', 1)[1], re.MULTILINE) == ['content']
              assert '    name: Required content checks\n' in content
              assert 'permissions:\n  contents: read\n' in content and 'persist-credentials: false' in content
              assert re.findall(r'^    if: (.+)$', content, re.MULTILINE) == [
                  "$" + "{{ github.repository_id != '1404598722' }}"]
              assert not re.search(r'continue-on-error:', content)
              for action in re.findall(r'uses: (\S+)', content):
                  assert re.fullmatch(r'[^@]+@[0-9a-f]{40}', action), action
              assert content_body('Caller tools').strip() == 'mise install'
              assert content_body('Caller check').strip() == 'mise exec -- just check'
              assert not any(name in content for name in ['typos', 'editorconfig-checker', 'rumdl', 'PyYAML'])
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  paths = directory / 'paths'
                  env = {'RUNNER_TEMP': temporary, 'GITHUB_PATH': str(paths)}
                  result = content_run('Mise bootstrap', directory, env)
                  assert result.returncode == 0, result.stdout + result.stderr
                  installed = pathlib.Path(paths.read_text(encoding='utf-8').strip()) / 'mise'
                  assert subprocess.check_output([str(installed), '--version'], text=True).startswith('2026.10.2 ')
                  fake = directory / 'mise'
                  fake.write_text('#!/bin/sh\nprintf "%s\\n" "$*" >> "$CALLS"\nexit "${STATUS:-0}"\n', encoding='utf-8')
                  fake.chmod(0o755)
                  calls = directory / 'calls'
                  selected = {'PATH': str(directory) + os.pathsep + os.environ['PATH'], 'CALLS': str(calls)}
                  for name, command in [('Caller tools', 'install'), ('Caller check', 'exec -- just check')]:
                      for status in ['0', '73']:
                          result = content_run(name, directory, selected | {'STATUS': status})
                          assert result.returncode == int(status), result.stdout + result.stderr
                          assert calls.read_text(encoding='utf-8').splitlines()[-1] == command
                  # A corrupted bootstrap download must not become executable or enter PATH.
                  curl = directory / 'curl'
                  curl.write_text('#!/bin/sh\nwhile [ "$1" != --output ]; do shift; done\nprintf corrupt > "$2"\n', encoding='utf-8')
                  curl.chmod(0o755)
                  before = paths.read_text(encoding='utf-8')
                  result = content_run('Mise bootstrap', directory, env | selected)
                  assert result.returncode != 0 and paths.read_text(encoding='utf-8') == before, result.stdout + result.stderr

          content_workflow_delegates_to_caller()
          print('PASS content_workflow_delegates_to_caller', flush=True)

          def content_requires_caller_files_and_pins():
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  result = content_run('Caller check files', directory)
                  assert result.returncode != 0 and 'justfile' in result.stderr, result.stdout + result.stderr
                  justfile = directory / 'justfile'
                  justfile.touch()
                  result = content_run('Caller check files', directory)
                  assert result.returncode != 0 and 'mise.toml' in result.stderr, result.stdout + result.stderr
                  config = directory / 'mise.toml'
                  for text in ['[broken', '[tools]\n', '[tools]\njust="latest"\nprek="0.5.4"\n',
                               '[tools]\njust="1.58.0"\nprek="0.5"\n', '[tools]\njust=3\nprek="0.5.4"\n']:
                      config.write_text(text, encoding='utf-8')
                      result = content_run('Caller check files', directory)
                      assert result.returncode != 0 and 'mise.toml' in result.stderr, result.stdout + result.stderr
                  config.write_text('[tools]\njust="1.58.0"\nprek="0.5.4"\n', encoding='utf-8')
                  justfile.unlink()
                  for name in ['justfile', '.justfile', 'Justfile']:
                      path = directory / name
                      path.touch()
                      result = content_run('Caller check files', directory)
                      assert result.returncode == 0, result.stdout + result.stderr
                      path.unlink()
                  names = re.findall(r'^      - name: (.+)$', content, re.MULTILINE)
                  assert names == ['Checkout', 'Caller check files', 'Mise bootstrap', 'Caller tools', 'Caller check']

          content_requires_caller_files_and_pins()
          print('PASS content_requires_caller_files_and_pins', flush=True)
      - name: Ephemeral runner policy
        run: python3 -m unittest discover -s .github -p runner_policy_test.py
      - name: Toolchain
        working-directory: fixtures/sample
        run: |
          rustup show
          rustup component add rustfmt clippy llvm-tools-preview
      - name: Coverage release installation
        timeout-minutes: 10
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import textwrap
          workflow = pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          step = next(s for s in workflow.split('      - name: ')[1:] if s.splitlines()[0] == 'Coverage tools')
          match = re.search(r'^        run: (?:&[\w-]+ )?\|\n((?:          .*\n|\n)+)', step, re.MULTILINE)
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', textwrap.dedent(match[1])], check=True)
      - name: Archived shards at workflow seam
        shell: python
        run: |
          import ast
          import pathlib
          import textwrap
          source = pathlib.Path('.github/workflows/ci-internal.yml').read_text(encoding='utf-8')
          code = source.split('      - name: Caller checks at workflow seam\n', 1)[1]
          code = code.split('        run: |\n', 1)[1].split('\n  native:', 1)[0]
          tree = ast.parse(textwrap.dedent(code))
          globals_needed = {'workflow', 'root', 'credential_names', 'coverage_report_args'}
          tree.body = [node for node in tree.body if isinstance(node, (ast.Import, ast.ImportFrom, ast.FunctionDef))
                       or (isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id in globals_needed
                                                               for target in node.targets))]
          exec(compile(tree, 'archive workflow seam', 'exec'))
          production_body = body
          def body(name, source=workflow):
              return production_body(name, source).replace('nextest-archive --no-clean', 'nextest-archive')
          try:
              archived_shards_reuse_build_and_prepared_outputs()
          except AssertionError as error:
              assert str(error).count('Compiling sample ') >= 2, str(error)
              print('PASS regression fails without preserving prepared compilation', flush=True)
          else:
              raise AssertionError('Archive regression did not detect repeated compilation')
          body = production_body
          archived_shards_reuse_build_and_prepared_outputs()
          print('PASS archived_shards_reuse_build_and_prepared_outputs', flush=True)
      - name: Example sources in coverage at workflow seam
        shell: python
        run: |
          import ast
          import os
          import pathlib
          import shutil
          import subprocess
          import tempfile
          import textwrap

          root = pathlib.Path.cwd()
          workflow = (root / '.github/workflows/ci.yml').read_text(encoding='utf-8')
          internal = (root / '.github/workflows/ci-internal.yml').read_text(encoding='utf-8')
          caller = internal.split('      - name: Caller checks at workflow seam\n', 1)[1]
          caller = caller.split('        run: |\n', 1)[1].split('\n  native:', 1)[0]
          tree = ast.parse(textwrap.dedent(caller))
          tree.body = [node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'body']
          exec(compile(tree, 'workflow body resolver', 'exec'))

          def example_sources_are_measured():
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary) / 'caller'
                  shutil.copytree(root / 'fixtures/example-coverage', directory, ignore=shutil.ignore_patterns('target'))
                  registry = directory / 'registry/src/fixture'
                  registry.mkdir(parents=True)
                  (registry / 'lib.rs').write_text('/// A dependency fixture.\npub fn answer() -> u32 { 42 }\n', encoding='utf-8')
                  test = directory / 'src/tests/coverage_example.rs'
                  test.write_text(test.read_text(encoding='utf-8') +
                                  '\n#[path = "../../registry/src/fixture/lib.rs"]\nmod dependency;\n'
                                  '#[test]\nfn dependency_runs() { assert_eq!(dependency::answer(), 42); }\n', encoding='utf-8')
                  toolchain = subprocess.check_output(['rustup', 'show', 'active-toolchain'], cwd=directory, text=True).split()[0]
                  subprocess.run(['cargo', 'clippy', '--all-targets', '--locked', '--', '-D', 'warnings'], cwd=directory, check=True)
                  for name, floor, shard in [('Coverage', '80', ''), ('Isolated tests', '80', ''),
                                             ('Isolated tests', '', '1')]:
                      env = os.environ | {'RUNNER_TEMP': temporary, 'RUSTUP_TOOLCHAIN': toolchain,
                                          'CARGO_COVERAGE_MIN_LINES': floor, 'COLLECT_COVERAGE': 'true',
                                          'SHARD': shard, 'TEST_SHARD_COUNT': '1'}
                      command = body(name)
                      result = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', command],
                                              cwd=directory, env=env, capture_output=True, text=True)
                      report = directory / (f'shard-{shard}.lcov' if shard else 'target/single-coverage/shard-1.lcov')
                      assert result.returncode == 0, result.stdout + result.stderr + (report.read_text(encoding='utf-8') if report.exists() else '')
                      records = report.read_text(encoding='utf-8').split('end_of_record')
                      sources = [os.path.normpath(line[3:]) for record in records
                                 for line in record.splitlines() if line.startswith('SF:')]
                      print(f'{name} floor={floor} LCOV sources: {sources}', flush=True)
                      example = [record for record in records if any(
                          line.startswith('SF:') and os.path.normpath(line[3:]) == str(directory / 'examples/coverage.rs')
                          for line in record.splitlines())]
                      assert example, 'examples/coverage.rs missing from LCOV'
                      assert any(line.startswith('DA:') and int(line.split(',')[1]) > 0
                                 for record in example for line in record.splitlines()), example
                      assert not any('/tests/' in source or '/registry/' in source for source in sources), sources
                      print(f'PASS example_sources_are_measured: {name}, floor={floor}', flush=True)
                      if shard:
                          (directory / 'coverage').mkdir()
                          shutil.copyfile(report, directory / 'coverage/shard-1.lcov')
                          merged = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', body('Merge coverage')],
                                                  cwd=directory, env=env, capture_output=True, text=True)
                          assert merged.returncode == 0, merged.stdout + merged.stderr
                          print(merged.stdout, flush=True)

          def single_coverage_runs_setup_scripts(name):
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary) / 'caller'
                  shutil.copytree(root / 'fixtures/sample', directory, ignore=shutil.ignore_patterns('target'))
                  (directory / '.config').mkdir()
                  (directory / '.config/nextest.toml').write_text(
                      'experimental=["setup-scripts"]\n'
                      '[scripts.setup.prepare]\ncommand="sh .config/prepare.sh"\n'
                      '[[profile.default.scripts]]\nfilter="all()"\nsetup="prepare"\n'
                      '[profile.default]\ndefault-filter="none()"\n', encoding='utf-8')
                  (directory / '.config/prepare.sh').write_text(
                      'echo WORKFLOW_SETUP=ready >> "$NEXTEST_ENV"\n', encoding='utf-8')
                  (directory / 'src/lib.rs').write_text(
                      '#[test]\nfn requires_setup() {\n'
                      '    assert_eq!(std::env::var("WORKFLOW_SETUP").unwrap(), "ready");\n'
                      '}\n', encoding='utf-8')
                  toolchain = subprocess.check_output(['rustup', 'show', 'active-toolchain'], cwd=directory, text=True).split()[0]
                  env = os.environ | {'RUNNER_TEMP': temporary, 'RUSTUP_TOOLCHAIN': toolchain,
                                      'CARGO_COVERAGE_MIN_LINES': '100', 'COLLECT_COVERAGE': 'true',
                                      'SHARD': '', 'TEST_SHARD_COUNT': '16'}
                  result = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', body(name)],
                                          cwd=directory, env=env, capture_output=True, text=True)
                  assert result.returncode == 0, result.stdout + result.stderr
                  assert 'requires_setup' in result.stderr + result.stdout
                  assert '1 passed' in result.stderr + result.stdout
                  print(f'PASS single_coverage_runs_setup_scripts: {name}', flush=True)

          def coverage_retries_report_flaky_tests_and_keep_failures():
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary) / 'caller'
                  shutil.copytree(root / 'fixtures/sample', directory, ignore=shutil.ignore_patterns('target'))
                  source = directory / 'src/lib.rs'
                  source.write_text('#[test] fn coverage_only_flaky() { assert_eq!(std::env::var("NEXTEST_ATTEMPT").unwrap(), "3"); }\n', encoding='utf-8')
                  toolchain = subprocess.check_output(['rustup', 'show', 'active-toolchain'], cwd=directory, text=True).split()[0]
                  env = os.environ | {'RUNNER_TEMP': temporary, 'RUSTUP_TOOLCHAIN': toolchain,
                                      'CARGO_COVERAGE_MIN_LINES': '0'}
                  result = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', body('Coverage')],
                                          cwd=directory, env=env, capture_output=True, text=True)
                  assert result.returncode == 0, result.stdout + result.stderr
                  log = directory / 'nextest.log'
                  assert log.exists(), 'Coverage must capture nextest output for its flaky summary'
                  assert 'FLAKY' in log.read_text(encoding='utf-8')
                  summary = directory / 'summary'
                  checks = workflow.split('  checks:\n', 1)[1].split('\n  fuzz:', 1)[0]
                  assert "if: always()" in checks.split('      - name: Coverage flaky test summary\n', 1)[1].split('      - name:', 1)[0]
                  assert body('Coverage flaky test summary') == body('Flaky test summary')
                  result = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', body('Coverage flaky test summary')],
                                          cwd=directory, env=env | {'GITHUB_STEP_SUMMARY': str(summary)}, capture_output=True, text=True)
                  assert result.returncode == 0 and 'coverage_only_flaky' in summary.read_text(encoding='utf-8'), result.stderr
                  source.write_text('#[test] fn coverage_permanent_failure() { panic!("permanent"); }\n', encoding='utf-8')
                  result = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', body('Coverage')],
                                          cwd=directory, env=env, capture_output=True, text=True)
                  assert result.returncode != 0, result.stdout + result.stderr
                  assert 'coverage_permanent_failure' in log.read_text(encoding='utf-8')
                  print('PASS coverage_retries_report_flaky_tests_and_keep_failures', flush=True)

          coverage_retries_report_flaky_tests_and_keep_failures()

          single_coverage_runs_setup_scripts('Isolated tests')
          single_coverage_runs_setup_scripts('Coverage')
          example_sources_are_measured()
      - name: Compile cache in every Rust job
        shell: python
        run: |
          import pathlib
          import re
          workflow = pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          def snapshot_jobs_share_one_owner():
              import json
              import subprocess
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
              assert document['permissions'] == {'contents': 'read'}
              assert set(document['jobs']) == {'declaration', 'quality', 'docs', 'test-build', 'tests', 'checks', 'advisories',
                                               'targets', 'browser', 'browser-tests', 'fuzz', 'tests-result'}
              jobs = dict(re.findall(r'^  ([\w-]+):\n(.*?)(?=^  [\w-]+:\n|\Z)',
                                     workflow.split('\njobs:\n', 1)[1], re.M | re.S))
              owners = {'quality', 'docs', 'test-build', 'tests', 'checks', 'targets', 'browser', 'browser-tests'}
              stages = ['Compile cache identity', 'Restore compile cache', 'Compile cache',
                        'Compile cache statistics', 'Seal compile cache', 'Save compile cache']
              for name in owners:
                  job = jobs[name]
                  offsets = [job.index('- name: ' + stage + '\n') for stage in stages]
                  assert offsets == sorted(offsets), name
                  assert all(job.count('- name: ' + stage + '\n') == 1 for stage in stages), name
                  save = job.split('- name: Save compile cache\n', 1)[1].split('      - name:', 1)[0]
                  assert "steps.cache-identity.outputs.writer == 'true'" in save, (name, 'save must require the shared writer decision')
                  if name == 'targets':
                      for stage in stages:
                          parsed = next(item for item in document['jobs'][name]['steps'] if item.get('name') == stage)
                          condition = parsed.get('if', '')
                          host = "runner.os != 'Windows'"
                          if stage == 'Compile cache statistics':
                              assert condition == 'always() && ' + host
                          elif stage == 'Save compile cache':
                              assert condition == host + " && steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'"
                          else:
                              assert condition == host, stage
                      upload = next(item for item in document['jobs'][name]['steps'] if item.get('name') == 'Upload compile cache errors')
                      assert upload['if'] == "always() && (steps.cache-statistics.outputs.write_errors == 'true' || (inputs.concurrency-key == 'maestro-proof' && steps.cache-statistics.outcome == 'success'))"
                      check = next(item for item in document['jobs'][name]['steps'] if item.get('name') == 'Check target')
                      assert 'if' not in check
              for name in owners - {'quality'}:
                  assert 'env: *sccache-identity-env' in jobs[name]
                  for alias in ['sccache-identity', 'sccache-restore', 'sccache-install', 'sccache-stats', 'sccache-seal', 'sccache-save']:
                      assert '*' + alias in jobs[name], (name, alias)
              assert 'CACHE_TARGET: $' + '{{ matrix.target }}' in jobs['targets']
              assert jobs['checks'].index('- name: Secrets\n') < jobs['checks'].index('- name: Restore compile cache\n')
              for obsolete in ['Compile cache credentials', 'SCCACHE_GHA_VERSION', 'SCCACHE_GHA_RW_MODE',
                               'SCCACHE_GHA_ENABLED=true', 'cache-proof-bulk', 'ACTIONS_RUNTIME_TOKEN']:
                  assert obsolete not in workflow, obsolete
              installer = next(item['run'] for item in document['jobs']['quality']['steps'] if item.get('name') == 'Compile cache')
              assert 'version=0.18.0' in installer and "hashlib.file_digest(source, 'sha256')" in installer
              assert 'SCCACHE_GHA_ENABLED=false' in workflow and 'CARGO_INCREMENTAL=0' in workflow

          snapshot_jobs_share_one_owner()
          print('PASS snapshot_jobs_share_one_owner')
      - name: Cache storage failures keep builds running
        shell: python
        run: |
          import contextlib
          import hashlib
          import http.server
          import json
          import os
          import pathlib
          import re
          import shlex
          import shutil
          import subprocess
          import tempfile
          import textwrap
          import threading

          root = pathlib.Path.cwd()
          workflow = (root / '.github/workflows/ci.yml').read_text(encoding='utf-8')

          def body(name):
              step = next(s for s in workflow.split('      - name: ')[1:] if s.splitlines()[0] == name)
              return textwrap.dedent(re.search(r'^        run: (?:&[\w-]+ )?\|\n((?:          .*\n|\n)+)', step, re.M)[1])

          install, startup = body('Compile cache').split('if [ "$CACHE_RESTORE_OUTCOME"', 1)
          startup = 'if [ "$CACHE_RESTORE_OUTCOME"' + startup

          def run(command, env, cwd=root):
              return subprocess.run(command, env=env, cwd=cwd, capture_output=True, text=True)

          def shell(source, env):
              return run(['bash', '-e', '-o', 'pipefail', '-c', source], env)

          class Storage(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.server.requests.append(self.path)
                  index = min(len(self.server.requests) - 1, len(self.server.responses) - 1)
                  status, payload, headers = self.server.responses[index]
                  self.send_response(status)
                  self.send_header('Content-Length', str(len(payload)))
                  for name, value in headers.items():
                      self.send_header(name, value)
                  self.end_headers()
                  self.wfile.write(payload)

              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length', '0')))
                  self.server.requests.append(self.path)
                  response = b'{"code":"unavailable","msg":"Egress is over the account limit"}'
                  self.send_response(503)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(response)))
                  self.end_headers()
                  self.wfile.write(response)

              def log_message(self, *args):
                  pass

          @contextlib.contextmanager
          def storage():
              server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), Storage)
              server.requests = []
              thread = threading.Thread(target=server.serve_forever)
              thread.start()
              try:
                  yield server
              finally:
                  server.shutdown()
                  thread.join()
                  server.server_close()

          def environment(directory):
              env = {k: v for k, v in os.environ.items()
                     if not k.startswith(('SCCACHE_', 'ACTIONS_', 'RUSTC_', 'CARGO_'))
                     and k not in ('GITHUB_API_URL', 'GITHUB_SERVER_URL')}
              return env | {'RUNNER_TEMP': str(directory), 'GITHUB_ENV': str(directory / 'env'),
                            'GITHUB_PATH': str(directory / 'paths'), 'SCCACHE_SERVER_UDS': str(directory / 'daemon.sock'),
                            'SCCACHE_CONF': str(directory / 'no-config'), 'SCCACHE_CACHED_CONF': str(directory / 'cached-config'),
                            'SCCACHE_DIR': str(directory / 'maestro-sccache'), 'CARGO_TARGET_DIR': str(directory / 'target'),
                            'GITHUB_OUTPUT': str(directory / 'outputs'), 'CACHE_RESTORE_OUTCOME': 'success',
                            'CARGO_INCREMENTAL': '0', 'CARGO_BUILD_JOBS': '3'}

          @contextlib.contextmanager
          def daemon(directory, outcome='success', matched='false'):
              env = environment(directory) | {'bin': str(binary.parent), 'PATH': str(binary.parent) + os.pathsep + os.environ['PATH'],
                                              'CACHE_RESTORE_OUTCOME': outcome, 'CACHE_RESTORE_MATCHED': matched}
              try:
                  started = shell(startup, env)
                  assert started.returncode == 0, (started.returncode, started.stdout, started.stderr)
                  (directory / 'restore-message').write_text(started.stdout, encoding='utf-8')
                  env.update(line.split('=', 1) for line in (directory / 'env').read_text(encoding='utf-8').splitlines())
                  yield env
              finally:
                  run([str(binary), '--stop-server'], env)

          def compile_sample(env, fixture='sample', lint=False):
              command = ['cargo', 'clippy' if lint else 'build', '--locked', '--manifest-path', str(root / f'fixtures/{fixture}/Cargo.toml')]
              if lint:
                  command += ['--', '-D', 'warnings']
              if os.environ.get('MAESTRO_LOCAL_CAPPED'):
                  command.insert(0, os.path.expanduser('~/.local/bin/capped'))
              return run(command, env)

          def stats(env, hits, misses):
              result = shell(body('Compile cache statistics'), env)
              assert result.returncode == 0, result.stdout + result.stderr
              assert re.search(rf'^Cache hits\s+{hits}$', result.stdout, re.M), result.stdout
              assert re.search(rf'^Cache misses\s+{misses}$', result.stdout, re.M), result.stdout
              return result.stdout

          def printed_log(env, output):
              log = pathlib.Path(env['RUNNER_TEMP'], 'sccache-error.log').read_text(encoding='utf-8')
              assert '503' in log and 'Egress is over the account limit' in log
              marker = re.search(r'^::stop-commands::([0-9a-f]{64})$', output, re.M)
              assert marker, 'Missing Actions command-suppression marker'
              token = marker[1]
              assert f'::stop-commands::{token}\n{log}\n::{token}::\n' in output

          def snapshot_keys(**changes):
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  env = environment(directory) | {
                      'CALLER_REPOSITORY': 'example/caller', 'CALLER_DIRECTORY': '.',
                      'HOST_OS': 'Linux', 'HOST_ARCH': 'X64', 'CACHE_JOB': 'tests', 'CACHE_INDEX': '0',
                      'CACHE_CALL': 'consumer', 'CACHE_COVERAGE': 'true', 'CACHE_ENABLED': 'true', 'CACHE_WARM': 'false',
                      'SHARD': '1', 'GITHUB_RUN_ID': '10', 'GITHUB_RUN_ATTEMPT': '1', 'CACHE_TARGET': '',
                      'GITHUB_EVENT_NAME': 'push', 'GITHUB_REF': 'refs/heads/main', 'CACHE_DEFAULT_BRANCH': 'main'}
                  compiler = changes.pop('compiler', None)
                  if compiler:
                      source = directory / 'source'
                      source.write_text('#!/bin/sh\nprintf "%s\\n" "different compiler"\n', encoding='utf-8')
                      subprocess.run(['install', '-m', '0700', str(source), str(directory / 'rustc')], check=True)
                      env['PATH'] = str(directory) + os.pathsep + os.environ['PATH']
