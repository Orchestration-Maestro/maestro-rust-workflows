name: CI self-test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sample:
    name: Sample
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: fixtures/sample
      concurrency-key: sample

  declared:
    name: Declared caller
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: fixtures/declared
      concurrency-key: declared

  test-tools:
    name: Caller test tools
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: fixtures/test-tools
      concurrency-key: test-tools

  quality:
    name: Required repository quality
    needs: [sample, declared, test-tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All callers passed every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())

  seams:
    name: Workflow seam proofs
    outputs:
      targets: ${{ steps.cases.outputs.targets }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        working-directory: fixtures/sample
        run: |
          rustup show
          rustup component add rustfmt clippy
      # Reusable workflow calls cannot use continue-on-error. The broken
      # fixtures run the workflow's own commands and assert all twenty outcomes.
      - name: Each broken fixture fails only its own check
        shell: python
        run: |
          import os
          import pathlib
          import re
          import shlex
          import subprocess

          workflow = pathlib.Path('.github/workflows/ci.yml').read_text()
          commands = re.findall(r'^        run: (cargo .+)$', workflow, re.MULTILINE)
          expected = [
              'cargo fmt --all --check',
              'cargo clippy --workspace --all-targets --locked -- -D warnings',
              'cargo doc --workspace --no-deps --locked',
              'cargo test --workspace --locked',
          ]
          assert commands == expected, f'Unexpected check commands: {commands}'
          assert 'continue-on-error' not in workflow
          assert '|| true' not in workflow
          for step in workflow.split('      - name:')[1:]:
              if any(f'run: {command}\n' in step for command in commands[:3]):
                  assert not re.search(r'^        if:', step, re.MULTILINE)
          base_test = next(step for step in workflow.split('      - name:')[1:]
                           if 'run: cargo test --workspace --locked\n' in step)
          assert "if: needs.declaration.outputs.enabled != 'true'" in base_test
          isolated_test = next(step for step in workflow.split('      - name:')[1:]
                               if step.startswith(' Isolated tests\n'))
          assert "if: needs.declaration.outputs.enabled == 'true'" in isolated_test
          assert 'run_isolated cargo test --workspace --locked\n' in isolated_test

          docs_step = next(step for step in workflow.split('      - name:')[1:]
                           if 'run: cargo doc --workspace --no-deps --locked\n' in step)
          flags = re.search(r'^          RUSTDOCFLAGS: (.+)$', docs_step, re.MULTILINE)
          assert flags and flags.group(1) == '-D warnings -D missing_docs'

          concurrency = re.search(r'^concurrency:\n((?:[ \t].*\n)+)', workflow, re.MULTILINE)
          assert concurrency, 'Missing top-level concurrency'
          group = re.search(r'^  group: (.+)$', concurrency.group(1), re.MULTILINE)
          assert group and 'github.ref' in group.group(1), 'Concurrency group must contain github.ref'
          cancellation = re.search(r'^  cancel-in-progress: (.+)$', concurrency.group(1), re.MULTILINE)
          assert cancellation and cancellation.group(1) == "$" + "{{ github.event_name == 'pull_request' }}", \
              'Cancellation must be limited to pull requests'

          failures = []
          for fixture, broken in [('unformatted', 0), ('clippy-warning', 1),
                                  ('failing-test', 3), ('undocumented', 2), ('broken-doc-link', 2)]:
              for check, command in enumerate(commands):
                  env = os.environ.copy()
                  if check == 2:
                      env['RUSTDOCFLAGS'] = flags.group(1)
                  argv = shlex.split(command)
                  if os.environ.get('MAESTRO_LOCAL_CAPPED'):
                      argv.insert(0, os.path.expanduser('~/.local/bin/capped'))
                      env['CARGO_BUILD_JOBS'] = '3'
                  result = subprocess.run(argv, cwd=f'fixtures/{fixture}', env=env)
                  expected_failure = check == broken
                  print(f'{fixture}: {command}: exit {result.returncode}; '
                        f'expected {"failure" if expected_failure else "success"}', flush=True)
                  if (result.returncode != 0) != expected_failure:
                      failures.append(f'{fixture}: {command}: exit {result.returncode}')
          assert not failures, '\n'.join(failures)
      - name: Added checks at workflow seam
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import shlex
          import subprocess
          import tempfile
          import textwrap
          import time

          workflow = pathlib.Path('.github/workflows/ci.yml').read_text()
          root = pathlib.Path.cwd()

          def body(name):
              step = next(s for s in workflow.split('      - name: ')[1:] if s.splitlines()[0] == name)
              match = re.search(r'^        run: (?:&[\w-]+ )?\|\n((?:          .*\n|\n)+)', step, re.MULTILINE)
              assert match, name
              return textwrap.dedent(match.group(1))

          def execute(name, directory, env):
              argv = ['bash', '-e', '-o', 'pipefail', '-c', body(name)]
              if os.environ.get('MAESTRO_LOCAL_CAPPED'):
                  argv.insert(0, os.path.expanduser('~/.local/bin/capped'))
                  env = env | {'CARGO_BUILD_JOBS': '3'}
              return subprocess.run(argv, cwd=directory, env=env, capture_output=True, text=True)

          checks = ['Licenses and dependencies', 'Unused dependencies', 'Spelling', 'Secrets', 'Workflows', 'Coverage']
          base = re.findall(r'^        run: (cargo .+)$', workflow, re.MULTILINE)
          assert len(base) == 4
          with tempfile.TemporaryDirectory() as temporary:
              env = os.environ | {'RUNNER_TEMP': temporary, 'GITHUB_PATH': temporary + '/paths',
                                  'GITHUB_ENV': temporary + '/environment', 'QUALITY_CONFIG': '{}'}
              start = time.monotonic()
              installed = execute('Check tools', root, env)
              assert installed.returncode == 0, installed.stdout + installed.stderr
              env['PATH'] = ':'.join(pathlib.Path(env['GITHUB_PATH']).read_text().splitlines()) + ':' + env['PATH']
              component = subprocess.run(['rustup', 'component', 'add', 'llvm-tools-preview'],
                                         cwd=root / 'fixtures/sample', capture_output=True, text=True)
              assert component.returncode == 0, component.stderr
              configured = execute('Embedded check defaults', root, env)
              assert configured.returncode == 0, configured.stdout + configured.stderr
              env.update(dict(line.split('=', 1) for line in pathlib.Path(env['GITHUB_ENV']).read_text().splitlines()))
              for name in checks:
                  result = execute(name, root / 'fixtures/sample', env)
                  assert result.returncode == 0, name + '\n' + result.stdout + result.stderr
                  print(f'sample: {name}: exit {result.returncode}', flush=True)
              print(f'Added sample CI time including verified installation: {time.monotonic() - start:.2f}s', flush=True)
              # Root self-calls keep the runner-compatible syntax until actionlint accepts $/.
              root_config = pathlib.Path(temporary) / 'root-zizmor.yml'
              root_config.write_text('rules:\n  self-repository:\n    ignore:\n'
                                     '      - ci-internal.yml:15:11\n'
                                     '      - ci-internal.yml:22:11\n'
                                     '      - ci-internal.yml:29:11\n')
              for argv in [['zizmor', '--offline', '--strict-collection', '--config', str(root_config), '.github/workflows'],
                           ['actionlint', '-config-file', env['CHECK_DEFAULTS'] + '/actionlint.yaml', '-shellcheck=', '-pyflakes=',
                            *map(str, (root / '.github/workflows').glob('*.yml'))]]:
                  result = subprocess.run(argv, cwd=root, env=env, capture_output=True, text=True)
                  assert result.returncode == 0, result.stdout + result.stderr
              print('PASS repository_workflow_checks')
              # Extensions grant only the named spelling word and exact license exception.
              extension = {'spelling_words': ['teh'], 'license_exceptions': [
                  {'package': 'sample', 'version': '0.1.0', 'licenses': ['GPL-3.0-only']}]}
              result = execute('Embedded check defaults', root, env | {'QUALITY_CONFIG': json.dumps(extension)})
              assert result.returncode == 0, result.stderr
              for fixture, name in [('misspelling', 'Spelling'), ('disallowed-license', 'Licenses and dependencies')]:
                  result = execute(name, root / 'fixtures' / fixture, env)
                  assert result.returncode == 0, result.stdout + result.stderr
              extension['license_exceptions'][0]['version'] = '0.1.1'
              result = execute('Embedded check defaults', root, env | {'QUALITY_CONFIG': json.dumps(extension)})
              assert result.returncode == 0, result.stderr
              result = execute('Licenses and dependencies', root / 'fixtures/disallowed-license', env)
              assert result.returncode != 0, 'License exception must not match another version'
              result = execute('Embedded check defaults', root, env)
              assert result.returncode == 0, result.stderr
              print('PASS quality_extensions_preserve_defaults')
              # The workflow seam also proves the correctness command, independently of security findings.
              workflows = pathlib.Path(temporary) / '.github/workflows'
              workflows.mkdir(parents=True)
              workflow_path = workflows / 'proof.yml'
              workflow_path.write_text('name: Proof\non: push\npermissions:\n  contents: read\njobs:\n'
                                       '  proof:\n    runs-on: ubuntu-latest\n    steps:\n'
                                       '      - name: Print\n        run: echo success\n')
              result = execute('Workflows', pathlib.Path(temporary), env)
              assert result.returncode == 0, result.stdout + result.stderr
              workflow_path.write_text(workflow_path.read_text().replace('name: Print', 'if: nonexistent.value\n        name: Print'))
              result = execute('Workflows', pathlib.Path(temporary), env)
              assert result.returncode != 0 and 'undefined variable "nonexistent"' in result.stdout + result.stderr, result.stdout + result.stderr
              print('PASS workflow_correctness_is_required')
              failures = []
              for fixture, broken in [('disallowed-license', 0), ('unused-dependency', 1), ('misspelling', 2),
                                      ('fake-secret', 3), ('unsafe-workflow', 4), ('low-coverage', 5)]:
                  directory = root / 'fixtures' / fixture
                  for index, name in enumerate(checks):
                      result = execute(name, directory, env)
                      print(f'{fixture}: {name}: exit {result.returncode}', flush=True)
                      if (result.returncode != 0) != (index == broken):
                          failures.append(f'{fixture}: {name}: {result.stdout}{result.stderr}')
                  for command in base:
                      argv = shlex.split(command)
                      child = env | {'RUSTDOCFLAGS': '-D warnings -D missing_docs'}
                      if os.environ.get('MAESTRO_LOCAL_CAPPED'):
                          argv.insert(0, os.path.expanduser('~/.local/bin/capped'))
                          child['CARGO_BUILD_JOBS'] = '3'
                      result = subprocess.run(argv, cwd=directory, env=child, capture_output=True, text=True)
                      print(f'{fixture}: {command}: exit {result.returncode}', flush=True)
                      if result.returncode:
                          failures.append(f'{fixture}: {command}: {result.stdout}{result.stderr}')
              assert not failures, '\n'.join(failures)
              # Each bypass is a separate temporary broken copy, never a consumer setting.
              import shutil
              bypasses = [
                  ('machete-package', 'unused-dependency', 'Unused dependencies', 'Cargo.toml',
                   '\n[package.metadata.cargo-machete]\nignored = ["unused"]\n'),
                  ('machete-workspace', 'unused-dependency', 'Unused dependencies', 'Cargo.toml',
                   '\n[workspace]\n[workspace.metadata.cargo-machete]\nignored = ["unused"]\n'),
                  ('machete-renamed-package', 'unused-dependency', 'Unused dependencies', 'Cargo.toml',
                   '\n[package.metadata.cargo-machete]\nrenamed = { unused = "super" }\n'),
                  ('machete-renamed-workspace', 'unused-dependency', 'Unused dependencies', 'Cargo.toml',
                   '\n[workspace]\n[workspace.metadata.cargo-machete]\nrenamed = { unused = "super" }\n'),
                  ('secret-ignore-file', 'fake-secret', 'Secrets', '.gitleaksignore', 'secret.txt:github-pat:1\n'),
                  ('secret-config', 'fake-secret', 'Secrets', '.gitleaks.toml',
                   '[allowlist]\nregexes = [".*"]\n'),
                  ('secret-inline', 'fake-secret', 'Secrets', 'secret.txt', ' # gitleaks:allow\n'),
                  ('spelling-config', 'misspelling', 'Spelling', '_typos.toml', '[default]\ncheck-file = false\n'),
                  ('license-config', 'disallowed-license', 'Licenses and dependencies', 'deny.toml',
                   '[licenses]\nallow = ["GPL-3.0-only"]\n'),
                  ('workflow-config', 'unsafe-workflow', 'Workflows', 'zizmor.yml',
                   'rules:\n  template-injection:\n    disable: true\n'),
                  ('workflow-inline', 'unsafe-workflow', 'Workflows', '.github/workflows/unsafe.yml',
                   ' # zizmor: ignore[template-injection]\n'),
              ]
              for case, original, name, filename, addition in bypasses:
                  directory = pathlib.Path(temporary) / case
                  shutil.copytree(root / 'fixtures' / original, directory, ignore=shutil.ignore_patterns('target'))
                  path = directory / filename
                  if case == 'secret-inline':
                      path.write_text(path.read_text().rstrip() + addition)
                  elif case == 'workflow-inline':
                      path.write_text(path.read_text().replace('title }}"', 'title }}"' + addition.rstrip()))
                  else:
                      path.write_text((path.read_text() if path.exists() else '') + addition)
                  result = execute(name, directory, env)
                  assert result.returncode != 0, f'{case}: bypass accepted\n{result.stdout}{result.stderr}'
                  print(f'PASS {case}: exit {result.returncode}')
              # An external coverage tool must not replace the toolchain's verified LLVM.
              directory = pathlib.Path(temporary) / 'coverage-tool'
              shutil.copytree(root / 'fixtures/low-coverage', directory, ignore=shutil.ignore_patterns('target'))
              fake = pathlib.Path(temporary) / 'fake-llvm-cov'
              fake.write_text('#!/bin/sh\nprintf \'{"data":[{"totals":{"lines":{"percent":100}}}]}\\n\'\n')
              fake.chmod(0o755)
              result = execute('Coverage', directory, env | {'LLVM_COV': str(fake)})
              assert result.returncode != 0, 'Coverage accepted an external LLVM override'
              print('PASS coverage-tool: external LLVM override rejected')
              # LLVM flags must not hide the uncovered module from the denominator.
              source = directory / 'src/lib.rs'
              text = source.read_text()
              start = text.index('/// Returns the sum')
              end = text.index('#[cfg(test)]', start)
              (directory / 'src/uncovered.rs').write_text('//! Uncovered arithmetic.\n' + text[start:end])
              source.write_text(text[:start] + 'pub mod uncovered;\n\n' + text[end:])
              for key in ['LLVM_COV_FLAGS', 'CARGO_LLVM_COV_FLAGS']:
                  result = execute('Coverage', directory, env | {key: '-ignore-filename-regex=uncovered.rs'})
                  assert result.returncode != 0, key + ': uncovered file excluded'
                  print(f'PASS {key}: exclusions rejected')
              # A caller actionlint runner allowlist cannot suppress correctness errors.
              workflow_path.write_text('name: Proof\non: push\npermissions:\n  contents: read\njobs:\n'
                                       '  proof:\n    runs-on: custom-runner\n    steps:\n'
                                       '      - name: Print\n        run: echo success\n')
              (pathlib.Path(temporary) / '.github/actionlint.yaml').write_text('self-hosted-runner:\n  labels: [custom-runner]\n')
              result = execute('Workflows', pathlib.Path(temporary), env)
              assert result.returncode != 0 and 'label' in result.stdout + result.stderr, result.stdout + result.stderr
              print('PASS actionlint-config: consumer runner allowlist ignored')

              # A corrupt release must never be extracted or put on PATH.
              hostile = pathlib.Path(temporary) / 'hostile'
              hostile.mkdir()
              curl = hostile / 'curl'
              curl.write_text('#!/bin/sh\nwhile [ "$1" != --output ]; do shift; done\nprintf invalid-archive > "$2"\n')
              curl.chmod(0o755)
              before = pathlib.Path(env['GITHUB_PATH']).read_text()
              result = execute('Check tools', root, env | {'PATH': str(hostile) + ':' + env['PATH']})
              assert result.returncode != 0
              assert pathlib.Path(env['GITHUB_PATH']).read_text() == before
              print('PASS check_tools_reject_corrupt_release')

      - name: Real search tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find
          mkdir -p "$RUNNER_TEMP/maestro-search-bin"
          ln -s /usr/bin/fdfind "$RUNNER_TEMP/maestro-search-bin/fd"
          echo "$RUNNER_TEMP/maestro-search-bin" >> "$GITHUB_PATH"
      - name: Caller checks at workflow seam
        id: cases
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import shlex
          import subprocess
          import tempfile
          import textwrap
          import tomllib

          workflow = pathlib.Path('.github/workflows/ci.yml').read_text()
          root = pathlib.Path.cwd()

          def body(name):
              steps = workflow.split('      - name: ')
              step = next(s for s in steps[1:] if s.splitlines()[0] == name)
              match = re.search(r'^        run: (?:&[\w-]+ )?\|\n((?:          .*\n|\n)+)', step, re.MULTILINE)
              assert match, f'Missing executable body: {name}'
              return textwrap.dedent(match.group(1))

          def execute(name, cwd, extra=None):
              env = {k: v for k, v in os.environ.items()
                     if k not in credential_names and not k.endswith('_API_KEY')}
              env.update(extra or {})
              command = body(name)
              if name in ['Browser tools', 'Test tools']:
                  command = body('Mise bootstrap') + command
              bash = 'bash'
              if os.name == 'nt':
                  import shutil
                  # Match the runner's Bash shell, not the Windows WSL launcher.
                  bash = str(pathlib.Path(shutil.which('git')).parent.parent / 'bin/bash.exe')
                  assert pathlib.Path(bash).is_file(), f'Git Bash not found: {bash}'
              argv = [bash, '-e', '-o', 'pipefail', '-c', command]
              if os.environ.get('MAESTRO_LOCAL_CAPPED'):
                  command = command.replace('env -i PATH=', 'env -i CARGO_BUILD_JOBS=3 PATH=')
                  argv = [os.path.expanduser('~/.local/bin/capped'), 'bash', '-e', '-o', 'pipefail', '-c', command]
                  env['CARGO_BUILD_JOBS'] = '3'
              return subprocess.run(argv, cwd=cwd, env=env, text=True, capture_output=True)

          credential_names = '''ANTHROPIC_API_KEY ANTHROPIC_OAUTH_TOKEN OPENAI_API_KEY GEMINI_API_KEY
          GROQ_API_KEY CEREBRAS_API_KEY XAI_API_KEY OPENROUTER_API_KEY ZAI_API_KEY
          MISTRAL_API_KEY MINIMAX_API_KEY MINIMAX_CN_API_KEY KIMI_API_KEY HF_TOKEN
          AI_GATEWAY_API_KEY OPENCODE_API_KEY COPILOT_GITHUB_TOKEN GH_TOKEN GITHUB_TOKEN
          GOOGLE_APPLICATION_CREDENTIALS GOOGLE_CLOUD_PROJECT GCLOUD_PROJECT
          GOOGLE_CLOUD_LOCATION AWS_PROFILE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION AWS_BEARER_TOKEN_BEDROCK
          AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI
          AWS_WEB_IDENTITY_TOKEN_FILE BEDROCK_EXTENSIVE_MODEL_TEST FIREWORKS_API_KEY'''.split()

          def declaration(directory):
              with tempfile.NamedTemporaryFile() as output:
                  result = execute('Read caller declaration', directory, {'GITHUB_OUTPUT': output.name})
                  values = dict(line.split('=', 1) for line in pathlib.Path(output.name).read_text().splitlines())
                  return result, values

          def absent_keeps_base_checks():
              result, values = declaration(root / 'fixtures/sample')
              assert result.returncode == 0, result.stdout + result.stderr
              assert values == {'quality_config': '{}', 'enabled': 'false', 'wasm_crates': '[]', 'targets': '[]', 'browser_build': 'false', 'test_tools': 'false'}
              assert 'if: needs.declaration.outputs.enabled != \'true\'' in workflow
              assert 'if: needs.declaration.outputs.enabled == \'true\'' in workflow
              assert "inputs.working-directory != '.'" in workflow

          absent_keeps_base_checks()
          print('PASS absent_keeps_base_checks')

          def test_tools_defaults_preserve_behavior():
              import shutil
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/sample', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  result, values = declaration(directory)
                  assert result.returncode == 0, result.stderr
                  assert values['test_tools'] == 'false'
                  (directory / '.github').mkdir()
                  path = directory / '.github/ci.toml'
                  for flag in ['', '\ntest_tools=false']:
                      path.write_text('wasm_crates=[]\ncheck_targets=[]' + flag)
                      result, values = declaration(directory)
                      assert result.returncode == 0 and values['test_tools'] == 'false', result.stderr
                  for flag in ['1', '"true"', '[]']:
                      path.write_text('wasm_crates=[]\ncheck_targets=[]\ntest_tools=' + flag)
                      result, values = declaration(directory)
                      assert result.returncode != 0 and 'test_tools must be a boolean' in result.stderr
                  assert workflow.count('digest=8f5f6660') == 1
                  browser = workflow.split('  browser:\n', 1)[1]
                  assert "if: needs.declaration.outputs.browser_build == 'true'\n        run: *mise-bootstrap" in browser
                  tests = workflow.split('  tests:\n', 1)[1].split('  targets:', 1)[0]
                  for name in ['Mise bootstrap', 'Test tools']:
                      step = next(s for s in tests.split('      - name: ')[1:] if s.splitlines()[0] == name)
                      assert "if: needs.declaration.outputs.test_tools == 'true'" in step

          test_tools_defaults_preserve_behavior()
          print('PASS test_tools_defaults_preserve_behavior')

          def test_tools_are_opt_in():
              import shutil
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/test-tools', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  # Keep rustup's bin directory present so its proxy does not prepend it.
                  proxies = directory / 'rust-bin'
                  proxies.mkdir()
                  for tool in ['cargo', 'rustc', 'rustdoc']:
                      (proxies / tool).symlink_to(shutil.which(tool))
                  for tool in ['just', 'prek']:
                      missing = proxies / tool
                      missing.write_text('#!/bin/sh\nexit 127\n')
                      missing.chmod(0o755)
                  env = {'RUNNER_TEMP': temporary, 'GITHUB_PATH': str(directory / 'paths'),
                         'PATH': f'{proxies}:/usr/bin:/bin:' + str(pathlib.Path.home() / '.cargo/bin')}
                  path = directory / '.github/ci.toml'
                  for flag in ['', '\ntest_tools=false']:
                      path.write_text('wasm_crates=[]\ncheck_targets=[]' + flag)
                      result, values = declaration(directory)
                      assert result.returncode == 0 and values['test_tools'] == 'false', result.stderr
                      result = execute('Isolated tests', directory, env)
                      assert result.returncode != 0 and 'test result: FAILED' in result.stdout, result.stderr
                  path.write_text('wasm_crates=[]\ncheck_targets=[]\ntest_tools=true')
                  result, values = declaration(directory)
                  assert result.returncode == 0 and values['test_tools'] == 'true', result.stderr
                  result = execute('Test tools', directory, env)
                  assert result.returncode == 0, result.stdout + result.stderr
                  env['PATH'] = ':'.join((directory / 'paths').read_text().splitlines()) + ':' + env['PATH']
                  result = execute('Isolated tests', directory, env)
                  assert result.returncode == 0, result.stdout + result.stderr
                  assert 'caller_pinned_tools_are_available ... ok' in result.stdout

          test_tools_are_opt_in()
          print('PASS test_tools_are_opt_in')

          def test_tools_follow_only_caller_pins():
              import shutil
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/test-tools', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  conflict = directory / 'conflict'
                  conflict.mkdir()
                  for tool in ['just', 'prek']:
                      binary = conflict / tool
                      binary.write_text('#!/bin/sh\necho conflicting-tool\nexit 29\n')
                      binary.chmod(0o755)
                  env = {'RUNNER_TEMP': temporary, 'GITHUB_PATH': str(directory / 'paths'),
                         'PATH': f'{conflict}:' + os.environ['PATH']}
