                  env['PATH'] = os.pathsep.join(p for p in os.environ['PATH'].split(os.pathsep)
                                              if not any((pathlib.Path(p) / name).is_file() for name in ['mise', 'mise.exe']))
                  result = execute('Mise bootstrap', directory, env)
