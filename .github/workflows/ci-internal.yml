              assert execute('Browser test tool pin', caller, env).returncode != 0
              (caller / 'mise.toml').write_text('[tools]\n', encoding='utf-8')
              assert execute('Browser test tool pin', caller, env).returncode != 0
              selected = env | values | {'PATH': cli + os.pathsep + os.environ['PATH']}
