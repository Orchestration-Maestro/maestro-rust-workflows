          browser_test_downloads_verify_every_archive()
          browser_test_result_stays_required()

          def mise_bootstrap_checks_release_digest():
              import shutil
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/declared', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  paths = directory / 'paths'
                  env = {'RUNNER_TEMP': temporary, 'GITHUB_PATH': str(paths)}
                  # Start without mise: production must fetch and verify the official release.
                  env['PATH'] = '/usr/bin:/bin'
                  result = execute('Mise bootstrap', directory, env)
                  assert result.returncode == 0, result.stdout + result.stderr
                  installed_bin = paths.read_text(encoding="utf-8").splitlines()[-1]
                  installed = pathlib.Path(installed_bin) / 'mise'
                  assert subprocess.check_output([str(installed), '--version'], text=True).split()[0] == '2026.10.2'
                  bin_dir = directory / 'bin'
                  bin_dir.mkdir()
                  (bin_dir / 'mise').symlink_to(installed)
                  curl = bin_dir / 'curl'
                  curl.write_text('#!/bin/sh\nexit 77\n', encoding="utf-8")
                  curl.chmod(0o755)
                  env['PATH'] = f'{bin_dir}:/usr/bin:/bin'
                  before = paths.read_text(encoding="utf-8")
                  result = execute('Mise bootstrap', directory, env)
                  assert result.returncode == 0, result.stdout + result.stderr
                  assert paths.read_text(encoding="utf-8") == before  # Matching version is reused, no download.
                  (bin_dir / 'mise').unlink()
                  (bin_dir / 'mise').write_text('#!/bin/sh\necho 0.0.0\n', encoding="utf-8")
                  (bin_dir / 'mise').chmod(0o755)
                  curl.write_text('#!/bin/sh\nexec /usr/bin/curl "$@"\n', encoding="utf-8")
                  result = execute('Mise bootstrap', directory, env)
                  assert result.returncode == 0, result.stdout + result.stderr
                  assert paths.read_text(encoding="utf-8") != before  # Wrong version selects verified release.
                  before = paths.read_text(encoding="utf-8")
                  # A hostile download is data until the production checksum has passed.
                  curl.write_text('#!/bin/sh\nwhile [ "$1" != --output ]; do shift; done\n'
                                  'printf "#!/bin/sh\\ntouch checksum-bypass-marker\\n" > "$2"\n', encoding="utf-8")
                  result = execute('Mise bootstrap', directory, env)
                  assert result.returncode != 0, result.stdout + result.stderr
                  assert not (directory / 'checksum-bypass-marker').exists()
                  assert paths.read_text(encoding="utf-8") == before

          mise_bootstrap_checks_release_digest()
          print('PASS mise_bootstrap_checks_release_digest')

          workflow_failures_remain_required()
          print('PASS workflow_failures_remain_required')

          def reusable_calls_complete_independently():
              internal = (root / '.github/workflows/ci-internal.yml').read_text(encoding="utf-8")
              group = re.search(r'^  group: (.+)$', workflow, re.MULTILINE).group(1)
              assert group == 'rust-ci-$' + '{{ github.ref }}$' + "{{ inputs.concurrency-key && format('-{0}', inputs.concurrency-key) || '' }}", \
                  'Reusable calls share a concurrency group and can cancel each other'
              keys = []
              for job in ['sample', 'declared', 'test-tools']:
                  section = re.split(r'\n  \S', internal.split(f'  {job}:\n', 1)[1], maxsplit=1)[0]
                  key = re.search(r'^      concurrency-key: (.+)$', section, re.MULTILINE)
                  assert key, f'{job} must select its own stable concurrency key'
                  keys.append(key.group(1).casefold())
              assert len(set(keys)) == 3, 'Concurrency groups are case-insensitive'
              assert 'needs: [sample, declared, test-tools]' in internal
              assert "all(job['result'] == 'success'" in internal
              assert "cancel-in-progress: $" + "{{ github.event_name == 'pull_request' }}" in workflow

          reusable_calls_complete_independently()
          print('PASS reusable_calls_complete_independently')

          def workflow_safety_is_unchanged():
              assert re.findall(r'^        run: (cargo .+)$', workflow, re.MULTILINE) + ['cargo test --workspace --locked'] == [
                  'cargo fmt --all --check',
                  'cargo clippy --workspace --all-targets --locked -- -D warnings',
                  'cargo doc --workspace --no-deps --locked',
                  'cargo test --workspace --locked',
              ]
              assert not re.search(r'^    continue-on-error:', workflow, re.MULTILINE) and '|| true' not in workflow
              assert 'permissions:\n  contents: read' in workflow
              assert "cancel-in-progress: $" + "{{ github.event_name == 'pull_request' }}" in workflow
              for step in workflow.split('      - name: ')[1:]:
                  if 'uses:' in step:
                      assert re.search(r'uses: [^\n]+@[0-9a-f]{40}', step)
                  if step.startswith('Checkout\n'):
                      assert 'persist-credentials: false' in step
              assert 'RUSTDOCFLAGS: -D warnings -D missing_docs' in workflow
              assert 'run_isolated cargo test --locked --doc' in body('Isolated tests')
              for job in ['quality', 'docs', 'tests', 'targets', 'browser', 'browser-tests', 'declaration']:
                  section = workflow.split(f'  {job}:\n', 1)[1]
                  assert 'run: rustup show' in section or 'rustup show\n' in section
              internal = (root / '.github/workflows/ci-internal.yml').read_text(encoding="utf-8")
              assert "('unformatted', 0), ('clippy-warning', 1)" in internal
              assert "('failing-test', 3), ('undocumented', 2), ('broken-doc-link', 2)" in internal
              # Only the base-vs-isolated tests branch may condition an original command.
              for step in workflow.split('      - name: ')[1:]:
                  if any(f'run: {command}\n' in step for command in [
                          'cargo fmt --all --check',
                          'cargo clippy --workspace --all-targets --locked -- -D warnings',
                          'cargo doc --workspace --no-deps --locked']):
                      assert not re.search(r'^        if:', step, re.MULTILINE)

          workflow_safety_is_unchanged()
          print('PASS workflow_safety_is_unchanged')

  native:
    name: Native compiler proof (${{ matrix.target }})
    needs: seams
    strategy:
      matrix:
        include: ${{ fromJSON(needs.seams.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Foreign target failures are detected
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import ast
          import pathlib
          import textwrap
          source = pathlib.Path('.github/workflows/ci-internal.yml').read_text(encoding="utf-8")
          code = source.split('      - name: Caller checks at workflow seam\n', 1)[1]
          code = code.split('        run: |\n', 1)[1].split('\n  native:', 1)[0]
          tree = ast.parse(textwrap.dedent(code))
          # Reuse the same workflow-body helpers and case, not a second command generator.
          tree.body = [node for node in tree.body if not isinstance(node, ast.Expr)]
          namespace = {}
          exec(compile(tree, 'workflow seam', 'exec'), namespace)
          namespace['mise_bootstrap_uses_runner_platform']()
          namespace['caller_build_tools_reach_compilers']()
          namespace['foreign_target_failures_are_detected']()
          namespace['foreign_target_warnings_are_denied']()
          print('PASS foreign_target_failures_are_detected')

  fuzz-issues:
    name: Fuzz findings and issues
    needs: fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download fuzz findings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fuzz-fuzz-*
          path: findings
      - name: Fuzz findings open one issue each
        shell: python
        run: |
          import ast
          import base64
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          import textwrap

          root = pathlib.Path.cwd()
          source = (root / '.github/workflows/ci-internal.yml').read_text(encoding='utf-8')
          seam = source.split('      - name: Added checks at workflow seam\n', 1)[1].split('        run: |\n', 1)[1]
          seam = seam.split('\n      - name: ', 1)[0]
          tree = ast.parse(textwrap.dedent(seam))
          # Reuse the seam's fake tool, not a second recorder.
          tree.body = [node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'fake_tool']
          exec(compile(tree, 'fake gh', 'exec'))
          nightly = (root / '.github/workflows/fuzz.yml').read_text(encoding='utf-8')
          step = next(s for s in nightly.split('      - name: ')[1:] if s.splitlines()[0] == 'Open fuzz issues')
          code = textwrap.dedent(re.search(r'^        run: \|\n((?:          .*\n|\n)+)', step, re.MULTILINE).group(1))
          titles = ['Fuzz out-of-memory in hungry', 'Fuzz crash in planted at src/lib.rs:5:5', 'Fuzz timeout in stalled']

          def findings_match_planted_defects():
              findings = root / 'findings'
              assert sorted(path.name for path in findings.iterdir()) == ['fuzz-fuzz-hungry', 'fuzz-fuzz-planted', 'fuzz-fuzz-stalled']
              def finding(name):
                  return json.loads((findings / name / 'finding.json').read_text(encoding='utf-8'))
              planted = finding('fuzz-fuzz-planted')
              assert (planted['kind'], planted['location']) == ('crash', 'src/lib.rs:5:5'), planted
              assert (findings / 'fuzz-fuzz-planted/minimized').read_bytes() == b'!'
              seed = (root / 'fixtures/fuzz/fuzz/corpus/planted/seeded-crash').read_bytes()
              assert (findings / 'fuzz-fuzz-planted/crash-833ac4a2bc4d586cda123149872c41bc75a77b83').read_bytes() == seed
              assert 'planted crash' in planted['stack'] and planted['stack'].splitlines()[-1].startswith('SUMMARY: '), planted['stack']
              assert [(finding(name)['kind'], finding(name)['location']) for name in ['fuzz-fuzz-stalled', 'fuzz-fuzz-hungry']] == [('timeout', ''), ('oom', '')]

          findings_match_planted_defects()
          print('PASS fuzz_findings_match_planted_defects', flush=True)

          with tempfile.TemporaryDirectory() as temporary:
              fake, recorded = fake_tool(pathlib.Path(temporary) / 'fake-gh', 'gh')
              def report(cwd=root, scan='success', open_issues=()):
                  result = subprocess.run(['python3', '-c', code], cwd=cwd, capture_output=True, text=True, env=os.environ | fake | {
                      'SCAN': scan, 'RUN_URL': 'https://example.invalid/run', 'REPOSITORY': 'owner/repo', 'GH_TOKEN': 'token',
                      'OPEN': json.dumps(list(open_issues))})
                  return result, recorded()
              def filed(made, verb):
                  return [call for call in made if call['argv'][:2] == ['issue', verb]]

              def issues_open_once_per_finding():
                  # An open issue whose title only shares the prefix is a different finding.
                  result, made = report(open_issues=[{'number': 5, 'title': 'Fuzz crash in planted at src/lib.rs:9:9'}])
                  assert result.returncode != 0 and result.stderr.strip().endswith('3 fuzz findings on main'), result.stdout + result.stderr
                  created = filed(made, 'create')
                  assert [call['argv'][call['argv'].index('--title') + 1] for call in created] == titles, made
                  for call in created:
                      assert call['argv'][-8:] == ['--body-file', '-', '--label', 'bug', '--label', 'needs-triage', '-R', 'owner/repo'], call
                  planted = created[1]['body']
                  assert '`IQ==`' in planted and '- Run: https://example.invalid/run\n' in planted, planted
                  assert '- Artifact: `fuzz-fuzz-planted` (raw and minimized inputs, logs)\n' in planted, planted
                  assert not any('clean' in json.dumps(call) for call in made), made
                  assert len(filed(made, 'list')) == 3 and len(made) == 6, made
                  return [call['body'] for call in created]

              bodies = issues_open_once_per_finding()
              print('PASS fuzz_issues_open_once_per_finding', flush=True)

              def replay_comments_on_open_issue():
                  numbers = {'Fuzz crash in planted at src/lib.rs:5:5': 9, 'Fuzz timeout in stalled': 7, 'Fuzz out-of-memory in hungry': 8}
                  result, made = report(open_issues=[{'number': number, 'title': title} for title, number in numbers.items()])
                  assert result.returncode != 0 and result.stderr.strip().endswith('3 fuzz findings on main'), result.stdout + result.stderr
                  assert filed(made, 'create') == [], made
                  comments = filed(made, 'comment')
                  assert [call['argv'] for call in comments] == [['issue', 'comment', str(numbers[title]), '--body-file', '-', '-R', 'owner/repo']
                                                                for title in titles], made
                  assert [call['body'] for call in comments] == bodies

              replay_comments_on_open_issue()
              print('PASS fuzz_replay_comments_on_open_issue', flush=True)

              def report_keeps_failed_scan_red():
                  result, made = report(scan='failure')
                  assert len(filed(made, 'create')) == 3, made
                  assert result.returncode != 0 and result.stderr.strip() == 'fuzz scan failure: https://example.invalid/run', result.stdout + result.stderr

              report_keeps_failed_scan_red()
              print('PASS fuzz_report_keeps_failed_scan_red', flush=True)

              def report_without_findings_stays_quiet():
                  empty = pathlib.Path(temporary) / 'empty'
                  empty.mkdir()
                  result, made = report(cwd=empty)
                  assert result.returncode == 0 and result.stdout == 'no fuzz findings on main\n' and made == [], result.stdout + result.stderr

              report_without_findings_stays_quiet()
              print('PASS fuzz_report_without_findings_stays_quiet', flush=True)

              def issue_body_fits_platform_limit():
                  large = pathlib.Path(temporary) / 'large'
                  (large / 'findings/fuzz-fuzz-large').mkdir(parents=True)
                  (large / 'findings/fuzz-fuzz-large/finding.json').write_text(json.dumps({
                      'target': 'large', 'kind': 'crash', 'location': '',
                      'input': base64.b64encode(bytes(60000)).decode(),
                      'stack': '\n'.join(f'#{index} frame' for index in range(20000))}), encoding='utf-8')
                  result, made = report(cwd=large)
                  body = filed(made, 'create')[0]['body']
                  assert len(body) == 65536 and body.endswith('\n```\n'), len(body)
                  assert '- Minimized input (60000 bytes): in the artifact\n' in body and 'base64' not in body, body[:400]

              issue_body_fits_platform_limit()
              print('PASS fuzz_issue_body_fits_platform_limit', flush=True)

  browser-qualification:
    name: Maestro browser qualification
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: maestro
    steps:
      - name: Checkout workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: workflow
      - name: Checkout Maestro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: Orchestration-Maestro/maestro
          path: maestro
          ref: 3e416ef4b096dffec41147bcdbba682a0eebbde7
      - name: Extract workflow steps
        working-directory: .
        run: python3 workflow/.github/extract-workflow-steps.py
      - name: Toolchain
        run: bash -e -o pipefail "$PROOF_STEPS/Toolchain"
      - name: Compile cache identity
        id: cache-identity
        env:
          CALLER_REPOSITORY: Orchestration-Maestro/maestro
          CALLER_DIRECTORY: maestro
          HOST_OS: ${{ runner.os }}
          HOST_ARCH: ${{ runner.arch }}
          CACHE_JOB: ${{ github.job }}
          CACHE_INDEX: ${{ strategy.job-index || 0 }}
          CACHE_CALL: ''
          CACHE_COVERAGE: 'false'
          CACHE_ENABLED: 'true'
          CACHE_WARM: 'false'
          CACHE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash -e -o pipefail "$PROOF_STEPS/Compile cache identity"
      - name: Restore compile cache
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/maestro-sccache
          key: ${{ steps.cache-identity.outputs.key }}
          restore-keys: ${{ steps.cache-identity.outputs.prefix }}
          enableCrossOsArchive: false
          fail-on-cache-miss: false
      - name: Compile cache
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache-restore.outcome }}
          CACHE_RESTORE_MATCHED: ${{ steps.cache-restore.outputs.cache-hit }}
        timeout-minutes: 10
        run: bash -e -o pipefail "$PROOF_STEPS/Compile cache"
      - name: Browser test tool pin
        run: bash -e -o pipefail "$PROOF_STEPS/Browser test tool pin"
      - name: Browser test mise bootstrap
        run: bash -e -o pipefail "$PROOF_STEPS/Browser test mise bootstrap"
      - name: Browser test caller tools
        run: bash -e -o pipefail "$PROOF_STEPS/Browser test caller tools"
      - name: Browser runtime tools
        run: bash -e -o pipefail "$PROOF_STEPS/Browser runtime tools"
      - name: Immutable shared recipe qualification
        run: |
          import json, os, pathlib, subprocess, time
          root=pathlib.Path.cwd()
          support=root/'crates/maestro-web/tests/sandbox_loading_support'
          execution=root/'crates/maestro-web/tests/sandbox_execution_browser.rs'
          loading=root/'crates/maestro-web/tests/sandbox_loading_browser.rs'
          inventory=support/'exports.json'
          driver=support/'run.cjs'
          original={p:p.read_bytes() for p in [execution,loading,inventory,driver]}
          logs=root.parent/'qualification-logs'
          logs.mkdir()
          tracked_before=subprocess.check_output(['git','diff','--binary'])
          print('SETUP DIFF\n'+tracked_before.decode(),flush=True)
          command=(pathlib.Path(os.environ['PROOF_STEPS'])/'Browser test recipe').read_text(encoding='utf-8')

          def run(label, expected, diagnostic=None):
              start=time.monotonic()
              with (logs/(label+'.log')).open('w', encoding='utf-8') as output:
                  result=subprocess.run(['bash','-e','-o','pipefail','-c',command],stdout=output,stderr=subprocess.STDOUT)
              text=(logs/(label+'.log')).read_text(encoding='utf-8')
              print(text, flush=True)
              print(f'QUALIFICATION {label} exit={result.returncode} seconds={time.monotonic()-start:.3f}',flush=True)
              if expected == 0:
                  assert result.returncode == 0, label
                  assert all(message in text for message in ('FAMILY execution 26/26', 'FAMILY loading 49/49', 'FAMILY contributions 194/194', 'COMPLETE 269/269')), label
              else:
                  assert result.returncode != 0 and all(message in text for message in diagnostic), label
                  assert 'COMPLETE 269/269' not in text, label
              print('PASS '+label,flush=True)

          def restore():
              for p, data in original.items(): p.write_bytes(data)

          def seed(p,name,statement):
              text=p.read_text(encoding='utf-8'); marker='pub async fn '+name+'() {'
              assert text.count(marker)==1
              p.write_text(text.replace(marker,marker+'\n    '+statement,1), encoding='utf-8')

          try:
              print('INVENTORY '+inventory.read_text(encoding='utf-8'),flush=True)
              seed(execution,'execution_preflight_avoids_all_effects','assert_eq!(1, 2, "qualification execution seed");')
              run('sandbox_execution_seed_fails_shared_body',1,('FAIL execution_preflight_avoids_all_effects:', 'RuntimeError', 'unreachable')); restore()
              seed(loading,'prepared_documents_keep_native_data_and_failures','assert_eq!(1, 2, "qualification loading seed");')
              run('sandbox_loading_seed_fails_shared_body',1,('FAIL prepared_documents_keep_native_data_and_failures:', 'RuntimeError', 'unreachable')); restore()
              data=json.loads(inventory.read_text(encoding='utf-8'));data['execution'][0]='qualification_missing_export';inventory.write_text(json.dumps(data, indent=2)+"\n", encoding='utf-8')
              run('sandbox_missing_export_fails_shared_body',1,('qualification_missing_export',));restore()
              data=json.loads(inventory.read_text(encoding='utf-8'));data['execution']=[];inventory.write_text(json.dumps(data, indent=2)+"\n", encoding='utf-8')
              run('sandbox_zero_exports_fail_shared_body',1,('empty execution selection',));restore()
              text=execution.read_text(encoding='utf-8')
              marker='pub async fn execution_preflight_avoids_all_effects() {'
              assert text.count(marker)==1 and text.count('    fixture.end();\n}\n\nuse crate::sandbox_execution_support;')==1
              text=text.replace(marker, 'pub async fn execution_preflight_avoids_all_effects() -> Result<(), wasm_bindgen::JsValue> {\n    wasm_bindgen_futures::JsFuture::from(js_sys::Promise::reject(&wasm_bindgen::JsValue::from_str("qualification async rejection"))).await?;',1)
              text=text.replace('    fixture.end();\n}\n\nuse crate::sandbox_execution_support;', '    fixture.end();\n    Ok(())\n}\n\nuse crate::sandbox_execution_support;',1)
              execution.write_text(text, encoding='utf-8')
              run('sandbox_async_rejection_fails_shared_body',1,('qualification async rejection',));restore()
              seed(execution,'execution_preflight_avoids_all_effects','wasm_bindgen_futures::JsFuture::from(js_sys::Promise::resolve(&wasm_bindgen::JsValue::UNDEFINED)).await.unwrap(); panic!("qualification async panic");')
              run('sandbox_async_panic_fails_shared_body',1,('FAIL execution_preflight_avoids_all_effects:', 'RuntimeError', 'unreachable'));restore()
              run('sandbox_restored_exports_pass_shared_body',0)
              restore()
              assert all(p.read_bytes() == data for p, data in original.items()), 'owned files were not restored'
              assert subprocess.check_output(['git','diff','--binary']) == tracked_before, 'qualification changed tracked files'
          finally:
              restore()
        shell: python
      - name: Compile cache statistics
        id: cache-statistics
        if: always()
        run: bash -e -o pipefail "$PROOF_STEPS/Compile cache statistics"
      - name: Upload compile cache errors
        if: always() && (steps.cache-statistics.outputs.write_errors == 'true' || ('' == 'maestro-proof' && steps.cache-statistics.outcome
          == 'success'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compile-cache-errors-root-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sccache-error.log
          if-no-files-found: error
      - name: Seal compile cache
        id: cache-seal
        run: bash -e -o pipefail "$PROOF_STEPS/Seal compile cache"
      - name: Save compile cache
        if: steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/maestro-sccache
          key: ${{ steps.cache-identity.outputs.key }}
      - name: Preserve qualification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-qualification
          path: qualification-logs
          if-no-files-found: error
    env:
      DECLARATION_TEST_TOOLS: 'true'
      CARGO_BUILD_JOBS: '3'

  consumers:
    name: Required consumer tests
    needs: [seams, native, fuzz-issues, browser-qualification]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every workflow proof passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())
