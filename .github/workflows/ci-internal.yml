                  bin_dir = directory / 'bin'
                  bin_dir.mkdir()
                  (bin_dir / 'mise').symlink_to(installed)
                  curl = bin_dir / 'curl'
                  curl.write_text('#!/bin/sh\nexit 77\n')
                  curl.chmod(0o755)
                  env['PATH'] = f'{bin_dir}:/usr/bin:/bin'
                  before = paths.read_text()
                  result = execute('Browser tools', directory, env)
                  assert result.returncode == 0, result.stdout + result.stderr
                  assert paths.read_text() == before  # Matching version is reused, no download.
                  (bin_dir / 'mise').unlink()
                  (bin_dir / 'mise').write_text('#!/bin/sh\necho 0.0.0\n')
                  (bin_dir / 'mise').chmod(0o755)
                  curl.write_text('#!/bin/sh\nexec /usr/bin/curl "$@"\n')
                  result = execute('Browser tools', directory, env)
                  assert result.returncode == 0, result.stdout + result.stderr
                  assert paths.read_text() != before  # Wrong version selects verified release.
                  before = paths.read_text()
                  # A hostile download is data until the production checksum has passed.
                  curl.write_text('#!/bin/sh\nwhile [ "$1" != --output ]; do shift; done\n'
                                  'printf "#!/bin/sh\\ntouch checksum-bypass-marker\\n" > "$2"\n')
                  result = execute('Browser tools', directory, env)
                  assert result.returncode != 0
