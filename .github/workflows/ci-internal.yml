                                  '--output', (directory / 'extract').read_text(encoding='utf-8').splitlines()[1]]
                              extraction = (directory / 'extract').read_text(encoding='utf-8').splitlines()
                              assert extraction[0] == '-xzf' and extraction[2] == '-C'
