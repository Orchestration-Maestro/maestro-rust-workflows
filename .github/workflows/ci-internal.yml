                  assert "if: needs.declaration.outputs.browser_build == 'true'" in step
                  assert 'always()' not in step

          browser_recipe_runs_after_wasm()
          print('PASS browser_recipe_runs_after_wasm')

          def browser_recipe_errors_fail_check():
