name: Content checks

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  content:
    name: Required content checks
    # This repository exercises deliberately broken fixtures in ci-internal.yml.
    if: ${{ github.repository_id != '1404598722' }}
    runs-on: ubuntu-24.04
    env:
      MISE_YES: '1'
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Caller check files
        run: |
          python3 - <<'PYTHON'
          import pathlib
          import re
          import tomllib
          if not any(pathlib.Path(name).is_file() for name in ['justfile', '.justfile', 'Justfile']):
              raise SystemExit('justfile: content checks require a caller-owned check recipe')
          try:
              config = tomllib.loads(pathlib.Path('mise.toml').read_text(encoding='utf-8'))
          except (OSError, ValueError) as error:
              raise SystemExit(f'mise.toml: {error}') from error
          tools = config.get('tools', {})
          for name in ['just', 'prek']:
              version = tools.get(name) if isinstance(tools, dict) else None
              if not isinstance(version, str) or not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version):
                  raise SystemExit(f'mise.toml: tools.{name} must be an exact version string')
          PYTHON
      - name: Mise bootstrap
        run: |
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-content-mise.XXXXXX")
          curl --fail --retry 3 --location https://github.com/jdx/mise/releases/download/v2026.10.2/mise-v2026.10.2-linux-x64 --output "$bin/mise"
          printf '%s  %s\n' 8f5f6660336f572830e33cd9b378d3131e529a0d4c4f0c553776be90a1ba302a "$bin/mise" | sha256sum --check --status
          chmod +x "$bin/mise"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Content cache identity
        id: cache-identity
        env:
          CACHE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import pathlib
          import tomllib
          lock = pathlib.Path('Cargo.lock')
          values = {'enabled': 'false'}
          if lock.is_file():
              tools = tomllib.loads(pathlib.Path('mise.toml').read_text(encoding='utf-8')).get('tools', {})
              toolchain = next((path.read_text(encoding='utf-8') for path in map(pathlib.Path, ['rust-toolchain.toml', 'rust-toolchain']) if path.is_file()), '')
              identity = [os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH'], hashlib.sha256(lock.read_bytes()).hexdigest(), tools, toolchain]
              digest = hashlib.sha256(json.dumps(identity, ensure_ascii=True, separators=(',', ':'), sort_keys=True).encode('utf-8')).hexdigest()
              writer = os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'] == 'refs/heads/' + os.environ['CACHE_DEFAULT_BRANCH']
              values = {'enabled': 'true', 'key': f'maestro-compile-v1-{digest}-content', 'writer': str(writer).lower()}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(''.join(f'{name}={value}\n' for name, value in values.items()))
          PYTHON
      - name: Restore content cache
        id: cache-restore
        if: steps.cache-identity.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/maestro-sccache
            ~/.local/share/mise
          key: ${{ steps.cache-identity.outputs.key }}
          enableCrossOsArchive: false
          fail-on-cache-miss: false
      - name: Content compile cache
        if: steps.cache-identity.outputs.enabled == 'true'
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache-restore.outcome }}
          CACHE_RESTORE_MATCHED: ${{ steps.cache-restore.outputs.cache-hit }}
        run: |
          version=0.18.0
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) platform=x86_64-unknown-linux-musl digest=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 ;;
            Linux:aarch64) platform=aarch64-unknown-linux-musl digest=2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a ;;
            Darwin:arm64) platform=aarch64-apple-darwin digest=308184519b646f5125289e8515b36f6ca65a13a041923994aebe702348674e8e ;;
            *) echo 'Unsupported compile cache runner host' >&2; exit 1 ;;
          esac
          name=sccache-v$version-$platform
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-sccache.XXXXXX")
          archive=$(mktemp)
          curl --fail --retry 3 --location "https://github.com/mozilla/sccache/releases/download/v$version/$name.tar.gz" --output "$archive"
          python3 - "$digest" "$archive" <<'PYTHON'
          import hashlib
          import sys
          with open(sys.argv[2], 'rb') as source:
              raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest() != sys.argv[1])
          PYTHON
          tar -xzf "$archive" -C "$bin" --strip-components=1 "$name/sccache"
          rm "$archive"
          test -x "$bin/sccache"
          echo "$bin" >> "$GITHUB_PATH"
          if [ "$CACHE_RESTORE_OUTCOME" = failure ] || { [ "$CACHE_RESTORE_MATCHED" != true ] && [ "$CACHE_RESTORE_MATCHED" != false ]; }; then
            rm -rf "$RUNNER_TEMP/maestro-sccache" "$HOME/.local/share/mise"
            echo 'Compile cache snapshot restore failed; using an empty local cache'
          fi
          export SCCACHE_DIR="$RUNNER_TEMP/maestro-sccache" SCCACHE_CACHE_SIZE=1073741824
          export SCCACHE_LOCAL_RW_MODE=READ_WRITE SCCACHE_GHA_ENABLED=false CARGO_INCREMENTAL=0
          export SCCACHE_SKIP_CACHE_CHECK=true SCCACHE_ERROR_LOG="$RUNNER_TEMP/sccache-error.log" SCCACHE_LOG=debug
          { echo CARGO_BUILD_RUSTC_WRAPPER=sccache; env | grep -E '^(SCCACHE_(DIR|CACHE_SIZE|LOCAL_RW_MODE|GHA_ENABLED|SKIP_CACHE_CHECK|ERROR_LOG|LOG)|CARGO_INCREMENTAL)='; } >> "$GITHUB_ENV"
          PATH="$bin:$PATH" sccache --start-server
      - name: Caller tools
        run: mise install
      - name: Caller check
        run: mise exec -- just check
      - name: Seal content cache
        id: cache-seal
        if: steps.cache-identity.outputs.enabled == 'true'
        run: |
          if ! sccache --stop-server; then
            echo 'Compile cache snapshot save skipped: server stop failed'
            exit 0
          fi
          python3 - <<'PYTHON'
          import os
          import pathlib
          import stat
          files = size = 0
          try:
              def failed(error):
                  raise error
              for directory, _, names in os.walk(os.environ['SCCACHE_DIR'], onerror=failed):
                  for name in names:
                      metadata = pathlib.Path(directory, name).lstat()
                      if stat.S_ISREG(metadata.st_mode):
                          files += 1
                          size += metadata.st_size
          except OSError:
              print('Compile cache snapshot save skipped: cache inspection failed')
          else:
              print(f'Compile cache snapshot: {files} files, {size} bytes')
              if not files or not size:
                  print('Compile cache snapshot save skipped: empty cache')
              elif size > 1073741824:
                  print('Compile cache snapshot save skipped: exceeds 1073741824 bytes')
              else:
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write('eligible=true\n')
          PYTHON
      - name: Save content cache
        if: steps.cache-identity.outputs.enabled == 'true' && steps.cache-identity.outputs.writer == 'true' && steps.cache-restore.outputs.cache-hit != 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/maestro-sccache
            ~/.local/share/mise
          key: ${{ steps.cache-identity.outputs.key }}
