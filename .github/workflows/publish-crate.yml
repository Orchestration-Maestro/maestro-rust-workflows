name: Publish Rust crate
# Contract: Same-revision CI and selected-package verification; explicit public crates.io publication only
'on':
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Validated Cargo package/workspace path
        type: string
        default: .
      dry-run:
        description: >-
          Validate/stage only, no authorization API or live publication
        type: boolean
        default: true
      artifact-key:
        description: >-
          Unique CI invocation key for this directory/run
        type: string
        default: publish-crate
      coverage-threshold:
        description: >-
          Forwarded unchanged to the CI run, so a release passes the same gates
          as the project's own CI. `rust-version` is not: a release builds with
          the committed pin
        type: number
        default: 90
      license-policy:
        description: >-
          Forwarded unchanged to the CI run, so a release passes the same gates
          as the project's own CI. `rust-version` is not: a release builds with
          the committed pin
        type: string
        default: auto
      mutation-test:
        description: >-
          Forwarded unchanged to the CI run, so a release passes the same gates
          as the project's own CI. `rust-version` is not: a release builds with
          the committed pin
        type: boolean
        default: true
      mutation-shards:
        description: >-
          Forwarded unchanged to the CI run; `1` keeps one inline run, `0`
          selects automatically, and `2` through `64` request a fixed count
        type: number
        default: 1
      mutation-mutants-per-shard:
        description: >-
          Forwarded unchanged to the CI run; automatic mode target from `1`
          through `1000`, an adjustable calibration knob, not a time guarantee
        type: number
        default: 50
      sarif-reports:
        description: >-
          Forwarded unchanged to the CI run, so a release passes the same gates
          as the project's own CI. `rust-version` is not: a release builds with
          the committed pin
        type: boolean
        default: true
      clippy-level:
        description: >-
          Forwarded unchanged to the CI run, so a release passes the same gates
          as the project's own CI. `rust-version` is not: a release builds with
          the committed pin
        type: string
        default: default
      dependency-audit:
        description: >-
          Forwarded unchanged to the CI run, so a release passes the same gates
          as the project's own CI. `rust-version` is not: a release builds with
          the committed pin
        type: boolean
        default: true
      unsafe-policy:
        description: >-
          Forwarded unchanged to the CI run, so a release passes the same gates
          as the project's own CI. `rust-version` is not: a release builds with
          the committed pin
        type: string
        default: deny
      unused-dependencies:
        description: >-
          Forwarded unchanged to the CI run, so a release passes the same gates
          as the project's own CI. `rust-version` is not: a release builds with
          the committed pin
        type: boolean
        default: true
      platforms:
        description: >-
          Forwarded unchanged to the CI run, so a release passes the same gates
          as the project's own CI. `rust-version` is not: a release builds with
          the committed pin
        type: string
        default: ''
      api-compatibility:
        description: >-
          Forwarded unchanged to the CI run, so a release passes the same gates
          as the project's own CI. `rust-version` is not: a release builds with
          the committed pin
        type: boolean
        default: true
      semver-check:
        description: >-
          Compare against the newest published version; leave off for a first
          release without a baseline
        type: boolean
        default: false
      package:
        description: >-
          Exact member name, 1 to 64 safe Cargo-name characters, never a
          package-ID expression
        type: string
        required: true
    outputs:
      artifact-id:
        description: Immutable validated release artifact ID
        value: ${{ jobs.ci.outputs.artifact-id }}
      artifact-name:
        description: Exact validated release artifact name
        value: ${{ jobs.ci.outputs.artifact-name }}
      revision:
        description: Validated source commit
        value: ${{ jobs.ci.outputs.revision }}
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: Public crates.io token; used only in protected live publish job
        required: false
permissions:
  contents: read
concurrency:
  # One publication per ref at a time and never cancelled: a release must not
  # be killed halfway by the next push, it waits its turn.
  group: rust-publish-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working-directory }}-${{ inputs.artifact-key }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  preflight:
    name: Validate the publication boundary
    if: ${{ github.event_name != 'pull_request_target' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read  # inspect release environment reviewers and tag policies
    steps:
      - name: Checkout the gate at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        uses: ./.github/actions/gate
      - name: Install verified JSON tool
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Validate publication boundary
        id: authorize
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
        run: rust-gate publish-crate authorize
  ci:
    name: Rust CI for the release
    needs:
      - preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write  # static ceiling for ci.yml's skipped SARIF upload
      id-token: write  # static ceiling for ci.yml's skipped Codecov login
    with:
      working-directory: ${{ inputs.working-directory }}
      artifact-key: ${{ inputs.artifact-key }}
      coverage-threshold: ${{ inputs.coverage-threshold }}
      license-policy: ${{ inputs.license-policy }}
      mutation-test: ${{ inputs.mutation-test }}
      mutation-shards: ${{ inputs.mutation-shards }}
      mutation-mutants-per-shard: ${{ inputs.mutation-mutants-per-shard }}
      sarif-reports: ${{ inputs.sarif-reports }}
      clippy-level: ${{ inputs.clippy-level }}
      dependency-audit: ${{ inputs.dependency-audit }}
      unsafe-policy: ${{ inputs.unsafe-policy }}
      unused-dependencies: ${{ inputs.unused-dependencies }}
      api-compatibility: ${{ inputs.api-compatibility }}
      platforms: ${{ inputs.platforms }}
  stage:
    name: Stage the crate package
    needs:
      - preflight
      - ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # Read from the consumer's rust-toolchain.toml once. The publishing job
      # needs the same compiler and would otherwise repeat the read, and pay for
      # a TOML parser to do it.
      toolchain: ${{ steps.toolchain.outputs.channel }}
    steps:
      - name: Checkout the gate at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        uses: ./.github/actions/gate
      - name: Checkout validated consumer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.revision }}
          persist-credentials: false
      - name: Install verified JSON tool
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Configure private Cargo state for direct crates.io access
        id: registry
        run: rust-gate registry
      - name: Set up validated consumer toolchain
        id: toolchain
        env:
          DIRECTORY: ${{ inputs.working-directory }}
        run: rust-gate publish-crate toolchain
      - name: Download exact CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.artifact-id }}
          path: rust-release
          merge-multiple: true
      - name: Verify checksums and source identity
        run: rust-gate verify-payload
        env:
          REVISION: ${{ needs.ci.outputs.revision }}
          REQUIRE_BINARIES: 'false'
      - name: Verify selected Cargo package
        id: package
        env:
          PACKAGE: ${{ inputs.package }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: rust-gate publish-crate package
      - name: Install the semantic-version checker
        if: ${{ inputs.semver-check }}
        run: rust-gate install-tools
        env:
          TOOLS: cargo-semver-checks obi1kenobi/cargo-semver-checks/releases/download/v0.50.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz 52a65dc88dc53fa8b57d6087954eb52cda149ca03bcfca78ce3fdecd23f893c4 cargo-semver-checks
      - name: Semantic-version compatibility
        id: semver
        env:
          PACKAGE: ${{ inputs.package }}
          SEMVER_CHECK: ${{ inputs.semver-check }}
        run: rust-gate publish-crate semver
  publish:
    name: Publish the crate
    needs:
      - ci
      - stage
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read  # inspect release environment reviewers and tag policies
    # Approval is enforced by GitHub and its configuration is checked through the API.
    environment: release
    steps:
      - name: Checkout the gate at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        uses: ./.github/actions/gate
      - name: Checkout validated consumer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.revision }}
          persist-credentials: false
      - name: Install verified JSON tool
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Configure private Cargo state for direct crates.io access
        run: rust-gate registry
      - name: Set up validated consumer toolchain
        env:
          DIRECTORY: ${{ inputs.working-directory }}
          TOOLCHAIN: ${{ needs.stage.outputs.toolchain }}
        run: rust-gate publish-crate publish-toolchain
      - name: Publish explicitly to public crates.io
        id: publish
        env:
          PACKAGE: ${{ inputs.package }}
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PROTECTED: ${{ github.ref_protected }}
          REVISION: ${{ needs.ci.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: rust-gate publish-crate publish
