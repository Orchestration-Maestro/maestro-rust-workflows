name: Rust CI

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to check (used by the self-test only)
        type: string
        default: .

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Format and lint
    # This workflow repository has fixtures, not a root Rust package.
    if: ${{ github.repository_id != '1404598722' || inputs.working-directory != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tests:
    name: Tests (${{ matrix.os }})
    if: ${{ github.repository_id != '1404598722' || inputs.working-directory != '' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Tests
        run: cargo test --workspace --locked
