name: Rust CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
    inputs:
      checkout-repository:
        description: Repository to check out (self-test, proof, and advisory and fuzz scans; defaults to caller)
        type: string
        default: ''
      checkout-ref:
        description: Checkout ref (self-test, proof, browser-only, and advisory and fuzz scans; defaults to caller)
        type: string
        default: ''
      checkout-base-ref:
        description: PR base ref (self-test proof only; defaults to real PR base)
        type: string
        default: ''
      test-event:
        description: Event mode (self-test, proof and advisory scan; defaults to real event)
        type: string
        default: ''
      working-directory:
        description: Directory to check (self-test, proof, and advisory and fuzz scans)
        type: string
        default: .
      concurrency-key:
        description: Stable key distinguishing multiple calls in one workflow
        type: string
        default: ''
      browser-only:
        description: Run only the declared Chromium browser tests (manual named-ref proof)
        type: boolean
        default: false
      warm-cache:
        description: Build the full coverage test graph with optional filtered test execution
        type: boolean
        default: false
      advisory-scan:
        description: Run only the advisory scan of the checked-out caller (scheduled advisory workflow)
        type: boolean
        default: false
      fuzz-scan:
        description: Run only the fuzz job of the checked-out caller (scheduled fuzz workflow)
        type: boolean
        default: false
    outputs:
      advisories:
        description: Undeclared advisories from the advisory scan, as a JSON list
        value: ${{ jobs.advisories.outputs.findings }}

concurrency:
  group: rust-ci-${{ github.event_name == 'push' && format('{0}-{1}', github.workflow, github.sha) || github.ref }}${{ inputs.concurrency-key && format('-{0}', inputs.concurrency-key) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  COVERAGE_IGNORE_FILENAME_REGEX: '(^|/)(tests|benches)/([^.]|\.[^./]|\.\.[^/])|(^|/)(target|vendor|registry|toolchains)/|(^|/)git/checkouts/|(^|/)rustc/([0-9a-f]+|[0-9]+\.[0-9]+\.[0-9]+)/|(^|/)(tests\.rs|[0-9a-zA-Z_-]+[_-]tests\.rs)$'
  PACKAGE_OWNER: |
    # The deepest root wins, so a nested package owns its own files.
    def package_owner(path, roots):
        return max((package for package, root in roots.items() if path.is_relative_to(root)),
                   key=lambda package: len(roots[package].parts), default=None)
  COVERAGE_MERGE: |
    import json
    import os
    import pathlib
    lines = {}
    reports = pathlib.Path(os.environ.get('COVERAGE_REPORT_DIR', 'coverage'))
    expected = {f'shard-{shard}.lcov' for shard in range(1, int(os.environ.get('COVERAGE_REPORT_COUNT') or os.environ['TEST_SHARD_COUNT']) + 1)}
    if {path.name for path in reports.glob('*.lcov')} != expected:
        raise SystemExit('Missing or unexpected shard coverage reports')
    for name in sorted(expected):
        source = None
        for record in (reports / name).read_text(encoding='utf-8').splitlines():
            if record.startswith('SF:'):
                source = os.path.normpath(record[3:])
            elif record.startswith('DA:'):
                if source is None:
                    raise SystemExit(f'{name}: line without source file')
                line, hits, *_ = record[3:].split(',')
                key = (source, int(line))
                lines[key] = lines.get(key, 0) + int(hits)
            elif record == 'end_of_record':
                source = None
    if not lines:
        raise SystemExit('No instrumented lines in shard coverage')
    covered = sum(hits > 0 for hits in lines.values())
    percentage = covered * 100 / len(lines)
    threshold = int(os.environ['CARGO_COVERAGE_MIN_LINES']) if os.environ.get('CARGO_COVERAGE_MIN_LINES') else json.loads(os.environ.get('QUALITY_CONFIG') or '{}').get('coverage_min_lines', 80)
    print('Coverage scope: full workspace')
    print(f'Merged line coverage: {percentage:.2f}% ({covered}/{len(lines)}), minimum {threshold}%')
    if percentage < threshold:
        raise SystemExit('Merged line coverage is below threshold')

defaults:
  run:
    shell: bash

jobs:
  declaration:
    permissions:
      contents: read
      actions: read
    name: Caller declaration
    if: ${{ github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      test_prepare: ${{ steps.selection.outputs.test_prepare }}
      test_prepare_inputs: ${{ steps.config.outputs.test_prepare_inputs }}
      warm_test_filter: ${{ steps.config.outputs.warm_test_filter }}
      packages: ${{ steps.selection.outputs.packages }}
      check_advisories: ${{ steps.selection.outputs.check_advisories }}
      coverage: ${{ steps.selection.outputs.coverage }}
      tests_reused: ${{ steps.queue.outputs.tests_reused }}
      merge_group_pull_request: ${{ steps.config.outputs.merge_group_pull_request }}
      coverage_scope: ${{ steps.selection.outputs.coverage_scope }}
      test_runners: ${{ steps.selection.outputs.test_runners }}
      test_counts: ${{ steps.selection.outputs.test_counts }}
      test_shard_count: ${{ steps.config.outputs.test_shard_count }}
      test_shards: ${{ steps.selection.outputs.test_shards }}
      wasm_crates: ${{ steps.config.outputs.wasm_crates }}
      wasm_examples: ${{ steps.config.outputs.wasm_examples }}
      emscripten_crates: ${{ steps.config.outputs.emscripten_crates }}
      targets: ${{ steps.config.outputs.targets }}
      browser_test_crates: ${{ steps.config.outputs.browser_test_crates }}
      browser_tests: ${{ steps.selection.outputs.browser_tests }}
      browser_build: ${{ steps.config.outputs.browser_build }}
      test_tools: ${{ steps.config.outputs.test_tools }}
      reserved_ports: ${{ steps.config.outputs.reserved_ports }}
      additional_locked_manifests: ${{ steps.config.outputs.additional_locked_manifests }}
      quality_config: ${{ steps.config.outputs.quality_config }}
      fuzz_manifest: ${{ steps.config.outputs.fuzz_manifest }}
      fuzz_targets: ${{ steps.config.outputs.fuzz_targets }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: &runner-hardware |
          python3 - <<'PYTHON'
          import os
          import platform
          import re
          model = ''
          with open(os.environ.get('CPUINFO_FILE', '/proc/cpuinfo'), encoding='utf-8') as cpuinfo:
              for line in cpuinfo:
                  if line.startswith('model name'):
                      model = line.split(':', 1)[1].strip()
                      break
          model = model or platform.machine()
          cores = os.environ.get('CPU_CORES') or str(len(os.sched_getaffinity(0)))
          words = re.sub(r'\((?:r|tm)\)|@.*$|\b(?:cpu|processor)\b', '', model.lower())
          label = re.sub(r'[^a-z0-9]+', '-', words).strip('-') + f'-{cores}c'
          line = f'Runner hardware: {model}, {cores} cores (runner-band: {label})'
          print(line)
          print(f'::notice title=Runner hardware::runner-band: {label}')
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(line + '\n')
          PYTHON
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
      - name: Toolchain
        run: rustup show
      - name: Read caller declaration
        id: config
        env:
          WARM: ${{ inputs.warm-cache }}
          TEST_EVENT: ${{ inputs.warm-cache && 'push' || github.repository_id == '1404598722' && inputs.test-event || github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import re
          import tomllib
          import subprocess
          path = pathlib.Path('.github/ci.toml')
          try:
              with path.open('rb') as source:
                  config = tomllib.load(source)
          except FileNotFoundError:
              if path.is_symlink():
                  raise SystemExit(f'{path}: unreadable declaration')
              config = None
          except (OSError, UnicodeDecodeError, tomllib.TOMLDecodeError) as error:
              raise SystemExit(f'{path}: {error}') from error
          values = dict(test_prepare_consumers='null', test_prepare_inputs='[]', warm_test_filter=json.dumps('none()'), test_shard_count='16', additional_locked_manifests='[]', quality_config='{}', enabled='false', wasm_crates='[]', wasm_examples='[]', emscripten_crates='[]', browser_test_crates='[]', targets='[]', browser_build='false', test_tools='false', reserved_ports='', fuzz_manifest='', fuzz_targets='[]')
          if config is not None:
              if 'test_shards' in config:
                  raise SystemExit(f'{path}: test_shards was removed; nextest partitions tests automatically')
              unknown = set(config) - {'test_prepare', 'test_prepare_setups', 'test_prepare_inputs', 'warm_test_filter', 'test_shard_count', 'wasm_crates', 'wasm_examples', 'emscripten_crates', 'check_targets', 'browser_test_crates', 'browser_build', 'test_tools', 'reserved_ports', 'additional_locked_manifests', 'coverage_min_lines', 'spelling_words', 'license_exceptions', 'advisory_exceptions', 'yanked_crate_exceptions', 'git_sources', 'privileged_trigger_workflows', 'fuzz_manifest', 'fuzz_targets', 'test_inputs'}
              if unknown:
                  replacement = '; test_prepare_setups replaces test_prepare_packages' if 'test_prepare_packages' in unknown else ''
                  raise SystemExit(f'{path}: unknown keys {sorted(unknown)!r}' + replacement)
              for key in ('wasm_crates', 'check_targets'):
                  if key not in config or not isinstance(config[key], list) or any(type(item) is not str for item in config[key]):
                      raise SystemExit(f'{path}: {key} must be an array of strings')
              emscripten = config.get('emscripten_crates', [])
              if not isinstance(emscripten, list) or any(type(item) is not str for item in emscripten):
                  raise SystemExit(f'{path}: emscripten_crates must be an array of strings')
              witnesses = config.get('wasm_examples', {})
              if not isinstance(witnesses, dict) or any(not isinstance(names, list) or any(type(name) is not str for name in names) for names in witnesses.values()):
                  raise SystemExit(f'{path}: wasm_examples must map package names to arrays of strings')
              browser_tests = config.get('browser_test_crates', [])
              if not isinstance(browser_tests, list) or any(type(item) is not str for item in browser_tests):
                  raise SystemExit(f'{path}: browser_test_crates must be an array of strings')
              for key in ('browser_build', 'test_tools'):
                  if type(config.get(key, False)) is not bool:
                      raise SystemExit(f'{path}: {key} must be a boolean')
              ports = config.get('reserved_ports', [])
              if not isinstance(ports, list) or any(type(port) is not int or not 1 <= port <= 65535 for port in ports):
                  raise SystemExit(f'{path}: reserved_ports must be an array of integers from 1 to 65535')
              if len(set(ports)) != len(ports):
                  raise SystemExit(f'{path}: reserved_ports entries must be unique')
              if type(config.get('warm_test_filter', 'none()')) is not str:
                  raise SystemExit(f'{path}: warm_test_filter must be a string')
              if type(config.get('test_prepare', '')) is not str:
                  raise SystemExit(f'{path}: test_prepare must be a string')
              count = config.get('test_shard_count', 16)
              if type(count) is not int or not 1 <= count <= 60:
                  raise SystemExit(f'{path}: test_shard_count must be a whole number from 1 to 60')
              values['test_shard_count'] = str(count)
              values['test_prepare_inputs'] = json.dumps(config.get('test_prepare_inputs', []))
              values['warm_test_filter'] = json.dumps(config.get('warm_test_filter', 'none()'))
              values['reserved_ports'] = ','.join(map(str, ports))
              values['additional_locked_manifests'] = json.dumps(config.get('additional_locked_manifests', []))
              threshold = config.get('coverage_min_lines', 80)
              if type(threshold) not in (int, float) or not 80 <= threshold <= 100:
                  raise SystemExit(f'{path}: coverage_min_lines must be a number from 80 to 100')
              for key in ('spelling_words', 'git_sources', 'privileged_trigger_workflows', 'additional_locked_manifests', 'test_prepare_setups', 'test_prepare_inputs'):
                  if not isinstance(config.get(key, []), list) or any(type(item) is not str or not item for item in config.get(key, [])):
                      raise SystemExit(f'{path}: {key} must be an array of nonempty strings')
              def validate_toml_string(key, value):
                  if any(ord(char) < 32 or 127 <= ord(char) <= 159 or 0xD800 <= ord(char) <= 0xDFFF for char in value):
                      raise SystemExit(f'{path}: {key} cannot contain control characters or surrogates')
              for key in ('spelling_words', 'git_sources', 'privileged_trigger_workflows', 'additional_locked_manifests', 'test_prepare_setups', 'test_prepare_inputs'):
                  for value in config.get(key, []):
                      validate_toml_string(key, value)
              def contained_manifest(value):
                  manifest = pathlib.Path(value)
                  try:
                      return (not manifest.is_absolute() and manifest.name == 'Cargo.toml'
                              and manifest.resolve().is_relative_to(pathlib.Path.cwd().resolve())
                              and manifest.is_file())
                  except (OSError, RuntimeError):
                      return False
              for value in config.get('additional_locked_manifests', []):
                  if not contained_manifest(value):
                      raise SystemExit(f'{path}: additional_locked_manifests requires existing repository-contained relative Cargo.toml files')
              if ('fuzz_manifest' in config) != ('fuzz_targets' in config):
                  raise SystemExit(f'{path}: fuzz_manifest and fuzz_targets must be declared together')
              if 'fuzz_manifest' in config:
                  manifest = config['fuzz_manifest']
                  if type(manifest) is not str or not manifest:
                      raise SystemExit(f'{path}: fuzz_manifest must be a nonempty string')
                  validate_toml_string('fuzz_manifest', manifest)
                  if not contained_manifest(manifest):
                      raise SystemExit(f'{path}: fuzz_manifest requires an existing repository-contained relative Cargo.toml file')
                  targets = config['fuzz_targets']
                  if not isinstance(targets, list):
                      raise SystemExit(f'{path}: fuzz_targets must be an array')
                  for entry in targets:
                      if not isinstance(entry, dict) or set(entry) != {'name', 'seconds', 'max_len', 'timeout', 'rss_limit_mb'}:
                          raise SystemExit(f'{path}: fuzz_targets requires name, seconds, max_len, timeout and rss_limit_mb')
                      if type(entry['name']) is not str or not re.fullmatch(r'[A-Za-z0-9_-]+', entry['name']):
                          raise SystemExit(f'{path}: fuzz_targets name must be a Cargo target name')
                      if any(type(entry[key]) is not int or entry[key] < 1 for key in ('seconds', 'max_len', 'timeout', 'rss_limit_mb')):
                          raise SystemExit(f'{path}: fuzz_targets seconds, max_len, timeout and rss_limit_mb must be positive integers')
                  if len({entry['name'] for entry in targets}) != len(targets):
                      raise SystemExit(f'{path}: fuzz_targets names must be unique')
                  values.update(fuzz_manifest=manifest, fuzz_targets=json.dumps(targets))
              privileged = config.get('privileged_trigger_workflows', [])
              if len(set(privileged)) != len(privileged):
                  raise SystemExit(f'{path}: privileged_trigger_workflows entries must be unique')
              for value in privileged:
                  if '..' in value or not re.fullmatch(r'\.github/workflows/[^/\\:*?\[\]]+\.ya?ml', value) or not pathlib.Path(value).is_file():
                      raise SystemExit(f'{path}: privileged_trigger_workflows requires exact existing .github/workflows/<name>.yml or .yaml files')
              from urllib.parse import urlsplit
              for url in config.get('git_sources', []):
                  parsed = urlsplit(url)
                  if parsed.scheme != 'https' or not parsed.netloc or parsed.query or parsed.fragment or parsed.username or parsed.password:
                      raise SystemExit(f'{path}: git_sources must contain exact HTTPS repository URLs')
              exceptions = config.get('license_exceptions', [])
              if not isinstance(exceptions, list):
                  raise SystemExit(f'{path}: license_exceptions must be an array')
              for entry in exceptions:
                  if not isinstance(entry, dict) or set(entry) != {'package', 'version', 'licenses'}:
                      raise SystemExit(f'{path}: license_exceptions requires package, version and licenses')
                  if any(type(entry[key]) is not str or not entry[key] for key in ('package', 'version')):
                      raise SystemExit(f'{path}: license_exceptions requires an exact package version')
                  if not isinstance(entry['licenses'], list) or not entry['licenses'] or any(type(item) is not str or not item for item in entry['licenses']):
                      raise SystemExit(f'{path}: license_exceptions licenses must be nonempty strings')
                  for key in ('package', 'version'):
                      validate_toml_string('license_exceptions.' + key, entry[key])
                  for value in entry['licenses']:
                      validate_toml_string('license_exceptions.licenses', value)
                  if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', entry['version']):
                      raise SystemExit(f'{path}: license_exceptions requires an exact package version')
              exact_version = (r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)'
                               r'(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
                               r'(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?'
                               r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?')
              exceptions = config.get('advisory_exceptions', [])
              if not isinstance(exceptions, list):
                  raise SystemExit(f'{path}: advisory_exceptions must be an array')
              for entry in exceptions:
                  if not isinstance(entry, dict) or set(entry) != {'id', 'package', 'version', 'reason'}:
                      raise SystemExit(f'{path}: advisory_exceptions requires id, package, version and reason')
                  if any(type(value) is not str or not value for value in entry.values()):
                      raise SystemExit(f'{path}: advisory_exceptions values must be nonempty strings')
                  for key, value in entry.items():
                      validate_toml_string('advisory_exceptions.' + key, value)
                  if not re.fullmatch(r'RUSTSEC-[0-9]{4}-[0-9]{4}', entry['id']):
                      raise SystemExit(f'{path}: advisory_exceptions id must match RUSTSEC-YYYY-NNNN')
                  if not re.fullmatch(exact_version, entry['version']):
                      raise SystemExit(f'{path}: advisory_exceptions requires an exact package version')
              exceptions = config.get('yanked_crate_exceptions', [])
              if not isinstance(exceptions, list):
                  raise SystemExit(f'{path}: yanked_crate_exceptions must be an array')
              for entry in exceptions:
                  if not isinstance(entry, dict) or set(entry) != {'package', 'version'}:
                      raise SystemExit(f'{path}: yanked_crate_exceptions requires exactly package and version')
                  if any(type(value) is not str for value in entry.values()):
                      raise SystemExit(f'{path}: yanked_crate_exceptions values must be strings')
                  if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_-]*', entry['package']) or not re.fullmatch(exact_version, entry['version']):
                      raise SystemExit(f'{path}: yanked_crate_exceptions requires an exact crate name and semantic version')
              values['quality_config'] = json.dumps({key: config[key] for key in ('coverage_min_lines', 'spelling_words', 'license_exceptions', 'advisory_exceptions', 'yanked_crate_exceptions', 'git_sources', 'privileged_trigger_workflows') if key in config})
              try:
                  metadata = json.loads(subprocess.check_output(
                      ['cargo', 'metadata', '--no-deps', '--format-version', '1', '--locked'], text=True))
                  packages = {package['name'] for package in metadata['packages']}
                  examples = {package['name']: {target['name'] for target in package['targets'] if 'example' in target['kind']} for package in metadata['packages']}
                  supported = set(subprocess.check_output(['rustc', '--print', 'target-list'], text=True).splitlines())
              except (subprocess.CalledProcessError, OSError, ValueError) as error:
                  raise SystemExit(f'{path}: caller metadata/toolchain failed') from error
              runners = {
                  'aarch64-unknown-linux-gnu': 'ubuntu-24.04-arm',
                  'aarch64-apple-darwin': 'macos-latest',
                  'x86_64-apple-darwin': 'macos-latest',
                  'x86_64-pc-windows-msvc': 'windows-latest',
              }
              for crate in config['wasm_crates']:
                  if crate not in packages:
                      raise SystemExit(f'{path}: wasm_crates contains unknown package {crate!r}')
              for crate, names in witnesses.items():
                  if crate not in packages:
                      raise SystemExit(f'{path}: wasm_examples contains unknown package {crate!r}')
                  for name in names:
                      if name not in examples[crate]:
                          raise SystemExit(f'{path}: wasm_examples[{json.dumps(crate)}] contains unknown example {name!r}')
              for crate in emscripten:
                  if crate not in packages:
                      raise SystemExit(f'{path}: emscripten_crates contains unknown package {crate!r}')
              for crate in browser_tests:
                  if crate not in packages:
                      raise SystemExit(f'{path}: browser_test_crates contains unknown package {crate!r}')
              values.update(browser_test_crates=json.dumps(sorted(set(browser_tests))))
              def prepared_consumers(setups):
                  nextest = pathlib.Path('.config/nextest.toml')
                  try:
                      with nextest.open('rb') as source:
                          scripts = tomllib.load(source).get('profile', {}).get('default', {}).get('scripts', [])
                  except FileNotFoundError:
                      scripts = []
                  except (OSError, UnicodeDecodeError, tomllib.TOMLDecodeError, AttributeError) as error:
                      raise SystemExit(f'{nextest}: {error}') from error
                  if not isinstance(scripts, list) or any(not isinstance(rule, dict) for rule in scripts):
                      raise SystemExit(f'{nextest}: profile.default.scripts must be an array of tables')
                  consumers = set()
                  def skip_whitespace():
                      nonlocal position
                      position += len(text[position:]) - len(text[position:].lstrip())
                  def token():
                      return re.match(r'([a-z_]+)\s*\(\s*(/(?:\\.|[^/\\])*/|(?:\\.|[^()\\])*)\s*\)', text[position:])
                  def expression(minimum=0):
                      nonlocal position
                      skip_whitespace()
                      atom = token()
                      start = position
                      if atom:
                          position += atom.end()
                          name, value = atom[1], atom[2].strip()
                          if name in ('deps', 'rdeps'):
                              refuse('filter selects packages by dependency: ' + atom[0])
                          if name == 'package':
                              value = value.removeprefix('=')
                              for prefix, kind in [('/', 'a regular expression'), ('~', 'a substring')]:
                                  if value.startswith(prefix):
                                      refuse(f'filter matches packages by {kind}: ' + atom[0])
                              if any(char in value for char in '*?[]#'):
                                  refuse('filter matches packages by a glob: ' + atom[0])
                          elif name not in ('all', 'none', 'test', 'binary', 'binary_id', 'kind', 'platform'):
                              refuse('filter has unsupported atom: ' + atom[0])
                          node = (name, value, atom[0])
                      elif text[position:position + 1] == '(':
                          position += 1
                          node = expression()
                          skip_whitespace()
                          if text[position:position + 1] != ')':
                              refuse(f'filter cannot be read at offset {position}')
                          position += 1
                      else:
                          negation = re.match(r'!|not\b', text[position:])
                          if not negation:
                              refuse(f'filter cannot be read at offset {position}')
                          position += negation.end()
                          node = ('not', expression(3), text[start:position])
                      while True:
                          skip_whitespace()
                          operator = re.match(r'\||\+|or\b|&|and\b|-', text[position:])
                          if not operator:
                              return node
                          op = 'or' if operator[0] in ('|', '+', 'or') else 'and'
                          precedence = 1 if op == 'or' else 2
                          if precedence < minimum:
                              return node
                          position += operator.end()
                          right = expression(precedence + 1)
                          if operator[0] == '-':
                              right = ('not', right, right[2])
                          node = (op, (node, right), text[start:position])
                  def package_atoms(node, negated=False):
                      if node[0] == 'package':
                          if negated:
                              refuse('filter negates package(' + node[1] + ')')
                          return [node[1]]
                      if node[0] == 'not':
                          return package_atoms(node[1], True)
                      if node[0] in ('and', 'or'):
                          return [name for child in node[1] for name in package_atoms(child, negated)]
                      return []
                  def terms(node, operator):
                      if node[0] == operator:
                          return [term for child in node[1] for term in terms(child, operator)]
                      return [node]
                  for setup in setups:
                      def refuse(reason):
                          raise SystemExit(f'{nextest}: setup {setup!r} {reason}')
                      rules = [rule for rule in scripts if rule.get('setup') == setup or
                               isinstance(rule.get('setup'), list) and setup in rule['setup']]
                      if not rules:
                          refuse('has no [[profile.default.scripts]] entry')
                      for rule in rules:
                          if 'filter' not in rule:
                              refuse('rule has no filter, so it runs before every test')
                          text = rule['filter']
                          if not isinstance(text, str):
                              refuse('filter must be a string')
                          position = 0
                          try:
                              tree = expression()
                              skip_whitespace()
                              if position != len(text):
                                  refuse(f'filter cannot be read at offset {position}')
                              package_atoms(tree)
                              for term in terms(tree, 'or'):
                                  conjuncts = terms(term, 'and')
                                  exact = [node[1] for node in conjuncts if node[0] == 'package']
                                  if not package_atoms(term):
                                      refuse(f'filter term {term[2]!r} names no package')
                                  if len(exact) != 1 or len(package_atoms(term)) != 1:
                                      refuse(f'filter term {term[2]!r} needs exactly one package() conjunct')
                                  for name in exact:
                                      if name not in packages:
                                          refuse(f'filter contains unknown package {name!r}')
                                  consumers.update(exact)
                          except RecursionError:
                              refuse('filter nesting is too deep')
                  return sorted(consumers)
              if 'test_prepare_setups' in config:
                  values['test_prepare_consumers'] = json.dumps(prepared_consumers(config['test_prepare_setups']))
              def repository_relative(key):
                  return bool(pathlib.PurePosixPath(key).parts) and not key.startswith('/') and '\\' not in key and '..' not in pathlib.PurePosixPath(key).parts
              for pattern in config.get('test_prepare_inputs', []):
                  if not repository_relative(pattern):
                      raise SystemExit(f'{path}: test_prepare_inputs entries must be repository-relative paths')
              inputs = config.get('test_inputs', {})
              if not isinstance(inputs, dict) or any(not isinstance(names, list) or any(type(name) is not str for name in names) for names in inputs.values()):
                  raise SystemExit(f'{path}: test_inputs must map repository paths to arrays of package names')
              for key, names in inputs.items():
                  validate_toml_string('test_inputs', key)
                  if not repository_relative(key):
                      raise SystemExit(f'{path}: test_inputs keys must be repository-relative paths')
                  for name in names:
                      if name not in packages:
                          raise SystemExit(f'{path}: test_inputs contains unknown package {name!r}')
              targets = []
              for target in config['check_targets']:
                  if target not in supported:
                      raise SystemExit(f'{path}: check_targets contains unknown target {target!r}')
                  if target not in runners:
                      raise SystemExit(f'{path}: check_targets has no runner for {target!r}')
                  if os.environ.get('TEST_EVENT') == 'pull_request' and target != 'x86_64-pc-windows-msvc':
                      continue
                  # The native macOS archive already compiles the arm64 target on full runs.
                  if target == 'aarch64-apple-darwin' and os.environ.get('WARM') != 'true':
                      continue
                  targets.append(dict(target=target, runner=runners[target]))
              values.update(targets=json.dumps(targets))
              values.update(enabled='true', wasm_crates=json.dumps(config['wasm_crates']),
                            wasm_examples=json.dumps([[crate, name] for crate, names in witnesses.items() for name in names]),
                            emscripten_crates=json.dumps(emscripten),
                            browser_build=str(config.get('browser_build', False)).lower(),
                            test_tools=str(config.get('test_tools', False)).lower())
          # The test jobs carry a Windows leg, but Windows is not a native test host until its cold setup fits the job limit.
          native_tests = {'aarch64-apple-darwin': ('macos-latest', 4)}
          count = int(values['test_shard_count'])
          hosts = {'ubuntu-latest': count}
          if config is not None and os.environ.get('TEST_EVENT') != 'pull_request' and os.environ.get('WARM') != 'true':
              hosts.update({runner: min(shards, count) for target, (runner, shards) in native_tests.items() if target in config['check_targets']})
          values.update(test_hosts=json.dumps(hosts))
          # A rebuilt merge group keeps its pull request number; only the base hash ending the ref changes.
          values['merge_group_pull_request'] = ''
          if os.environ.get('GITHUB_EVENT_NAME') == 'merge_group':
              queued = re.fullmatch(r'refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+', os.environ.get('GITHUB_REF', ''))
              if queued is None:
                  raise SystemExit(f"merge group ref {os.environ.get('GITHUB_REF')!r} names no queued pull request")
              values['merge_group_pull_request'] = queued[1]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PYTHON
      - &superseded-check
        name: Stop when the merge group was replaced
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A queue rebuild deletes the old group's ref. A job of the replaced run must not join a concurrency group the live run holds.
          # Only a missing ref stops the run; an API failure says nothing about the group.
          if ! reply=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${GITHUB_REF#refs/}" 2>&1) && [[ "$reply" == *'HTTP 404'* ]]; then
            echo "::error::${GITHUB_REF} no longer exists: the merge queue replaced this group"
            exit 1
          fi
      - name: Test evidence identity
        id: evidence-scope
        if: github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.warm-cache && !inputs.advisory-scan && !inputs.fuzz-scan)
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_WORKFLOW_REF: ${{ github.workflow_ref }}
          CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CALLER_DIRECTORY: ${{ inputs.working-directory || '.' }}
          CALL_KEY: ${{ inputs.concurrency-key }}
        run: |
          python3 -I - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import subprocess
          identity = [os.environ['GITHUB_REPOSITORY'], os.environ['CALLER_DIRECTORY'], os.environ['CALL_KEY']]
          scope = hashlib.sha256(json.dumps(identity, ensure_ascii=False).encode('utf-8')).hexdigest()
          path = 'Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci.yml'
          revision = ''
          try:
              current = json.loads(subprocess.check_output(['gh', 'api',
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"], text=True))
              references = [item for item in current['referenced_workflows'] if item['path'].startswith(path + '@')]
              if len(references) > 1:
                  raise ValueError('Ambiguous reusable workflow identity')
              revisions = {item['sha'] for item in references}
              if os.environ['CURRENT_WORKFLOW_REF'].startswith(path + '@'):
                  revisions.add(os.environ['CURRENT_WORKFLOW_SHA'])
              if len(revisions) != 1 or not re.fullmatch('[0-9a-f]{40}', next(iter(revisions))):
                  raise ValueError('Reusable workflow identity is unresolved or conflicting')
              revision = revisions.pop()
          except (subprocess.CalledProcessError, ValueError, KeyError, TypeError, AttributeError):
              print('Reusable workflow identity unavailable; merge queue tests cannot be reused')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'scope={scope}\nworkflow_sha={revision}\nworkflow_ref=' + (path + '@' + revision if revision else '') + '\n')
          PYTHON
      - name: Check merge queue result
        id: queue
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.warm-cache && !inputs.advisory-scan && !inputs.fuzz-scan && !inputs.checkout-repository && !inputs.checkout-ref && !inputs.test-event }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_SCOPE: ${{ steps.evidence-scope.outputs.scope }}
          WORKFLOW_REF: ${{ steps.evidence-scope.outputs.workflow_ref }}
          WORKFLOW_SHA: ${{ steps.evidence-scope.outputs.workflow_sha }}
        run: |
          python3 -I - <<'PYTHON'
          import io
          import json
          import os
          import re
          import subprocess
          import zipfile
          repository = os.environ['GITHUB_REPOSITORY']
          workflow_path = 'Orchestration-Maestro/maestro-rust-workflows/.github/workflows/ci.yml'
          def api(path, paginate=False, binary=False):
              flags = ['--paginate', '--slurp'] if paginate else []
              result = subprocess.check_output(['gh', 'api', *flags, f'repos/{repository}/{path}'], text=not binary)
              return result if binary else json.loads(result)
          reused = False
          try:
              revision = os.environ['WORKFLOW_SHA']
              if not re.fullmatch('[0-9a-f]{40}', revision) or os.environ['WORKFLOW_REF'].rsplit('@', 1)[0] != workflow_path:
                  raise ValueError('Current reusable workflow revision is not verifiable')
              pages = api(f"actions/runs?event=merge_group&status=success&head_sha={os.environ['GITHUB_SHA']}&per_page=100", True)
              for run in (run for page in pages for run in page['workflow_runs']):
                  if ((run.get('head_repository') or {}).get('full_name') != repository
                          or run['head_sha'] != os.environ['GITHUB_SHA'] or run['event'] != 'merge_group'
                          or run['status'] != 'completed' or run['conclusion'] != 'success'):
                      continue
                  name = f"merge-queue-tests-{os.environ['EVIDENCE_SCOPE']}-{run['run_attempt']}"
                  listed = api(f"actions/runs/{run['id']}/artifacts?name={name}&per_page=100", True)
                  artifacts = [item for page in listed for item in page['artifacts'] if item['name'] == name and not item['expired']]
                  if len(artifacts) != 1:
                      continue
                  archive = api(f"actions/artifacts/{artifacts[0]['id']}/zip", binary=True)
                  with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                      if bundle.namelist() != ['merge-queue-tests.json'] or bundle.infolist()[0].file_size > 4096:
                          raise ValueError('Invalid merge queue evidence archive')
                      evidence = json.loads(bundle.read('merge-queue-tests.json'))
                  if (evidence['workflow_ref'].rsplit('@', 1)[0] == workflow_path
                          and evidence['workflow_sha'] == revision and evidence['full_test_set'] is True):
                      reused = True
                      break
          except (subprocess.CalledProcessError, ValueError, KeyError, TypeError, AttributeError, OSError, zipfile.BadZipFile):
              print('Merge queue evidence unavailable; running the full suite')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('tests_reused=' + str(reused).lower() + '\n')
          PYTHON
      - name: Reuse merge queue tests
        if: steps.queue.outputs.tests_reused == 'true'
        run: echo 'Exact commit already passed this workflow in the merge queue; tests skipped. Archive and preparation still seed compile caches. Cache warm-up remains independent.'
      - name: Select test packages
        id: selection
        env:
          TEST_EVENT: ${{ inputs.warm-cache && 'push' || github.repository_id == '1404598722' && inputs.test-event || github.event_name }}
          BASE_REF: ${{ github.repository_id == '1404598722' && inputs.checkout-base-ref || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          TEST_SHARD_COUNT: ${{ steps.config.outputs.test_shard_count }}
          TEST_HOSTS: ${{ steps.config.outputs.test_hosts }}
          TEST_PREPARE_CONSUMERS: ${{ steps.config.outputs.test_prepare_consumers }}
          TESTS_REUSED: ${{ steps.queue.outputs.tests_reused }}
        run: |
          python3 - <<'PYTHON'
          import ast
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          import tomllib
          exec(os.environ['PACKAGE_OWNER'])
          def metadata(directory):
              return json.loads(subprocess.check_output(
                  ['cargo', 'metadata', '--format-version', '1', '--locked'], cwd=directory, text=True))
          event = os.environ['TEST_EVENT']
          fallback = None
          try:
              head = metadata('.')
          except (subprocess.CalledProcessError, ValueError, KeyError):
              if event != 'merge_group':
                  raise
              # Enumeration without resolution keeps graph failures on the full-suite route.
              head = json.loads(subprocess.check_output(
                  ['cargo', 'metadata', '--no-deps', '--format-version', '1', '--locked'], text=True))
              fallback = 'workspace graph could not be resolved'
          packages = {p['id']: p for p in head['packages']}
          members = set(head['workspace_members'])
          roots = {p: pathlib.Path(packages[p]['manifest_path']).parent.relative_to(pathlib.Path.cwd()) for p in members}
          root_targets = [target for p in members if roots[p] == pathlib.Path('.') for target in packages[p]['targets']]
          root_source_dirs = {pathlib.Path(target['src_path']).resolve().parent
                              for target in root_targets if 'custom-build' not in target['kind']}
          root_build_scripts = {pathlib.Path(target['src_path']).resolve()
                                for target in root_targets if 'custom-build' in target['kind']}
          selected = set(members)
          trigger = None
          browser_changed = False
          included_readers = set()
          included_paths = set()
          base = os.environ.get('BASE_REF')
          def declarations():
              try:
                  before = tomllib.loads(subprocess.check_output(['git', 'show', f'{base}:./.github/ci.toml'], text=True))
              except subprocess.CalledProcessError:
                  before = {}
              path = pathlib.Path('.github/ci.toml')
              return before, tomllib.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          declaration = pathlib.Path('.github/ci.toml')
          config = tomllib.loads(declaration.read_text(encoding='utf-8')) if declaration.exists() else {}
          ids = {packages[p]['name']: p for p in members}
          # Declared paths outside every member select only the packages whose tests read them.
          inputs = {pathlib.Path(key): {ids[name] for name in readers} for key, readers in config.get('test_inputs', {}).items()}
          changed = None
          if event == 'pull_request' and base:
              changed = subprocess.check_output(['git', 'diff', '--relative', '--no-renames', '--name-only', '-z', base, 'HEAD'], text=True).split('\0')[:-1]
          if changed is not None:
              # Literal compile-input paths are relative to the Rust source, not the package root.
              changed_paths = {(pathlib.Path.cwd() / name).resolve() for name in changed}
              # shortcut: static matching may overselect commented inputs; use a Rust parser if that becomes costly.
              literal_include = re.compile(r'("(?:[^"\\]|\\.)*")|r(#{0,255})"(.*?)"\2', re.DOTALL)
              def skip_trivia(text, position):
                  while position < len(text):
                      trivia = re.match(r'\s+|//[^\n]*(?:\n|$)|/\*', text[position:])
                      if not trivia:
                          break
                      position += trivia.end()
                      if trivia[0] == '/*':
                          depth = 1
                          for delimiter in re.finditer(r'/\*|\*/', text[position:]):
                              depth += 1 if delimiter[0] == '/*' else -1
                              if depth == 0:
                                  position += delimiter.end()
                                  break
                          else:
                              return len(text)
                  return position
              scan_roots = {root for root in roots.values() if not any(
                  root != parent and root.is_relative_to(parent) for parent in roots.values())}
              for source in sorted(source for root in scan_roots for source in root.rglob('*.rs')):
                  text = source.read_text(encoding='utf-8')
                  for compile_input in re.finditer(r'\binclude_(?:str|bytes)\b|#\s*\[\s*path\s*=', text):
                      position = skip_trivia(text, compile_input.end())
                      if not compile_input[0].startswith('#'):
                          if text[position:position + 1] != '!':
                              continue
                          position = skip_trivia(text, position + 1)
                          if text[position:position + 1] not in ('(', '[', '{'):
                              continue
                          position = skip_trivia(text, position + 1)
                      match = literal_include.match(text, position)
                      if not match:
                          continue
                      path = match[3]
                      if match[1] is not None:
                          # Normalize Rust's Unicode and continued-line escapes before decoding.
                          literal = re.sub(r'\\(?:u\{([0-9a-fA-F_]+)\}|(\r?\n\s*)|.)',
                                           lambda m: '\\U' + f'{int(m[1].replace("_", ""), 16):08x}' if m[1] else '' if m[2] else m[0],
                                           match[1], flags=re.DOTALL)
                          path = ast.literal_eval(literal.replace('\n', r'\n').replace('\r', r'\r'))
                      if (source.parent / path).resolve() in changed_paths:
                          included_readers.add(package_owner(source, roots))
                          included_paths.add((source.parent / path).resolve())
              selected = set()
              for filename in changed:
                  path = pathlib.Path(filename)
                  if filename in ('Cargo.toml', 'rust-toolchain', 'rust-toolchain.toml', '.github/ci.schema.json', '.config/nextest.toml') or filename.startswith('.github/workflows/'):
                      selected = set(members)
                      trigger = f'shared input: {filename}'
                      break
                  if filename in ('Cargo.lock', '.github/ci.toml'):
                      continue
                  resolved = path.resolve()
                  included = resolved in included_paths
                  owner = package_owner(path, roots)
                  # Compile-input readers also retain modules outside root-package Cargo targets.
                  owned = owner is not None and (roots[owner] != pathlib.Path('.') or path == pathlib.Path('Cargo.toml')
                          or resolved in root_build_scripts or any(resolved.is_relative_to(root) for root in root_source_dirs))
                  owners = {owner} if owner is not None and (not included or owned) else set()
                  routes = [readers for key, readers in inputs.items() if path.is_relative_to(key)]
                  selected.update(owners, *routes)
                  if not owners and not routes and not included and path.suffix != '.md' and not filename.startswith('docs/'):
                      selected = set(members)
                      trigger = f'unknown path: {filename}'
                      break
              if '.github/ci.toml' in changed:
                  before, after = declarations()
                  browser_changed = before.get('browser_test_crates', []) != after.get('browser_test_crates', [])
                  if any(before.get(key) != after.get(key) for key in ('test_prepare', 'test_prepare_setups', 'test_prepare_inputs', 'test_tools', 'reserved_ports', 'coverage_min_lines', 'additional_locked_manifests', 'test_inputs')) or bool(before) != bool(after):
                      selected = set(members)
                      trigger = 'shared input: .github/ci.toml'
              if 'Cargo.lock' in changed and selected != members:
                  # Resolve both revisions, comparing transitive dependency identities and features.
                  with tempfile.TemporaryDirectory() as temporary:
                      base_dir = str(pathlib.Path(temporary) / 'base')
                      subprocess.run(['git', 'worktree', 'add', '--detach', base_dir, base], check=True)
                      try:
                          caller = pathlib.Path.cwd().relative_to(pathlib.Path(subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()))
                          before = metadata(pathlib.Path(base_dir) / caller)
                      finally:
                          subprocess.run(['git', 'worktree', 'remove', '--force', base_dir], check=True)
                  def dependencies(data):
                      pkgs = {p['id']: p for p in data['packages']}
                      nodes = {n['id']: n for n in data['resolve']['nodes']}
                      result = {}
                      for member in data['workspace_members']:
                          seen, pending = set(), [member]
                          while pending:
                              node = pending.pop()
                              if node not in seen:
                                  seen.add(node)
                                  pending.extend(nodes[node]['dependencies'])
                          result[pkgs[member]['name']] = {(pkgs[n]['name'], pkgs[n]['version'], pkgs[n]['source'], tuple(sorted(nodes[n]['features']))) for n in seen}
                      return result
                  old, new = dependencies(before), dependencies(head)
                  selected.update(p for p in members if old.get(packages[p]['name']) != new[packages[p]['name']])
              selected.update(included_readers)
              while True:
                  reverse = {n['id'] for n in head['resolve']['nodes'] if n['id'] in members and set(n['dependencies']) & selected}
                  if reverse <= selected:
                      break
                  selected.update(reverse)
          if fallback:
              trigger = fallback
          if trigger:
              print(f'Full-suite fallback: {trigger}')
          names = sorted(packages[p]['name'] for p in selected)
          print('Coverage scope: ' + ('full workspace' if selected == members else 'selected packages'))
          requested = set(config.get('browser_test_crates', []))
          browser_tests = bool(requested and (browser_changed or requested.intersection(names)))
          print(f'Selected test packages ({event}): {names}')
          print(f'Selected package count: {len(selected)}/{len(members)}')
          share = f'Selection share: {len(selected) * 100 / len(members):.0f}% ({len(selected)}/{len(members)} test packages)'
          print(share)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(share + '\n' + (f'Full-suite fallback: {trigger}\n' if trigger else ''))
          # A change can introduce an advisory only through the lockfile or the declared exceptions.
          check_advisories = event not in ('pull_request', 'merge_group') or not base
          if not check_advisories:
              # A base the checkout cannot read keeps the check.
              diff = subprocess.run(['git', 'diff', '--relative', '--name-only', '-z', base, 'HEAD', '--', 'Cargo.lock', '.github/ci.toml'], capture_output=True, text=True)
              changed_files = diff.stdout.split('\0')[:-1]
              if diff.returncode or 'Cargo.lock' in changed_files:
                  check_advisories = True
              elif '.github/ci.toml' in changed_files:
                  before, after = declarations()
                  check_advisories = any(before.get(key) != after.get(key) for key in ('advisory_exceptions', 'yanked_crate_exceptions'))
          print(f'Advisory check ({event}): {"required" if check_advisories else "skipped, no change to Cargo.lock or the declared exceptions"}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('browser_tests=' + str(browser_tests).lower() + '\n')
              # The preparation job runs only when a selected package reads its output.
              consumers = json.loads(os.environ['TEST_PREPARE_CONSUMERS'])
              prepare = json.dumps(config.get('test_prepare', '') if consumers is None or set(consumers) & set(names) else '')
              output.write('test_prepare=' + prepare + '\n')
              output.write('packages=' + json.dumps(names) + '\n')
              output.write('coverage_scope=' + ('full workspace' if selected == members else 'selected packages: ' + ', '.join(names)) + '\n')
              output.write('coverage=' + str(event != 'pull_request' and os.environ.get('TESTS_REUSED') != 'true').lower() + '\n')
              hosts = json.loads(os.environ['TEST_HOSTS'])
              # A reused queue result seeds only the Linux compile cache.
              if os.environ.get('TESTS_REUSED') == 'true':
                  hosts = {'ubuntu-latest': hosts['ubuntu-latest']}
              shards = [dict(runner=runner, shard=shard, count=count) for runner, count in hosts.items() for shard in range(1, count + 1)]
              output.write('test_shards=' + json.dumps(shards) + '\n')
              output.write('test_runners=' + json.dumps(list(hosts)) + '\n')
              output.write('test_counts=' + json.dumps(hosts) + '\n')
              output.write('check_advisories=' + str(check_advisories).lower() + '\n')
          PYTHON
      - name: Validate browser-only request
        if: inputs.browser-only
        env:
          CAN_RUN_BROWSER: ${{ steps.selection.outputs.browser_tests == 'true' && steps.selection.outputs.coverage == 'true' && !inputs.warm-cache && !inputs.advisory-scan && !inputs.fuzz-scan }}
        run: |
          if [ "$CAN_RUN_BROWSER" != true ]; then
            echo 'browser-only requires selected browser tests and cannot be combined with warm-cache, advisory-scan or fuzz-scan' >&2
            exit 1
          fi
      - name: Record merge queue evidence
        if: github.event_name == 'merge_group'
        env:
          WORKFLOW_REF: ${{ steps.evidence-scope.outputs.workflow_ref }}
          WORKFLOW_SHA: ${{ steps.evidence-scope.outputs.workflow_sha }}
          FULL_TEST_SET: ${{ steps.selection.outputs.coverage_scope == 'full workspace' && steps.selection.outputs.coverage == 'true' && !inputs.warm-cache && !inputs.advisory-scan && !inputs.fuzz-scan && !inputs.checkout-repository && !inputs.checkout-ref && !inputs.test-event }}
        run: |
          python3 <<'PYTHON'
          import json
          import os
          import pathlib
          evidence = {'workflow_ref': os.environ['WORKFLOW_REF'], 'workflow_sha': os.environ['WORKFLOW_SHA'],
                      'full_test_set': os.environ['FULL_TEST_SET'] == 'true'}
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'merge-queue-tests.json'
          path.write_text(json.dumps(evidence) + '\n', encoding='utf-8')
          PYTHON
      - name: Upload merge queue evidence
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-queue-tests-${{ steps.evidence-scope.outputs.scope }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merge-queue-tests.json
          if-no-files-found: error

  quality:
    permissions:
      contents: read
      actions: read
    needs: declaration
    name: Format and lint
    # This workflow repository has fixtures, not a root Rust package.
    if: ${{ !inputs.browser-only && !inputs.advisory-scan && !inputs.fuzz-scan && (!inputs.warm-cache || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
      - name: Compile cache identity
        id: cache-identity
        env: &sccache-identity-env
          CALLER_REPOSITORY: ${{ inputs.checkout-repository || github.repository }}
          CALLER_DIRECTORY: ${{ inputs.working-directory || '.' }}
          HOST_OS: ${{ runner.os }}
          HOST_ARCH: ${{ runner.arch }}
          CACHE_JOB: ${{ github.job }}
          CACHE_INDEX: ${{ strategy.job-index || 0 }}
          CACHE_CALL: ${{ inputs.concurrency-key }}
          ADDITIONAL_LOCKED_MANIFESTS: ${{ needs.declaration.outputs.additional_locked_manifests }}
          CACHE_COVERAGE: ${{ needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true' }}
          CACHE_ENABLED: ${{ needs.declaration.outputs.enabled }}
          CACHE_WARM: ${{ inputs.warm-cache }}
          CACHE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: &sccache-identity |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import subprocess
          shape = os.environ['CACHE_JOB']
          if shape in ('tests', 'test-build', 'doctests'):
              coverage = os.environ['HOST_OS'] == 'Linux' and shape != 'doctests' and (os.environ['CACHE_WARM'] == 'true' or (os.environ['CACHE_ENABLED'] == 'true' and os.environ['CACHE_COVERAGE'] == 'true' and (shape == 'test-build' or os.environ.get('SHARD', '') not in ('', 'doctests'))))
              shape = 'tests-coverage' if coverage else 'tests-plain'
          elif shape == 'targets':
              shape += '-clippy-' + os.environ['CACHE_TARGET']
          compiler = subprocess.check_output(['rustc', '-vV'], text=True)
          identity = [os.environ[name] for name in ['CALLER_REPOSITORY', 'CALLER_DIRECTORY', 'HOST_OS', 'HOST_ARCH']] + [compiler, shape]
          digest = hashlib.sha256(json.dumps(identity, ensure_ascii=True, separators=(',', ':')).encode('utf-8')).hexdigest()
          namespace = 'maestro-compile-v1-'
          prefix = f'{namespace}{digest}-'
          seeder = r'-\d+-' + re.escape(os.environ['CACHE_JOB']) + r'-\d+-'
          call = hashlib.sha256(os.environ['CACHE_CALL'].encode('utf-8')).hexdigest()
          suffix = '-'.join(os.environ[name] for name in ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'CACHE_JOB', 'CACHE_INDEX']) + '-' + call
          # A Linux job that no later job restores keeps no snapshot: the repository cache holds one snapshot per
          # other shape, and a snapshot for each of these would not fit the cache limit next to them.
          snapshot = not (os.environ['HOST_OS'] == 'Linux' and os.environ['CACHE_JOB'] in ('quality', 'docs', 'doctests', 'browser', 'browser-tests', 'targets'))
          writer = snapshot and os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'] == 'refs/heads/' + os.environ['CACHE_DEFAULT_BRANCH']
          if os.environ['CACHE_JOB'] in ('tests', 'doctests') and not (os.environ['CACHE_JOB'] == 'doctests' and os.environ['CACHE_WARM'] == 'true'):
              writer = writer and os.environ.get('SHARD', '') in ('warm', '1')
          # Prepare test setup also builds every wasm example extension; its working set passed 1 GiB.
          size = 1610612736 if shape == 'test-prepare' else 1073741824
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'prefix={prefix}\nkey={prefix}{suffix}\nwriter={str(writer).lower()}\nsnapshot={str(snapshot).lower()}\nshape={shape}\nnamespace={namespace}\nseeder={seeder}\nsize={size}\n')
          PYTHON
      - name: Restore compile cache
        if: steps.cache-identity.outputs.snapshot == 'true'
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: &sccache-restore
          path: ${{ runner.temp }}/maestro-sccache
          key: ${{ steps.cache-identity.outputs.key }}
          restore-keys: ${{ steps.cache-identity.outputs.prefix }}
          enableCrossOsArchive: false
          fail-on-cache-miss: false
      - name: Compile cache
        env: &sccache-install-env
          GH_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
          CACHE_RESTORE_OUTCOME: ${{ steps.cache-restore.outcome }}
          CACHE_RESTORE_MATCHED: ${{ steps.cache-restore.outputs.cache-hit }}
          CACHE_SIZE: ${{ steps.cache-identity.outputs.size }}
        timeout-minutes: 10
        run: &sccache-install |
          version=0.18.0
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) platform=x86_64-unknown-linux-musl digest=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 ;;
            Linux:aarch64) platform=aarch64-unknown-linux-musl digest=2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a ;;
            Darwin:arm64) platform=aarch64-apple-darwin digest=308184519b646f5125289e8515b36f6ca65a13a041923994aebe702348674e8e ;;
            *) echo 'Unsupported compile cache runner host' >&2; exit 1 ;;
          esac
          name=sccache-v$version-$platform
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-sccache.XXXXXX")
          archive=$(mktemp)
          assets="$RUNNER_TEMP/maestro-release-assets"
          mkdir -p "$assets"
          if [ -f "$assets/$digest" ]; then
            cp "$assets/$digest" "$archive"
          else
            curl --fail --retry 3 --retry-all-errors --retry-delay 30 --header "Authorization: Bearer $GH_TOKEN" --proto '=https' --proto-redir '=https' --location "https://github.com/mozilla/sccache/releases/download/v$version/$name.tar.gz" --output "$archive"
          fi
          python3 -I - "$digest" "$archive" <<'PYTHON'
          import hashlib
          import sys
          with open(sys.argv[2], 'rb') as source:
              raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest() != sys.argv[1])
          PYTHON
          cp "$archive" "$assets/$digest"
          tar -xzf "$archive" -C "$bin" --strip-components=1 "$name/sccache"
          rm "$archive"
          test -x "$bin/sccache"
          echo "$bin" >> "$GITHUB_PATH"
          if [ "$CACHE_RESTORE_OUTCOME" = failure ] || { [ "$CACHE_RESTORE_OUTCOME" != skipped ] && [ "$CACHE_RESTORE_MATCHED" != true ] && [ "$CACHE_RESTORE_MATCHED" != false ]; }; then
            rm -rf "$RUNNER_TEMP/maestro-sccache"
            echo 'Compile cache snapshot restore failed; using an empty local cache'
          fi
          export SCCACHE_DIR="$RUNNER_TEMP/maestro-sccache" SCCACHE_CACHE_SIZE="${CACHE_SIZE:?}"
          export SCCACHE_LOCAL_RW_MODE=READ_WRITE SCCACHE_GHA_ENABLED=false CARGO_INCREMENTAL=0
          export SCCACHE_SKIP_CACHE_CHECK=true SCCACHE_ERROR_LOG="$RUNNER_TEMP/sccache-error.log" SCCACHE_LOG=debug
          { echo CARGO_BUILD_RUSTC_WRAPPER=sccache; env | grep -E '^(SCCACHE_(DIR|CACHE_SIZE|LOCAL_RW_MODE|GHA_ENABLED|SKIP_CACHE_CHECK|ERROR_LOG|LOG)|CARGO_INCREMENTAL)='; } >> "$GITHUB_ENV"
          if [ -z "${HOST_CC+x}" ] && [ -z "${CC+x}" ]; then
            python3 -I - <<'PYTHON'
          import os
          import pathlib
          import tomllib
          configs = [pathlib.Path('.cargo/config'), pathlib.Path('.cargo/config.toml')]
          values = [tomllib.loads(config.read_text(encoding='utf-8')).get('env', {}) for config in configs if config.is_file()]
          if any('CC' in env or 'HOST_CC' in env for env in values):
              print('Native C cache keeps caller compiler configuration')
          else:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                  output.write('HOST_CC=sccache cc\n')
          PYTHON
          fi
          env -u GH_TOKEN -u MISE_GITHUB_TOKEN PATH="$bin:$PATH" sccache --start-server
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: &release-auth
          GH_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: &mise-bootstrap |
          # https://github.com/jdx/mise/releases/download/v2026.10.2/SHASUMS256.txt
          version=2026.10.2
          executable=mise
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) platform=linux-x64 digest=8f5f6660336f572830e33cd9b378d3131e529a0d4c4f0c553776be90a1ba302a ;;
            Linux:aarch64) platform=linux-arm64 digest=8d230a5a23ac559ea24ec65280867f437000b37473d967a9bb954837592490a8 ;;
            Darwin:arm64) platform=macos-arm64 digest=66d49acecca413c8b334922584982a4907a10588912829873d6c55d0c6d42612 ;;
            Darwin:x86_64) platform=macos-x64 digest=1c6b3d4aaeba8d3b8b57e2d06e4b7825a5134b7aa6e97313bd99db6f22bac21f ;;
            MINGW*:x86_64) platform=windows-x64.exe executable=mise.exe digest=15901d0b8e0cfe76c1c3b7de4194f929244f331ca3fdf183c2e3aa17ba31634c ;;
            *) echo 'Unsupported mise runner host' >&2; exit 1 ;;
          esac
          url=https://github.com/jdx/mise/releases/download/v$version/mise-v$version-$platform
          installed=$(mise --version 2>/dev/null | cut -d ' ' -f 1) || installed=
          if [ "$installed" != "$version" ]; then
            bin=$(mktemp -d "$RUNNER_TEMP/maestro-mise.XXXXXX")
            assets="$RUNNER_TEMP/maestro-release-assets"
            mkdir -p "$assets"
            if [ -f "$assets/$digest" ]; then
              cp "$assets/$digest" "$bin/$executable"
            else
              curl --fail --retry 3 --retry-all-errors --retry-delay 30 --header "Authorization: Bearer $GH_TOKEN" --proto '=https' --proto-redir '=https' --location "$url" --output "$bin/$executable"
            fi
            python3 -I - "$digest" "$bin/$executable" <<'PYTHON'
          import hashlib
          import sys
          with open(sys.argv[2], 'rb') as source:
              raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest() != sys.argv[1])
          PYTHON
            cp "$bin/$executable" "$assets/$digest"
            chmod +x "$bin/$executable"
            "$bin/$executable" --version | grep "^$version "
            export PATH="$bin:$PATH"
            if [ "$executable" = mise.exe ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          fi
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: &caller-tools |
          if [ ! -f mise.toml ]; then
            echo 'mise.toml: caller tools require a pinned tool configuration' >&2
            exit 1
          fi
          mise install
          mise bin-paths | while IFS= read -r bin; do
            if [ "${OS:-}" = Windows_NT ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          done
      - name: Cargo git cache identity
        id: git-cache-identity
        env: *sccache-identity-env
        run: &git-cache-identity |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import pathlib
          root = pathlib.Path.cwd().resolve()
          locks = {root / 'Cargo.lock'}
          for manifest in json.loads(os.environ['ADDITIONAL_LOCKED_MANIFESTS']):
              for directory in (root / manifest).resolve().parents:
                  if (directory / 'Cargo.lock').is_file():
                      locks.add(directory / 'Cargo.lock')
                      break
                  if directory == root:
                      break
          digest = hashlib.sha256()
          for lock in sorted(path for path in locks if path.is_file()):
              digest.update(f'{os.path.relpath(lock, root)}\0'.encode('utf-8') + lock.read_bytes() + b'\0')
          scope = hashlib.sha256(json.dumps([os.environ[name] for name in ['CALLER_REPOSITORY', 'CALLER_DIRECTORY', 'CACHE_CALL', 'HOST_OS']]).encode('utf-8')).hexdigest()
          prefix = f'maestro-cargo-git-v1-{scope}-'
          home = os.environ.get('CARGO_HOME') or os.path.expanduser('~/.cargo')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'prefix={prefix}\nkey={prefix}{digest.hexdigest()}\nhome={home}\n')
          PYTHON
      - name: Restore Cargo git cache
        id: git-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: &git-cache-restore
          path: |
            ${{ steps.git-cache-identity.outputs.home }}/git/db
            ${{ steps.git-cache-identity.outputs.home }}/git/checkouts
          key: ${{ steps.git-cache-identity.outputs.key }}
          restore-keys: ${{ steps.git-cache-identity.outputs.prefix }}
          enableCrossOsArchive: false
          fail-on-cache-miss: false
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        env:
          TEST_PACKAGES: ${{ needs.declaration.outputs.packages }}
          COVERAGE_SCOPE: ${{ needs.declaration.outputs.coverage_scope }}
          TARGET: ''
        run: &clippy |
          if [ "${TEST_PACKAGES:-}" = '[]' ]; then exit 0; fi
          packages=()
          while IFS= read -r -d '' argument; do packages+=("$argument"); done < <(python3 -c 'import json, os; print("".join("-p\0" + name + "\0" for name in json.loads(os.environ.get("TEST_PACKAGES", "[]"))), end="")')
          if [ -z "${TEST_PACKAGES:-}" ] || [ "${COVERAGE_SCOPE:-}" = "full workspace" ]; then packages=(--workspace); fi
          target=()
          if [ -n "${TARGET:-}" ]; then
            rustup target add "$TARGET"
            rustup component add clippy
            target=(--target "$TARGET")
          fi
          cargo clippy "${packages[@]}" --all-targets --locked "${target[@]}" -- -D warnings
      - name: Lint wasm crates
        env:
          WASM_CRATES: ${{ needs.declaration.outputs.wasm_crates }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          crates = json.loads(os.environ['WASM_CRATES'])
          if crates:
              subprocess.run(['rustup', 'target', 'add', 'wasm32-unknown-unknown'], check=True)
              # Library targets only, as the wasm build compiles them: tests may depend on native-only crates.
              packages = [argument for crate in crates for argument in ('-p', crate)]
              subprocess.run(['cargo', 'clippy', '--locked', '--target', 'wasm32-unknown-unknown', *packages, '--', '-D', 'warnings'], check=True)
          PYTHON
      - name: Compile cache statistics
        id: cache-statistics
        if: always()
        run: &sccache-stats |
          test "$CARGO_BUILD_RUSTC_WRAPPER" = sccache
          test "$CARGO_INCREMENTAL" = 0
          sccache --show-stats | tee "$RUNNER_TEMP/sccache-stats"
          if grep -Eq '^Cache write errors +[1-9][0-9]*' "$RUNNER_TEMP/sccache-stats"; then
            echo write_errors=true >> "$GITHUB_OUTPUT"
          else
            echo write_errors=false >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$RUNNER_TEMP/sccache-error.log" ]; then
            token=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
            echo "::stop-commands::$token"
            cat "$RUNNER_TEMP/sccache-error.log"
            printf '\n::%s::\n' "$token"
          fi
      - name: Upload compile cache errors
        if: &sccache-artifact-condition always() && (steps.cache-statistics.outputs.write_errors == 'true' || (inputs.concurrency-key == 'maestro-proof' && steps.cache-statistics.outcome == 'success'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: &sccache-artifact
          name: compile-cache-errors-${{ inputs.concurrency-key || 'root' }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sccache-error.log
          if-no-files-found: error
      - name: Seal compile cache
        id: cache-seal
        run: &sccache-seal |
          if ! sccache --stop-server; then
            echo 'Compile cache snapshot save skipped: server stop failed'
            exit 0
          fi
          python3 - <<'PYTHON'
          import os
          import pathlib
          import stat
          files = 0
          sizes = {'object': 0, 'preprocessor': 0}
          # sccache caps its objects and its preprocessor directory separately, each at this size.
          limit = int(os.environ['SCCACHE_CACHE_SIZE'])
          root = os.environ['SCCACHE_DIR']
          try:
              def failed(error):
                  raise error
              for directory, _, names in os.walk(root, onerror=failed):
                  part = 'preprocessor' if pathlib.Path(directory).relative_to(root).parts[:1] == ('preprocessor',) else 'object'
                  for name in names:
                      metadata = pathlib.Path(directory, name).lstat()
                      if stat.S_ISREG(metadata.st_mode):
                          files += 1
                          sizes[part] += metadata.st_size
          except OSError:
              print('Compile cache snapshot save skipped: cache inspection failed')
          else:
              print(f"Compile cache snapshot: {files} files, {sizes['object']} object bytes, {sizes['preprocessor']} preprocessor bytes")
              over = [part for part, size in sizes.items() if size > limit]
              if not files or not any(sizes.values()):
                  print('Compile cache snapshot save skipped: empty cache')
              elif over:
                  print(f'Compile cache snapshot save skipped: {over[0]} bytes exceed {limit}')
              else:
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write('eligible=true\n')
          PYTHON
      - name: Save compile cache
        if: steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: &sccache-save
          path: ${{ runner.temp }}/maestro-sccache
          key: ${{ steps.cache-identity.outputs.key }}
      - name: Compile cache hit-rate floor
        if: &sccache-floor-condition job.status == 'success' && steps.cache-statistics.outcome == 'success'
        env: &sccache-floor-env
          CACHE_SHAPE: ${{ steps.cache-identity.outputs.shape }}
          CACHE_MATCHED_KEY: ${{ steps.cache-restore.outputs.cache-matched-key }}
          CACHE_PREFIX: ${{ steps.cache-identity.outputs.prefix }}
          CACHE_NAMESPACE: ${{ steps.cache-identity.outputs.namespace }}
          CACHE_SEEDER: ${{ steps.cache-identity.outputs.seeder }}
          CACHE_SNAPSHOT: ${{ steps.cache-identity.outputs.snapshot }}
          GH_TOKEN: ${{ github.token }}
        run: &sccache-floor |
          python3 -I - <<'PYTHON'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          def finish(message, status=0):
              print(message)
              sys.exit(status)
          floor = 90
          shape = os.environ['CACHE_SHAPE']
          stats = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'sccache-stats').read_text(encoding='utf-8')
          executed = re.search(r'(?m)^Compile requests executed +(\d+)', stats)
          rate = re.search(r'(?m)^Cache hits rate +([0-9.]+) %', stats)
          if not executed or not int(executed[1]) or not rate:
              finish('Compile cache hit rate not judged: no cacheable compilation ran')
          rate = float(rate[1])
          if os.environ['CACHE_SNAPSHOT'] != 'true':
              print(f'::notice title=Work units::compiles: {executed[1]}')
              finish(f'Compile cache hit rate not judged: shape {shape} keeps no snapshot')
          # The guards read the compile units and the hit rate of every build from this notice.
          print(f'::notice title=Work units::compiles: {executed[1]}; hit-rate: {rate:.2f}')
          if rate >= floor:
              finish(f'Compile cache hit rate {rate:.2f}% (floor {floor}%) in shape {shape}')
          matched, prefix = os.environ['CACHE_MATCHED_KEY'], os.environ['CACHE_PREFIX']
          if matched:
              cause = f"cold snapshot: the restored snapshot {matched} holds too few of this build's objects; seed it again from the default branch"
          else:
              listing = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/caches?key={os.environ['CACHE_NAMESPACE']}&per_page=100"],
                                       capture_output=True, text=True)
              if listing.returncode:
                  cause = 'no snapshot restored (key change, no writer or eviction; the cache list is unavailable)'
              else:
                  others = [cache['key'] for cache in json.loads(listing.stdout)['actions_caches'] if not cache['key'].startswith(prefix)]
                  own = [key for key in others if re.search(os.environ['CACHE_SEEDER'], key)]
                  if own:
                      cause = (f'key change: no snapshot matches {prefix} but {len(own)} snapshots of this job exist under other keys; '
                               'the job shape (compiler, runner or caller directory) changed')
                  elif others:
                      cause = (f'no writer: the repository cache holds {len(others)} snapshots of other jobs but none of this shape; '
                               'no default-branch push saves it')
                  else:
                      cause = 'eviction: the repository cache holds no compile snapshot; they were evicted or never saved'
          # A warning, never a failure: a change can invalidate the cache itself, and only a default-branch push seeds it again.
          # The guards read this annotation and file the issue.
          finish(f'::warning title=Compile cache floor::Compile cache hit rate {rate:.2f}% is below the {floor}% floor in shape {shape}: {cause}')
          PYTHON

  docs:
    permissions:
      contents: read
      actions: read
    needs: declaration
    name: Docs
    # This workflow repository has fixtures, not a root Rust package.
    if: ${{ !inputs.browser-only && !inputs.advisory-scan && !inputs.fuzz-scan && (!inputs.warm-cache || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Compile cache identity
        id: cache-identity
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        if: steps.cache-identity.outputs.snapshot == 'true'
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        env: *sccache-install-env
        timeout-minutes: 10
        run: *sccache-install
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: *mise-bootstrap
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: *caller-tools
      - name: Cargo git cache identity
        id: git-cache-identity
        env: *sccache-identity-env
        run: *git-cache-identity
      - name: Restore Cargo git cache
        id: git-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *git-cache-restore
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --workspace --no-deps --locked
      - name: Docs for every feature
        # Merge groups and main pushes document every feature; pull requests stay fast.
        if: needs.declaration.outputs.coverage == 'true'
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --workspace --no-deps --locked --all-features
      - name: Compile cache statistics
        id: cache-statistics
        if: always()
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save
      - name: Compile cache hit-rate floor
        if: *sccache-floor-condition
        env: *sccache-floor-env
        run: *sccache-floor

  test-build:
    needs: declaration
    permissions:
      contents: read
      actions: read
    name: ${{ matrix.runner == 'ubuntu-latest' && 'Build test archive' || format('Build test archive ({0})', matrix.runner) }}
    if: ${{ !inputs.browser-only && !inputs.warm-cache && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true') && !inputs.advisory-scan && !inputs.fuzz-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.declaration.outputs.test_runners) }}
    concurrency:
      group: ${{ format('rust-ci-job-{0}-{1}{2}-test-build-{3}', github.workflow, github.event_name == 'merge_group' && format('mg-{0}', needs.declaration.outputs.merge_group_pull_request) || github.run_id, inputs.concurrency-key && format('-{0}', inputs.concurrency-key) || '', matrix.runner) }}
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    runs-on: ${{ matrix.runner }}
    env:
      ADDITIONAL_LOCKED_MANIFESTS: ${{ needs.declaration.outputs.additional_locked_manifests }}
      TEST_SHARD_COUNT: ${{ fromJSON(needs.declaration.outputs.test_counts)[matrix.runner] }}
      TEST_PACKAGES: ${{ needs.declaration.outputs.packages }}
      COVERAGE_SCOPE: ${{ needs.declaration.outputs.coverage_scope }}
      COLLECT_COVERAGE: ${{ matrix.runner == 'ubuntu-latest' && needs.declaration.outputs.enabled == 'true' && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true') }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Free instrumented build space
        if: runner.os == 'Linux' && (inputs.warm-cache || needs.declaration.outputs.enabled == 'true')
        run: &free-build-space |
          # The deletion overlaps the toolchain, tools and compilation; the build needs the space minutes later.
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc >/dev/null 2>&1 &
      - name: Test toolchain
        run: &test-toolchain |
          rustup show
          toolchain=$(rustup show active-toolchain)
          echo "RUSTUP_TOOLCHAIN=${toolchain%% *}" >> "$GITHUB_ENV"
          rustup component add llvm-tools-preview
      - name: Compile cache identity
        id: cache-identity
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        if: &sccache-target-host runner.os != 'Windows'
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        if: *sccache-target-host
        env: *sccache-install-env
        timeout-minutes: 10
        run: *sccache-install
      - name: Coverage tools
        timeout-minutes: 10
        env: *release-auth
        run: &coverage-tools |
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) tools='
          https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz 3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522 cargo-llvm-cov
          https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-musl.tar.gz bf92cb81450872d960ffa13857a83084d557ec0cdc141663d263bb23ef756f97 cargo-nextest
          ' ;;
            Darwin:arm64) tools='
          https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-universal-apple-darwin.tar.gz 6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b cargo-nextest
          ' ;;
            MINGW*:x86_64) tools='
          https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-pc-windows-msvc.zip 7a931b4a9123fe5e641dd0f2b73d897f64bcf77bb06f080db17cb434b7eac782 cargo-nextest.exe
          ' ;;
            *) echo 'Unsupported test tool host' >&2; exit 1 ;;
          esac
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-coverage-tools.XXXXXX")
          while read -r url digest binary; do
            [ -n "$url" ] || continue
            archive=$(mktemp)
            assets="$RUNNER_TEMP/maestro-release-assets"
            mkdir -p "$assets"
            if [ -f "$assets/$digest" ]; then
              cp "$assets/$digest" "$archive"
            else
              curl --fail --retry 3 --retry-all-errors --retry-delay 30 --header "Authorization: Bearer $GH_TOKEN" --proto '=https' --proto-redir '=https' --location "$url" --output "$archive"
            fi
            python3 -I - "$digest" "$archive" "$binary" "$bin" <<'PYTHON'
          import gzip
          import hashlib
          import io
          import pathlib
          import sys
          import tarfile
          import zipfile
          digest, archive, binary, directory = sys.argv[1:]
          data = pathlib.Path(archive).read_bytes()
          if hashlib.sha256(data).hexdigest() != digest:
              raise SystemExit(f'{binary}: archive digest mismatch')
          if zipfile.is_zipfile(io.BytesIO(data)):
              with zipfile.ZipFile(io.BytesIO(data)) as source:
                  names = [name for name in source.namelist() if name.split('/')[-1] == binary]
                  content = source.read(names[0]) if len(names) == 1 else None
          else:
              with tarfile.TarFile(fileobj=gzip.GzipFile(fileobj=io.BytesIO(data))) as source:
                  members = [member for member in source.getmembers() if member.isfile() and member.name.split('/')[-1] == binary]
                  content = source.extractfile(members[0]).read() if len(members) == 1 else None
          if content is None:
              raise SystemExit(f'{binary}: the archive must hold exactly one {binary}')
          target = pathlib.Path(directory) / binary
          target.write_bytes(content)
          target.chmod(0o755)
          PYTHON
            cp "$archive" "$assets/$digest"
            rm "$archive"
          done <<< "$tools"
          if [ "${OS:-}" = Windows_NT ]; then bin=$(cygpath -m "$bin"); fi
          echo "TOOLS=$bin" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Cargo git cache identity
        id: git-cache-identity
        env: *sccache-identity-env
        run: *git-cache-identity
      - name: Restore Cargo git cache
        id: git-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
