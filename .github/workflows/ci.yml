name: Rust CI

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to check (used by the self-test only)
        type: string
        default: .

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Format and lint
    # This workflow repository has fixtures, not a root Rust package.
    if: ${{ github.repository_id != '1404598722' || inputs.working-directory != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.working-directory || '.' }}/target
          key: ${{ runner.os }}-cargo-${{ hashFiles(format('{0}/rust-toolchain.toml', inputs.working-directory || '.'), format('{0}/Cargo.lock', inputs.working-directory || '.')) }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: Docs
    # This workflow repository has fixtures, not a root Rust package.
    if: ${{ github.repository_id != '1404598722' || inputs.working-directory != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.working-directory || '.' }}/target
          key: ${{ runner.os }}-cargo-${{ hashFiles(format('{0}/rust-toolchain.toml', inputs.working-directory || '.'), format('{0}/Cargo.lock', inputs.working-directory || '.')) }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Toolchain
        run: rustup show
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --workspace --no-deps --locked

  tests:
    name: Tests (${{ matrix.os }})
    if: ${{ github.repository_id != '1404598722' || inputs.working-directory != '' }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.working-directory || '.' }}/target
          key: ${{ runner.os }}-cargo-${{ hashFiles(format('{0}/rust-toolchain.toml', inputs.working-directory || '.'), format('{0}/Cargo.lock', inputs.working-directory || '.')) }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Toolchain
        run: rustup show
      - name: Tests
        run: cargo test --workspace --locked
