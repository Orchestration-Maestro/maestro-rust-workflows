            Linux:x86_64) tools='
          https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c rg
          https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz 761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7 fd
          ' ;;
            Darwin:arm64) tools='
          https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-aarch64-apple-darwin.tar.gz 3750b2e93f37e0c692657da574d7019a101c0084da05a790c83fd335bad973e4 rg
          https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-aarch64-apple-darwin.tar.gz b67e1836c468e42e411984b56e52fa7abec08c2bd22c867398e7cc134aac5e12 fd
          ' ;;
            MINGW*:x86_64) tools='
          https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip 71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5 rg.exe
          https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-pc-windows-msvc.zip a227701b8551c35a9931d9f6da75503cf86d88e182d71fb849a70864c5d57cd7 fd.exe
          ' ;;
            *) echo 'Unsupported test tool host' >&2; exit 1 ;;
          esac
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-search-bin.XXXXXX")
          while read -r url digest binary; do
            [ -n "$url" ] || continue
            archive=$(mktemp)
            assets="$RUNNER_TEMP/maestro-release-assets"
            mkdir -p "$assets"
            if [ -f "$assets/$digest" ]; then
              cp "$assets/$digest" "$archive"
            else
              curl --fail --retry 3 --retry-all-errors --retry-delay 30 --header "Authorization: Bearer $GH_TOKEN" --proto '=https' --proto-redir '=https' --location "$url" --output "$archive"
            fi
            python3 -I - "$digest" "$archive" "$binary" "$bin" <<'PYTHON'
          import gzip
          import hashlib
          import io
          import pathlib
          import sys
          import tarfile
          import zipfile
          digest, archive, binary, directory = sys.argv[1:]
          data = pathlib.Path(archive).read_bytes()
          if hashlib.sha256(data).hexdigest() != digest:
              raise SystemExit(f'{binary}: archive digest mismatch')
          if zipfile.is_zipfile(io.BytesIO(data)):
              with zipfile.ZipFile(io.BytesIO(data)) as source:
                  names = [name for name in source.namelist() if name.split('/')[-1] == binary]
                  content = source.read(names[0]) if len(names) == 1 else None
          else:
              with tarfile.TarFile(fileobj=gzip.GzipFile(fileobj=io.BytesIO(data))) as source:
                  members = [member for member in source.getmembers() if member.isfile() and member.name.split('/')[-1] == binary]
                  content = source.extractfile(members[0]).read() if len(members) == 1 else None
          if content is None:
              raise SystemExit(f'{binary}: the archive must hold exactly one {binary}')
          target = pathlib.Path(directory) / binary
          target.write_bytes(content)
          target.chmod(0o755)
          PYTHON
            cp "$archive" "$assets/$digest"
            rm "$archive"
          done <<< "$tools"
          "$bin/rg" --version
          "$bin/fd" --version
          if [ "${OS:-}" = Windows_NT ]; then bin=$(cygpath -m "$bin"); fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: *mise-bootstrap
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: *caller-tools
      - name: Share release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ runner.os }}-${{ runner.arch }}-${{ inputs.concurrency-key || 'root' }}
          path: ${{ runner.temp }}/maestro-release-assets
          if-no-files-found: error
      # Seconds only steer which shard gets each test binary, never which tests run; the token stays out of the step that compiles the caller.
      - name: Earlier test seconds
        env:
          GH_TOKEN: ${{ github.token }}
        # Isolated mode keeps the caller's checkout off the import path while the token is set.
        run: |
          python3 -I - <<'PYTHON'
          import concurrent.futures
          import json
          import os
          import pathlib
          import re
          import subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          def gh(*argv):
              return subprocess.check_output(['gh', 'api', *argv[:-1], f'repos/{repository}/{argv[-1]}'], text=True)
          def jobs_of(path):
              return [job for page in json.loads(gh('--paginate', '--slurp', path)) for job in page['jobs']]
          def log_of(job):
              return gh('--allow-escape-sequences', f"actions/jobs/{job['id']}/logs")
          seconds = {}
          try:
              current = json.loads(gh(f"actions/runs/{os.environ['GITHUB_RUN_ID']}"))
              built = next(job for job in jobs_of(f"actions/runs/{current['id']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}/jobs?per_page=100")
                           if job['status'] == 'in_progress' and job['runner_name'] == os.environ['RUNNER_NAME'])
              # This caller's shards carry the same prefix as this job (`suite / Build test archive`).
              shard = re.compile(re.escape(built['name'].removesuffix('Build test archive')) + r'Test shard \(\d+/\d+\)')
              earlier = sorted((run for event in ('merge_group', 'push')
                                for run in json.loads(gh(f'actions/runs?event={event}&status=success&per_page=100'))['workflow_runs']
                                if run['workflow_id'] == current['workflow_id'] and run['created_at'] < current['created_at']
                                and (run['head_repository'] or {}).get('full_name') == repository),
                               key=lambda run: run['created_at'], reverse=True)
              for run in earlier:
                  shards = [job for job in jobs_of(f"actions/runs/{run['id']}/jobs?per_page=100") if shard.fullmatch(job['name'])]
                  if shards and all(job['conclusion'] == 'success' for job in shards):
                      break
              else:
                  raise LookupError('no earlier successful run of this workflow ran these test shards')
              with concurrent.futures.ThreadPoolExecutor() as pool:
                  logs = list(pool.map(log_of, shards))
              for log in logs:
                  log = re.sub(r'\x1b\[[0-9;]*m', '', log)
                  for took, binary in re.findall(r'(?m)^\S+Z\s+PASS \[\s*([0-9.]+)s\]\s+(?:\([^)]*\)\s+)?(\S+)\s', log):
                      seconds[binary] = seconds.get(binary, 0) + float(took)
              print(f"Test seconds from run {run['id']} ({run['event']} on {run['head_branch']} at {run['head_sha']}, {run['created_at']}): "
                    f'{len(seconds)} test binaries')
          except (subprocess.CalledProcessError, ValueError, TypeError, StopIteration, LookupError) as error:
              seconds = {}
              print(f'Test seconds unavailable ({error}); test binaries are grouped by test count.')
          pathlib.Path('target').mkdir(exist_ok=True)
          pathlib.Path('target/test-seconds.json').write_text(json.dumps(seconds), encoding='utf-8')
          PYTHON
      - name: Build test archive
        timeout-minutes: 45
        run: |
          cargo fetch --locked
          packages=()
          while IFS= read -r -d '' argument; do packages+=("$argument"); done < <(python3 -c 'import json, os; print("".join("-p\0" + name + "\0" for name in json.loads(os.environ.get("TEST_PACKAGES", "[]"))), end="")')
          if [ -z "${TEST_PACKAGES:-}" ] || [ "${COVERAGE_SCOPE:-}" = "full workspace" ]; then packages=(--workspace); fi
          build=(--user-config-file none --locked "${packages[@]}")
          if [ "${COLLECT_COVERAGE:-false}" = true ]; then
            # The environment and target directory cargo llvm-cov nextest-archive builds with: shards extract there and report from it.
            target_dir="$PWD/target/llvm-cov-target"
            eval "$(CARGO_LLVM_COV_TARGET_DIR="$target_dir" "$TOOLS/cargo-llvm-cov" llvm-cov show-env --sh)"
            # Only show-env sets these; the compile cache hashes every CARGO_ variable, so they would miss every cached compilation.
            unset CARGO_LLVM_COV_SHOW_ENV CARGO_LLVM_COV_TARGET_DIR CARGO_LLVM_COV_BUILD_DIR
            build+=(--target-dir "$target_dir")
          fi
          mkdir -p target
          rm -rf test-archives
          mkdir test-archives
          # The one compilation: every later archive call finds the binaries fresh.
          "$TOOLS/cargo-nextest" nextest list "${build[@]}" --timings --ignore-default-filter --message-format json > target/test-list.json
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          suites = json.loads(pathlib.Path('target/test-list.json').read_text(encoding='utf-8'))['rust-suites']
          tests = {binary: sum(case['filter-match']['status'] == 'matches' for case in suite['testcases'].values())
                   for binary, suite in suites.items()}
          timed = pathlib.Path('target/test-seconds.json')
          measured = json.loads(timed.read_text(encoding='utf-8')) if timed.exists() else {}
          known = [binary for binary in tests if binary in measured]
          # A binary the earlier run did not time weighs its tests at the timed binaries' seconds per test; with none timed, every test weighs one.
          rate = sum(measured[binary] for binary in known) / (sum(tests[binary] for binary in known) or 1) if known else 1
          weight = {binary: measured.get(binary, tests[binary] * rate) for binary in tests}
          def load(group):
              return sum(weight[member] for member in group), sum(tests[member] for member in group)
          # Each test binary goes whole to one shard: the slowest first, each to the shard with the fewest seconds so far.
          groups = [[] for _ in range(int(os.environ['TEST_SHARD_COUNT']))]
          for binary in sorted(tests, key=lambda binary: (-weight[binary], -tests[binary], binary)):
              min(groups, key=load).append(binary)
          groups.sort(key=load, reverse=True)
          for shard, group in enumerate(groups, 1):
              print(f'Shard {shard}: ' + (f'{load(group)[0]:.0f} s, ' if known else '') + f'{load(group)[1]} tests in {len(group)} {"binary" if len(group) == 1 else "binaries"}: {" ".join(group)}')
          # Bash reads this file: a Windows text-mode write would end each line with a carriage return that nextest rejects in the filterset.
          pathlib.Path('target/test-filters.txt').write_text(
              ''.join((' | '.join(f'binary_id(={binary})' for binary in group) or 'none()') + '\n' for group in groups), encoding='utf-8', newline='\n')
          # How many test binaries each shard's archive holds: a shard with none has nothing to run.
          pathlib.Path('test-archives/test-binaries.json').write_text(
              json.dumps({f'shard-{shard}.tar.zst': len(group) for shard, group in enumerate(groups, 1)}), encoding='utf-8')
          PYTHON
          filters=()
          while IFS= read -r filter; do filters+=("$filter"); done < target/test-filters.txt
          for shard in "${!filters[@]}"; do
            "$TOOLS/cargo-nextest" nextest archive "${build[@]}" -E "${filters[$shard]}" --archive-file "test-archives/shard-$((shard + 1)).tar.zst"
          done
      - name: Save Cargo git cache
        if: steps.cache-identity.outputs.writer == 'true' && steps.git-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: &git-cache-save
          path: |
            ${{ steps.git-cache-identity.outputs.home }}/git/db
            ${{ steps.git-cache-identity.outputs.home }}/git/checkouts
          key: ${{ steps.git-cache-identity.outputs.key }}
      - name: Upload test archive
        if: needs.declaration.outputs.tests_reused != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: &test-archive-name test-archive-${{ inputs.concurrency-key || 'root' }}${{ matrix.runner != 'ubuntu-latest' && format('-{0}', matrix.runner) || '' }}
          path: ${{ inputs.working-directory || '.' }}/test-archives/
          compression-level: 0
          if-no-files-found: error
      - name: Upload archive build timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-build-timings-${{ inputs.concurrency-key || 'root' }}
          path: ${{ inputs.working-directory || '.' }}/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: error
      - name: Compile cache statistics
        id: cache-statistics
        if: always() && runner.os != 'Windows'
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        if: *sccache-target-host
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: runner.os != 'Windows' && steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save
      - name: Compile cache hit-rate floor
        if: *sccache-floor-condition
        env: *sccache-floor-env
        run: *sccache-floor
      - *superseded-check

  test-prepare:
    permissions:
      contents: read
      actions: read
    needs: declaration
    name: ${{ matrix.runner == 'ubuntu-latest' && 'Prepare test setup' || format('Prepare test setup ({0})', matrix.runner) }}
    if: ${{ !inputs.browser-only && needs.declaration.outputs.test_prepare != '""' && (!inputs.warm-cache || needs.declaration.outputs.test_prepare_inputs != '[]') && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true') && !inputs.advisory-scan && !inputs.fuzz-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.declaration.outputs.test_runners) }}
    concurrency:
      group: ${{ format('rust-ci-job-{0}-{1}{2}-test-prepare-{3}', github.workflow, github.event_name == 'merge_group' && format('mg-{0}', needs.declaration.outputs.merge_group_pull_request) || github.run_id, inputs.concurrency-key && format('-{0}', inputs.concurrency-key) || '', matrix.runner) }}
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    runs-on: ${{ matrix.runner }}
    env:
      ADDITIONAL_LOCKED_MANIFESTS: ${{ needs.declaration.outputs.additional_locked_manifests }}
      TEST_PREPARE: ${{ fromJSON(needs.declaration.outputs.test_prepare) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Free instrumented build space
        if: runner.os == 'Linux' && (inputs.warm-cache || needs.declaration.outputs.enabled == 'true')
        run: *free-build-space
      - name: Test toolchain
        run: *test-toolchain
      - name: Compile cache identity
        id: cache-identity
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        if: *sccache-target-host
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        if: *sccache-target-host
        env: *sccache-install-env
        timeout-minutes: 10
        run: *sccache-install
      - name: Cargo git cache identity
        id: git-cache-identity
        env: *sccache-identity-env
        run: *git-cache-identity
      - name: Restore Cargo git cache
        id: git-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *git-cache-restore
      - name: Fetch additional locked manifests
        if: needs.declaration.outputs.additional_locked_manifests != '[]'
        run: *fetch-locked-manifests
      - name: Search tools
        timeout-minutes: 10
        if: inputs.warm-cache || needs.declaration.outputs.enabled == 'true'
        env: *release-auth
        run: *search-tools
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: *mise-bootstrap
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: *caller-tools
      - name: Test setup cache identity
        id: setup-identity
        if: ${{ needs.declaration.outputs.test_prepare_inputs != '[]' }}
        env:
          COMPILE_CACHE_PREFIX: ${{ steps.cache-identity.outputs.prefix }}
          TEST_PREPARE_INPUTS: ${{ needs.declaration.outputs.test_prepare_inputs }}
        run: |
          python3 - <<'PYTHON'
          import glob
          import hashlib
          import json
          import os
          # The compile cache prefix names repository, directory, host and compiler; the command and checkout path complete the prefix that finds an earlier bundle, and the input file contents complete the key.
          files = {}
          for pattern in json.loads(os.environ['TEST_PREPARE_INPUTS']):
              matches = [name for name in glob.glob(pattern, recursive=True, include_hidden=True) if os.path.isfile(name)]
              if not matches:
                  raise SystemExit(f'test_prepare_inputs pattern {pattern!r} matches no file')
              for name in matches:
                  with open(name, 'rb') as source:
                      files[name] = hashlib.sha256(source.read()).hexdigest()
          def digest(value):
              return hashlib.sha256(json.dumps(value, ensure_ascii=True, separators=(',', ':')).encode('utf-8')).hexdigest()
          prefix = 'maestro-test-setup-v2-' + digest([os.environ['COMPILE_CACHE_PREFIX'], os.environ['GITHUB_WORKSPACE'], os.environ['TEST_PREPARE']]) + '-'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'prefix={prefix}\nkey={prefix}{digest(sorted(files.items()))}\n')
          PYTHON
      - name: Restore test setup cache
        id: setup-cache
        if: ${{ needs.declaration.outputs.test_prepare_inputs != '[]' }}
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/test-setup.tar
          key: ${{ steps.setup-identity.outputs.key }}
          restore-keys: ${{ steps.setup-identity.outputs.prefix }}
          lookup-only: ${{ steps.cache-identity.outputs.writer == 'true' }}
          enableCrossOsArchive: false
          fail-on-cache-miss: false
      # A merge group adds bundles from the pull request runs that tested the change. Writers compile without bases, so they need no candidates.
      - name: Test setup candidates
        id: candidates
        if: ${{ steps.cache-identity.outputs.writer != 'true' && steps.setup-cache.outputs.cache-hit != 'true' && needs.declaration.outputs.test_prepare_inputs != '[]' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: &test-setup-name test-setup-${{ inputs.concurrency-key || 'root' }}${{ matrix.runner != 'ubuntu-latest' && format('-{0}', matrix.runner) || '' }}
          CACHE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -I - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          repository, event, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_EVENT_NAME'], os.environ['GITHUB_SHA']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/{path}'], text=True))
          def has_bundle(run):
              listing = api(f"actions/runs/{run['id']}/artifacts?name={urllib.parse.quote(os.environ['ARTIFACT_NAME'])}&per_page=100")
              return any(not item['expired'] for item in listing['artifacts'])
          def newest_with_bundle(runs):
              return next((run for run in runs if has_bundle(run)), None)
          def runs_at(event, head):
              # The repository's own runs of that event at that commit, whichever workflow ran them: a workflow an organization ruleset requires has no route under actions/workflows. Fork runs are not this repository's code under review.
              runs = api(f'actions/runs?event={event}&head_sha={head}&status=success&per_page=100')['workflow_runs']
              return [run for run in runs if (run['head_repository'] or {}).get('full_name') == repository]
          candidates = []
          try:
              if event == 'merge_group':
                  # The queue branch is cut from the previous group, so only the default branch lists every pull request still ahead of it.
                  subjects = [item['commit']['message'].split('\n', 1)[0] for item in api(f"compare/{os.environ['CACHE_DEFAULT_BRANCH']}...{sha}?per_page=100")['commits']]
                  for number in [int(match[1]) for match in map(re.compile(r'\(#(\d+)\)$').search, subjects) if match]:
                      candidates.append(newest_with_bundle(runs_at('pull_request', api(f'pulls/{number}')['head']['sha'])))
          except (subprocess.CalledProcessError, ValueError, KeyError, TypeError) as error:
              print(f'::warning::The test setup candidates could not be listed ({error}); preparing from the bases found so far.', flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('runs=' + ' '.join(str(run['id']) for run in candidates if run) + '\n')
          PYTHON
      - name: Download test setup candidates
        if: ${{ steps.candidates.outputs.runs != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: *test-setup-name
          ARTIFACT_PATH: ${{ runner.temp }}/test-setup-candidates
          ARTIFACT_RUN_IDS: ${{ steps.candidates.outputs.runs }}
        run: &download-artifact |
          python3 -I - <<'PYTHON'
          import hashlib
          import http.client
          import io
          import json
          import os
          import pathlib
          import shutil
          import struct
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          import zlib
          from concurrent.futures import ThreadPoolExecutor

          # The artifact is a zip in blob storage. One stream is slow in some regions, so fetch it in parallel ranges,
          # check its size and digest, then extract. Named members are fetched alone, each checked against the zip's own
          # size and checksum. An unusable listing or any failed range hands the whole download over to the single-stream action.
          STREAMS, MINIMUM_RANGE = 16, 1 << 20
          TRANSPORT = (OSError, http.client.HTTPException)
          name, destination = os.environ['ARTIFACT_NAME'], pathlib.Path(os.environ['ARTIFACT_PATH'])
          members = os.environ.get('ARTIFACT_MEMBERS', '').split()
          api = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions"
          partial = pathlib.Path(os.environ['RUNNER_TEMP']) / f'{name}.zip'

          class KeepRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *arguments):
                  return None

          urllib.request.install_opener(urllib.request.build_opener(KeepRedirect))

          def get(url, headers):
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=120)

          def api_get(path):
              return get(f'{api}/{path}', {'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'})

          def storage_url(artifact):
              # One call per download: the probe and every range reuse the signed URL, and the token never reaches storage.
              try:
                  api_get(f"artifacts/{artifact['id']}/zip").close()
              except urllib.error.HTTPError as redirect:
                  if redirect.code == 302:
                      return redirect.headers['Location']
                  raise
              raise OSError('artifact download did not redirect to storage')

          def fetch(url, start, end, path, base):
              with get(url, {'Range': f'bytes={start}-{end}'}) as response, open(path, 'r+b') as target:
                  if response.status != 206:
                      raise OSError('storage ignored the range')
                  target.seek(start - base)
                  shutil.copyfileobj(response, target, 1 << 20)
                  if target.tell() != end + 1 - base:
                      raise OSError('short range')

          def fetch_ranges(url, base, size, path):
              with open(path, 'wb') as target:
                  target.truncate(size)
              streams = max(1, min(STREAMS, size // MINIMUM_RANGE))
              step = max(1, -(-size // streams))
              # All ranges start together, within the signed URL's roughly one-minute lifetime.
              with ThreadPoolExecutor(streams) as pool:
                  for future in [pool.submit(fetch, url, start, min(start + step, base + size) - 1, path, base)
                                 for start in range(base, base + size, step)]:
                      future.result()
              return streams

          def download(artifact):
              size = artifact['size_in_bytes']
              url = storage_url(artifact)
              with get(url, {'Range': 'bytes=0-0'}) as probe, open(partial, 'wb') as target:
                  if probe.status != 206:
                      shutil.copyfileobj(probe, target, 1 << 20)
                      return 1
              return fetch_ranges(url, 0, size, partial)

          class Stored(io.RawIOBase):
              # The artifact zip as a file whose reads are range requests, so the zip reader fetches only its directory.
              def __init__(self, url, size):
                  self.url, self.size, self.position = url, size, 0

              def readable(self):
                  return True

              def seekable(self):
                  return True

              def seek(self, offset, whence=io.SEEK_SET):
                  self.position = {io.SEEK_SET: 0, io.SEEK_CUR: self.position, io.SEEK_END: self.size}[whence] + offset
                  return self.position

              def readinto(self, buffer):
                  end = min(self.position + len(buffer), self.size)
                  if end <= self.position:
                      return 0
                  with get(self.url, {'Range': f'bytes={self.position}-{end - 1}'}) as response:
                      if response.status != 206:
                          raise OSError('storage ignored the range')
                      data = response.read()
                  buffer[:len(data)] = data
                  self.position += len(data)
                  return len(data)

          def download_members(artifact, destination):
              url = storage_url(artifact)
              stored = Stored(url, artifact['size_in_bytes'])
              with zipfile.ZipFile(stored) as bundle:
                  entries = [bundle.getinfo(member) for member in members]
              destination.mkdir(parents=True, exist_ok=True)
              streams = 0
              for entry in entries:
                  if entry.compress_type != zipfile.ZIP_STORED:
                      raise ValueError(f'{entry.filename} is compressed in the artifact')
                  stored.seek(entry.header_offset)
                  header = stored.read(zipfile.sizeFileHeader)
                  if len(header) != zipfile.sizeFileHeader or header[:4] != zipfile.stringFileHeader:
                      raise zipfile.BadZipFile(f'{entry.filename} has no local header')
                  # The local header ends with the name and extra field lengths; the stored bytes follow both.
                  start = entry.header_offset + zipfile.sizeFileHeader + sum(struct.unpack_from('<HH', header, 26))
                  path = destination / entry.filename
                  streams = max(streams, fetch_ranges(url, start, entry.file_size, path))
                  checksum = 0
                  with open(path, 'rb') as source:
                      for block in iter(lambda: source.read(1 << 20), b''):
                          checksum = zlib.crc32(block, checksum)
                  if path.stat().st_size != entry.file_size or checksum != entry.CRC:
                      raise SystemExit(f'{name}: {entry.filename} does not match the size and checksum the artifact records')
              return streams, sum(entry.file_size for entry in entries)

          run_ids = os.environ.get('ARTIFACT_RUN_IDS', '').split()

          def fall_back(reason, started):
              print(f'::warning::{reason}' + ('' if run_ids else '; using the single-stream download'), file=sys.stderr)
              print(f'artifact-download name={name} bytes=0 seconds={time.monotonic() - started:.2f} mb_per_second=0.00 streams=0')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('fallback=true\n')

          def download_run(run_id, destination):
              started = time.monotonic()
              try:
                  with api_get(f'runs/{run_id}/artifacts?' + urllib.parse.urlencode({'name': name, 'per_page': 100})) as listing:
                      artifacts = [item for item in json.load(listing)['artifacts'] if item['name'] == name and not item['expired']]
                  artifact = max(artifacts, key=lambda item: item['id'])
                  expected = artifact.get('digest') or ''
                  if not expected.startswith('sha256:'):
                      raise OSError('artifact has no sha256 digest')
                  started = time.monotonic()
                  if members:
                      streams, size = download_members(artifact, destination)
                  else:
                      streams = download(artifact)
                  seconds = time.monotonic() - started
              except (*TRANSPORT, KeyError, ValueError, zipfile.BadZipFile) as error:
                  partial.unlink(missing_ok=True)
                  fall_back(f'{type(error).__name__}: {error}', started)
                  return
              if not members:
                  try:
                      size, hasher = partial.stat().st_size, hashlib.sha256()
                      with open(partial, 'rb') as source:
                          for block in iter(lambda: source.read(1 << 20), b''):
                              hasher.update(block)
                      if size != artifact['size_in_bytes']:
                          raise SystemExit(f"{name}: size mismatch, expected {artifact['size_in_bytes']} bytes, got {size}")
                      if 'sha256:' + hasher.hexdigest() != expected:
                          raise SystemExit(f'{name}: digest mismatch, expected {expected}, got sha256:{hasher.hexdigest()}')
                      with zipfile.ZipFile(partial) as bundle:
                          bundle.extractall(destination)
                  finally:
                      partial.unlink(missing_ok=True)
              print(f"artifact-download name={name} bytes={size} seconds={seconds:.2f} mb_per_second={size / 1e6 / seconds:.2f} streams={streams}")

          # One run's artifact goes straight to the path; a list of runs puts each in a directory named for its run, and a run whose bundle is missing, fails its checks or cannot be read is skipped.
          if not run_ids:
              download_run(os.environ['GITHUB_RUN_ID'], destination)
          for run_id in run_ids:
              try:
                  download_run(run_id, destination / run_id)
              except (SystemExit, zipfile.BadZipFile) as error:
                  print(f'::warning::{error}; leaving run {run_id} out', file=sys.stderr)
                  shutil.rmtree(destination / run_id, ignore_errors=True)
          PYTHON
      - name: Prepare test setup
        # A bundle hit supplies prepared files, not the compiler objects the next build needs.
        if: steps.setup-cache.outputs.cache-hit != 'true' || steps.cache-identity.outputs.writer == 'true'
        timeout-minutes: 45
        env:
          TEST_SETUP_CANDIDATE_RUNS: ${{ steps.candidates.outputs.runs }}
          CACHE_WRITER: ${{ steps.cache-identity.outputs.writer }}
        run: |
          export TEST_PREPARE_OUTPUT="$PWD/target/test-setup"
          if [ "${OS:-}" = Windows_NT ]; then TEST_PREPARE_OUTPUT=$(cygpath -m "$TEST_PREPARE_OUTPUT"); fi
          export CARGO_TARGET_DIR="$RUNNER_TEMP/maestro-test-prepare-build"
          mkdir -p "$TEST_PREPARE_OUTPUT"
          # The preparation's bases, in order: a miss on the exact key may still restore the closest earlier bundle, and the candidates follow. Each is extracted to its own directory, apart from the output.
          unset TEST_PREPARE_BASE
          bases=()
          extract() {
            mkdir -p "$2"
            if tar -C "$2" -xf - < "$1"; then
              bases+=("$2/test-setup")
            else
              echo "::warning::The earlier test setup bundle $1 is unreadable; preparing without it."
              rm -rf "$2"
            fi
          }
          # Writers compile every input to seed objects; reusing prepared files would leave their cache cold.
          if [ "${CACHE_WRITER:-false}" != true ]; then
            if [ -f "$RUNNER_TEMP/test-setup.tar" ]; then
              extract "$RUNNER_TEMP/test-setup.tar" "$RUNNER_TEMP/test-setup-base"
            fi
            for run in ${TEST_SETUP_CANDIDATE_RUNS-}; do
              if [ -f "$RUNNER_TEMP/test-setup-candidates/$run/test-setup.tar" ]; then
                extract "$RUNNER_TEMP/test-setup-candidates/$run/test-setup.tar" "$RUNNER_TEMP/test-setup-candidate-$run"
              fi
            done
          fi
          if [ "${#bases[@]}" -gt 0 ]; then
            export TEST_PREPARE_BASE
            TEST_PREPARE_BASE=$(python3 -c 'import os, sys; print(os.pathsep.join(sys.argv[1:]))' "${bases[@]}")
          fi
          bash -e -o pipefail -c "$TEST_PREPARE"
          tar -C target -cf - test-setup > "$RUNNER_TEMP/test-setup.tar"
      - name: Save test setup cache
        if: ${{ steps.cache-identity.outputs.writer == 'true' && steps.setup-cache.outputs.cache-hit != 'true' && needs.declaration.outputs.test_prepare_inputs != '[]' }}
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/test-setup.tar
          key: ${{ steps.setup-identity.outputs.key }}
      - name: Upload test setup
        if: needs.declaration.outputs.tests_reused != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: *test-setup-name
          path: ${{ runner.temp }}/test-setup.tar
          if-no-files-found: error
      - name: Compile cache statistics
        id: cache-statistics
        if: always() && runner.os != 'Windows'
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        if: *sccache-target-host
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: runner.os != 'Windows' && steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save
      - name: Compile cache hit-rate floor
        if: *sccache-floor-condition
        env: *sccache-floor-env
        run: *sccache-floor
      - *superseded-check

  tests:
    needs: [declaration, test-build, test-prepare]
    permissions:
      contents: read
      actions: read
    name: ${{ inputs.warm-cache && 'Warm coverage cache' || matrix.runner == 'ubuntu-latest' && format('Test shard ({0}/{1})', matrix.shard, matrix.count) || format('Test shard ({0} {1}/{2})', matrix.runner, matrix.shard, matrix.count) }}
    if: ${{ !inputs.browser-only && !cancelled() && (inputs.warm-cache || needs.test-build.result == 'success') && (needs.test-prepare.result == 'success' || needs.test-prepare.result == 'skipped') && needs.declaration.outputs.coverage == 'true' && !inputs.advisory-scan && !inputs.fuzz-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.warm-cache && '[{"runner":"ubuntu-latest","shard":"warm"}]' || needs.declaration.outputs.test_shards) }}
    concurrency:
      group: ${{ format('rust-ci-job-{0}-{1}{2}-tests-{3}-{4}', github.workflow, github.event_name == 'merge_group' && format('mg-{0}', needs.declaration.outputs.merge_group_pull_request) || github.run_id, inputs.concurrency-key && format('-{0}', inputs.concurrency-key) || '', matrix.runner, matrix.shard) }}
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    runs-on: ${{ matrix.runner }}
    env: &test-env
      TEST_SHARD_COUNT: ${{ matrix.count || needs.declaration.outputs.test_shard_count }}
      ADDITIONAL_LOCKED_MANIFESTS: ${{ needs.declaration.outputs.additional_locked_manifests }}
      WARM_CACHE: ${{ inputs.warm-cache && matrix.shard != 'doctests' }}
      WARM_TEST_FILTER: ${{ fromJSON(needs.declaration.outputs.warm_test_filter) }}
      SHARD: ${{ matrix.shard }}
      TEST_PACKAGES: ${{ needs.declaration.outputs.packages }}
      TEST_ARCHIVE: ${{ !inputs.warm-cache && matrix.shard != 'doctests' && format('{0}/{1}/shard-{2}.tar.zst', github.workspace, inputs.working-directory || '.', matrix.shard) || '' }}
      COLLECT_COVERAGE: ${{ matrix.runner == 'ubuntu-latest' && needs.declaration.outputs.coverage || 'false' }}
      COVERAGE_SCOPE: ${{ needs.declaration.outputs.coverage_scope }}
      # What the shard itself writes into the checkout, so a test's own file stands out against
      # the baseline: the build directory, the test log, the shard reports and the tool lock file.
      TEST_CHECKOUT_EXCLUSIONS: ':(exclude)target :(exclude)nextest.log :(exclude)shard-*.lcov :(exclude)mise.lock'
    defaults: &test-defaults
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps: &test-steps
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Free instrumented build space
        if: runner.os == 'Linux' && (env.WARM_CACHE == 'true' || needs.declaration.outputs.enabled == 'true')
        run: *free-build-space
      - name: Test toolchain
        run: *test-toolchain
      - name: Compile cache identity
        if: runner.os != 'Windows' && (inputs.warm-cache || matrix.shard == 'doctests')
        id: cache-identity
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        if: runner.os != 'Windows' && (inputs.warm-cache || matrix.shard == 'doctests') && steps.cache-identity.outputs.snapshot == 'true'
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Restore release assets
        if: ${{ !inputs.warm-cache && github.job == 'tests' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ runner.os }}-${{ runner.arch }}-${{ inputs.concurrency-key || 'root' }}
          path: ${{ runner.temp }}/maestro-release-assets
      - name: Compile cache
        if: runner.os != 'Windows' && (inputs.warm-cache || matrix.shard == 'doctests')
        env: *sccache-install-env
        timeout-minutes: 10
        run: *sccache-install
      - name: Coverage tools
        timeout-minutes: 10
        env: *release-auth
        run: *coverage-tools
      - name: Cargo git cache identity
        id: git-cache-identity
        env: *sccache-identity-env
        run: *git-cache-identity
      - name: Restore Cargo git cache
        id: git-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *git-cache-restore
      - name: Fetch additional locked manifests
        if: needs.declaration.outputs.additional_locked_manifests != '[]'
        run: *fetch-locked-manifests
      - name: Download test archive
        id: archive-download
        if: ${{ !inputs.warm-cache && matrix.shard != 'doctests' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: *test-archive-name
          ARTIFACT_MEMBERS: shard-${{ matrix.shard }}.tar.zst test-binaries.json
          ARTIFACT_PATH: .
        run: *download-artifact
      - name: Download test archive in one stream
        if: ${{ steps.archive-download.outputs.fallback == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: *test-archive-name
          path: ${{ inputs.working-directory || '.' }}
      - name: Download test setup
        id: setup-download
        if: ${{ matrix.shard != 'doctests' && needs.declaration.outputs.test_prepare != '""' && (!inputs.warm-cache || needs.declaration.outputs.test_prepare_inputs != '[]') }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: *test-setup-name
          ARTIFACT_PATH: ${{ runner.temp }}/maestro-test-setup
        run: *download-artifact
      - name: Download test setup in one stream
        if: ${{ steps.setup-download.outputs.fallback == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: *test-setup-name
          path: ${{ runner.temp }}/maestro-test-setup
      - name: Restore test setup
        if: ${{ matrix.shard != 'doctests' && needs.declaration.outputs.test_prepare != '""' && (!inputs.warm-cache || needs.declaration.outputs.test_prepare_inputs != '[]') }}
        run: |
          mkdir -p target
          tar -C target -xf - < "$RUNNER_TEMP/maestro-test-setup/test-setup.tar"
      - name: Test checkout baseline
        run: |
          # The checkout as git reports it, taken before either test route runs; the after-tests step
          # subtracts it, so only the files the tests themselves left are named.
          read -r -a exclusions <<< "$TEST_CHECKOUT_EXCLUSIONS"
          git status --porcelain --untracked-files=all -- . "${exclusions[@]}" > "$RUNNER_TEMP/test-checkout-baseline"
          echo "Test checkout baseline: $(wc -l < "$RUNNER_TEMP/test-checkout-baseline") entries"
      - name: Tests
        timeout-minutes: 45
        if: ${{ env.WARM_CACHE != 'true' && needs.declaration.outputs.enabled != 'true' }}
        run: |
          cargo fetch --locked
          packages=()
          while IFS= read -r -d '' argument; do packages+=("$argument"); done < <(python3 -c 'import json, os; print("".join("-p\0" + name + "\0" for name in json.loads(os.environ.get("TEST_PACKAGES", "[]"))), end="")')
          if [ -z "${TEST_PACKAGES:-}" ] || [ "${COVERAGE_SCOPE:-}" = "full workspace" ]; then packages=(--workspace); fi
          if [ "${TEST_PACKAGES:-}" = '[]' ]; then exit 0; fi
          build_args=(--locked "${packages[@]}")
          if [ -n "${TEST_ARCHIVE:-}" ]; then
            build_args=(--archive-file "$TEST_ARCHIVE" --workspace-remap "$PWD" --extract-to "$PWD" --extract-overwrite)
          fi
          if [ "${SHARD:-}" != doctests ]; then
            # A shard's own archive holds exactly its tests.
            partition=()
            if [ -z "${TEST_ARCHIVE:-}" ]; then partition=(--partition "slice:$SHARD/$TEST_SHARD_COUNT"); fi
            "$TOOLS/cargo-nextest" nextest run --user-config-file none --ignore-default-filter "${build_args[@]}" --retries 0 --final-status-level flaky "${partition[@]}" --no-tests pass 2>&1 | tee nextest.log
          fi
          if [[ "$SHARD" == doctests || ( -z "${TEST_ARCHIVE:-}" && "$SHARD" == 1 && "${COLLECT_COVERAGE:-false}" != true ) ]]; then
            cargo test --locked --doc "${packages[@]}"
          fi
      - name: Search tools
        timeout-minutes: 10
        if: env.WARM_CACHE == 'true' || needs.declaration.outputs.enabled == 'true'
        env: *release-auth
        run: *search-tools
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: *mise-bootstrap
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: *caller-tools
      - name: Reserved ports
        if: runner.os == 'Linux' && needs.declaration.outputs.reserved_ports != ''
        env:
          RESERVED_PORTS: ${{ needs.declaration.outputs.reserved_ports }}
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports="$RESERVED_PORTS"
      - name: Isolated tests
        timeout-minutes: 45
        if: env.WARM_CACHE == 'true' || needs.declaration.outputs.enabled == 'true'
        env:
          CARGO_COVERAGE_MIN_LINES: ''
        run: |
          python3 - <<'PYTHON'
          import os
          names = '''ANTHROPIC_API_KEY ANTHROPIC_OAUTH_TOKEN OPENAI_API_KEY GEMINI_API_KEY
          GROQ_API_KEY CEREBRAS_API_KEY XAI_API_KEY OPENROUTER_API_KEY ZAI_API_KEY
          MISTRAL_API_KEY MINIMAX_API_KEY MINIMAX_CN_API_KEY KIMI_API_KEY HF_TOKEN
          AI_GATEWAY_API_KEY OPENCODE_API_KEY COPILOT_GITHUB_TOKEN GH_TOKEN GITHUB_TOKEN
          GOOGLE_APPLICATION_CREDENTIALS GOOGLE_CLOUD_PROJECT GCLOUD_PROJECT
          GOOGLE_CLOUD_LOCATION AWS_PROFILE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION AWS_BEARER_TOKEN_BEDROCK
          AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI
          AWS_WEB_IDENTITY_TOKEN_FILE BEDROCK_EXTENSIVE_MODEL_TEST FIREWORKS_API_KEY'''.split()
          found = sorted(name for name in os.environ if name in names or name.endswith('_API_KEY'))
          if found:
              raise SystemExit('Credential variables present: ' + ', '.join(found))
          PYTHON
          # Windows programs need mixed-separator paths rather than MSYS paths.
          native() { if [ "${OS:-}" = Windows_NT ]; then cygpath -m "$1"; else printf '%s\n' "$1"; fi; }
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          cargo_home=$(cd "${CARGO_HOME:-$HOME/.cargo}" && pwd)
          rustup_home=$(cd "${RUSTUP_HOME:-$HOME/.rustup}" && pwd)
          cargo_home=$(native "$cargo_home")
          rustup_home=$(native "$rustup_home")
          diagnostics="$PWD/target/browser-author-diagnostics"
          mkdir -p "$diagnostics"
          diagnostics=$(native "$diagnostics")
          isolation=$(mktemp -d "$RUNNER_TEMP/maestro-tests.XXXXXX")
          # Tests can leave processes that keep writing here: stop and name them, and keep the test status.
          cleanup_isolation() {
            status=$?
            set +e
            python3 - "$isolation" <<'PYTHON'
          import json
          import os
          import signal
          import sys
          import time
          if not os.path.isdir('/proc'):
              sys.exit(0)
          roots = tuple(path + '/' for path in {sys.argv[1], os.path.realpath(sys.argv[1])})
          def link(path):
              try:
                  return os.readlink(path)
              except OSError:
                  return ''
          def users():
              found = {}
              for entry in os.listdir('/proc'):
                  if not entry.isdigit() or int(entry) == os.getpid():
                      continue
                  base = '/proc/' + entry
                  try:
                      descriptors = os.listdir(base + '/fd')
                  except OSError:
                      descriptors = []
                  paths = [link(base + '/cwd'), link(base + '/exe')] + [link(base + '/fd/' + fd) for fd in descriptors]
                  if os.path.basename(paths[1]) == 'sccache':
                      # The compile cache server outlives the tests; its own steps report on it and stop it.
                      continue
                  try:
                      with open(base + '/environ', 'rb') as file:
                          environment = file.read()
                  except OSError:
                      environment = b''
                  if any(path.startswith(roots) for path in paths) or any(root.encode() in environment for root in roots):
                      try:
                          with open(base + '/cmdline', 'rb') as file:
                              found[int(entry)] = json.dumps(file.read().decode('utf-8', 'replace').split('\0')[:-1])
                      except OSError:
                          pass
              return found
          announced = set()
          for _ in range(50):
              found = users()
              if not found:
                  break
              for pid, command in found.items():
                  if pid not in announced:
                      announced.add(pid)
                      print(f'Stopped test process {pid}: {command}', flush=True)
                  try:
                      os.kill(pid, signal.SIGKILL)
                  except OSError:
                      pass
              time.sleep(0.1)
          PYTHON
            rm -rf "$isolation" || echo "Could not remove $isolation" >&2
            exit "$status"
          }
          trap cleanup_isolation EXIT
          mkdir "$isolation"/{home,tmp,config,data,cache,state,runtime,config-dirs,data-dirs}
          isolation=$(native "$isolation")
          # Preserve Windows system locations, but give profile and application data a fresh home.
          system=()
          if [ "${OS:-}" = Windows_NT ]; then
            # Windows environment names are case-insensitive, unlike Bash's printenv.
            while IFS= read -r -d '' variable; do system+=("$variable"); done < <(python3 - <<'PYTHON'
          import os
          names = '''SYSTEMROOT WINDIR SYSTEMDRIVE COMSPEC PATHEXT PROGRAMDATA PROGRAMFILES PROGRAMFILES(X86)
          PROGRAMW6432 COMMONPROGRAMFILES COMMONPROGRAMFILES(X86) COMMONPROGRAMW6432 NUMBER_OF_PROCESSORS
          PROCESSOR_ARCHITECTURE OS'''.split()
          for name, value in os.environ.items():
              key = name.upper()
              if key in names:
                  print(key + '=' + value, end='\0')
          PYTHON
            )
            # Known-folder APIs expand USERPROFILE and require these directories to exist.
            mkdir -p "$isolation/home/AppData/"{Roaming,Local}
            system+=(USERPROFILE="$isolation/home" APPDATA="$isolation/home/AppData/Roaming" LOCALAPPDATA="$isolation/home/AppData/Local")
          fi
          run_isolated() {
          env -i "${system[@]}" PATH="${TOOLS:+$TOOLS:}$PATH" CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
            HOME="$isolation/home" TMPDIR="$isolation/tmp" TMP="$isolation/tmp" TEMP="$isolation/tmp" \
            XDG_CONFIG_HOME="$isolation/config" XDG_DATA_HOME="$isolation/data" \
            XDG_CACHE_HOME="$isolation/cache" XDG_STATE_HOME="$isolation/state" \
            XDG_RUNTIME_DIR="$isolation/runtime" XDG_CONFIG_DIRS="$isolation/config-dirs" \
            XDG_DATA_DIRS="$isolation/data-dirs" MAESTRO_NO_LOCAL_LLM=1 MAESTRO_TEST_DIAGNOSTICS_DIR="$diagnostics" \
            TEST_PREPARE_OUTPUT="$(native "$PWD/target/test-setup")" ${TEST_ARCHIVE:+TEST_ARCHIVE=1} \
            CARGO_BUILD_RUSTC_WRAPPER="${CARGO_BUILD_RUSTC_WRAPPER-}" CARGO_INCREMENTAL="${CARGO_INCREMENTAL-}" \
            ${CARGO_NET_GIT_FETCH_WITH_CLI+CARGO_NET_GIT_FETCH_WITH_CLI="$CARGO_NET_GIT_FETCH_WITH_CLI"} \
            ${HOST_CC+HOST_CC="$HOST_CC"} ${CC+CC="$CC"} \
            SCCACHE_DIR="${SCCACHE_DIR-}" SCCACHE_CACHE_SIZE="${SCCACHE_CACHE_SIZE-}" \
            SCCACHE_LOCAL_RW_MODE="${SCCACHE_LOCAL_RW_MODE-}" SCCACHE_GHA_ENABLED="${SCCACHE_GHA_ENABLED-}" \
            SCCACHE_SKIP_CACHE_CHECK="${SCCACHE_SKIP_CACHE_CHECK-}" SCCACHE_ERROR_LOG="${SCCACHE_ERROR_LOG-}" SCCACHE_LOG="${SCCACHE_LOG-}" \
            "$@"
          }
          cargo fetch --locked
          packages=()
          while IFS= read -r -d '' argument; do packages+=("$argument"); done < <(python3 -c 'import json, os; print("".join("-p\0" + name + "\0" for name in json.loads(os.environ.get("TEST_PACKAGES", "[]"))), end="")')
          if [ -z "${TEST_PACKAGES:-}" ] || [ "${COVERAGE_SCOPE:-}" = "full workspace" ]; then packages=(--workspace); fi
          if [ "${TEST_PACKAGES:-}" = '[]' ] && [ "${WARM_CACHE:-false}" != true ]; then exit 0; fi
          build_args=(--locked "${packages[@]}")
          if [ -n "${TEST_ARCHIVE:-}" ]; then
            build_args=(--archive-file "$TEST_ARCHIVE" --workspace-remap "$PWD" --extract-to "$PWD" --extract-overwrite)
          fi
          if [ "${SHARD:-}" != doctests ]; then
            if [ -n "${CARGO_COVERAGE_MIN_LINES:-}" ] || [ "${WARM_CACHE:-false}" = true ] || { [ "${COLLECT_COVERAGE:-true}" = true ] && [ -n "${SHARD:-}" ]; }; then
              partition=(--partition "slice:$SHARD/$TEST_SHARD_COUNT")
              report=(--lcov --output-path "$PWD/shard-$SHARD.lcov")
              if [ "${WARM_CACHE:-false}" = true ]; then
                packages=(--workspace)
                partition=(-E "${WARM_TEST_FILTER-none()}")
                report=(--no-report)
              elif [ -n "${CARGO_COVERAGE_MIN_LINES:-}" ]; then
                partition=(--partition slice:1/1)
                mkdir -p target/single-coverage
                report=(--lcov --output-path "$PWD/target/single-coverage/shard-1.lcov")
              fi
              coverage_build_args=("${packages[@]}" --locked)
              archived_binaries=''
              if [ -n "${TEST_ARCHIVE:-}" ]; then
                # Keep compile-time Cargo executable paths valid after archive extraction.
                mkdir -p target/llvm-cov-target
                ln -sfn target/debug target/llvm-cov-target/debug
                coverage_build_args=(--no-clean --archive-file "$TEST_ARCHIVE" --workspace-remap "$PWD" --extract-overwrite)
                partition=()
                archived_binaries=$(python3 -c 'import json, os, pathlib; archive = pathlib.Path(os.environ["TEST_ARCHIVE"]); print(json.loads((archive.parent / "test-binaries.json").read_text(encoding="utf-8"))[archive.name])')
              fi
              if [ "$archived_binaries" = 0 ]; then
                # More shards than test binaries: this shard has none, so it runs nothing and covers no line.
                : > "$PWD/shard-$SHARD.lcov"
              else
                run_isolated "$TOOLS/cargo-llvm-cov" llvm-cov nextest --user-config-file none --ignore-default-filter \
                  --retries 0 --final-status-level flaky "${partition[@]}" --no-tests pass "${coverage_build_args[@]}" \
                  --no-default-ignore-filename-regex --ignore-filename-regex "$COVERAGE_IGNORE_FILENAME_REGEX" "${report[@]}" 2>&1 | tee nextest.log
              fi
              if [ -n "${CARGO_COVERAGE_MIN_LINES:-}" ] && [ "${WARM_CACHE:-false}" != true ]; then
                COVERAGE_REPORT_DIR=target/single-coverage COVERAGE_REPORT_COUNT=1 python3 -c "$COVERAGE_MERGE"
              fi
            else
              partition=()
              if [ -n "${SHARD:-}" ] && [ -z "${TEST_ARCHIVE:-}" ]; then partition=(--partition "slice:$SHARD/$TEST_SHARD_COUNT"); fi
              run_isolated "$TOOLS/cargo-nextest" nextest run --user-config-file none --ignore-default-filter \
                "${build_args[@]}" --retries 0 --final-status-level flaky --no-tests pass "${partition[@]}" 2>&1 | tee nextest.log
            fi
          fi
          if [[ "${WARM_CACHE:-false}" != true && -z "${CARGO_COVERAGE_MIN_LINES:-}" && ( "${SHARD:-}" == doctests || ( -z "${TEST_ARCHIVE:-}" && "${SHARD:-1}" == 1 && "${COLLECT_COVERAGE:-false}" != true ) ) ]]; then
            run_isolated cargo test --locked --doc "${packages[@]}"
          fi
      - name: Tests leave no files behind
        if: always()
        run: |
          # A test that writes into the checkout can be staged and committed: name every file that was
          # not there before the tests, whatever its name, and fail the shard.
          state="$RUNNER_TEMP/test-checkout-baseline"
          if [ ! -f "$state" ]; then
            echo 'No test checkout baseline was recorded before the tests' >&2
            exit 1
          fi
          after="$RUNNER_TEMP/test-checkout-after-tests"
          read -r -a exclusions <<< "$TEST_CHECKOUT_EXCLUSIONS"
          git status --porcelain --untracked-files=all -- . "${exclusions[@]}" > "$after"
          status=0
          while IFS= read -r entry; do
            path=${entry:3}
            echo "::error file=$path::The tests left $path in the checkout"
            status=1
          done < <(comm -13 <(LC_ALL=C sort "$state") <(LC_ALL=C sort "$after"))
          exit "$status"
      - name: Print test diagnostics
        id: diagnostics
        if: always() && needs.declaration.outputs.enabled == 'true'
        env:
          CALLER_REPOSITORY: ${{ inputs.checkout-repository || github.repository }}
          CALLER_DIRECTORY: ${{ inputs.working-directory || '.' }}
          CALL_KEY: ${{ inputs.concurrency-key }}
          TEST_RUNNER: ${{ matrix.runner }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import pathlib
          import secrets
          import sys
          identity = [os.environ['CALLER_REPOSITORY'], os.environ['CALLER_DIRECTORY'], os.environ['CALL_KEY']]
          digest = hashlib.sha256(json.dumps(identity, ensure_ascii=False, separators=(',', ':')).encode('utf-8')).hexdigest()
          host = '' if os.environ.get('TEST_RUNNER', 'ubuntu-latest') == 'ubuntu-latest' else '-' + os.environ['TEST_RUNNER']
          name = f"test-diagnostics{host}-{os.environ['GITHUB_REPOSITORY_ID']}-{digest}-shard-{os.environ['SHARD']}-run-{os.environ['GITHUB_RUN_ID']}-attempt-{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'artifact_name={name}\n')
          token = secrets.token_hex(32)
          print(f'::stop-commands::{token}', flush=True)
          try:
              for path in pathlib.Path('target/browser-author-diagnostics').rglob('*'):
                  if path.is_file() and not path.is_symlink():
                      sys.stdout.buffer.write(path.read_bytes())
          finally:
              print(f'\n::{token}::', flush=True)
          PYTHON
      - name: Upload test diagnostics
        if: always() && needs.declaration.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.diagnostics.outputs.artifact_name }}
          path: |
            ${{ inputs.working-directory || '.' }}/target/browser-author-diagnostics
            ${{ inputs.working-directory || '.' }}/nextest.log
          if-no-files-found: ignore
      - name: Test work units
        if: always()
        run: |
          python3 - <<'PYTHON'
          import pathlib
          import re
          path = pathlib.Path('nextest.log')
          text = re.sub(r'\x1b\[[0-9;]*m', '', path.read_text(encoding='utf-8')) if path.exists() else ''
          summary = re.search(r'(?m)^\s*Summary \[\s*[0-9.]+s\] (\d+) tests? run', text)
          if summary:
              print(f'::notice title=Work units::tests: {summary[1]}')
          PYTHON
      - name: Compile cache statistics
        id: cache-statistics
        if: always() && runner.os != 'Windows' && (inputs.warm-cache || matrix.shard == 'doctests')
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        if: runner.os != 'Windows' && (inputs.warm-cache || matrix.shard == 'doctests')
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: runner.os != 'Windows' && steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save
      - name: Compile cache hit-rate floor
        if: *sccache-floor-condition
        env: *sccache-floor-env
        run: *sccache-floor
      - name: Upload shard coverage
        if: ${{ !inputs.warm-cache && matrix.runner == 'ubuntu-latest' && needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true' && matrix.shard != 'doctests' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ inputs.concurrency-key || 'root' }}-${{ matrix.shard }}
          path: ${{ inputs.working-directory || '.' }}/shard-${{ matrix.shard }}.lcov
          if-no-files-found: error

  doctests:
    permissions:
      contents: read
      actions: read
    name: ${{ matrix.runner == 'ubuntu-latest' && 'Doctests' || format('Doctests ({0})', matrix.runner) }}
    needs: declaration
    # A push that reuses merge-queue tests still runs doctests, to seed this shape's snapshot.
    if: ${{ !inputs.browser-only && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true') && (!inputs.warm-cache || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && !inputs.advisory-scan && !inputs.fuzz-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    concurrency:
      group: ${{ format('rust-ci-job-{0}-{1}{2}-doctests-{3}', github.workflow, github.event_name == 'merge_group' && format('mg-{0}', needs.declaration.outputs.merge_group_pull_request) || github.run_id, inputs.concurrency-key && format('-{0}', inputs.concurrency-key) || '', matrix.runner) }}
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.declaration.outputs.test_runners) }}
        shard: [doctests]
        # Zero uses the declared shard count in the shared test environment.
        count: [0]
    env: *test-env
    defaults: *test-defaults
    steps: *test-steps

  tests-result:
    name: Tests (ubuntu-latest)
    needs: [tests, doctests, declaration]
    if: ${{ !inputs.browser-only && always() && !inputs.advisory-scan && !inputs.fuzz-scan && !inputs.warm-cache && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: All test shards passed
        env:
          RESULT: ${{ needs.tests.result }}
          DOCTEST_RESULT: ${{ needs.doctests.result }}
          DECLARATION_RESULT: ${{ needs.declaration.result }}
          COLLECT_COVERAGE: ${{ needs.declaration.outputs.coverage }}
          TESTS_REUSED: ${{ needs.declaration.outputs.tests_reused }}
        shell: python
        run: |
          import os
          assert os.environ['DECLARATION_RESULT'] == 'success'
          expected = {'false': 'skipped', 'true': 'success'}
          assert os.environ['COLLECT_COVERAGE'] in expected
          required = expected[os.environ['COLLECT_COVERAGE']]
          assert os.environ['RESULT'] == required
          assert os.environ['DOCTEST_RESULT'] == ('success' if os.environ.get('TESTS_REUSED') == 'true' else required)
      - name: Download shard coverage
        if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-${{ inputs.concurrency-key || 'root' }}-*
          path: coverage
          merge-multiple: true
      - name: Merge coverage
        if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true'
        env:
          QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
          TEST_SHARD_COUNT: ${{ needs.declaration.outputs.test_shard_count }}
        run: python3 -c "$COVERAGE_MERGE"

  checks:
    permissions:
      contents: read
      actions: read
    name: Dependency, source and coverage checks
    needs: declaration
    if: ${{ !inputs.browser-only && !inputs.advisory-scan && !inputs.fuzz-scan && !inputs.warm-cache && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
      CHECK_ADVISORIES: ${{ needs.declaration.outputs.check_advisories }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Free instrumented build space
        if: needs.declaration.outputs.enabled != 'true'
        run: *free-build-space
      - name: Toolchain
        run: |
          rustup show
          rustup component add llvm-tools-preview
      - name: Check tools
        timeout-minutes: 10
        env: *release-auth
        run: &check-tools |
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-check-tools.XXXXXX")
          while read -r url digest binary; do
            # Only the fuzz job needs cargo-fuzz; the required checks never download it.
            if [ "$binary" = cargo-fuzz ] && [ "${FUZZ_SCAN:-}" != true ]; then continue; fi
            archive=$(mktemp)
            curl --fail --retry 3 --retry-all-errors --retry-delay 30 --header "Authorization: Bearer $GH_TOKEN" --proto '=https' --proto-redir '=https' --location "$url" --output "$archive"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status
            if [ "$binary" = shfmt ]; then
              install -m 0755 "$archive" "$bin/$binary"
              rm -f "$archive"
              continue
            fi
            unpack=$(mktemp -d)
            tar -xzf "$archive" -C "$unpack"
            find "$unpack" -type f -name "$binary" -exec cp '{}' "$bin/$binary" \;
            test -x "$bin/$binary"
            rm -rf "$archive" "$unpack"
          done <<'TOOLS'
          https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f cargo-deny
          https://github.com/guppy-rs/guppy/releases/download/cargo-hakari-0.9.39/cargo-hakari-0.9.39-x86_64-unknown-linux-musl.tar.gz 6437e3dede815ff68b7671c15ad65240a7c80118e5a6a07d68ff85d29e78d017 cargo-hakari
          https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz 48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9 cargo-machete
          https://github.com/crate-ci/typos/releases/download/v1.51.1/typos-v1.51.1-x86_64-unknown-linux-musl.tar.gz 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454 typos
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks
          https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a zizmor
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 actionlint
          https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz 3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522 cargo-llvm-cov
          https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-musl.tar.gz bf92cb81450872d960ffa13857a83084d557ec0cdc141663d263bb23ef756f97 cargo-nextest
          https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.2/cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c cargo-fuzz
          https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf shfmt
          TOOLS
          echo "TOOLS=$bin" >> "$GITHUB_ENV"
      - name: Cargo git cache identity
        id: git-cache-identity
        env: *sccache-identity-env
        run: *git-cache-identity
      - name: Restore Cargo git cache
        id: git-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *git-cache-restore
      - name: Embedded check defaults
        run: &check-defaults |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess
          import tomllib
          config = json.loads(os.environ.get('QUALITY_CONFIG') or '{}')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'maestro-checks'
          directory.mkdir(exist_ok=True)
          def toml_value(value):
              return json.dumps(value, ensure_ascii=False)
          # BSL-1.0 is the Boost Software License; BUSL-1.1, the Business Source License, is absent from the default allowlist.
          # Callers can allow BUSL-1.1 for an exact package version through license_exceptions.
          allow = ['MIT', 'Apache-2.0', 'ISC', 'BSD-2-Clause', 'BSD-3-Clause', 'Zlib',
                   'Apache-2.0 WITH LLVM-exception', 'Unicode-DFS-2016', 'Unicode-3.0',
                   'CC0-1.0', 'CDLA-Permissive-2.0', 'MPL-2.0', 'MIT-0', 'BSL-1.0', '0BSD']
          deny = '[advisories]\nyanked = "deny"\n'
          if config.get('advisory_exceptions') or config.get('yanked_crate_exceptions'):
              with pathlib.Path('Cargo.lock').open('rb') as source:
                  packages = {(entry['name'], entry['version']) for entry in tomllib.load(source)['package']}
              for entry in config.get('yanked_crate_exceptions', []):
                  if (entry['package'], entry['version']) not in packages:
                      raise SystemExit(f"Cargo.lock: stale yanked-crate exception for {entry['package']} {entry['version']}")
          if config.get('advisory_exceptions'):
              for entry in config['advisory_exceptions']:
                  if (entry['package'], entry['version']) not in packages:
                      raise SystemExit(f"Cargo.lock: stale advisory exception {entry['id']} for {entry['package']} {entry['version']}")
          if config.get('advisory_exceptions') and os.environ.get('CHECK_ADVISORIES') != 'false':
              declared = {(entry['id'], entry['package'], entry['version']) for entry in config['advisory_exceptions']}
              probe = directory / 'probe-deny.toml'
              probe.write_text('[advisories]\nyanked = "deny"\n', encoding="utf-8")
              found = subprocess.run([os.environ['TOOLS'] + '/cargo-deny', '--format', 'json', '--workspace', '--locked', '--all-features',
                                      '--config', str(probe), 'check', 'advisories'], capture_output=True, text=True)
              reported = {}
              for line in found.stderr.splitlines():
                  fields = json.loads(line).get('fields', {}) if line.startswith('{') else {}
                  if 'advisory' in fields:
                      reported.setdefault(fields['advisory']['id'], set()).update(
                          (graph['Krate']['name'], graph['Krate']['version']) for graph in fields['graphs'])
              for entry in config['advisory_exceptions']:
                  if (entry['package'], entry['version']) not in reported.get(entry['id'], set()):
                      actual = ', '.join(f'{name} {version}' for name, version in sorted(reported.get(entry['id'], ()))) or 'no such finding'
                      raise SystemExit(f"Cargo.lock: advisory exception {entry['id']} is not reported for {entry['package']} {entry['version']}: {actual}")
              missing = {(advisory, package, version) for advisory in {entry['id'] for entry in config['advisory_exceptions']}
                         for package, version in reported.get(advisory, set())} - declared
              if missing:
                  advisory, package, version = sorted(missing)[0]
                  raise SystemExit(f"Cargo.lock: advisory exception {advisory} is missing for {package} {version}")
          if config.get('advisory_exceptions') or config.get('yanked_crate_exceptions'):
              deny += 'ignore = [\n'
              for entry in config.get('advisory_exceptions', []):
                  deny += '  { id = ' + toml_value(entry['id']) + ', reason = ' + toml_value(entry['reason']) + ' },\n'
              for entry in config.get('yanked_crate_exceptions', []):
                  deny += '  { crate = ' + toml_value(entry['package'] + '@=' + entry['version']) + ' },\n'
              deny += ']\n'
          deny += '[licenses]\nallow = ' + toml_value(allow) + '\n'
          for entry in config.get('license_exceptions', []):
              deny += '\n[[licenses.exceptions]]\nname = ' + toml_value(entry['package'])
              deny += '\nversion = ' + toml_value('=' + entry['version'])
              deny += '\nallow = ' + toml_value(entry['licenses']) + '\n'
          deny += '\n[bans]\n[sources]\nunknown-registry = "deny"\nunknown-git = "deny"\n'
          deny += 'allow-git = ' + toml_value(config.get('git_sources', [])) + '\n'
          (directory / 'deny.toml').write_text(deny, encoding="utf-8")
          words = '[default.extend-words]\n'
          words += ''.join(toml_value(word) + ' = ' + toml_value(word) + '\n' for word in dict.fromkeys(config.get('spelling_words', [])))
          (directory / 'typos.toml').write_text(words, encoding="utf-8")
          (directory / 'gitleaks.toml').write_text('[extend]\nuseDefault = true\n', encoding="utf-8")
          (directory / 'gitleaks.ignore').write_text('', encoding="utf-8")
          (directory / 'actionlint.yaml').write_text('{}\n', encoding="utf-8")
          privileged = config.get('privileged_trigger_workflows', [])
          zizmor = {'rules': {'dangerous-triggers': {'ignore': [pathlib.Path(value).name
                    for value in privileged]}}} if privileged else {'rules': {}}
          (directory / 'zizmor.yaml').write_text(toml_value(zizmor) + '\n', encoding="utf-8")
          with open(os.environ['GITHUB_ENV'], 'a', encoding="utf-8") as output:
              output.write(f'CHECK_DEFAULTS={directory}\n')
              output.write(f'CARGO_COVERAGE_MIN_LINES={config.get("coverage_min_lines", 80)}\n')
          PYTHON
      - name: Secrets
        run: |
          if [ -s .gitleaksignore ]; then
            echo '.gitleaksignore: suppressions are forbidden; extensions go through the caller declaration' >&2
            exit 1
          fi
          "$TOOLS/gitleaks" dir --config "$CHECK_DEFAULTS/gitleaks.toml" --gitleaks-ignore-path "$CHECK_DEFAULTS/gitleaks.ignore" --ignore-gitleaks-allow --redact .
      - name: Licenses and dependencies
        run: |
          checks=(licenses bans sources)
          if [ "${CHECK_ADVISORIES:-true}" = false ]; then
            echo 'advisories: not checked; Cargo.lock and the declared exceptions are unchanged, and the scheduled advisory scan watches main'
          else
            checks+=(advisories)
          fi
          "$TOOLS/cargo-deny" deny --workspace --locked --all-features --config "$CHECK_DEFAULTS/deny.toml" check "${checks[@]}"
      - name: Unused dependencies
        run: |
          python3 - <<'PYTHON'
          import pathlib
          import tomllib
          for path in pathlib.Path('.').rglob('Cargo.toml'):
              if 'target' in path.parts or '.git' in path.parts:
                  continue
              with path.open('rb') as source:
                  manifest = tomllib.load(source)
              for section in ('package', 'workspace'):
                  metadata = manifest.get(section, {}).get('metadata', {}).get('cargo-machete', {})
                  if metadata.get('ignored') or metadata.get('renamed'):
                      raise SystemExit(f'{path}: cargo-machete suppressions are forbidden; extensions go through the caller declaration')
          PYTHON
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess
          import tomllib
          machete = [os.environ['TOOLS'] + '/cargo-machete', '--no-ignore', '--skip-target-dir']
          config = pathlib.Path('.config/hakari.toml')
          if not config.is_file():
              raise SystemExit(subprocess.run(machete).returncode)
          with config.open('rb') as source:
              hakari = tomllib.load(source).get('hakari-package')
          if not hakari:
              raise SystemExit(subprocess.run(machete).returncode)
          metadata = json.loads(subprocess.run(['cargo', 'metadata', '--no-deps', '--format-version', '1'],
                                               check=True, capture_output=True, text=True).stdout)
          members = {p['name']: pathlib.Path(p['manifest_path']) for p in metadata['packages']}
          generated = members.get(hakari)
          paths = [str(m.parent) for name, m in members.items() if name != hakari]
          if not paths:
              raise SystemExit(0)
          # The generated package is skipped; only the member-to-unifier edge is accepted.
          result = subprocess.run([*machete, *paths], capture_output=True, text=True)
          failed = False
          crate = None
          for line in result.stdout.splitlines():
              if line.startswith('\t'):
                  if crate != generated and line.strip() != hakari:
                      failed = True
                      print(f'{crate}: unused dependency {line.strip()}')
              elif ' -- ' in line:
                  crate = pathlib.Path(line.rsplit(' -- ', 1)[1].rstrip(':')).resolve()
          if result.returncode not in (0, 1):
              raise SystemExit(result.stderr)
          if failed:
              raise SystemExit(1)
          PYTHON
      - name: Feature unifier
        run: |
          if [ -f .config/hakari.toml ]; then
            PATH="$TOOLS:$PATH" cargo hakari verify
          fi
      - name: Spelling
        run: |
          "$TOOLS/typos" --isolated --config "$CHECK_DEFAULTS/typos.toml" .
      - name: Workflows
        run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#workflows[@]}" -gt 0 ]; then
            python3 - "${workflows[@]}" <<'PYTHON'
          import pathlib
          import re
          import sys
          for filename in sys.argv[1:]:
              for line, text in enumerate(pathlib.Path(filename).read_text(encoding="utf-8").splitlines(), 1):
                  if re.search(r'#\s*zizmor\s*:\s*ignore', text, re.IGNORECASE):
                      raise SystemExit(f'{filename}:{line}: inline zizmor ignores are forbidden; extensions go through the caller declaration')
          PYTHON
            "$TOOLS/zizmor" --offline --config "$CHECK_DEFAULTS/zizmor.yaml" --strict-collection "${workflows[@]}"
            "$TOOLS/actionlint" -config-file "$CHECK_DEFAULTS/actionlint.yaml" -shellcheck= -pyflakes= "${workflows[@]}"
          fi
      - name: Compile cache identity
        id: cache-identity
        if: needs.declaration.outputs.enabled != 'true'
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        id: cache-restore
        if: needs.declaration.outputs.enabled != 'true'
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        env: *sccache-install-env
        if: needs.declaration.outputs.enabled != 'true'
        timeout-minutes: 10
        run: *sccache-install
      - name: Coverage
        timeout-minutes: 45
        if: needs.declaration.outputs.enabled != 'true' && needs.declaration.outputs.coverage == 'true'
        run: |
          unset LLVM_COV LLVM_PROFDATA CARGO_LLVM_COV_FLAGS CARGO_LLVM_PROFDATA_FLAGS
          for name in ${!LLVM_@}; do
            if [[ "$name" == LLVM_*_FLAGS ]]; then unset "$name"; fi
          done
          mkdir -p target/single-coverage
          PATH="$TOOLS:$PATH" "$TOOLS/cargo-llvm-cov" llvm-cov nextest --user-config-file none --ignore-default-filter \
            --retries 0 --final-status-level flaky --partition slice:1/1 --no-tests pass --workspace --locked \
            --no-default-ignore-filename-regex --ignore-filename-regex "$COVERAGE_IGNORE_FILENAME_REGEX" \
            --lcov --output-path "$PWD/target/single-coverage/shard-1.lcov" 2>&1 | tee nextest.log
          COVERAGE_REPORT_DIR=target/single-coverage COVERAGE_REPORT_COUNT=1 python3 -c "$COVERAGE_MERGE"
      - name: Compile cache statistics
        id: cache-statistics
        if: always() && needs.declaration.outputs.enabled != 'true'
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        id: cache-seal
        if: needs.declaration.outputs.enabled != 'true'
        run: *sccache-seal
      - name: Save compile cache
        if: needs.declaration.outputs.enabled != 'true' && steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save
      - name: Compile cache hit-rate floor
        if: *sccache-floor-condition
        env: *sccache-floor-env
        run: *sccache-floor

  fuzz:
    name: Fuzz ${{ matrix.name }}
    needs: declaration
    if: ${{ !inputs.browser-only && !inputs.warm-cache && inputs.fuzz-scan && needs.declaration.outputs.fuzz_targets != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.declaration.outputs.fuzz_targets) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-15
      QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
      FUZZ_MANIFEST: ${{ needs.declaration.outputs.fuzz_manifest }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Fuzz toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Check tools
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
          FUZZ_SCAN: true
        run: *check-tools
      - name: Embedded check defaults
        env:
          CHECK_ADVISORIES: false
        run: *check-defaults
      - name: Fuzz licences
        run: |
          # NCSA is accepted only for libfuzzer-sys, and only in this test-only crate.
          cp "$CHECK_DEFAULTS/deny.toml" "$RUNNER_TEMP/fuzz-deny.toml"
          printf '\n[[licenses.exceptions]]\nname = "libfuzzer-sys"\nallow = ["NCSA"]\n' >> "$RUNNER_TEMP/fuzz-deny.toml"
          "$TOOLS/cargo-deny" --manifest-path "$FUZZ_MANIFEST" --locked --all-features --config "$RUNNER_TEMP/fuzz-deny.toml" check licenses
      - name: Fuzz target
        id: fuzz
        env:
          TARGET: ${{ matrix.name }}
          SECONDS_BUDGET: ${{ matrix.seconds }}
          MAX_LEN: ${{ matrix.max_len }}
          TIMEOUT: ${{ matrix.timeout }}
          RSS_LIMIT_MB: ${{ matrix.rss_limit_mb }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          target = os.environ['TARGET']
          fuzz_dir = pathlib.Path(os.environ['FUZZ_MANIFEST']).parent
          # The minimizer asserts on -max_len, so it reproduces with the time and memory limits only.
          limits = [f"-timeout={os.environ['TIMEOUT']}", f"-rss_limit_mb={os.environ['RSS_LIMIT_MB']}"]
          def fuzz(command, *args):
              result = subprocess.run([os.environ['TOOLS'] + '/cargo-fuzz', 'fuzz', command, '--fuzz-dir', str(fuzz_dir),
                                       '--target', 'x86_64-unknown-linux-gnu', target, *args],
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors='replace')
              print(result.stdout, flush=True)
              return result
          run = fuzz('run', '--', f"-max_total_time={os.environ['SECONDS_BUDGET']}", f"-max_len={os.environ['MAX_LEN']}", *limits)
          artifacts = [path for path in (fuzz_dir / 'artifacts' / target).glob('*')
                       if re.fullmatch(r'(crash|timeout|oom|leak)-[0-9a-f]{40}', path.name)]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'found={str(bool(artifacts)).lower()}\n')
          if not artifacts:
              if run.returncode:
                  raise SystemExit(f'fuzz target {target} exited {run.returncode} without a finding')
              raise SystemExit(0)
          if len(artifacts) != 1:
              raise SystemExit(f'fuzz target {target} left {len(artifacts)} findings')
          raw = artifacts[0]
          tmin = fuzz('tmin', str(raw), '--', *limits)
          reached = re.findall(r'^CRASH_MIN: failed to minimize beyond (.+) \(\d+ bytes\), exiting$', tmin.stdout, re.MULTILINE)
          minimized = pathlib.Path(reached[-1]) if tmin.returncode == 0 and reached else raw
          lines = run.stdout.splitlines()
          panic = next((m for m in map(re.compile(r"^thread '.*' (?:\(\d+\) )?panicked at (.+):$").match, lines) if m), None)
          start = next((i for i, line in enumerate(lines) if re.search(r"panicked at |has overflowed its stack|^==\d+== ?ERROR: |^ALARM: ", line)), 0)
          end = next((i + 1 for i in range(start, len(lines)) if lines[i].startswith('SUMMARY: ')), len(lines))
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fuzz-finding'
          out.mkdir()
          shutil.copyfile(raw, out / raw.name)
          shutil.copyfile(minimized, out / 'minimized')
          (out / 'fuzz.log').write_text(run.stdout, encoding='utf-8')
          (out / 'tmin.log').write_text(tmin.stdout, encoding='utf-8')
          (out / 'finding.json').write_text(json.dumps({
              'target': target, 'kind': raw.name.split('-', 1)[0],
              'location': panic[1].removeprefix(f'{pathlib.Path.cwd()}/') if panic else '',
              'input': base64.b64encode(minimized.read_bytes()).decode(),
              'stack': '\n'.join(lines[start:end])}), encoding='utf-8')
          PYTHON
      - name: Upload fuzz finding
        if: steps.fuzz.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ inputs.concurrency-key || 'root' }}-${{ matrix.name }}
          path: ${{ runner.temp }}/fuzz-finding
          if-no-files-found: error

  advisories:
    name: Advisory scan
    needs: declaration
    if: ${{ !inputs.browser-only && inputs.advisory-scan && !inputs.warm-cache }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Check tools
        timeout-minutes: 10
        env: *release-auth
        run: *check-tools
      - name: Embedded check defaults
        run: *check-defaults
      - name: Undeclared advisories
        id: scan
        run: |
          set +e
          "$TOOLS/cargo-deny" --format json --workspace --locked --all-features --config "$CHECK_DEFAULTS/deny.toml" check advisories 2> "$RUNNER_TEMP/advisories.jsonl"
          status=$?
          set -e
          STATUS=$status python3 - <<'PYTHON'
          import json
          import os
          findings = {}
          for line in open(os.path.join(os.environ['RUNNER_TEMP'], 'advisories.jsonl'), encoding='utf-8'):
              fields = json.loads(line).get('fields', {}) if line.startswith('{') else {}
              if fields.get('severity') != 'error':
                  continue
              crates = sorted({f"{graph['Krate']['name']} {graph['Krate']['version']}" for graph in fields.get('graphs', [])})
              advisory = fields.get('advisory')
              # Yanked crates carry no advisory; their code and crates identify them.
              key = advisory['id'] if advisory else f"{fields.get('code')} {', '.join(crates)}"
              finding = findings.setdefault(key, {'id': key, 'title': advisory.get('title', '') if advisory else fields.get('message', ''), 'crates': set()})
              finding['crates'].update(crates)
          if os.environ['STATUS'] != '0' and not findings:
              raise SystemExit(f"cargo-deny exited {os.environ['STATUS']} without an advisory finding")
          result = [dict(finding, crates=sorted(finding['crates'])) for finding in sorted(findings.values(), key=lambda finding: finding['id'])]
          for finding in result:
              print(f"{finding['id']}: {', '.join(finding['crates'])}: {finding['title']}")
          print(f'{len(result)} undeclared advisories')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('findings=' + json.dumps(result) + '\n')
          PYTHON

  targets:
    permissions:
      contents: read
      actions: read
    name: Check (${{ matrix.target }})
    needs: declaration
    if: ${{ !inputs.browser-only && !inputs.advisory-scan && !inputs.fuzz-scan && (!inputs.warm-cache || github.event_name == 'push') && needs.declaration.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.declaration.outputs.targets) }}
    concurrency:
      group: ${{ format('rust-ci-job-{0}-{1}{2}-targets-{3}', github.workflow, github.event_name == 'merge_group' && format('mg-{0}', needs.declaration.outputs.merge_group_pull_request) || github.run_id, inputs.concurrency-key && format('-{0}', inputs.concurrency-key) || '', matrix.target) }}
      cancel-in-progress: ${{ github.event_name == 'merge_group' }}
    runs-on: ${{ matrix.runner }}
    env:
      CACHE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Compile cache identity
        id: cache-identity
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        if: runner.os != 'Windows' && steps.cache-identity.outputs.snapshot == 'true'
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        if: *sccache-target-host
        env: *sccache-install-env
        timeout-minutes: 10
        run: *sccache-install
      - name: Cargo git cache identity
        id: git-cache-identity
        env: *sccache-identity-env
        run: *git-cache-identity
      - name: Restore Cargo git cache
        id: git-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *git-cache-restore
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: *mise-bootstrap
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        env: *release-auth
        run: *caller-tools
      - name: Check target
        env:
          TEST_PACKAGES: ${{ needs.declaration.outputs.packages }}
          COVERAGE_SCOPE: ${{ needs.declaration.outputs.coverage_scope }}
          TARGET: ${{ matrix.target }}
        run: *clippy
      - name: Save Cargo git cache
        if: runner.os != 'Linux' && steps.cache-identity.outputs.writer == 'true' && steps.git-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *git-cache-save
      - name: Compile cache statistics
        id: cache-statistics
        if: always() && runner.os != 'Windows'
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        if: *sccache-target-host
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: runner.os != 'Windows' && steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save
      - name: Compile cache hit-rate floor
        if: *sccache-floor-condition
        env: *sccache-floor-env
        run: *sccache-floor

  browser:
    permissions:
      contents: read
      actions: read
    name: Wasm and browser build
    needs: declaration
    # A push that reuses merge-queue tests still builds, to seed this shape's snapshot.
    # A pull request runs the job only for declared example witnesses; the other steps skip.
    if: ${{ !inputs.browser-only && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true' || needs.declaration.outputs.wasm_examples != '[]') && !inputs.advisory-scan && !inputs.fuzz-scan && (!inputs.warm-cache || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (needs.declaration.outputs.wasm_crates != '[]' || needs.declaration.outputs.wasm_examples != '[]' || needs.declaration.outputs.emscripten_crates != '[]' || needs.declaration.outputs.browser_build == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Compile cache identity
        id: cache-identity
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        if: steps.cache-identity.outputs.snapshot == 'true'
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        env: *sccache-install-env
        timeout-minutes: 10
        run: *sccache-install
      - name: Browser tool pin
        if: needs.declaration.outputs.browser_build == 'true' && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true')
        run: &browser-tool-pin |
          test -f mise.toml
          python3 - <<'PYTHON'
          import tomllib
          with open('mise.toml', 'rb') as source:
              config = tomllib.load(source)
          if 'just' not in config.get('tools', {}):
              raise SystemExit('mise.toml: tools.just must select the caller browser tool')
          PYTHON
      - name: Browser mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true' || (needs.declaration.outputs.browser_build == 'true' && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true'))
        env: *release-auth
        run: *mise-bootstrap
      - name: Browser tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true' || (needs.declaration.outputs.browser_build == 'true' && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true'))
        env: *release-auth
        run: *caller-tools
      - name: Emscripten SDK
        timeout-minutes: 10
        if: needs.declaration.outputs.emscripten_crates != '[]' && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true')
        env: &emscripten-sdk-env
          GH_TOKEN: ${{ github.token }}
        run: &emscripten-sdk |
          # emsdk 6.0.10 from its release archive, then the two archives its installer fetches for that release
          # (node and the toolchain binaries). Each is checksummed and placed where the installer looks first.
          emsdk=$(mktemp -d "$RUNNER_TEMP/maestro-emsdk.XXXXXX")
          archive=$(mktemp)
          curl --fail --retry 3 --retry-all-errors --retry-delay 30 --header "Authorization: Bearer $GH_TOKEN" --proto '=https' --proto-redir '=https' --location https://github.com/emscripten-core/emsdk/archive/refs/tags/6.0.10.tar.gz --output "$archive"
          unset GH_TOKEN
          printf '%s  %s\n' 09cbafdf00e5a7b4275fc27229d69befafc5ca6070543124219977101310dade "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$emsdk" --strip-components=1
          rm "$archive"
          mkdir "$emsdk/downloads"
          while read -r url digest name; do
            curl --fail --retry 3 --retry-all-errors --retry-delay 30 --proto '=https' --proto-redir '=https' --location "$url" --output "$emsdk/downloads/$name"
            printf '%s  %s\n' "$digest" "$emsdk/downloads/$name" | sha256sum --check --status
          done <<'ARCHIVES'
          https://storage.googleapis.com/webassembly/emscripten-releases-builds/deps/node-v24.19.0-linux-x64.tar.xz 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647 node-v24.19.0-linux-x64.tar.xz
          https://storage.googleapis.com/webassembly/emscripten-releases-builds/linux/666337b525e673e769121856d175f6f52b8ead64/wasm-binaries.tar.xz a51dd2829bdf725d268974728e032533b106ea01cb482a62288ec12627a7abbe 666337b525e673e769121856d175f6f52b8ead64-wasm-binaries.tar.xz
          ARCHIVES
          EMSDK_KEEP_DOWNLOADS=1 "$emsdk/emsdk" install 6.0.10
          "$emsdk/emsdk" activate 6.0.10
          node="$emsdk/node/24.19.0_64bit/bin/node"
          PATH="$emsdk/upstream/emscripten:$PATH" EMSDK="$emsdk" EMSDK_NODE="$node" emcc --version | head -n 1 | grep -F ' 6.0.10 '
          echo "$emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=$emsdk" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$node" >> "$GITHUB_ENV"
      - name: Emscripten target
        if: needs.declaration.outputs.emscripten_crates != '[]' && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true')
        run: &emscripten-target |
          rustup target add wasm32-unknown-emscripten
      - name: Build wasm crates
        if: &browser-sweep (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true')
        env:
          WASM_CRATES: ${{ needs.declaration.outputs.wasm_crates }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          crates = json.loads(os.environ['WASM_CRATES'])
          if crates:
              subprocess.run(['rustup', 'target', 'add', 'wasm32-unknown-unknown'], check=True)
          for crate in crates:
              subprocess.run(['cargo', 'build', '--locked', '--target', 'wasm32-unknown-unknown', '-p', crate], check=True)
          PYTHON
      - name: Build emscripten crates
        if: needs.declaration.outputs.emscripten_crates != '[]' && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true')
        env:
          EMSCRIPTEN_CRATES: ${{ needs.declaration.outputs.emscripten_crates }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          for crate in json.loads(os.environ['EMSCRIPTEN_CRATES']):
              subprocess.run(['cargo', 'build', '--locked', '--target', 'wasm32-unknown-emscripten', '-p', crate], check=True)
          PYTHON
      - name: Build wasm examples
        env:
          WASM_EXAMPLES: ${{ needs.declaration.outputs.wasm_examples }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          witnesses = json.loads(os.environ['WASM_EXAMPLES'])
          if witnesses:
              subprocess.run(['rustup', 'target', 'add', 'wasm32-unknown-unknown'], check=True)
          for crate, example in witnesses:
              print(f'wasm example {crate}::{example}', flush=True)
              subprocess.run(['cargo', 'check', '--locked', '--target', 'wasm32-unknown-unknown', '-p', crate, '--example', example], check=True)
          PYTHON
      - name: Document wasm crates
        if: *browser-sweep
        env:
          WASM_CRATES: ${{ needs.declaration.outputs.wasm_crates }}
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          crates = json.loads(os.environ['WASM_CRATES'])
          if crates:
              subprocess.run(['rustup', 'target', 'add', 'wasm32-unknown-unknown'], check=True)
          for crate in crates:
              subprocess.run(['cargo', 'doc', '--locked', '--no-deps', '--target', 'wasm32-unknown-unknown', '-p', crate], check=True)
          PYTHON
      - name: Browser recipe
        if: needs.declaration.outputs.browser_build == 'true' && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true')
        run: |
          mise exec -- just browser-build
      - name: Compile cache statistics
        id: cache-statistics
        if: always()
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save
      - name: Compile cache hit-rate floor
        if: *sccache-floor-condition
        env: *sccache-floor-env
        run: *sccache-floor

  browser-tests:
    permissions:
      contents: read
      actions: read
    name: Chromium browser tests
    needs: declaration
    # A push that reuses merge-queue tests still runs browser tests, to seed this shape's snapshot.
    if: ${{ (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.tests_reused == 'true') && !inputs.advisory-scan && !inputs.fuzz-scan && (!inputs.warm-cache || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && needs.declaration.outputs.browser_tests == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Compile cache identity
        id: cache-identity
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        if: steps.cache-identity.outputs.snapshot == 'true'
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        env: *sccache-install-env
        timeout-minutes: 10
        run: *sccache-install
      - name: Browser test tool pin
        run: *browser-tool-pin
      - name: Browser test mise bootstrap
        env: *release-auth
        run: *mise-bootstrap
      - name: Browser test caller tools
        env: *release-auth
        run: *caller-tools
      - name: Emscripten SDK
        timeout-minutes: 10
        if: needs.declaration.outputs.emscripten_crates != '[]'
        env: *emscripten-sdk-env
        run: *emscripten-sdk
      - name: Emscripten target
        if: needs.declaration.outputs.emscripten_crates != '[]'
        run: *emscripten-target
      - name: Browser runtime tools
        env: *release-auth
        run: |
          tools=$(mktemp -d "$RUNNER_TEMP/browser-runtime.XXXXXX")
          cd "$tools"
          curl --fail --retry 3 --retry-all-errors --retry-delay 30 --silent --show-error --location https://cdn.playwright.dev/builds/cft/156.0.8078.4/linux64/chrome-linux64.zip -o chromium.zip
          echo '43fd31766c7533a02dda2ded5ad50c2f861cd5400be7509c0abad71129f79d79  chromium.zip' | sha256sum --check --status
          unzip -q chromium.zip
          curl --fail --retry 3 --retry-all-errors --retry-delay 30 --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --proto '=https' --proto-redir '=https' --location https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz -o bindgen.tar.gz
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  bindgen.tar.gz' | sha256sum --check --status
          tar -xzf bindgen.tar.gz
          curl --fail --retry 3 --retry-all-errors --retry-delay 30 --silent --show-error --location https://registry.npmjs.org/playwright/-/playwright-1.64.1.tgz -o playwright.tgz
          curl --fail --retry 3 --retry-all-errors --retry-delay 30 --silent --show-error --location https://registry.npmjs.org/playwright-core/-/playwright-core-1.64.1.tgz -o playwright-core.tgz
          python3 -I - <<'PYTHON'
          import base64
          import hashlib
          import pathlib
          for name, digest in [
              ('playwright', 'HCrVhHr5QQuwYoswEUGTb7gGp522yflbv/ST8nF4sFWGuLjQCt17Q/EubpGGSNKYn1tsTCPZxqHhHCfVURu7UA=='),
              ('playwright-core', 'BC4s8y6SEVA6Q1rSxZTto8hI1KUI3xXlHGZgvGqP4IqPdI/a6FX9H29IDNz7vKo9l21b6LfYosScPL6M3xxyDQ=='),
          ]:
              if hashlib.sha512(pathlib.Path(name + '.tgz').read_bytes()).digest() != base64.b64decode(digest):
                  raise SystemExit(name + ': archive checksum mismatch')
          PYTHON
          mkdir -p node_modules/playwright node_modules/playwright-core
          tar -xzf playwright.tgz --strip-components=1 -C node_modules/playwright
          tar -xzf playwright-core.tgz --strip-components=1 -C node_modules/playwright-core
          node - <<'JAVASCRIPT'
          const assert = require('node:assert/strict');
          assert(Number(process.versions.node.split('.')[0]) >= 20);
          const driver = require('./node_modules/playwright/package.json');
          const core = require('./node_modules/playwright-core/package.json');
          assert.equal(driver.version, '1.64.1');
          assert.deepEqual(driver.dependencies, {'playwright-core': '1.64.1'});
          assert.equal(core.version, '1.64.1');
          assert.deepEqual(core.dependencies || {}, {});
          assert.deepEqual(core.optionalDependencies || {}, {});
          assert.deepEqual(driver.optionalDependencies || {}, {});
          console.log(process.version);
          JAVASCRIPT
          node node_modules/playwright/cli.js --version
          "$tools/chrome-linux64/chrome" --version
          "$tools/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen" --version
          echo "$tools/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          echo "PLAYWRIGHT_MODULE=$tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$tools/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Browser runtime packages
        timeout-minutes: 5
        run: |
          # Apt reads this drop-in as root, so every transfer it still needs fails over in seconds instead
          # of holding the job for minutes.
          settings=$(mktemp)
          printf '%s\n' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            'Acquire::Retries "3";' > "$settings"
          sudo install -m 0644 "$settings" /etc/apt/apt.conf.d/99-maestro-browser-packages
          rm "$settings"
          node "$PLAYWRIGHT_MODULE/cli.js" install-deps chromium
      - name: Browser test recipe
        id: browser-recipe
        run: |
          just browser-test 2>&1 | tee "$RUNNER_TEMP/browser-test.log"
      - name: Upload browser test log
        if: always() && (steps.browser-recipe.outcome == 'success' || steps.browser-recipe.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-${{ inputs.concurrency-key || 'root' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-test.log
          if-no-files-found: error
      - name: Compile cache statistics
        id: cache-statistics
        if: always()
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save
      - name: Compile cache hit-rate floor
        if: *sccache-floor-condition
        env: *sccache-floor-env
        run: *sccache-floor

  quality-prune:
    # Cache entries are immutable, so every default-branch save adds one beside the entry it replaces.
    # A pruner follows each saving job and keeps only the newest entry of each prefix, the one a restore
    # reads, so the cache holds one snapshot per shape. It holds the only write grant and runs no caller code.
    name: Prune superseded caches (quality)
    needs: quality
    if: &prune-condition ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions: &prune-permissions
      actions: write
    runs-on: ubuntu-latest
    steps: &prune-steps
      - name: Runner hardware
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: *runner-hardware
      - name: Prune superseded caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PYTHON'
          import datetime
          import json
          import os
          import re
          import subprocess
          import sys
          # The compile, Cargo git and test setup prefixes each end in their identity digest.
          prefix = re.compile(r'(?:maestro-compile-v1|maestro-cargo-git-v1|maestro-test-setup-v2)-[0-9a-f]{64}-')
          repository = os.environ['GITHUB_REPOSITORY']
          pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
              f"repos/{repository}/actions/caches?ref={os.environ['GITHUB_REF']}&per_page=100"], text=True))
          caches = sorted((cache for page in pages for cache in page['actions_caches']),
                          key=lambda cache: datetime.datetime.fromisoformat(cache['created_at']), reverse=True)
          newest, status = {}, 0
          for cache in caches:
              match = prefix.match(cache['key'])
              if not match or newest.setdefault(match[0], cache) is cache:
                  continue
              deleted = subprocess.run(['gh', 'api', '--method', 'DELETE', f"repos/{repository}/actions/caches/{cache['id']}"],
                                       capture_output=True, text=True)
              # Another pruner of this or a later run may have deleted the entry first.
              if deleted.returncode and 'HTTP 404' not in deleted.stderr:
                  print(f"::warning title=Cache prune::{cache['key']} was not deleted: {' '.join(deleted.stderr.split())}")
                  status = 1
              else:
                  print(f"Deleted {cache['key']}, replaced by {newest[match[0]]['key']}")
          sys.exit(status)
          PYTHON

