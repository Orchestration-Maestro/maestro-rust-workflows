        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save

  tests:
    needs: [declaration, test-build, test-prepare]
    name: ${{ inputs.warm-cache && 'Warm coverage cache' || matrix.shard == 'doctests' && 'Doctests' || format('Test shard ({0}/{1})', matrix.shard, needs.declaration.outputs.test_shard_count) }}
    if: ${{ !cancelled() && (inputs.warm-cache || (needs.test-build.result == 'success' && (needs.test-prepare.result == 'success' || needs.test-prepare.result == 'skipped'))) && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.included_tests == 'true') && !inputs.advisory-scan && !inputs.fuzz-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.warm-cache && '["warm"]' || needs.declaration.outputs.test_shards) }}
    runs-on: ${{ fromJSON(needs.declaration.outputs.linux_runner) }}
    env: &test-env
      TEST_SHARD_COUNT: ${{ needs.declaration.outputs.test_shard_count }}
      ADDITIONAL_LOCKED_MANIFESTS: ${{ needs.declaration.outputs.additional_locked_manifests }}
      WARM_CACHE: ${{ inputs.warm-cache && matrix.shard != 'doctests' }}
