      - name: Fetch additional locked manifests
        if: needs.declaration.outputs.additional_locked_manifests != '[]'
        run: *fetch-locked-manifests
      - name: Download test archive
        if: ${{ !inputs.warm-cache && matrix.shard != 'doctests' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-archive-${{ inputs.concurrency-key || 'root' }}
          path: ${{ inputs.working-directory || '.' }}
      - name: Download test setup
        if: ${{ !inputs.warm-cache && matrix.shard != 'doctests' && needs.declaration.outputs.test_prepare != '""' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-setup-${{ inputs.concurrency-key || 'root' }}
          path: ${{ runner.temp }}/maestro-test-setup
      - name: Restore test setup
        if: ${{ !inputs.warm-cache && matrix.shard != 'doctests' && needs.declaration.outputs.test_prepare != '""' }}
        run: |
          mkdir -p target
          tar -C target -xf "$RUNNER_TEMP/maestro-test-setup/test-setup.tar"
      - name: Tests
        timeout-minutes: 45
        if: ${{ env.WARM_CACHE != 'true' && needs.declaration.outputs.enabled != 'true' }}
        run: |
          cargo fetch --locked
          mapfile -d '' -t packages < <(python3 -c 'import json, os; print("".join("-p\0" + name + "\0" for name in json.loads(os.environ.get("TEST_PACKAGES", "[]"))), end="")')
          if [ -z "${TEST_PACKAGES:-}" ] || [ "${COVERAGE_SCOPE:-}" = "full workspace" ]; then packages=(--workspace); fi
          if [ "${TEST_PACKAGES:-}" = '[]' ]; then exit 0; fi
          build_args=(--locked "${packages[@]}")
          if [ -n "${TEST_ARCHIVE:-}" ]; then
            build_args=(--archive-file "$TEST_ARCHIVE" --workspace-remap "$PWD" --extract-to "$PWD" --extract-overwrite)
          fi
          if [ "${SHARD:-}" != doctests ]; then
            "$TOOLS/cargo-nextest" nextest run --user-config-file none --ignore-default-filter "${build_args[@]}" --retries 2 --flaky-result pass --final-status-level flaky --partition "count:$SHARD/$TEST_SHARD_COUNT" --no-tests pass 2>&1 | tee nextest.log
          fi
          if [[ "$SHARD" == doctests || ( -z "${TEST_ARCHIVE:-}" && "$SHARD" == 1 && "${COLLECT_COVERAGE:-false}" != true ) ]]; then
            cargo test --locked --doc "${packages[@]}"
          fi
      - name: Search tools
        timeout-minutes: 10
        if: env.WARM_CACHE == 'true' || needs.declaration.outputs.enabled == 'true'
        run: *search-tools
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: *mise-bootstrap
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: *caller-tools
      - name: Reserved ports
        if: runner.environment == 'github-hosted' && needs.declaration.outputs.reserved_ports != ''
        env:
          RESERVED_PORTS: ${{ needs.declaration.outputs.reserved_ports }}
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports="$RESERVED_PORTS"
      - name: Isolated tests
        timeout-minutes: 45
        if: env.WARM_CACHE == 'true' || needs.declaration.outputs.enabled == 'true'
        env:
          CARGO_COVERAGE_MIN_LINES: ''
        run: |
          python3 - <<'PYTHON'
          import os
          names = '''ANTHROPIC_API_KEY ANTHROPIC_OAUTH_TOKEN OPENAI_API_KEY GEMINI_API_KEY
          GROQ_API_KEY CEREBRAS_API_KEY XAI_API_KEY OPENROUTER_API_KEY ZAI_API_KEY
          MISTRAL_API_KEY MINIMAX_API_KEY MINIMAX_CN_API_KEY KIMI_API_KEY HF_TOKEN
          AI_GATEWAY_API_KEY OPENCODE_API_KEY COPILOT_GITHUB_TOKEN GH_TOKEN GITHUB_TOKEN
          GOOGLE_APPLICATION_CREDENTIALS GOOGLE_CLOUD_PROJECT GCLOUD_PROJECT
          GOOGLE_CLOUD_LOCATION AWS_PROFILE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION AWS_BEARER_TOKEN_BEDROCK
          AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI
          AWS_WEB_IDENTITY_TOKEN_FILE BEDROCK_EXTENSIVE_MODEL_TEST FIREWORKS_API_KEY'''.split()
          found = sorted(name for name in os.environ if name in names or name.endswith('_API_KEY'))
          if found:
              raise SystemExit('Credential variables present: ' + ', '.join(found))
          PYTHON
          cargo_home=$(cd "${CARGO_HOME:-$HOME/.cargo}" && pwd)
          rustup_home=$(cd "${RUSTUP_HOME:-$HOME/.rustup}" && pwd)
          diagnostics="$PWD/target/browser-author-diagnostics"
          mkdir -p "$diagnostics"
          isolation=$(mktemp -d "$RUNNER_TEMP/maestro-tests.XXXXXX")
          # Tests can leave processes that keep writing here: stop and name them, and keep the test status.
          cleanup_isolation() {
            status=$?
            set +e
            python3 - "$isolation" <<'PYTHON'
          import json
          import os
          import signal
          import sys
          import time
          roots = tuple(path + '/' for path in {sys.argv[1], os.path.realpath(sys.argv[1])})
          def link(path):
              try:
                  return os.readlink(path)
              except OSError:
                  return ''
          def users():
              found = {}
              for entry in os.listdir('/proc'):
                  if not entry.isdigit() or int(entry) == os.getpid():
                      continue
                  base = '/proc/' + entry
                  try:
                      descriptors = os.listdir(base + '/fd')
                  except OSError:
                      descriptors = []
                  paths = [link(base + '/cwd'), link(base + '/exe')] + [link(base + '/fd/' + fd) for fd in descriptors]
                  if os.path.basename(paths[1]) == 'sccache':
                      # The compile cache server outlives the tests; its own steps report on it and stop it.
                      continue
                  try:
                      with open(base + '/environ', 'rb') as file:
                          environment = file.read()
                  except OSError:
                      environment = b''
                  if any(path.startswith(roots) for path in paths) or any(root.encode() in environment for root in roots):
                      try:
                          with open(base + '/cmdline', 'rb') as file:
                              found[int(entry)] = json.dumps(file.read().decode('utf-8', 'replace').split('\0')[:-1])
                      except OSError:
                          pass
              return found
          announced = set()
          for _ in range(50):
              found = users()
              if not found:
                  break
              for pid, command in found.items():
                  if pid not in announced:
                      announced.add(pid)
                      print(f'Stopped test process {pid}: {command}', flush=True)
                  try:
                      os.kill(pid, signal.SIGKILL)
                  except OSError:
                      pass
              time.sleep(0.1)
          PYTHON
            rm -rf "$isolation" || echo "Could not remove $isolation" >&2
            exit "$status"
          }
          trap cleanup_isolation EXIT
          mkdir "$isolation"/{home,tmp,config,data,cache,state,runtime,config-dirs,data-dirs}
          run_isolated() {
          env -i PATH="${TOOLS:+$TOOLS:}$PATH" CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
            HOME="$isolation/home" TMPDIR="$isolation/tmp" TMP="$isolation/tmp" TEMP="$isolation/tmp" \
            XDG_CONFIG_HOME="$isolation/config" XDG_DATA_HOME="$isolation/data" \
            XDG_CACHE_HOME="$isolation/cache" XDG_STATE_HOME="$isolation/state" \
            XDG_RUNTIME_DIR="$isolation/runtime" XDG_CONFIG_DIRS="$isolation/config-dirs" \
            XDG_DATA_DIRS="$isolation/data-dirs" MAESTRO_NO_LOCAL_LLM=1 MAESTRO_TEST_DIAGNOSTICS_DIR="$diagnostics" \
            TEST_PREPARE_OUTPUT="$PWD/target/test-setup" ${TEST_ARCHIVE:+TEST_ARCHIVE=1} \
            CARGO_BUILD_RUSTC_WRAPPER="${CARGO_BUILD_RUSTC_WRAPPER-}" CARGO_INCREMENTAL="${CARGO_INCREMENTAL-}" \
            SCCACHE_DIR="${SCCACHE_DIR-}" SCCACHE_CACHE_SIZE="${SCCACHE_CACHE_SIZE-}" \
            SCCACHE_LOCAL_RW_MODE="${SCCACHE_LOCAL_RW_MODE-}" SCCACHE_GHA_ENABLED="${SCCACHE_GHA_ENABLED-}" \
            SCCACHE_SKIP_CACHE_CHECK="${SCCACHE_SKIP_CACHE_CHECK-}" SCCACHE_ERROR_LOG="${SCCACHE_ERROR_LOG-}" SCCACHE_LOG="${SCCACHE_LOG-}" \
            "$@"
          }
          cargo fetch --locked
          mapfile -d '' -t packages < <(python3 -c 'import json, os; print("".join("-p\0" + name + "\0" for name in json.loads(os.environ.get("TEST_PACKAGES", "[]"))), end="")')
          if [ -z "${TEST_PACKAGES:-}" ] || [ "${COVERAGE_SCOPE:-}" = "full workspace" ]; then packages=(--workspace); fi
          if [ "${TEST_PACKAGES:-}" = '[]' ] && [ "${WARM_CACHE:-false}" != true ]; then exit 0; fi
          build_args=(--locked "${packages[@]}")
          if [ -n "${TEST_ARCHIVE:-}" ]; then
            build_args=(--archive-file "$TEST_ARCHIVE" --workspace-remap "$PWD" --extract-to "$PWD" --extract-overwrite)
          fi
          if [ "${SHARD:-}" != doctests ]; then
            if [ -n "${CARGO_COVERAGE_MIN_LINES:-}" ] || [ "${WARM_CACHE:-false}" = true ] || { [ "${COLLECT_COVERAGE:-true}" = true ] && [ -n "${SHARD:-}" ]; }; then
              mapfile -d '' -t report_packages < <(python3 -c 'import json, os; print("".join("--exclude-from-report\0" + name + "\0" for name in json.loads(os.environ.get("COVERAGE_EXCLUDE") or "[]")), end="")')
              partition=(--partition "count:$SHARD/$TEST_SHARD_COUNT")
              report=(--lcov --output-path "$PWD/shard-$SHARD.lcov")
              if [ "${WARM_CACHE:-false}" = true ]; then
                packages=(--workspace)
                report_packages=()
                partition=(-E "${WARM_TEST_FILTER-none()}")
                report=(--no-report)
              elif [ -n "${CARGO_COVERAGE_MIN_LINES:-}" ]; then
                partition=(--partition count:1/1)
                mkdir -p target/single-coverage
                report=(--lcov --output-path "$PWD/target/single-coverage/shard-1.lcov")
              fi
              coverage_build_args=("${packages[@]}" "${report_packages[@]}" --locked)
              if [ -n "${TEST_ARCHIVE:-}" ]; then
                # Keep compile-time Cargo executable paths valid after archive extraction.
                mkdir -p target/llvm-cov-target
                ln -sfn target/debug target/llvm-cov-target/debug
                coverage_build_args=(--no-clean --archive-file "$TEST_ARCHIVE" --workspace-remap "$PWD" --extract-overwrite "${report_packages[@]}")
              fi
              run_isolated "$TOOLS/cargo-llvm-cov" llvm-cov nextest --user-config-file none --ignore-default-filter \
                --retries 2 --flaky-result pass --final-status-level flaky "${partition[@]}" --no-tests pass "${coverage_build_args[@]}" \
                --no-default-ignore-filename-regex --ignore-filename-regex "$COVERAGE_IGNORE_FILENAME_REGEX" "${report[@]}" 2>&1 | tee nextest.log
              if [ -n "${CARGO_COVERAGE_MIN_LINES:-}" ] && [ "${WARM_CACHE:-false}" != true ]; then
                COVERAGE_REPORT_DIR=target/single-coverage COVERAGE_REPORT_COUNT=1 python3 -c "$COVERAGE_MERGE"
              fi
            else
              partition=()
              if [ -n "${SHARD:-}" ]; then partition=(--partition "count:$SHARD/$TEST_SHARD_COUNT"); fi
              run_isolated "$TOOLS/cargo-nextest" nextest run --user-config-file none --ignore-default-filter \
                "${build_args[@]}" --retries 2 --flaky-result pass --final-status-level flaky --no-tests pass "${partition[@]}" 2>&1 | tee nextest.log
            fi
          fi
          if [[ "${WARM_CACHE:-false}" != true && -z "${CARGO_COVERAGE_MIN_LINES:-}" && ( "${SHARD:-}" == doctests || ( -z "${TEST_ARCHIVE:-}" && "${SHARD:-1}" == 1 && "${COLLECT_COVERAGE:-false}" != true ) ) ]]; then
            run_isolated cargo test --locked --doc "${packages[@]}"
          fi
      - name: Print test diagnostics
        id: diagnostics
        if: always() && needs.declaration.outputs.enabled == 'true'
        env:
          CALLER_REPOSITORY: ${{ inputs.checkout-repository || github.repository }}
          CALLER_DIRECTORY: ${{ inputs.working-directory || '.' }}
          CALL_KEY: ${{ inputs.concurrency-key }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import pathlib
          import secrets
          import sys
          identity = [os.environ['CALLER_REPOSITORY'], os.environ['CALLER_DIRECTORY'], os.environ['CALL_KEY']]
          digest = hashlib.sha256(json.dumps(identity, ensure_ascii=False, separators=(',', ':')).encode('utf-8')).hexdigest()
          name = f"test-diagnostics-{os.environ['GITHUB_REPOSITORY_ID']}-{digest}-shard-{os.environ['SHARD']}-run-{os.environ['GITHUB_RUN_ID']}-attempt-{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'artifact_name={name}\n')
          token = secrets.token_hex(32)
          print(f'::stop-commands::{token}', flush=True)
          try:
              for path in pathlib.Path('target/browser-author-diagnostics').rglob('*'):
                  if path.is_file() and not path.is_symlink():
                      sys.stdout.buffer.write(path.read_bytes())
          finally:
              print(f'\n::{token}::', flush=True)
          PYTHON
      - name: Upload test diagnostics
        if: always() && needs.declaration.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.diagnostics.outputs.artifact_name }}
          path: |
            ${{ inputs.working-directory || '.' }}/target/browser-author-diagnostics
            ${{ inputs.working-directory || '.' }}/nextest.log
          if-no-files-found: ignore
      - name: Flaky test summary
        if: always()
        run: &flaky-test-summary |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import re
          path = pathlib.Path('nextest.log')
          text = path.read_text(encoding='utf-8') if path.exists() else ''
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          flaky = sorted(set(re.findall(r'^\s*FLAKY(?:\s+\d+/\d+)?\s+\[[^]]*\]\s*(.+)$', text, re.MULTILINE)))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('### Flaky tests (passed on retry)\n' + ('\n'.join('- ' + name for name in flaky) if flaky else 'None') + '\n')
          PYTHON
      - name: Compile cache statistics
        id: cache-statistics
        if: always() && (inputs.warm-cache || matrix.shard == 'doctests')
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        if: (inputs.warm-cache || matrix.shard == 'doctests')
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save
      - name: Upload shard coverage
        if: ${{ !inputs.warm-cache && needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true' && matrix.shard != 'doctests' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ inputs.concurrency-key || 'root' }}-${{ matrix.shard }}
          path: ${{ inputs.working-directory || '.' }}/shard-${{ matrix.shard }}.lcov
          if-no-files-found: error

  doctests:
    name: ${{ matrix.shard == 'doctests' && 'Doctests' }}
    needs: declaration
    if: ${{ (!inputs.warm-cache || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (needs.declaration.outputs.coverage == 'true' || needs.declaration.outputs.included_tests == 'true') && !inputs.advisory-scan && !inputs.fuzz-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ${{ fromJSON(needs.declaration.outputs.linux_runner) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [doctests]
    env: *test-env
    defaults: *test-defaults
    steps: *test-steps

  tests-result:
    name: Tests (ubuntu-latest)
    needs: [tests, doctests, declaration, test-build]
    if: ${{ always() && !inputs.advisory-scan && !inputs.fuzz-scan && !inputs.warm-cache && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ${{ fromJSON(needs.declaration.outputs.linux_runner) }}
    steps:
      - name: All test shards passed
        env:
          RESULT: ${{ needs.tests.result }}
          DOCTEST_RESULT: ${{ needs.doctests.result }}
          DECLARATION_RESULT: ${{ needs.declaration.result }}
          INCLUDED_TESTS: ${{ needs.declaration.outputs.included_tests }}
          COLLECT_COVERAGE: ${{ needs.declaration.outputs.coverage }}
        shell: python
        run: |
          import os
          assert os.environ['DECLARATION_RESULT'] == 'success'
          expected = {'false': 'skipped', 'true': 'success'}
          assert os.environ['COLLECT_COVERAGE'] in expected
          required = 'success' if os.environ.get('INCLUDED_TESTS') == 'true' else expected[os.environ['COLLECT_COVERAGE']]
          assert os.environ['RESULT'] == required
          assert os.environ['DOCTEST_RESULT'] == required
      - name: Download shard coverage
        if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-${{ inputs.concurrency-key || 'root' }}-*
          path: coverage
          merge-multiple: true
      - name: Download coverage baseline
        if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true' && startsWith(needs.declaration.outputs.coverage_scope, 'selected packages:')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-baseline-${{ inputs.concurrency-key || 'root' }}
          path: baseline
      - name: Merge coverage
        if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true'
        env:
          QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
          COVERAGE_SCOPE: ${{ needs.declaration.outputs.coverage_scope }}
          COVERAGE_LAYOUT: ${{ needs.declaration.outputs.coverage_layout }}
          COVERAGE_CHECKOUT_ROOT: ${{ needs.test-build.outputs.coverage_checkout_root }}
          TEST_PACKAGES: ${{ needs.declaration.outputs.packages }}
          TEST_SHARD_COUNT: ${{ needs.declaration.outputs.test_shard_count }}
        run: python3 -c "$COVERAGE_MERGE"
      - name: Upload full coverage manifest
        if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true' && needs.declaration.outputs.coverage_scope == 'full workspace'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ inputs.concurrency-key || 'root' }}-full
          path: coverage/manifest.json
          if-no-files-found: error

  checks:
    name: Dependency, source and coverage checks
    needs: declaration
    if: ${{ !inputs.advisory-scan && !inputs.fuzz-scan && !inputs.warm-cache && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ${{ fromJSON(needs.declaration.outputs.linux_runner) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
      CHECK_ADVISORIES: ${{ needs.declaration.outputs.check_advisories }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Free instrumented build space
        if: runner.environment == 'github-hosted' && needs.declaration.outputs.enabled != 'true'
        run: *free-build-space
      - name: Toolchain
        run: |
          rustup show
          rustup component add llvm-tools-preview
      - name: Check tools
        timeout-minutes: 10
        run: &check-tools |
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-check-tools.XXXXXX")
          while read -r url digest binary; do
            # Only the fuzz job needs cargo-fuzz; the required checks never download it.
            if [ "$binary" = cargo-fuzz ] && [ "${FUZZ_SCAN:-}" != true ]; then continue; fi
            archive=$(mktemp)
            curl --fail --retry 3 --location "$url" --output "$archive"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status
            if [ "$binary" = shfmt ]; then
              install -m 0755 "$archive" "$bin/$binary"
              rm -f "$archive"
              continue
            fi
            unpack=$(mktemp -d)
            tar -xzf "$archive" -C "$unpack"
            find "$unpack" -type f -name "$binary" -exec cp '{}' "$bin/$binary" \;
            test -x "$bin/$binary"
            rm -rf "$archive" "$unpack"
          done <<'TOOLS'
          https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f cargo-deny
          https://github.com/guppy-rs/guppy/releases/download/cargo-hakari-0.9.39/cargo-hakari-0.9.39-x86_64-unknown-linux-musl.tar.gz 6437e3dede815ff68b7671c15ad65240a7c80118e5a6a07d68ff85d29e78d017 cargo-hakari
          https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz 48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9 cargo-machete
          https://github.com/crate-ci/typos/releases/download/v1.51.1/typos-v1.51.1-x86_64-unknown-linux-musl.tar.gz 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454 typos
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks
          https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a zizmor
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 actionlint
          https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz 3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522 cargo-llvm-cov
          https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-musl.tar.gz bf92cb81450872d960ffa13857a83084d557ec0cdc141663d263bb23ef756f97 cargo-nextest
          https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.2/cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c cargo-fuzz
          https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf shfmt
          TOOLS
          echo "TOOLS=$bin" >> "$GITHUB_ENV"
      - name: Embedded check defaults
        run: &check-defaults |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess
          import tomllib
          config = json.loads(os.environ.get('QUALITY_CONFIG') or '{}')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'maestro-checks'
          directory.mkdir(exist_ok=True)
          def toml_value(value):
              return json.dumps(value, ensure_ascii=False)
          # BSL-1.0 is the Boost Software License; BUSL-1.1, the Business Source License, is absent from the default allowlist.
          # Callers can allow BUSL-1.1 for an exact package version through license_exceptions.
          allow = ['MIT', 'Apache-2.0', 'ISC', 'BSD-2-Clause', 'BSD-3-Clause', 'Zlib',
                   'Apache-2.0 WITH LLVM-exception', 'Unicode-DFS-2016', 'Unicode-3.0',
                   'CC0-1.0', 'CDLA-Permissive-2.0', 'MPL-2.0', 'MIT-0', 'BSL-1.0']
          deny = '[advisories]\nyanked = "deny"\n'
          if config.get('advisory_exceptions') or config.get('yanked_crate_exceptions'):
              with pathlib.Path('Cargo.lock').open('rb') as source:
                  packages = {(entry['name'], entry['version']) for entry in tomllib.load(source)['package']}
              for entry in config.get('yanked_crate_exceptions', []):
                  if (entry['package'], entry['version']) not in packages:
                      raise SystemExit(f"Cargo.lock: stale yanked-crate exception for {entry['package']} {entry['version']}")
          if config.get('advisory_exceptions'):
              for entry in config['advisory_exceptions']:
                  if (entry['package'], entry['version']) not in packages:
                      raise SystemExit(f"Cargo.lock: stale advisory exception {entry['id']} for {entry['package']} {entry['version']}")
          if config.get('advisory_exceptions') and os.environ.get('CHECK_ADVISORIES') != 'false':
              declared = {(entry['id'], entry['package'], entry['version']) for entry in config['advisory_exceptions']}
              probe = directory / 'probe-deny.toml'
              probe.write_text('[advisories]\nyanked = "deny"\n', encoding="utf-8")
              found = subprocess.run([os.environ['TOOLS'] + '/cargo-deny', '--format', 'json', '--workspace', '--locked', '--all-features',
                                      '--config', str(probe), 'check', 'advisories'], capture_output=True, text=True)
              reported = {}
              for line in found.stderr.splitlines():
                  fields = json.loads(line).get('fields', {}) if line.startswith('{') else {}
                  if 'advisory' in fields:
                      reported.setdefault(fields['advisory']['id'], set()).update(
                          (graph['Krate']['name'], graph['Krate']['version']) for graph in fields['graphs'])
              for entry in config['advisory_exceptions']:
                  if (entry['package'], entry['version']) not in reported.get(entry['id'], set()):
                      actual = ', '.join(f'{name} {version}' for name, version in sorted(reported.get(entry['id'], ()))) or 'no such finding'
                      raise SystemExit(f"Cargo.lock: advisory exception {entry['id']} is not reported for {entry['package']} {entry['version']}: {actual}")
              missing = {(advisory, package, version) for advisory in {entry['id'] for entry in config['advisory_exceptions']}
                         for package, version in reported.get(advisory, set())} - declared
              if missing:
                  advisory, package, version = sorted(missing)[0]
                  raise SystemExit(f"Cargo.lock: advisory exception {advisory} is missing for {package} {version}")
          if config.get('advisory_exceptions') or config.get('yanked_crate_exceptions'):
              deny += 'ignore = [\n'
              for entry in config.get('advisory_exceptions', []):
                  deny += '  { id = ' + toml_value(entry['id']) + ', reason = ' + toml_value(entry['reason']) + ' },\n'
              for entry in config.get('yanked_crate_exceptions', []):
                  deny += '  { crate = ' + toml_value(entry['package'] + '@=' + entry['version']) + ' },\n'
              deny += ']\n'
          deny += '[licenses]\nallow = ' + toml_value(allow) + '\n'
          for entry in config.get('license_exceptions', []):
              deny += '\n[[licenses.exceptions]]\nname = ' + toml_value(entry['package'])
              deny += '\nversion = ' + toml_value('=' + entry['version'])
              deny += '\nallow = ' + toml_value(entry['licenses']) + '\n'
          deny += '\n[bans]\n[sources]\nunknown-registry = "deny"\nunknown-git = "deny"\n'
          deny += 'allow-git = ' + toml_value(config.get('git_sources', [])) + '\n'
          (directory / 'deny.toml').write_text(deny, encoding="utf-8")
          words = '[default.extend-words]\n'
          words += ''.join(toml_value(word) + ' = ' + toml_value(word) + '\n' for word in dict.fromkeys(config.get('spelling_words', [])))
          (directory / 'typos.toml').write_text(words, encoding="utf-8")
          (directory / 'gitleaks.toml').write_text('[extend]\nuseDefault = true\n', encoding="utf-8")
          (directory / 'gitleaks.ignore').write_text('', encoding="utf-8")
          (directory / 'actionlint.yaml').write_text('{}\n', encoding="utf-8")
          privileged = config.get('privileged_trigger_workflows', [])
          zizmor = {'rules': {'dangerous-triggers': {'ignore': [pathlib.Path(value).name
                    for value in privileged]}}} if privileged else {'rules': {}}
          (directory / 'zizmor.yaml').write_text(toml_value(zizmor) + '\n', encoding="utf-8")
          with open(os.environ['GITHUB_ENV'], 'a', encoding="utf-8") as output:
              output.write(f'CHECK_DEFAULTS={directory}\n')
              output.write(f'CARGO_COVERAGE_MIN_LINES={config.get("coverage_min_lines", 80)}\n')
          PYTHON
      - name: Secrets
        run: |
          if [ -s .gitleaksignore ]; then
            echo '.gitleaksignore: suppressions are forbidden; extensions go through the caller declaration' >&2
            exit 1
          fi
          "$TOOLS/gitleaks" dir --config "$CHECK_DEFAULTS/gitleaks.toml" --gitleaks-ignore-path "$CHECK_DEFAULTS/gitleaks.ignore" --ignore-gitleaks-allow --redact .
      - name: Licenses and dependencies
        run: |
          checks=(licenses bans sources)
          if [ "${CHECK_ADVISORIES:-true}" = false ]; then
            echo 'advisories: not checked; Cargo.lock and the declared exceptions are unchanged, and the scheduled advisory scan watches main'
          else
            checks+=(advisories)
          fi
          "$TOOLS/cargo-deny" deny --workspace --locked --all-features --config "$CHECK_DEFAULTS/deny.toml" check "${checks[@]}"
      - name: Unused dependencies
        run: |
          python3 - <<'PYTHON'
          import pathlib
          import tomllib
          for path in pathlib.Path('.').rglob('Cargo.toml'):
              if 'target' in path.parts or '.git' in path.parts:
                  continue
              with path.open('rb') as source:
                  manifest = tomllib.load(source)
              for section in ('package', 'workspace'):
                  metadata = manifest.get(section, {}).get('metadata', {}).get('cargo-machete', {})
                  if metadata.get('ignored') or metadata.get('renamed'):
                      raise SystemExit(f'{path}: cargo-machete suppressions are forbidden; extensions go through the caller declaration')
          PYTHON
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess
          import tomllib
          machete = [os.environ['TOOLS'] + '/cargo-machete', '--no-ignore', '--skip-target-dir']
          config = pathlib.Path('.config/hakari.toml')
          if not config.is_file():
              raise SystemExit(subprocess.run(machete).returncode)
          with config.open('rb') as source:
              hakari = tomllib.load(source).get('hakari-package')
          if not hakari:
              raise SystemExit(subprocess.run(machete).returncode)
          metadata = json.loads(subprocess.run(['cargo', 'metadata', '--no-deps', '--format-version', '1'],
                                               check=True, capture_output=True, text=True).stdout)
          members = {p['name']: pathlib.Path(p['manifest_path']) for p in metadata['packages']}
          generated = members.get(hakari)
          paths = [str(m.parent) for name, m in members.items() if name != hakari]
          if not paths:
              raise SystemExit(0)
          # The generated package is skipped; only the member-to-unifier edge is accepted.
          result = subprocess.run([*machete, *paths], capture_output=True, text=True)
          failed = False
          crate = None
          for line in result.stdout.splitlines():
              if line.startswith('\t'):
                  if crate != generated and line.strip() != hakari:
                      failed = True
                      print(f'{crate}: unused dependency {line.strip()}')
              elif ' -- ' in line:
                  crate = pathlib.Path(line.rsplit(' -- ', 1)[1].rstrip(':')).resolve()
          if result.returncode not in (0, 1):
              raise SystemExit(result.stderr)
          if failed:
              raise SystemExit(1)
          PYTHON
      - name: Feature unifier
        run: |
          if [ -f .config/hakari.toml ]; then
            PATH="$TOOLS:$PATH" cargo hakari verify
          fi
      - name: Spelling
        run: |
          "$TOOLS/typos" --isolated --config "$CHECK_DEFAULTS/typos.toml" .
      - name: Workflows
        run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#workflows[@]}" -gt 0 ]; then
            python3 - "${workflows[@]}" <<'PYTHON'
          import pathlib
          import re
          import sys
          for filename in sys.argv[1:]:
              for line, text in enumerate(pathlib.Path(filename).read_text(encoding="utf-8").splitlines(), 1):
                  if re.search(r'#\s*zizmor\s*:\s*ignore', text, re.IGNORECASE):
                      raise SystemExit(f'{filename}:{line}: inline zizmor ignores are forbidden; extensions go through the caller declaration')
          PYTHON
            "$TOOLS/zizmor" --offline --config "$CHECK_DEFAULTS/zizmor.yaml" --strict-collection "${workflows[@]}"
            "$TOOLS/actionlint" -config-file "$CHECK_DEFAULTS/actionlint.yaml" -shellcheck= -pyflakes= "${workflows[@]}"
          fi
      - name: Compile cache identity
        id: cache-identity
        if: needs.declaration.outputs.enabled != 'true'
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        id: cache-restore
        if: needs.declaration.outputs.enabled != 'true'
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache-restore.outcome }}
          CACHE_RESTORE_MATCHED: ${{ steps.cache-restore.outputs.cache-hit }}
        if: needs.declaration.outputs.enabled != 'true'
        timeout-minutes: 10
        run: *sccache-install
      - name: Coverage
        timeout-minutes: 45
        if: needs.declaration.outputs.enabled != 'true' && needs.declaration.outputs.coverage == 'true'
        run: |
          unset LLVM_COV LLVM_PROFDATA CARGO_LLVM_COV_FLAGS CARGO_LLVM_PROFDATA_FLAGS
          for name in ${!LLVM_@}; do
            if [[ "$name" == LLVM_*_FLAGS ]]; then unset "$name"; fi
          done
          mkdir -p target/single-coverage
          PATH="$TOOLS:$PATH" "$TOOLS/cargo-llvm-cov" llvm-cov nextest --user-config-file none --ignore-default-filter \
            --retries 2 --flaky-result pass --final-status-level flaky --partition count:1/1 --no-tests pass --workspace --locked \
            --no-default-ignore-filename-regex --ignore-filename-regex "$COVERAGE_IGNORE_FILENAME_REGEX" \
            --lcov --output-path "$PWD/target/single-coverage/shard-1.lcov" 2>&1 | tee nextest.log
          COVERAGE_REPORT_DIR=target/single-coverage COVERAGE_REPORT_COUNT=1 python3 -c "$COVERAGE_MERGE"
      - name: Coverage flaky test summary
        if: always() && needs.declaration.outputs.enabled != 'true' && needs.declaration.outputs.coverage == 'true'
        run: *flaky-test-summary
      - name: Compile cache statistics
        id: cache-statistics
        if: always() && needs.declaration.outputs.enabled != 'true'
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        id: cache-seal
        if: needs.declaration.outputs.enabled != 'true'
        run: *sccache-seal
      - name: Save compile cache
        if: needs.declaration.outputs.enabled != 'true' && steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save

  fuzz:
    name: Fuzz ${{ matrix.name }}
    needs: declaration
    if: ${{ !inputs.warm-cache && inputs.fuzz-scan && needs.declaration.outputs.fuzz_targets != '[]' }}
    runs-on: ${{ fromJSON(needs.declaration.outputs.linux_runner) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.declaration.outputs.fuzz_targets) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-15
      QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
      FUZZ_MANIFEST: ${{ needs.declaration.outputs.fuzz_manifest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Fuzz toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Check tools
        timeout-minutes: 10
        env:
          FUZZ_SCAN: true
        run: *check-tools
      - name: Embedded check defaults
        env:
          CHECK_ADVISORIES: false
        run: *check-defaults
      - name: Fuzz licences
        run: |
          # NCSA is accepted only for libfuzzer-sys, and only in this test-only crate.
          cp "$CHECK_DEFAULTS/deny.toml" "$RUNNER_TEMP/fuzz-deny.toml"
          printf '\n[[licenses.exceptions]]\nname = "libfuzzer-sys"\nallow = ["NCSA"]\n' >> "$RUNNER_TEMP/fuzz-deny.toml"
          "$TOOLS/cargo-deny" --manifest-path "$FUZZ_MANIFEST" --locked --all-features --config "$RUNNER_TEMP/fuzz-deny.toml" check licenses
      - name: Fuzz target
        id: fuzz
        env:
          TARGET: ${{ matrix.name }}
          SECONDS_BUDGET: ${{ matrix.seconds }}
          MAX_LEN: ${{ matrix.max_len }}
          TIMEOUT: ${{ matrix.timeout }}
          RSS_LIMIT_MB: ${{ matrix.rss_limit_mb }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          target = os.environ['TARGET']
          fuzz_dir = pathlib.Path(os.environ['FUZZ_MANIFEST']).parent
          # The minimizer asserts on -max_len, so it reproduces with the time and memory limits only.
          limits = [f"-timeout={os.environ['TIMEOUT']}", f"-rss_limit_mb={os.environ['RSS_LIMIT_MB']}"]
          def fuzz(command, *args):
              result = subprocess.run([os.environ['TOOLS'] + '/cargo-fuzz', 'fuzz', command, '--fuzz-dir', str(fuzz_dir),
                                       '--target', 'x86_64-unknown-linux-gnu', target, *args],
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors='replace')
              print(result.stdout, flush=True)
              return result
          run = fuzz('run', '--', f"-max_total_time={os.environ['SECONDS_BUDGET']}", f"-max_len={os.environ['MAX_LEN']}", *limits)
          artifacts = [path for path in (fuzz_dir / 'artifacts' / target).glob('*')
                       if re.fullmatch(r'(crash|timeout|oom|leak)-[0-9a-f]{40}', path.name)]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'found={str(bool(artifacts)).lower()}\n')
          if not artifacts:
              if run.returncode:
                  raise SystemExit(f'fuzz target {target} exited {run.returncode} without a finding')
              raise SystemExit(0)
          if len(artifacts) != 1:
              raise SystemExit(f'fuzz target {target} left {len(artifacts)} findings')
          raw = artifacts[0]
          tmin = fuzz('tmin', str(raw), '--', *limits)
          reached = re.findall(r'^CRASH_MIN: failed to minimize beyond (.+) \(\d+ bytes\), exiting$', tmin.stdout, re.MULTILINE)
          minimized = pathlib.Path(reached[-1]) if tmin.returncode == 0 and reached else raw
          lines = run.stdout.splitlines()
          panic = next((m for m in map(re.compile(r"^thread '.*' (?:\(\d+\) )?panicked at (.+):$").match, lines) if m), None)
          start = next((i for i, line in enumerate(lines) if re.search(r"panicked at |has overflowed its stack|^==\d+== ?ERROR: |^ALARM: ", line)), 0)
          end = next((i + 1 for i in range(start, len(lines)) if lines[i].startswith('SUMMARY: ')), len(lines))
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fuzz-finding'
          out.mkdir()
          shutil.copyfile(raw, out / raw.name)
          shutil.copyfile(minimized, out / 'minimized')
          (out / 'fuzz.log').write_text(run.stdout, encoding='utf-8')
          (out / 'tmin.log').write_text(tmin.stdout, encoding='utf-8')
          (out / 'finding.json').write_text(json.dumps({
              'target': target, 'kind': raw.name.split('-', 1)[0],
              'location': panic[1].removeprefix(f'{pathlib.Path.cwd()}/') if panic else '',
              'input': base64.b64encode(minimized.read_bytes()).decode(),
              'stack': '\n'.join(lines[start:end])}), encoding='utf-8')
          PYTHON
      - name: Upload fuzz finding
        if: steps.fuzz.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ inputs.concurrency-key || 'root' }}-${{ matrix.name }}
          path: ${{ runner.temp }}/fuzz-finding
          if-no-files-found: error

  advisories:
    name: Advisory scan
    needs: declaration
    if: ${{ inputs.advisory-scan && !inputs.warm-cache }}
    runs-on: ${{ fromJSON(needs.declaration.outputs.linux_runner) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Check tools
        timeout-minutes: 10
        run: *check-tools
      - name: Embedded check defaults
        run: *check-defaults
      - name: Undeclared advisories
        id: scan
        run: |
          set +e
          "$TOOLS/cargo-deny" --format json --workspace --locked --all-features --config "$CHECK_DEFAULTS/deny.toml" check advisories 2> "$RUNNER_TEMP/advisories.jsonl"
          status=$?
          set -e
          STATUS=$status python3 - <<'PYTHON'
          import json
          import os
          findings = {}
          for line in open(os.path.join(os.environ['RUNNER_TEMP'], 'advisories.jsonl'), encoding='utf-8'):
              fields = json.loads(line).get('fields', {}) if line.startswith('{') else {}
              if fields.get('severity') != 'error':
                  continue
              crates = sorted({f"{graph['Krate']['name']} {graph['Krate']['version']}" for graph in fields.get('graphs', [])})
              advisory = fields.get('advisory')
              # Yanked crates carry no advisory; their code and crates identify them.
              key = advisory['id'] if advisory else f"{fields.get('code')} {', '.join(crates)}"
              finding = findings.setdefault(key, {'id': key, 'title': advisory.get('title', '') if advisory else fields.get('message', ''), 'crates': set()})
              finding['crates'].update(crates)
          if os.environ['STATUS'] != '0' and not findings:
              raise SystemExit(f"cargo-deny exited {os.environ['STATUS']} without an advisory finding")
          result = [dict(finding, crates=sorted(finding['crates'])) for finding in sorted(findings.values(), key=lambda finding: finding['id'])]
          for finding in result:
              print(f"{finding['id']}: {', '.join(finding['crates'])}: {finding['title']}")
          print(f'{len(result)} undeclared advisories')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('findings=' + json.dumps(result) + '\n')
          PYTHON

  targets:
    name: Check (${{ matrix.target }})
    needs: declaration
    if: ${{ !inputs.advisory-scan && !inputs.fuzz-scan && (!inputs.warm-cache || github.event_name == 'push') && needs.declaration.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.declaration.outputs.targets) }}
    runs-on: ${{ matrix.runner == 'ubuntu-latest' && fromJSON(needs.declaration.outputs.linux_runner) || matrix.runner }}
    env:
      CACHE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Compile cache identity
        if: &sccache-target-host runner.os != 'Windows'
        id: cache-identity
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        if: *sccache-target-host
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        if: *sccache-target-host
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache-restore.outcome }}
          CACHE_RESTORE_MATCHED: ${{ steps.cache-restore.outputs.cache-hit }}
        timeout-minutes: 10
        run: *sccache-install
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: *mise-bootstrap
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: *caller-tools
      - name: Check target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          rustup component add clippy
          cargo clippy --workspace --all-targets --locked --target "$TARGET" -- -D warnings
      - name: Compile cache statistics
        id: cache-statistics
        if: always() && runner.os != 'Windows'
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        if: *sccache-target-host
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: runner.os != 'Windows' && steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save

  browser:
    name: Wasm and browser build
    needs: declaration
    if: ${{ needs.declaration.outputs.coverage == 'true' && !inputs.advisory-scan && !inputs.fuzz-scan && (!inputs.warm-cache || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (needs.declaration.outputs.wasm_crates != '[]' || needs.declaration.outputs.browser_build == 'true') }}
    runs-on: ${{ fromJSON(needs.declaration.outputs.linux_runner) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Compile cache identity
        id: cache-identity
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache-restore.outcome }}
          CACHE_RESTORE_MATCHED: ${{ steps.cache-restore.outputs.cache-hit }}
        timeout-minutes: 10
        run: *sccache-install
      - name: Browser tool pin
        if: needs.declaration.outputs.browser_build == 'true'
        run: &browser-tool-pin |
          test -f mise.toml
          python3 - <<'PYTHON'
          import tomllib
          with open('mise.toml', 'rb') as source:
              config = tomllib.load(source)
          if 'just' not in config.get('tools', {}):
              raise SystemExit('mise.toml: tools.just must select the caller browser tool')
          PYTHON
      - name: Browser mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true' || needs.declaration.outputs.browser_build == 'true'
        run: *mise-bootstrap
      - name: Browser tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true' || needs.declaration.outputs.browser_build == 'true'
        run: *caller-tools
      - name: Build wasm crates
        env:
          WASM_CRATES: ${{ needs.declaration.outputs.wasm_crates }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          crates = json.loads(os.environ['WASM_CRATES'])
          if crates:
              subprocess.run(['rustup', 'target', 'add', 'wasm32-unknown-unknown'], check=True)
          for crate in crates:
              subprocess.run(['cargo', 'build', '--locked', '--target', 'wasm32-unknown-unknown', '-p', crate], check=True)
          PYTHON
      - name: Browser recipe
        if: needs.declaration.outputs.browser_build == 'true'
        run: |
          mise exec -- just browser-build
      - name: Compile cache statistics
        id: cache-statistics
        if: always()
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save

  browser-tests:
    name: Chromium browser tests
    needs: declaration
    if: ${{ needs.declaration.outputs.coverage == 'true' && !inputs.advisory-scan && !inputs.fuzz-scan && (!inputs.warm-cache || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && needs.declaration.outputs.browser_tests == 'true' }}
    runs-on: ${{ fromJSON(needs.declaration.outputs.linux_runner) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Compile cache identity
        id: cache-identity
        env: *sccache-identity-env
        run: *sccache-identity
      - name: Restore compile cache
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-restore
      - name: Compile cache
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache-restore.outcome }}
          CACHE_RESTORE_MATCHED: ${{ steps.cache-restore.outputs.cache-hit }}
        timeout-minutes: 10
        run: *sccache-install
      - name: Browser test tool pin
        run: *browser-tool-pin
      - name: Browser test mise bootstrap
        run: *mise-bootstrap
      - name: Browser test caller tools
        run: *caller-tools
      - name: Browser runtime tools
        run: |
          tools=$(mktemp -d "$RUNNER_TEMP/browser-runtime.XXXXXX")
          cd "$tools"
          curl --fail --retry 3 --silent --show-error --location https://cdn.playwright.dev/builds/cft/156.0.8078.4/linux64/chrome-linux64.zip -o chromium.zip
          echo '43fd31766c7533a02dda2ded5ad50c2f861cd5400be7509c0abad71129f79d79  chromium.zip' | sha256sum --check --status
          unzip -q chromium.zip
          curl --fail --retry 3 --silent --show-error --location https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz -o bindgen.tar.gz
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  bindgen.tar.gz' | sha256sum --check --status
          tar -xzf bindgen.tar.gz
          curl --fail --retry 3 --silent --show-error --location https://registry.npmjs.org/playwright/-/playwright-1.64.1.tgz -o playwright.tgz
          curl --fail --retry 3 --silent --show-error --location https://registry.npmjs.org/playwright-core/-/playwright-core-1.64.1.tgz -o playwright-core.tgz
          python3 - <<'PYTHON'
          import base64
          import hashlib
          import pathlib
          for name, digest in [
              ('playwright', 'HCrVhHr5QQuwYoswEUGTb7gGp522yflbv/ST8nF4sFWGuLjQCt17Q/EubpGGSNKYn1tsTCPZxqHhHCfVURu7UA=='),
              ('playwright-core', 'BC4s8y6SEVA6Q1rSxZTto8hI1KUI3xXlHGZgvGqP4IqPdI/a6FX9H29IDNz7vKo9l21b6LfYosScPL6M3xxyDQ=='),
          ]:
              if hashlib.sha512(pathlib.Path(name + '.tgz').read_bytes()).digest() != base64.b64decode(digest):
                  raise SystemExit(name + ': archive checksum mismatch')
          PYTHON
          mkdir -p node_modules/playwright node_modules/playwright-core
          tar -xzf playwright.tgz --strip-components=1 -C node_modules/playwright
          tar -xzf playwright-core.tgz --strip-components=1 -C node_modules/playwright-core
          node - <<'JAVASCRIPT'
          const assert = require('node:assert/strict');
          assert(Number(process.versions.node.split('.')[0]) >= 20);
          const driver = require('./node_modules/playwright/package.json');
          const core = require('./node_modules/playwright-core/package.json');
          assert.equal(driver.version, '1.64.1');
          assert.deepEqual(driver.dependencies, {'playwright-core': '1.64.1'});
          assert.equal(core.version, '1.64.1');
          assert.deepEqual(core.dependencies || {}, {});
          assert.deepEqual(core.optionalDependencies || {}, {});
          assert.deepEqual(driver.optionalDependencies || {}, {});
          console.log(process.version);
          JAVASCRIPT
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            node node_modules/playwright/cli.js install-deps chromium
          fi
          node node_modules/playwright/cli.js --version
          "$tools/chrome-linux64/chrome" --version
          "$tools/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen" --version
          echo "$tools/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          echo "PLAYWRIGHT_MODULE=$tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$tools/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Browser test recipe
        run: |
          just browser-test
      - name: Compile cache statistics
        id: cache-statistics
        if: always()
        run: *sccache-stats
      - name: Upload compile cache errors
        if: *sccache-artifact-condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: *sccache-artifact
      - name: Seal compile cache
        id: cache-seal
        run: *sccache-seal
      - name: Save compile cache
        if: steps.cache-identity.outputs.writer == 'true' && steps.cache-seal.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with: *sccache-save
