name: Rust CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
    inputs:
      checkout-repository:
        description: Repository to check out (self-test, proof and advisory scan; defaults to caller)
        type: string
        default: ''
      checkout-ref:
        description: Checkout ref (self-test, proof and advisory scan; defaults to caller)
        type: string
        default: ''
      checkout-base-ref:
        description: PR base ref (self-test proof only; defaults to real PR base)
        type: string
        default: ''
      test-event:
        description: Event mode (self-test, proof and advisory scan; defaults to real event)
        type: string
        default: ''
      working-directory:
        description: Directory to check (self-test, proof and advisory scan)
        type: string
        default: .
      concurrency-key:
        description: Stable key distinguishing multiple calls in one workflow
        type: string
        default: ''
      advisory-scan:
        description: Run only the advisory scan of the checked-out caller (scheduled advisory workflow)
        type: boolean
        default: false
    outputs:
      advisories:
        description: Undeclared advisories from the advisory scan, as a JSON list
        value: ${{ jobs.advisories.outputs.findings }}

concurrency:
  group: rust-ci-${{ github.ref }}${{ inputs.concurrency-key && format('-{0}', inputs.concurrency-key) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  declaration:
    name: Caller declaration
    if: ${{ github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      packages: ${{ steps.selection.outputs.packages }}
      check_advisories: ${{ steps.selection.outputs.check_advisories }}
      coverage: ${{ steps.selection.outputs.coverage }}
      wasm_crates: ${{ steps.config.outputs.wasm_crates }}
      targets: ${{ steps.config.outputs.targets }}
      browser_build: ${{ steps.config.outputs.browser_build }}
      test_tools: ${{ steps.config.outputs.test_tools }}
      reserved_ports: ${{ steps.config.outputs.reserved_ports }}
      additional_locked_manifests: ${{ steps.config.outputs.additional_locked_manifests }}
      quality_config: ${{ steps.config.outputs.quality_config }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
      - name: Toolchain
        run: rustup show
      - name: Read caller declaration
        id: config
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import re
          import tomllib
          import subprocess
          path = pathlib.Path('.github/ci.toml')
          try:
              with path.open('rb') as source:
                  config = tomllib.load(source)
          except FileNotFoundError:
              if path.is_symlink():
                  raise SystemExit(f'{path}: unreadable declaration')
              config = None
          except (OSError, tomllib.TOMLDecodeError) as error:
              raise SystemExit(f'{path}: {error}') from error
          values = dict(additional_locked_manifests='[]', quality_config='{}', enabled='false', wasm_crates='[]', targets='[]', browser_build='false', test_tools='false', reserved_ports='')
          if config is not None:
              if 'test_shards' in config:
                  raise SystemExit(f'{path}: test_shards was removed; nextest partitions tests automatically')
              unknown = set(config) - {'wasm_crates', 'check_targets', 'browser_build', 'test_tools', 'reserved_ports', 'additional_locked_manifests', 'coverage_min_lines', 'spelling_words', 'license_exceptions', 'advisory_exceptions', 'yanked_crate_exceptions', 'git_sources', 'privileged_trigger_workflows'}
              if unknown:
                  raise SystemExit(f'{path}: unknown keys {sorted(unknown)!r}')
              for key in ('wasm_crates', 'check_targets'):
                  if key not in config or not isinstance(config[key], list) or any(type(item) is not str for item in config[key]):
                      raise SystemExit(f'{path}: {key} must be an array of strings')
              for key in ('browser_build', 'test_tools'):
                  if type(config.get(key, False)) is not bool:
                      raise SystemExit(f'{path}: {key} must be a boolean')
              ports = config.get('reserved_ports', [])
              if not isinstance(ports, list) or any(type(port) is not int or not 1 <= port <= 65535 for port in ports):
                  raise SystemExit(f'{path}: reserved_ports must be an array of integers from 1 to 65535')
              if len(set(ports)) != len(ports):
                  raise SystemExit(f'{path}: reserved_ports entries must be unique')
              values['reserved_ports'] = ','.join(map(str, ports))
              values['additional_locked_manifests'] = json.dumps(config.get('additional_locked_manifests', []))
              threshold = config.get('coverage_min_lines', 80)
              if type(threshold) not in (int, float) or not 80 <= threshold <= 100:
                  raise SystemExit(f'{path}: coverage_min_lines must be a number from 80 to 100')
              for key in ('spelling_words', 'git_sources', 'privileged_trigger_workflows', 'additional_locked_manifests'):
                  if not isinstance(config.get(key, []), list) or any(type(item) is not str or not item for item in config.get(key, [])):
                      raise SystemExit(f'{path}: {key} must be an array of nonempty strings')
              def validate_toml_string(key, value):
                  if any(ord(char) < 32 or 127 <= ord(char) <= 159 or 0xD800 <= ord(char) <= 0xDFFF for char in value):
                      raise SystemExit(f'{path}: {key} cannot contain control characters or surrogates')
              for key in ('spelling_words', 'git_sources', 'privileged_trigger_workflows', 'additional_locked_manifests'):
                  for value in config.get(key, []):
                      validate_toml_string(key, value)
              for value in config.get('additional_locked_manifests', []):
                  manifest = pathlib.Path(value)
                  try:
                      valid = (not manifest.is_absolute() and manifest.name == 'Cargo.toml'
                               and manifest.resolve().is_relative_to(pathlib.Path.cwd().resolve())
                               and manifest.is_file())
                  except (OSError, RuntimeError):
                      valid = False
                  if not valid:
                      raise SystemExit(f'{path}: additional_locked_manifests requires existing repository-contained relative Cargo.toml files')
              privileged = config.get('privileged_trigger_workflows', [])
              if len(set(privileged)) != len(privileged):
                  raise SystemExit(f'{path}: privileged_trigger_workflows entries must be unique')
              for value in privileged:
                  if '..' in value or not re.fullmatch(r'\.github/workflows/[^/\\:*?\[\]]+\.ya?ml', value) or not pathlib.Path(value).is_file():
                      raise SystemExit(f'{path}: privileged_trigger_workflows requires exact existing .github/workflows/<name>.yml or .yaml files')
              from urllib.parse import urlsplit
              for url in config.get('git_sources', []):
                  parsed = urlsplit(url)
                  if parsed.scheme != 'https' or not parsed.netloc or parsed.query or parsed.fragment or parsed.username or parsed.password:
                      raise SystemExit(f'{path}: git_sources must contain exact HTTPS repository URLs')
              exceptions = config.get('license_exceptions', [])
              if not isinstance(exceptions, list):
                  raise SystemExit(f'{path}: license_exceptions must be an array')
              for entry in exceptions:
                  if not isinstance(entry, dict) or set(entry) != {'package', 'version', 'licenses'}:
                      raise SystemExit(f'{path}: license_exceptions requires package, version and licenses')
                  if any(type(entry[key]) is not str or not entry[key] for key in ('package', 'version')):
                      raise SystemExit(f'{path}: license_exceptions requires an exact package version')
                  if not isinstance(entry['licenses'], list) or not entry['licenses'] or any(type(item) is not str or not item for item in entry['licenses']):
                      raise SystemExit(f'{path}: license_exceptions licenses must be nonempty strings')
                  for key in ('package', 'version'):
                      validate_toml_string('license_exceptions.' + key, entry[key])
                  for value in entry['licenses']:
                      validate_toml_string('license_exceptions.licenses', value)
                  if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', entry['version']):
                      raise SystemExit(f'{path}: license_exceptions requires an exact package version')
              exact_version = (r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)'
                               r'(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
                               r'(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?'
                               r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?')
              exceptions = config.get('advisory_exceptions', [])
              if not isinstance(exceptions, list):
                  raise SystemExit(f'{path}: advisory_exceptions must be an array')
              for entry in exceptions:
                  if not isinstance(entry, dict) or set(entry) != {'id', 'package', 'version', 'reason'}:
                      raise SystemExit(f'{path}: advisory_exceptions requires id, package, version and reason')
                  if any(type(value) is not str or not value for value in entry.values()):
                      raise SystemExit(f'{path}: advisory_exceptions values must be nonempty strings')
                  for key, value in entry.items():
                      validate_toml_string('advisory_exceptions.' + key, value)
                  if not re.fullmatch(r'RUSTSEC-[0-9]{4}-[0-9]{4}', entry['id']):
                      raise SystemExit(f'{path}: advisory_exceptions id must match RUSTSEC-YYYY-NNNN')
                  if not re.fullmatch(exact_version, entry['version']):
                      raise SystemExit(f'{path}: advisory_exceptions requires an exact package version')
              exceptions = config.get('yanked_crate_exceptions', [])
              if not isinstance(exceptions, list):
                  raise SystemExit(f'{path}: yanked_crate_exceptions must be an array')
              for entry in exceptions:
                  if not isinstance(entry, dict) or set(entry) != {'package', 'version'}:
                      raise SystemExit(f'{path}: yanked_crate_exceptions requires exactly package and version')
                  if any(type(value) is not str for value in entry.values()):
                      raise SystemExit(f'{path}: yanked_crate_exceptions values must be strings')
                  if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_-]*', entry['package']) or not re.fullmatch(exact_version, entry['version']):
                      raise SystemExit(f'{path}: yanked_crate_exceptions requires an exact crate name and semantic version')
              values['quality_config'] = json.dumps({key: config[key] for key in ('coverage_min_lines', 'spelling_words', 'license_exceptions', 'advisory_exceptions', 'yanked_crate_exceptions', 'git_sources', 'privileged_trigger_workflows') if key in config})
              try:
                  metadata = json.loads(subprocess.check_output(
                      ['cargo', 'metadata', '--no-deps', '--format-version', '1', '--locked'], text=True))
                  packages = {package['name'] for package in metadata['packages']}
                  supported = set(subprocess.check_output(['rustc', '--print', 'target-list'], text=True).splitlines())
              except (subprocess.CalledProcessError, OSError, ValueError) as error:
                  raise SystemExit(f'{path}: caller metadata/toolchain failed') from error
              runners = {
                  'aarch64-unknown-linux-gnu': 'ubuntu-24.04-arm',
                  'aarch64-apple-darwin': 'macos-latest',
                  'x86_64-apple-darwin': 'macos-latest',
                  'x86_64-pc-windows-msvc': 'windows-latest',
              }
              for crate in config['wasm_crates']:
                  if crate not in packages:
                      raise SystemExit(f'{path}: wasm_crates contains unknown package {crate!r}')
              targets = []
              for target in config['check_targets']:
                  if target not in supported:
                      raise SystemExit(f'{path}: check_targets contains unknown target {target!r}')
                  if target not in runners:
                      raise SystemExit(f'{path}: check_targets has no runner for {target!r}')
                  targets.append(dict(target=target, runner=runners[target]))
              values.update(targets=json.dumps(targets))
              values.update(enabled='true', wasm_crates=json.dumps(config['wasm_crates']),
                            browser_build=str(config.get('browser_build', False)).lower(),
                            test_tools=str(config.get('test_tools', False)).lower())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PYTHON
      - name: Select test packages
        id: selection
        env:
          TEST_EVENT: ${{ github.repository_id == '1404598722' && inputs.test-event || github.event_name }}
          BASE_REF: ${{ github.repository_id == '1404598722' && inputs.checkout-base-ref || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import tomllib
          def metadata(directory):
              return json.loads(subprocess.check_output(
                  ['cargo', 'metadata', '--format-version', '1', '--locked'], cwd=directory, text=True))
          head = metadata('.')
          packages = {p['id']: p for p in head['packages']}
          members = set(head['workspace_members'])
          roots = {p: pathlib.Path(packages[p]['manifest_path']).parent.relative_to(pathlib.Path.cwd()) for p in members}
          selected = set(members)
          event = os.environ['TEST_EVENT']
          base = os.environ.get('BASE_REF')
          if event == 'pull_request' and base:
              changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, 'HEAD'], text=True).split('\0')[:-1]
              selected = set()
              for filename in changed:
                  path = pathlib.Path(filename)
                  if filename in ('Cargo.toml', 'rust-toolchain', 'rust-toolchain.toml', '.github/ci.schema.json') or filename.startswith('.github/workflows/'):
                      selected = set(members)
                      break
                  if filename in ('Cargo.lock', '.github/ci.toml'):
                      continue
                  owners = {p for p, root in roots.items() if path.is_relative_to(root)}
                  selected.update(owners)
                  if not owners and path.suffix not in ('.md',) and not filename.startswith('docs/'):
                      selected = set(members)
                      break
              if '.github/ci.toml' in changed:
                  try:
                      before = tomllib.loads(subprocess.check_output(['git', 'show', f'{base}:.github/ci.toml'], text=True))
                  except subprocess.CalledProcessError:
                      before = {}
                  path = pathlib.Path('.github/ci.toml')
                  after = tomllib.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
                  if any(before.get(key) != after.get(key) for key in ('test_tools', 'reserved_ports', 'coverage_min_lines', 'additional_locked_manifests')) or bool(before) != bool(after):
                      selected = set(members)
              if 'Cargo.lock' in changed and selected != members:
                  # Resolve both revisions, comparing transitive dependency identities and features.
                  with tempfile.TemporaryDirectory() as temporary:
                      base_dir = str(pathlib.Path(temporary) / 'base')
                      subprocess.run(['git', 'worktree', 'add', '--detach', base_dir, base], check=True)
                      try:
                          caller = pathlib.Path.cwd().relative_to(pathlib.Path(subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()))
                          before = metadata(pathlib.Path(base_dir) / caller)
                      finally:
                          subprocess.run(['git', 'worktree', 'remove', '--force', base_dir], check=True)
                  def dependencies(data):
                      pkgs = {p['id']: p for p in data['packages']}
                      nodes = {n['id']: n for n in data['resolve']['nodes']}
                      result = {}
                      for member in data['workspace_members']:
                          seen, pending = set(), [member]
                          while pending:
                              node = pending.pop()
                              if node not in seen:
                                  seen.add(node)
                                  pending.extend(nodes[node]['dependencies'])
                          result[pkgs[member]['name']] = {(pkgs[n]['name'], pkgs[n]['version'], pkgs[n]['source'], tuple(sorted(nodes[n]['features']))) for n in seen}
                      return result
                  old, new = dependencies(before), dependencies(head)
                  selected.update(p for p in members if old.get(packages[p]['name']) != new[packages[p]['name']])
              while True:
                  reverse = {n['id'] for n in head['resolve']['nodes'] if n['id'] in members and set(n['dependencies']) & selected}
                  if reverse <= selected:
                      break
                  selected.update(reverse)
          names = sorted(packages[p]['name'] for p in selected)
          print(f'Selected test packages ({event}): {names}')
          # A change can introduce an advisory only through the lockfile or the declared exceptions.
          check_advisories = event not in ('pull_request', 'merge_group') or not base or subprocess.run(
              ['git', 'diff', '--quiet', base, 'HEAD', '--', 'Cargo.lock', '.github/ci.toml']).returncode != 0
          print(f'Advisory check ({event}): {"required" if check_advisories else "skipped, Cargo.lock and .github/ci.toml unchanged"}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('packages=' + json.dumps(names) + '\n')
              output.write('coverage=' + str(event != 'pull_request').lower() + '\n')
              output.write('check_advisories=' + str(check_advisories).lower() + '\n')
          PYTHON

  quality:
    needs: declaration
    name: Format and lint
    # This workflow repository has fixtures, not a root Rust package.
    if: ${{ !inputs.advisory-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
      - name: Compile cache credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: Compile cache
        timeout-minutes: 10
        run: &sccache-install |
          version=0.18.0
          # Digests: GitHub release asset digests of the musl tarballs.
          case "$(uname -m)" in
            x86_64) arch=x86_64 digest=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 ;;
            aarch64) arch=aarch64 digest=2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a ;;
          esac
          name=sccache-v$version-$arch-unknown-linux-musl
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-sccache.XXXXXX")
          archive=$(mktemp)
          curl --fail --location "https://github.com/mozilla/sccache/releases/download/v$version/$name.tar.gz" --output "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$bin" --strip-components=1 "$name/sccache"
          rm "$archive"
          test -x "$bin/sccache"
          echo "$bin" >> "$GITHUB_PATH"
          { echo RUSTC_WRAPPER=sccache; echo SCCACHE_GHA_ENABLED=true; echo SCCACHE_GHA_VERSION=2; echo CARGO_INCREMENTAL=0; } >> "$GITHUB_ENV"
          PATH="$bin:$PATH" SCCACHE_GHA_ENABLED=true SCCACHE_GHA_VERSION=2 sccache --start-server
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: &mise-bootstrap |
          # https://github.com/jdx/mise/releases/download/v2026.10.2/SHASUMS256.txt
          version=2026.10.2
          executable=mise
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) platform=linux-x64 digest=8f5f6660336f572830e33cd9b378d3131e529a0d4c4f0c553776be90a1ba302a ;;
            Linux:aarch64) platform=linux-arm64 digest=8d230a5a23ac559ea24ec65280867f437000b37473d967a9bb954837592490a8 ;;
            Darwin:arm64) platform=macos-arm64 digest=66d49acecca413c8b334922584982a4907a10588912829873d6c55d0c6d42612 ;;
            Darwin:x86_64) platform=macos-x64 digest=1c6b3d4aaeba8d3b8b57e2d06e4b7825a5134b7aa6e97313bd99db6f22bac21f ;;
            MINGW*:x86_64) platform=windows-x64.exe executable=mise.exe digest=15901d0b8e0cfe76c1c3b7de4194f929244f331ca3fdf183c2e3aa17ba31634c ;;
            *) echo 'Unsupported mise runner host' >&2; exit 1 ;;
          esac
          url=https://github.com/jdx/mise/releases/download/v$version/mise-v$version-$platform
          installed=$(mise --version 2>/dev/null | cut -d ' ' -f 1) || installed=
          if [ "$installed" != "$version" ]; then
            bin=$(mktemp -d "$RUNNER_TEMP/maestro-mise.XXXXXX")
            curl --fail --location "$url" --output "$bin/$executable"
            python3 - "$digest" "$bin/$executable" <<'PYTHON'
          import hashlib
          import sys
          with open(sys.argv[2], 'rb') as source:
              raise SystemExit(hashlib.file_digest(source, 'sha256').hexdigest() != sys.argv[1])
          PYTHON
            chmod +x "$bin/$executable"
            "$bin/$executable" --version | grep "^$version "
            export PATH="$bin:$PATH"
            if [ "$executable" = mise.exe ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          fi
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: &caller-tools |
          if [ ! -f mise.toml ]; then
            echo 'mise.toml: caller tools require a pinned tool configuration' >&2
            exit 1
          fi
          mise install
          mise bin-paths | while IFS= read -r bin; do
            if [ "${OS:-}" = Windows_NT ]; then bin=$(cygpath -w "$bin"); fi
            echo "$bin" >> "$GITHUB_PATH"
          done
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Compile cache statistics
        if: always()
        run: &sccache-stats |
          test "$RUSTC_WRAPPER" = sccache
          test "$CARGO_INCREMENTAL" = 0
          sccache --show-stats

  docs:
    needs: declaration
    name: Docs
    # This workflow repository has fixtures, not a root Rust package.
    if: ${{ !inputs.advisory-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Compile cache credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: Compile cache
        timeout-minutes: 10
        run: *sccache-install
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: *mise-bootstrap
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: *caller-tools
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --workspace --no-deps --locked
      - name: Compile cache statistics
        if: always()
        run: *sccache-stats

  tests:
    needs: declaration
    name: ${{ matrix.shard == 'doctests' && 'Doctests' || format('Test shard ({0}/4)', matrix.shard) }}
    if: ${{ !inputs.advisory-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.declaration.outputs.coverage == 'true' && '[1,2,3,4,"doctests"]' || '[1,2,3,4]') }}
    runs-on: ubuntu-latest
    env:
      ADDITIONAL_LOCKED_MANIFESTS: ${{ needs.declaration.outputs.additional_locked_manifests }}
      SHARD: ${{ matrix.shard }}
      TEST_PACKAGES: ${{ needs.declaration.outputs.packages }}
      COLLECT_COVERAGE: ${{ needs.declaration.outputs.coverage }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Free instrumented build space
        if: needs.declaration.outputs.enabled == 'true'
        run: &free-build-space |
          # The deletion overlaps the toolchain, tools and compilation; the build needs the space minutes later.
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc >/dev/null 2>&1 &
      - name: Test toolchain
        run: |
          rustup show
          toolchain=$(rustup show active-toolchain)
          echo "RUSTUP_TOOLCHAIN=${toolchain%% *}" >> "$GITHUB_ENV"
          rustup component add llvm-tools-preview
      - name: Compile cache credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: Compile cache
        timeout-minutes: 10
        run: *sccache-install
      - name: Coverage tools
        timeout-minutes: 10
        run: |
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-coverage-tools.XXXXXX")
          while read -r url digest binary; do
            archive=$(mktemp)
            curl --fail --location "$url" --output "$archive"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status
            tar -xzf "$archive" -C "$bin" "$binary"
            test -x "$bin/$binary"
            rm "$archive"
          done <<'TOOLS'
          https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz 3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522 cargo-llvm-cov
          https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-musl.tar.gz bf92cb81450872d960ffa13857a83084d557ec0cdc141663d263bb23ef756f97 cargo-nextest
          TOOLS
          echo "TOOLS=$bin" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Fetch additional locked manifests
        if: needs.declaration.outputs.additional_locked_manifests != '[]'
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import sys
          for manifest in json.loads(os.environ['ADDITIONAL_LOCKED_MANIFESTS']):
              print(f'Fetching locked dependencies: {manifest}', file=sys.stderr, flush=True)
              result = subprocess.run(['cargo', 'fetch', '--locked', '--manifest-path', manifest])
              if result.returncode:
                  sys.exit(result.returncode)
          PYTHON
      - name: Tests
        timeout-minutes: 45
        if: needs.declaration.outputs.enabled != 'true'
        run: |
          cargo fetch --locked
          mapfile -d '' -t packages < <(python3 -c 'import json, os; print("".join("-p\0" + name + "\0" for name in json.loads(os.environ.get("TEST_PACKAGES", "[]"))), end="")')
          if [ -z "${TEST_PACKAGES:-}" ]; then packages=(--workspace); fi
          if [ "${TEST_PACKAGES:-}" = '[]' ]; then exit 0; fi
          if [ "${SHARD:-}" != doctests ]; then
            "$TOOLS/cargo-nextest" nextest run --user-config-file none --ignore-default-filter --locked "${packages[@]}" --retries 2 --flaky-result pass --final-status-level flaky --partition "count:$SHARD/4" --no-tests pass 2>&1 | tee nextest.log
          fi
          if [[ "$SHARD" == doctests || ( "$SHARD" == 1 && "${COLLECT_COVERAGE:-false}" != true ) ]]; then
            cargo test --locked --doc "${packages[@]}"
          fi
      - name: Search tools
        timeout-minutes: 10
        if: needs.declaration.outputs.enabled == 'true'
        run: |
          # Digests: ripgrep's release .sha256 file and fd's GitHub release asset digest.
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-search-bin.XXXXXX")
          while read -r url digest binary; do
            archive=$(mktemp)
            curl --fail --location "$url" --output "$archive"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status
            unpack=$(mktemp -d)
            tar -xzf "$archive" -C "$unpack"
            find "$unpack" -type f -name "$binary" -exec cp '{}' "$bin/$binary" \;
            test -x "$bin/$binary"
            rm -rf "$archive" "$unpack"
          done <<'TOOLS'
          https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c rg
          https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz 761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7 fd
          TOOLS
          "$bin/rg" --version
          "$bin/fd" --version
          echo "$bin" >> "$GITHUB_PATH"
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: *mise-bootstrap
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: *caller-tools
      - name: Reserved ports
        if: needs.declaration.outputs.reserved_ports != ''
        env:
          RESERVED_PORTS: ${{ needs.declaration.outputs.reserved_ports }}
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports="$RESERVED_PORTS"
      - name: Isolated tests
        timeout-minutes: 45
        if: needs.declaration.outputs.enabled == 'true'
        env:
          CARGO_COVERAGE_MIN_LINES: ''
        run: |
          python3 - <<'PYTHON'
          import os
          names = '''ANTHROPIC_API_KEY ANTHROPIC_OAUTH_TOKEN OPENAI_API_KEY GEMINI_API_KEY
          GROQ_API_KEY CEREBRAS_API_KEY XAI_API_KEY OPENROUTER_API_KEY ZAI_API_KEY
          MISTRAL_API_KEY MINIMAX_API_KEY MINIMAX_CN_API_KEY KIMI_API_KEY HF_TOKEN
          AI_GATEWAY_API_KEY OPENCODE_API_KEY COPILOT_GITHUB_TOKEN GH_TOKEN GITHUB_TOKEN
          GOOGLE_APPLICATION_CREDENTIALS GOOGLE_CLOUD_PROJECT GCLOUD_PROJECT
          GOOGLE_CLOUD_LOCATION AWS_PROFILE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION AWS_BEARER_TOKEN_BEDROCK
          AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI
          AWS_WEB_IDENTITY_TOKEN_FILE BEDROCK_EXTENSIVE_MODEL_TEST FIREWORKS_API_KEY'''.split()
          found = sorted(name for name in os.environ if name in names or name.endswith('_API_KEY'))
          if found:
              raise SystemExit('Credential variables present: ' + ', '.join(found))
          PYTHON
          cargo_home=$(cd "${CARGO_HOME:-$HOME/.cargo}" && pwd)
          rustup_home=$(cd "${RUSTUP_HOME:-$HOME/.rustup}" && pwd)
          diagnostics="$PWD/target/browser-author-diagnostics"
          mkdir -p "$diagnostics"
          isolation=$(mktemp -d "$RUNNER_TEMP/maestro-tests.XXXXXX")
          trap 'rm -rf "$isolation"' EXIT
          mkdir "$isolation"/{home,tmp,config,data,cache,state,runtime,config-dirs,data-dirs}
          run_isolated() {
          env -i PATH="${TOOLS:+$TOOLS:}$PATH" CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
            HOME="$isolation/home" TMPDIR="$isolation/tmp" TMP="$isolation/tmp" TEMP="$isolation/tmp" \
            XDG_CONFIG_HOME="$isolation/config" XDG_DATA_HOME="$isolation/data" \
            XDG_CACHE_HOME="$isolation/cache" XDG_STATE_HOME="$isolation/state" \
            XDG_RUNTIME_DIR="$isolation/runtime" XDG_CONFIG_DIRS="$isolation/config-dirs" \
            XDG_DATA_DIRS="$isolation/data-dirs" MAESTRO_NO_LOCAL_LLM=1 MAESTRO_TEST_DIAGNOSTICS_DIR="$diagnostics" \
            RUSTC_WRAPPER="${RUSTC_WRAPPER-}" CARGO_INCREMENTAL="${CARGO_INCREMENTAL-}" \
            "$@"
          }
          cargo fetch --locked
          mapfile -d '' -t packages < <(python3 -c 'import json, os; print("".join("-p\0" + name + "\0" for name in json.loads(os.environ.get("TEST_PACKAGES", "[]"))), end="")')
          if [ -z "${TEST_PACKAGES:-}" ]; then packages=(--workspace); fi
          if [ "${TEST_PACKAGES:-}" = '[]' ]; then exit 0; fi
          if [ "${SHARD:-}" != doctests ]; then
            if [ -n "${CARGO_COVERAGE_MIN_LINES:-}" ]; then
              run_isolated "$TOOLS/cargo-llvm-cov" llvm-cov --workspace --locked --fail-under-lines "$CARGO_COVERAGE_MIN_LINES"
            elif [ "${COLLECT_COVERAGE:-true}" = true ] && [ -n "${SHARD:-}" ]; then
              run_isolated "$TOOLS/cargo-llvm-cov" llvm-cov nextest --user-config-file none --ignore-default-filter \
                --retries 2 --flaky-result pass --final-status-level flaky --partition "count:$SHARD/4" --no-tests pass --workspace --locked --lcov --output-path "$PWD/shard-$SHARD.lcov" 2>&1 | tee nextest.log
            else
              partition=()
              if [ -n "${SHARD:-}" ]; then partition=(--partition "count:$SHARD/4"); fi
              run_isolated "$TOOLS/cargo-nextest" nextest run --user-config-file none --ignore-default-filter \
                --locked "${packages[@]}" --retries 2 --flaky-result pass --final-status-level flaky --no-tests pass "${partition[@]}" 2>&1 | tee nextest.log
            fi
          fi
          if [[ -z "${CARGO_COVERAGE_MIN_LINES:-}" && ( "${SHARD:-}" == doctests || ( "${SHARD:-1}" == 1 && "${COLLECT_COVERAGE:-false}" != true ) ) ]]; then
            run_isolated cargo test --locked --doc "${packages[@]}"
          fi
      - name: Print test diagnostics
        id: diagnostics
        if: always() && needs.declaration.outputs.enabled == 'true'
        env:
          CALLER_REPOSITORY: ${{ inputs.checkout-repository || github.repository }}
          CALLER_DIRECTORY: ${{ inputs.working-directory || '.' }}
          CALL_KEY: ${{ inputs.concurrency-key }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import pathlib
          import secrets
          import sys
          identity = [os.environ['CALLER_REPOSITORY'], os.environ['CALLER_DIRECTORY'], os.environ['CALL_KEY']]
          digest = hashlib.sha256(json.dumps(identity, ensure_ascii=False, separators=(',', ':')).encode('utf-8')).hexdigest()
          name = f"test-diagnostics-{os.environ['GITHUB_REPOSITORY_ID']}-{digest}-shard-{os.environ['SHARD']}-run-{os.environ['GITHUB_RUN_ID']}-attempt-{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'artifact_name={name}\n')
          token = secrets.token_hex(32)
          print(f'::stop-commands::{token}', flush=True)
          try:
              for path in pathlib.Path('target/browser-author-diagnostics').rglob('*'):
                  if path.is_file() and not path.is_symlink():
                      sys.stdout.buffer.write(path.read_bytes())
          finally:
              print(f'\n::{token}::', flush=True)
          PYTHON
      - name: Upload test diagnostics
        if: always() && needs.declaration.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.diagnostics.outputs.artifact_name }}
          path: |
            ${{ inputs.working-directory || '.' }}/target/browser-author-diagnostics
            ${{ inputs.working-directory || '.' }}/nextest.log
          if-no-files-found: ignore
      - name: Flaky test summary
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import re
          path = pathlib.Path('nextest.log')
          text = path.read_text(encoding='utf-8') if path.exists() else ''
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          flaky = sorted(set(re.findall(r'^\s*FLAKY(?:\s+\d+/\d+)?\s+\[[^]]*\]\s*(.+)$', text, re.MULTILINE)))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('### Flaky tests (passed on retry)\n' + ('\n'.join('- ' + name for name in flaky) if flaky else 'None') + '\n')
          PYTHON
      - name: Compile cache statistics
        if: always()
        run: *sccache-stats
      - name: Upload shard coverage
        if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true' && matrix.shard != 'doctests'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ inputs.concurrency-key || 'root' }}-${{ matrix.shard }}
          path: ${{ inputs.working-directory || '.' }}/shard-${{ matrix.shard }}.lcov
          if-no-files-found: error

  tests-result:
    name: Tests (ubuntu-latest)
    needs: [tests, declaration]
    if: ${{ always() && !inputs.advisory-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ubuntu-latest
    steps:
      - name: All test shards passed
        env:
          RESULT: ${{ needs.tests.result }}
        shell: python
        run: |
          import os
          assert os.environ['RESULT'] == 'success'
      - name: Download shard coverage
        if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-${{ inputs.concurrency-key || 'root' }}-*
          path: coverage
          merge-multiple: true
      - name: Merge coverage
        if: needs.declaration.outputs.enabled == 'true' && needs.declaration.outputs.coverage == 'true'
        env:
          QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          lines = {}
          reports = pathlib.Path('coverage')
          expected = {f'shard-{shard}.lcov' for shard in range(1, 5)}
          if {path.name for path in reports.glob('*.lcov')} != expected:
              raise SystemExit('Missing or unexpected shard coverage reports')
          for name in sorted(expected):
              source = None
              for record in (reports / name).read_text(encoding='utf-8').splitlines():
                  if record.startswith('SF:'):
                      source = record[3:]
                  elif record.startswith('DA:'):
                      if source is None:
                          raise SystemExit(f'{name}: line without source file')
                      line, hits, *_ = record[3:].split(',')
                      key = (source, int(line))
                      lines[key] = lines.get(key, False) or int(hits) > 0
                  elif record == 'end_of_record':
                      source = None
          if not lines:
              raise SystemExit('No instrumented lines in shard coverage')
          covered = sum(lines.values())
          percentage = covered * 100 / len(lines)
          threshold = json.loads(os.environ.get('QUALITY_CONFIG') or '{}').get('coverage_min_lines', 80)
          print(f'Merged line coverage: {percentage:.2f}% ({covered}/{len(lines)}), minimum {threshold}%')
          if percentage < threshold:
              raise SystemExit('Merged line coverage is below threshold')
          PYTHON

  checks:
    name: Dependency, source and coverage checks
    needs: declaration
    if: ${{ !inputs.advisory-scan && (github.repository_id != '1404598722' || (inputs.working-directory != '' && inputs.working-directory != '.')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
      CHECK_ADVISORIES: ${{ needs.declaration.outputs.check_advisories }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Free instrumented build space
        if: needs.declaration.outputs.enabled != 'true'
        run: *free-build-space
      - name: Toolchain
        run: |
          rustup show
          rustup component add llvm-tools-preview
      - name: Check tools
        timeout-minutes: 10
        run: &check-tools |
          bin=$(mktemp -d "$RUNNER_TEMP/maestro-check-tools.XXXXXX")
          while read -r url digest binary; do
            archive=$(mktemp)
            curl --fail --location "$url" --output "$archive"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status
            unpack=$(mktemp -d)
            tar -xzf "$archive" -C "$unpack"
            find "$unpack" -type f -name "$binary" -exec cp '{}' "$bin/$binary" \;
            test -x "$bin/$binary"
            rm -rf "$archive" "$unpack"
          done <<'TOOLS'
          https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f cargo-deny
          https://github.com/guppy-rs/guppy/releases/download/cargo-hakari-0.9.39/cargo-hakari-0.9.39-x86_64-unknown-linux-musl.tar.gz 6437e3dede815ff68b7671c15ad65240a7c80118e5a6a07d68ff85d29e78d017 cargo-hakari
          https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz 48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9 cargo-machete
          https://github.com/crate-ci/typos/releases/download/v1.51.1/typos-v1.51.1-x86_64-unknown-linux-musl.tar.gz 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454 typos
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks
          https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a zizmor
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 actionlint
          https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz 3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522 cargo-llvm-cov
          TOOLS
          echo "TOOLS=$bin" >> "$GITHUB_ENV"
      - name: Embedded check defaults
        run: &check-defaults |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess
          import tomllib
          config = json.loads(os.environ.get('QUALITY_CONFIG') or '{}')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'maestro-checks'
          directory.mkdir(exist_ok=True)
          def toml_value(value):
              return json.dumps(value, ensure_ascii=False)
          allow = ['MIT', 'Apache-2.0', 'ISC', 'BSD-2-Clause', 'BSD-3-Clause', 'Zlib',
                   'Apache-2.0 WITH LLVM-exception', 'Unicode-DFS-2016', 'Unicode-3.0',
                   'CC0-1.0', 'CDLA-Permissive-2.0', 'MPL-2.0', 'MIT-0']
          deny = '[advisories]\nyanked = "deny"\n'
          if config.get('advisory_exceptions') or config.get('yanked_crate_exceptions'):
              with pathlib.Path('Cargo.lock').open('rb') as source:
                  packages = {(entry['name'], entry['version']) for entry in tomllib.load(source)['package']}
              for entry in config.get('yanked_crate_exceptions', []):
                  if (entry['package'], entry['version']) not in packages:
                      raise SystemExit(f"Cargo.lock: stale yanked-crate exception for {entry['package']} {entry['version']}")
          if config.get('advisory_exceptions'):
              for entry in config['advisory_exceptions']:
                  if (entry['package'], entry['version']) not in packages:
                      raise SystemExit(f"Cargo.lock: stale advisory exception {entry['id']} for {entry['package']} {entry['version']}")
          if config.get('advisory_exceptions') and os.environ.get('CHECK_ADVISORIES') != 'false':
              declared = {(entry['id'], entry['package'], entry['version']) for entry in config['advisory_exceptions']}
              probe = directory / 'probe-deny.toml'
              probe.write_text('[advisories]\nyanked = "deny"\n', encoding="utf-8")
              found = subprocess.run([os.environ['TOOLS'] + '/cargo-deny', '--format', 'json', '--workspace', '--locked', '--all-features',
                                      '--config', str(probe), 'check', 'advisories'], capture_output=True, text=True)
              reported = {}
              for line in found.stderr.splitlines():
                  fields = json.loads(line).get('fields', {}) if line.startswith('{') else {}
                  if 'advisory' in fields:
                      reported.setdefault(fields['advisory']['id'], set()).update(
                          (graph['Krate']['name'], graph['Krate']['version']) for graph in fields['graphs'])
              for entry in config['advisory_exceptions']:
                  if (entry['package'], entry['version']) not in reported.get(entry['id'], set()):
                      actual = ', '.join(f'{name} {version}' for name, version in sorted(reported.get(entry['id'], ()))) or 'no such finding'
                      raise SystemExit(f"Cargo.lock: advisory exception {entry['id']} is not reported for {entry['package']} {entry['version']}: {actual}")
              missing = {(advisory, package, version) for advisory in {entry['id'] for entry in config['advisory_exceptions']}
                         for package, version in reported.get(advisory, set())} - declared
              if missing:
                  advisory, package, version = sorted(missing)[0]
                  raise SystemExit(f"Cargo.lock: advisory exception {advisory} is missing for {package} {version}")
          if config.get('advisory_exceptions') or config.get('yanked_crate_exceptions'):
              deny += 'ignore = [\n'
              for entry in config.get('advisory_exceptions', []):
                  deny += '  { id = ' + toml_value(entry['id']) + ', reason = ' + toml_value(entry['reason']) + ' },\n'
              for entry in config.get('yanked_crate_exceptions', []):
                  deny += '  { crate = ' + toml_value(entry['package'] + '@=' + entry['version']) + ' },\n'
              deny += ']\n'
          deny += '[licenses]\nallow = ' + toml_value(allow) + '\n'
          for entry in config.get('license_exceptions', []):
              deny += '\n[[licenses.exceptions]]\nname = ' + toml_value(entry['package'])
              deny += '\nversion = ' + toml_value('=' + entry['version'])
              deny += '\nallow = ' + toml_value(entry['licenses']) + '\n'
          deny += '\n[bans]\n[sources]\nunknown-registry = "deny"\nunknown-git = "deny"\n'
          deny += 'allow-git = ' + toml_value(config.get('git_sources', [])) + '\n'
          (directory / 'deny.toml').write_text(deny, encoding="utf-8")
          words = '[default.extend-words]\n'
          words += ''.join(toml_value(word) + ' = ' + toml_value(word) + '\n' for word in dict.fromkeys(config.get('spelling_words', [])))
          (directory / 'typos.toml').write_text(words, encoding="utf-8")
          (directory / 'gitleaks.toml').write_text('[extend]\nuseDefault = true\n', encoding="utf-8")
          (directory / 'gitleaks.ignore').write_text('', encoding="utf-8")
          (directory / 'actionlint.yaml').write_text('{}\n', encoding="utf-8")
          privileged = config.get('privileged_trigger_workflows', [])
          zizmor = {'rules': {'dangerous-triggers': {'ignore': [pathlib.Path(value).name
                    for value in privileged]}}} if privileged else {'rules': {}}
          (directory / 'zizmor.yaml').write_text(toml_value(zizmor) + '\n', encoding="utf-8")
          with open(os.environ['GITHUB_ENV'], 'a', encoding="utf-8") as output:
              output.write(f'CHECK_DEFAULTS={directory}\n')
              output.write(f'CARGO_COVERAGE_MIN_LINES={config.get("coverage_min_lines", 80)}\n')
          PYTHON
      - name: Secrets
        run: |
          if [ -s .gitleaksignore ]; then
            echo '.gitleaksignore: suppressions are forbidden; extensions go through the caller declaration' >&2
            exit 1
          fi
          "$TOOLS/gitleaks" dir --config "$CHECK_DEFAULTS/gitleaks.toml" --gitleaks-ignore-path "$CHECK_DEFAULTS/gitleaks.ignore" --ignore-gitleaks-allow --redact .
      - name: Licenses and dependencies
        run: |
          checks=(licenses bans sources)
          if [ "${CHECK_ADVISORIES:-true}" = false ]; then
            echo 'advisories: not checked; Cargo.lock and .github/ci.toml are unchanged, and the scheduled advisory scan watches main'
          else
            checks+=(advisories)
          fi
          "$TOOLS/cargo-deny" deny --workspace --locked --all-features --config "$CHECK_DEFAULTS/deny.toml" check "${checks[@]}"
      - name: Unused dependencies
        run: |
          python3 - <<'PYTHON'
          import pathlib
          import tomllib
          for path in pathlib.Path('.').rglob('Cargo.toml'):
              if 'target' in path.parts or '.git' in path.parts:
                  continue
              with path.open('rb') as source:
                  manifest = tomllib.load(source)
              for section in ('package', 'workspace'):
                  metadata = manifest.get(section, {}).get('metadata', {}).get('cargo-machete', {})
                  if metadata.get('ignored') or metadata.get('renamed'):
                      raise SystemExit(f'{path}: cargo-machete suppressions are forbidden; extensions go through the caller declaration')
          PYTHON
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess
          import tomllib
          machete = [os.environ['TOOLS'] + '/cargo-machete', '--no-ignore', '--skip-target-dir']
          config = pathlib.Path('.config/hakari.toml')
          if not config.is_file():
              raise SystemExit(subprocess.run(machete).returncode)
          with config.open('rb') as source:
              hakari = tomllib.load(source).get('hakari-package')
          if not hakari:
              raise SystemExit(subprocess.run(machete).returncode)
          metadata = json.loads(subprocess.run(['cargo', 'metadata', '--no-deps', '--format-version', '1'],
                                               check=True, capture_output=True, text=True).stdout)
          members = {p['name']: pathlib.Path(p['manifest_path']) for p in metadata['packages']}
          generated = members.get(hakari)
          paths = [str(m.parent) for name, m in members.items() if name != hakari]
          if not paths:
              raise SystemExit(0)
          # The generated package is skipped; only the member-to-unifier edge is accepted.
          result = subprocess.run([*machete, *paths], capture_output=True, text=True)
          failed = False
          crate = None
          for line in result.stdout.splitlines():
              if line.startswith('\t'):
                  if crate != generated and line.strip() != hakari:
                      failed = True
                      print(f'{crate}: unused dependency {line.strip()}')
              elif ' -- ' in line:
                  crate = pathlib.Path(line.rsplit(' -- ', 1)[1].rstrip(':')).resolve()
          if result.returncode not in (0, 1):
              raise SystemExit(result.stderr)
          if failed:
              raise SystemExit(1)
          PYTHON
      - name: Feature unifier
        run: |
          if [ -f .config/hakari.toml ]; then
            PATH="$TOOLS:$PATH" cargo hakari verify
          fi
      - name: Spelling
        run: |
          "$TOOLS/typos" --isolated --config "$CHECK_DEFAULTS/typos.toml" .
      - name: Workflows
        run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#workflows[@]}" -gt 0 ]; then
            python3 - "${workflows[@]}" <<'PYTHON'
          import pathlib
          import re
          import sys
          for filename in sys.argv[1:]:
              for line, text in enumerate(pathlib.Path(filename).read_text(encoding="utf-8").splitlines(), 1):
                  if re.search(r'#\s*zizmor\s*:\s*ignore', text, re.IGNORECASE):
                      raise SystemExit(f'{filename}:{line}: inline zizmor ignores are forbidden; extensions go through the caller declaration')
          PYTHON
            "$TOOLS/zizmor" --offline --config "$CHECK_DEFAULTS/zizmor.yaml" --strict-collection "${workflows[@]}"
            "$TOOLS/actionlint" -config-file "$CHECK_DEFAULTS/actionlint.yaml" -shellcheck= -pyflakes= "${workflows[@]}"
          fi
      - name: Compile cache credentials
        if: needs.declaration.outputs.enabled != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: Compile cache
        if: needs.declaration.outputs.enabled != 'true'
        timeout-minutes: 10
        run: *sccache-install
      - name: Coverage
        timeout-minutes: 45
        if: needs.declaration.outputs.enabled != 'true' && needs.declaration.outputs.coverage == 'true'
        run: |
          unset LLVM_COV LLVM_PROFDATA CARGO_LLVM_COV_FLAGS CARGO_LLVM_PROFDATA_FLAGS
          for name in ${!LLVM_@}; do
            if [[ "$name" == LLVM_*_FLAGS ]]; then unset "$name"; fi
          done
          "$TOOLS/cargo-llvm-cov" llvm-cov --workspace --locked --fail-under-lines "$CARGO_COVERAGE_MIN_LINES"
      - name: Compile cache statistics
        if: always() && needs.declaration.outputs.enabled != 'true'
        run: *sccache-stats

  advisories:
    name: Advisory scan
    needs: declaration
    if: ${{ inputs.advisory-scan }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      QUALITY_CONFIG: ${{ needs.declaration.outputs.quality_config }}
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Check tools
        timeout-minutes: 10
        run: *check-tools
      - name: Embedded check defaults
        run: *check-defaults
      - name: Undeclared advisories
        id: scan
        run: |
          set +e
          "$TOOLS/cargo-deny" --format json --workspace --locked --all-features --config "$CHECK_DEFAULTS/deny.toml" check advisories 2> "$RUNNER_TEMP/advisories.jsonl"
          status=$?
          set -e
          STATUS=$status python3 - <<'PYTHON'
          import json
          import os
          findings = {}
          for line in open(os.path.join(os.environ['RUNNER_TEMP'], 'advisories.jsonl'), encoding='utf-8'):
              fields = json.loads(line).get('fields', {}) if line.startswith('{') else {}
              if fields.get('severity') != 'error':
                  continue
              crates = sorted({f"{graph['Krate']['name']} {graph['Krate']['version']}" for graph in fields.get('graphs', [])})
              advisory = fields.get('advisory')
              # Yanked crates carry no advisory; their code and crates identify them.
              key = advisory['id'] if advisory else f"{fields.get('code')} {', '.join(crates)}"
              finding = findings.setdefault(key, {'id': key, 'title': advisory.get('title', '') if advisory else fields.get('message', ''), 'crates': set()})
              finding['crates'].update(crates)
          if os.environ['STATUS'] != '0' and not findings:
              raise SystemExit(f"cargo-deny exited {os.environ['STATUS']} without an advisory finding")
          result = [dict(finding, crates=sorted(finding['crates'])) for finding in sorted(findings.values(), key=lambda finding: finding['id'])]
          for finding in result:
              print(f"{finding['id']}: {', '.join(finding['crates'])}: {finding['title']}")
          print(f'{len(result)} undeclared advisories')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('findings=' + json.dumps(result) + '\n')
          PYTHON

  targets:
    name: Check (${{ matrix.target }})
    needs: declaration
    if: ${{ !inputs.advisory-scan && needs.declaration.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.declaration.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Compile cache credentials
        if: runner.os == 'Linux'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: Compile cache
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: *sccache-install
      - name: Mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: *mise-bootstrap
      - name: Test tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true'
        run: *caller-tools
      - name: Check target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo check --workspace --all-targets --locked --target "$TARGET"
      - name: Compile cache statistics
        if: always() && runner.os == 'Linux'
        run: *sccache-stats

  browser:
    name: Wasm and browser build
    needs: declaration
    if: ${{ !inputs.advisory-scan && (needs.declaration.outputs.wasm_crates != '[]' || needs.declaration.outputs.browser_build == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.checkout-repository || github.repository }}
          path: ${{ inputs.checkout-repository && inputs.working-directory || '.' }}
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Toolchain
        run: rustup show
      - name: Compile cache credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: Compile cache
        timeout-minutes: 10
        run: *sccache-install
      - name: Browser tool pin
        if: needs.declaration.outputs.browser_build == 'true'
        run: |
          test -f mise.toml
          python3 - <<'PYTHON'
          import tomllib
          with open('mise.toml', 'rb') as source:
              config = tomllib.load(source)
          if 'just' not in config.get('tools', {}):
              raise SystemExit('mise.toml: tools.just must select the caller browser tool')
          PYTHON
      - name: Browser mise bootstrap
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true' || needs.declaration.outputs.browser_build == 'true'
        run: *mise-bootstrap
      - name: Browser tools
        timeout-minutes: 10
        if: needs.declaration.outputs.test_tools == 'true' || needs.declaration.outputs.browser_build == 'true'
        run: *caller-tools
      - name: Build wasm crates
        env:
          WASM_CRATES: ${{ needs.declaration.outputs.wasm_crates }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          crates = json.loads(os.environ['WASM_CRATES'])
          if crates:
              subprocess.run(['rustup', 'target', 'add', 'wasm32-unknown-unknown'], check=True)
          for crate in crates:
              subprocess.run(['cargo', 'build', '--locked', '--target', 'wasm32-unknown-unknown', '-p', crate], check=True)
          PYTHON
      - name: Browser recipe
        if: needs.declaration.outputs.browser_build == 'true'
        run: |
          mise exec -- just browser-build
      - name: Compile cache statistics
        if: always()
        run: *sccache-stats
