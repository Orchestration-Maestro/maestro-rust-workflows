name: CI self-test shard count

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shards:
    name: Shard count seam proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shared coverage policy
        run: python3 .github/extract-workflow-steps.py
      - name: Toolchain
        working-directory: fixtures/sample
        run: rustup show
      - name: Shard count at workflow seam
        shell: python
        run: |
          import ast
          import json
          import pathlib
          import re
          import shutil
          import subprocess
          import tempfile
          import textwrap

          # The helpers (execute, declaration, select_packages, fixture_git) keep one owner: the caller checks step.
          source = pathlib.Path('.github/workflows/ci-internal.yml').read_text(encoding='utf-8')
          code = source.split('      - name: Caller checks at workflow seam\n', 1)[1]
          code = code.split('        run: |\n', 1)[1].split('\n  native:', 1)[0]
          tree = ast.parse(textwrap.dedent(code))
          globals_needed = {'workflow', 'root', 'credential_names', 'coverage_report_args'}
          tree.body = [node for node in tree.body if isinstance(node, (ast.Import, ast.ImportFrom, ast.FunctionDef))
                       or (isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id in globals_needed
                                                               for target in node.targets))]
          exec(compile(tree, 'caller checks helpers', 'exec'))

          def shard_count_declaration_is_validated():
              message = '.github/ci.toml: test_shard_count must be a whole number from 1 to 60'
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/sample', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  result, values = declaration(directory)
                  assert result.returncode == 0 and values['test_shard_count'] == '16', result.stderr
                  (directory / '.github').mkdir()
                  path = directory / '.github/ci.toml'
                  for declared, expected in [('', '16'), ('test_shard_count=1', '1'), ('test_shard_count=16', '16'),
                                             ('test_shard_count=32', '32'), ('test_shard_count=60', '60')]:
                      path.write_text('wasm_crates=[]\ncheck_targets=[]\n' + declared + '\n', encoding='utf-8')
                      result, values = declaration(directory)
                      assert result.returncode == 0 and values['test_shard_count'] == expected, (declared, result.stderr)
                  for declared in ['0', '61', '-1', '16.0', '1e1', '"16"', 'true', '[16]', '{}']:
                      path.write_text('wasm_crates=[]\ncheck_targets=[]\ntest_shard_count=' + declared + '\n', encoding='utf-8')
                      result, values = declaration(directory)
                      assert result.returncode != 0 and not values, (declared, result.stdout)
                      assert result.stderr.strip() == message, (declared, result.stderr)
              schema = json.loads((root / '.github/ci.schema.json').read_text(encoding='utf-8'))
              assert schema['properties']['test_shard_count'] == {
                  'description': 'Number of parallel test shards; every shard collects coverage.',
                  'type': 'integer', 'minimum': 1, 'maximum': 60, 'default': 16}
              assert 'test_shard_count' not in schema['required']

          shard_count_declaration_is_validated()
          print('PASS shard_count_declaration_is_validated')

          def shard_count_seen_by(job, step, declared):
              # Layers workflow, job and step env as GitHub does, resolving declaration outputs from a real declaration run.
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/sample', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  if declared is not None:
                      (directory / '.github').mkdir()
                      (directory / '.github/ci.toml').write_text(
                          f'wasm_crates=[]\ncheck_targets=[]\ntest_shard_count={declared}\n', encoding='utf-8')
                  result, outputs = declaration(directory)
                  assert result.returncode == 0, result.stderr
              def resolve(value):
                  match = re.fullmatch(r'\$\{\{ (steps\.config|needs\.declaration)\.outputs\.(\w+) \}\}', str(value))
                  if not match:
                      return str(value)
                  if match[1] == 'steps.config':
                      return outputs[match[2]]
                  return resolve(document['jobs']['declaration']['outputs'][match[2]])
              layers = [document.get('env', {}), document['jobs'][job].get('env', {}),
                        next(s for s in document['jobs'][job]['steps'] if s.get('name') == step).get('env', {})]
              seen = [layer['TEST_SHARD_COUNT'] for layer in layers if 'TEST_SHARD_COUNT' in layer]
              return resolve(seen[-1]) if seen else None

          def declared_shard_count_reaches_every_reader():
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
              assert 'TEST_SHARD_COUNT' not in document.get('env', {}), 'the shard count is no longer fixed for the workflow'
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/sample', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  fixture_git(directory, 'init', '--quiet')
                  fixture_git(directory, 'add', '.')
                  fixture_git(directory, 'commit', '-qm', 'shard count fixture')
                  for declared in [None, 32, 60]:
                      expected = declared or 16
                      output = directory / 'output'
                      output.write_text('', encoding='utf-8')
                      result = select_packages(directory, {
                          'TEST_EVENT': 'push', 'BASE_REF': '', 'GITHUB_OUTPUT': str(output),
                          'TEST_SHARD_COUNT': shard_count_seen_by('declaration', 'Select test packages', declared)})
                      assert result.returncode == 0, result.stderr
                      selected = dict(line.split('=', 1) for line in output.read_text(encoding='utf-8').splitlines())
                      assert json.loads(selected['test_shards']) == list(range(1, expected + 1)), declared
                      assert json.loads(selected['coverage_layout'])['shard_count'] == expected, declared
                      for job, step in [('tests', 'Tests'), ('tests', 'Isolated tests'), ('doctests', 'Tests'),
                                        ('tests-result', 'Merge coverage')]:
                          assert shard_count_seen_by(job, step, declared) == str(expected), (job, step, declared)

          declared_shard_count_reaches_every_reader()
          print('PASS declared_shard_count_reaches_every_reader')

          def union_expects_exactly_the_declared_report_count():
              report = 'SF:/src/lib.rs\nDA:1,1\nend_of_record\n'
              for declared in [None, 32]:
                  expected = declared or 16
                  env = {'TEST_SHARD_COUNT': shard_count_seen_by('tests-result', 'Merge coverage', declared)}
                  for reports, accepted in [(expected, True), (expected - 1, False), (expected + 1, False)]:
                      with tempfile.TemporaryDirectory() as temporary:
                          directory = pathlib.Path(temporary)
                          (directory / 'coverage').mkdir()
                          for shard in range(1, reports + 1):
                              (directory / f'coverage/shard-{shard}.lcov').write_text(report, encoding='utf-8')
                          result = execute('Merge coverage', directory, env)
                          assert (result.returncode == 0) == accepted, (declared, reports, result.stdout + result.stderr)
                          assert accepted or result.stderr.strip() == 'Missing or unexpected shard coverage reports', result.stderr

          union_expects_exactly_the_declared_report_count()
          print('PASS union_expects_exactly_the_declared_report_count')

          def baseline_recorded_with_another_shard_count_is_accepted():
              layout = {'head': 'fixture', 'package_roots': {'selected': 'crates/a', 'unchanged': 'crates/b'}}
              for declared, recorded in [(32, 16), (None, 32), (32, 32)]:
                  current = declared or 16
                  with tempfile.TemporaryDirectory() as temporary:
                      directory = pathlib.Path(temporary)
                      for folder in ['coverage', 'baseline']:
                          (directory / folder).mkdir()
                      (directory / 'baseline/manifest.json').write_text(
                          json.dumps(layout | {'shard_count': recorded, 'checkout_root': '/old/runner/caller'}), encoding='utf-8')
                      for shard in range(1, recorded + 1):
                          (directory / f'baseline/shard-{shard}.lcov').write_text(
                              'SF:/old/runner/caller/crates/b/src/lib.rs\nDA:1,1\nend_of_record\n', encoding='utf-8')
                      for shard in range(1, current + 1):
                          (directory / f'coverage/shard-{shard}.lcov').write_text(
                              'SF:/current/caller/crates/a/src/lib.rs\nDA:1,1\nend_of_record\n', encoding='utf-8')
                      env = {'TEST_SHARD_COUNT': shard_count_seen_by('tests-result', 'Merge coverage', declared),
                             'COVERAGE_SCOPE': 'selected packages: selected', 'TEST_PACKAGES': '["selected"]',
                             'COVERAGE_LAYOUT': json.dumps(layout | {'shard_count': current}),
                             'COVERAGE_CHECKOUT_ROOT': '/current/caller', 'COVERAGE_BASELINE_DIR': str(directory / 'baseline')}
                      result = execute('Merge coverage', directory, env)
                      assert result.returncode == 0 and 'Workspace line coverage (gate): 100.00% (2/2)' in result.stdout, (
                          declared, recorded, result.stdout + result.stderr)
                      (directory / f'baseline/shard-{recorded}.lcov').unlink()
                      result = execute('Merge coverage', directory, env)
                      assert result.returncode != 0, (declared, recorded, result.stdout)
                      assert result.stderr.strip() == 'Missing or unexpected baseline coverage reports', result.stderr

          baseline_recorded_with_another_shard_count_is_accepted()
          print('PASS baseline_recorded_with_another_shard_count_is_accepted')

          def diagnostics_docs_follow_the_declared_shard_count():
              # The artifact name is built from the shard number, so the documented range must follow the declaration.
              guide = ' '.join((root / 'docs/caller-checks.md').read_text(encoding='utf-8').split())
              assert 'The shard field is `1` through the declared `test_shard_count`, or `doctests`' in guide
              assert '`1` through `16`' not in guide

          diagnostics_docs_follow_the_declared_shard_count()
          print('PASS diagnostics_docs_follow_the_declared_shard_count')

  guards:
    name: CI guard seam proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shared coverage policy
        run: python3 .github/extract-workflow-steps.py
      - name: Toolchain
        working-directory: fixtures/sample
        run: rustup show
      - name: Guards at workflow seam
        shell: python
        run: |
          import ast
          import datetime
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import tempfile
          import textwrap
          from functools import partial

          # The helpers (execute, body, select_packages, fixture_git) keep one owner: the caller checks step.
          workflow = pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          root = pathlib.Path.cwd()
          internal = pathlib.Path('.github/workflows/ci-internal.yml').read_text(encoding='utf-8')
          code = internal.split('      - name: Caller checks at workflow seam\n', 1)[1]
          code = code.split('        run: |\n', 1)[1].split('\n  native:', 1)[0]
          tree = ast.parse(textwrap.dedent(code))
          globals_needed = {'workflow', 'root', 'credential_names', 'coverage_report_args'}
          tree.body = [node for node in tree.body if isinstance(node, (ast.Import, ast.ImportFrom, ast.FunctionDef))
                       or (isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id in globals_needed
                                                               for target in node.targets))]
          exec(compile(tree, 'caller checks helpers', 'exec'))

          guards = pathlib.Path('.github/workflows/ci-guards.yml').read_text(encoding='utf-8')

          def functions_of(step):
              # Loads the step's imports and function definitions, never its entry point.
              parsed = ast.parse(textwrap.dedent(body(step, guards)))
              parsed.body = [node for node in parsed.body if isinstance(node, (ast.Import, ast.FunctionDef))]
              namespace = {}
              exec(compile(parsed, step, 'exec'), namespace)
              return namespace

          judging = functions_of('Judge the run')

          def moment(seconds):
              start = datetime.datetime(2026, 10, 30, 2, 0, tzinfo=datetime.timezone.utc)
              return (start + datetime.timedelta(seconds=seconds)).isoformat().replace('+00:00', 'Z')

          def job(name, minutes, conclusion='success', identifier=1):
              return {'id': identifier, 'name': name, 'conclusion': conclusion,
                      'started_at': moment(0), 'completed_at': moment(minutes * 60)}

          def run_of(identifier, minutes, event='merge_group', conclusion='success'):
              return {'id': identifier, 'html_url': f'https://example.test/runs/{identifier}', 'status': 'completed',
                      'conclusion': conclusion, 'event': event, 'workflow_id': 9, 'created_at': moment(identifier),
                      'run_started_at': moment(0), 'updated_at': moment(minutes * 60)}

          def merge_run_over_budget_files_an_issue_with_its_slowest_jobs():
              jobs = [job(f'Test shard ({n}/16)', 20 + n) for n in range(1, 9)] + [job('Docs', 5), job('Advisory scan', 0, 'skipped')]
              finding = judging['budget_finding'](run_of(7, 50), jobs, 45)
              assert finding['title'] == 'Merge run over its time budget: run 7', finding
              assert 'Run: https://example.test/runs/7' in finding['body'], finding
              assert 'Took 50.0 minutes; the budget is 45 minutes.' in finding['body'], finding
              listed = [line for line in finding['body'].splitlines() if line.startswith('- ')]
              assert listed == [f'- Test shard ({n}/16): {20 + n:.1f} min' for n in (8, 7, 6, 5, 4)], listed
              for minutes in (39.8, 45):
                  assert judging['budget_finding'](run_of(8, minutes), jobs, 45) is None, minutes

          merge_run_over_budget_files_an_issue_with_its_slowest_jobs()
          print('PASS merge_run_over_budget_files_an_issue_with_its_slowest_jobs')

          def findings_file_once_and_slow_issues_are_limited():
              calls = []
              def gh(*argv, body=None):
                  calls.append((argv, body))
                  return json.dumps([{'title': 'Already open'}]) if argv[:2] == ('issue', 'list') else ''
              findings = [{'title': 'Already open', 'body': 'old'}, {'title': 'New', 'body': 'new body'}] + [
                  {'title': f'Slow {n}', 'body': 'slow body', 'slow': True} for n in range(4)]
              filed = judging['file_issues'](findings, 'owner/repo', gh, 2)
              assert filed == ['New', 'Slow 0', 'Slow 1'], filed
              creates = [call for call in calls if call[0][:2] == ('issue', 'create')]
              assert [call[0][call[0].index('--title') + 1] for call in creates] == filed, creates
              assert creates[0][1] == 'new body' and all('-R' in call[0] and 'owner/repo' in call[0] for call in calls), calls

          findings_file_once_and_slow_issues_are_limited()
          print('PASS findings_file_once_and_slow_issues_are_limited')

          def fake_repository(minutes=39, shard_minutes=None, required=None, shard_logs=None, selections=None, event='merge_group'):
              """Serves the REST calls judge makes for run 7, its earlier green run 6 and the selection window."""
              names = required or ['Caller declaration', 'Format and lint', 'Docs', 'Build test archive', 'Doctests',
                                   'Tests (ubuntu-latest)', 'Dependency, source and coverage checks']
              shard_minutes = shard_minutes or [26 + n % 4 for n in range(16)]
              logs = {}
              def jobs_for(identifier):
                  base = identifier * 1000
                  found = [job(name, 5, identifier=base + index) for index, name in enumerate(names)]
                  for index, took in enumerate(shard_minutes):
                      found.append(job(f'Test shard ({index + 1}/16)', took, identifier=base + 100 + index))
                      logs[base + 100 + index] = (shard_logs or {}).get((identifier, index), 'Summary [1.0s] 1 test run\n')
                  declaration = next(item for item in found if item['name'] == 'Caller declaration') if 'Caller declaration' in names else None
                  if declaration:
                      selected, total, trigger = (selections or {}).get(identifier, (1, 51, None))
                      logs[declaration['id']] = '2026-10-30T02:00:00.1234567Z ' + (
                          f'Full-suite fallback: {trigger}\n' if trigger else '') + f'2026-10-30T02:00:01.1234567Z Selected package count: {selected}/{total}\n'
                  return found
              runs = {identifier: run_of(identifier, minutes if identifier == 7 else 30, event) for identifier in range(1, 8)}
              def gh(*argv, body=None):
                  text = ' '.join(argv)
                  if m := re.search(r'actions/runs/(\d+)/jobs', text):
                      return json.dumps([{'jobs': jobs_for(int(m[1]))}])
                  if m := re.search(r'actions/jobs/(\d+)/logs', text):
                      jobs_for(int(m[1]) // 1000)
                      return logs[int(m[1])]
                  if m := re.search(r'actions/runs/(\d+)$', text):
                      return json.dumps(runs[int(m[1])])
                  if m := re.search(r'workflows/9/runs\?event=\w+&status=(\w+)', text):
                      newest = sorted(runs.values(), key=lambda item: item['id'], reverse=True)
                      return json.dumps({'workflow_runs': newest})
                  if argv[:2] == ('issue', 'list'):
                      return '[]'
                  if argv[:2] == ('issue', 'create'):
                      created.append((argv[argv.index('--title') + 1], body))
                      return ''
                  raise AssertionError(f'unexpected gh call: {text}')
              created = []
              return gh, created

          SETTINGS = {'budget': 45.0, 'window': 5, 'ceiling': 25.0, 'margin': 1.5, 'slow': 30.0, 'required': [
              'Caller declaration', 'Format and lint', 'Docs', 'Build test archive', 'Test shard (*', 'Doctests',
              'Tests (ubuntu-latest)', 'Dependency, source and coverage checks']}

          def judge_stays_quiet_on_a_healthy_run_and_reports_a_budget_breach():
              gh, _ = fake_repository()
              assert judging['judge']('7', 'owner/repo', gh, SETTINGS) == []
              gh, _ = fake_repository(minutes=50)
              titles = [finding['title'] for finding in judging['judge']('7', 'owner/repo', gh, SETTINGS)]
              assert titles == ['Merge run over its time budget: run 7'], titles
              cancelled = run_of(7, 90, conclusion='cancelled')
              assert judging['judge']('7', 'owner/repo', lambda *argv, body=None: json.dumps(cancelled), SETTINGS) == []

          judge_stays_quiet_on_a_healthy_run_and_reports_a_budget_breach()
          print('PASS judge_stays_quiet_on_a_healthy_run_and_reports_a_budget_breach')

          SLOW_LOG = '\n'.join([
              '2026-10-30T02:48:22.6648967Z         SLOW [> 30.000s] (─────────) maestro-tooling::integration browser_author_build::repairs',
              '2026-10-30T02:49:22.6708479Z         SLOW [> 60.000s] (─────────) maestro-tooling::integration browser_author_build::repairs',
              '2026-10-30T02:50:22.7069208Z   TRY 2 SLOW [> 30.000s] (─────────) maestro-wasmtime::integration guide::builds_from_a_clean_folder',
              '2026-10-30T02:53:23.4168865Z      Summary [1629.798s] 1010 tests run: 1010 passed (7 slow, 2 flaky), 14656 skipped', ''])

          def slow_marks_are_read_from_nextest_output():
              assert judging['slow_tests'](SLOW_LOG) == {
                  'maestro-tooling::integration browser_author_build::repairs': 60.0,
                  'maestro-wasmtime::integration guide::builds_from_a_clean_folder': 30.0}
              assert judging['slow_tests']('\x1b[32m        PASS\x1b[0m [   1.2s] crate test\n') == {}

          slow_marks_are_read_from_nextest_output()
          print('PASS slow_marks_are_read_from_nextest_output')

          def each_slow_test_on_main_gets_one_issue():
              findings = judging['slow_findings']({'b::two': 90.0, 'a::one': 30.0}, 30.0, run_of(7, 39))
              assert [finding['title'] for finding in findings] == ['Test over 30 seconds: a::one', 'Test over 30 seconds: b::two']
              assert all(finding['slow'] for finding in findings) and 'over 90 seconds' in findings[1]['body'], findings
              assert 'Run: https://example.test/runs/7' in findings[0]['body'] and 'do not raise a timeout' in findings[0]['body']
              gh, _ = fake_repository(shard_logs={(7, 3): SLOW_LOG})
              titles = [finding['title'] for finding in judging['judge']('7', 'owner/repo', gh, SETTINGS)]
              assert titles == ['Test over 30 seconds: maestro-tooling::integration browser_author_build::repairs',
                                'Test over 30 seconds: maestro-wasmtime::integration guide::builds_from_a_clean_folder'], titles
              gh, _ = fake_repository(shard_logs={(7, 3): SLOW_LOG}, event='pull_request')
              assert judging['judge']('7', 'owner/repo', gh, SETTINGS) == []

          each_slow_test_on_main_gets_one_issue()
          print('PASS each_slow_test_on_main_gets_one_issue')

          def shard_balance_breach_names_the_tests_that_grew():
              jobs = [job(f'Test shard ({n}/16)', 20) for n in range(1, 16)] + [job('Test shard (16/16)', 31), job('Docs', 90)]
              grown = [('a::slow', 60.0, 30.0), ('b::new', 30.0, None)]
              finding = judging['shard_finding'](run_of(7, 50), jobs, 1.5, grown)
              assert finding['title'] == 'Test shards unbalanced: run 7', finding
              assert 'Test shard (16/16) took 31.0 min against a median shard of 20.0 min (1.55 times; the margin is 1.5).' in finding['body'], finding
              assert '- `a::slow`: over 60 s now, over 30 s before' in finding['body'], finding
              assert '- `b::new`: over 30 s now, not slow before' in finding['body'], finding
              for slowest in (20, 30):
                  healthy = jobs[:15] + [job('Test shard (16/16)', slowest)]
                  assert judging['shard_finding'](run_of(8, 50), healthy, 1.5, []) is None, slowest
              assert judging['shard_finding'](run_of(8, 50), [job('Test shard (1/1)', 90)], 1.5, []) is None

          shard_balance_breach_names_the_tests_that_grew()
          print('PASS shard_balance_breach_names_the_tests_that_grew')

          def grown_tests_are_new_or_past_a_higher_mark():
              current = {'same': 30.0, 'higher': 90.0, 'fresh': 30.0, 'gone': 30.0, 'faster': 30.0}
              previous = {'same': 30.0, 'higher': 30.0, 'faster': 60.0, 'old': 120.0}
              assert judging['grown_tests'](current, previous) == [('higher', 90.0, 30.0), ('fresh', 30.0, None), ('gone', 30.0, None)]
              many = {f't{n}': 30.0 + n for n in range(8)}
              assert len(judging['grown_tests'](many, {})) == 5

          grown_tests_are_new_or_past_a_higher_mark()
          print('PASS grown_tests_are_new_or_past_a_higher_mark')

          def judge_reports_an_unbalanced_shard_with_the_tests_that_grew():
              spread = [26] * 15 + [45]
              earlier_log = SLOW_LOG.splitlines()[0] + '\n'
              gh, _ = fake_repository(shard_minutes=spread, shard_logs={(7, 15): SLOW_LOG, (6, 0): earlier_log})
              findings = judging['judge']('7', 'owner/repo', gh, SETTINGS)
              unbalanced = next(finding for finding in findings if finding['title'].startswith('Test shards unbalanced'))
              assert '- `maestro-tooling::integration browser_author_build::repairs`: over 60 s now, over 30 s before' in unbalanced['body'], unbalanced
              assert 'guide::builds_from_a_clean_folder`: over 30 s now, not slow before' in unbalanced['body'], unbalanced

          judge_reports_an_unbalanced_shard_with_the_tests_that_grew()
          print('PASS judge_reports_an_unbalanced_shard_with_the_tests_that_grew')

          def a_pinned_job_that_did_not_run_is_reported():
              pinned = SETTINGS['required']
              ran = [job(name.rstrip('*') + ('1/16)' if name.endswith('*') else ''), 5) for name in pinned]
              assert judging['required_finding'](run_of(7, 39), ran, pinned) is None
              renamed = [item for item in ran if item['name'] != 'Docs'] + [job('Documentation', 5)]
              skipped = [dict(item, conclusion='skipped') if item['name'] == 'Format and lint' else item for item in renamed]
              finding = judging['required_finding'](run_of(7, 39), skipped, pinned)
              assert finding['title'] == 'Required checks missing from run 7', finding
              assert '`Docs`, `Format and lint`' in finding['body'] or '`Format and lint`, `Docs`' in finding['body'], finding
              assert 'Test shard' not in finding['body'], finding
              failing = [dict(item, conclusion='failure') for item in ran]
              assert judging['required_finding'](run_of(7, 39), failing, pinned) is None
              gh, _ = fake_repository(required=['Caller declaration', 'Docs'])
