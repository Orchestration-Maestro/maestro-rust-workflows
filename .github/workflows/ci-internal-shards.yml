          def selection_reports_its_share_and_trigger_file():
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  (directory / 'Cargo.toml').write_text('[workspace]\nresolver="3"\nmembers=["a","b","c","d"]\n', encoding='utf-8')
                  for name, dependency in [('a', None), ('b', 'a'), ('c', 'b'), ('d', None)]:
                      crate = directory / name
                      (crate / 'src').mkdir(parents=True)
                      manifest = f'[package]\nname="{name}"\nversion="0.1.0"\nedition="2024"\n'
                      if dependency:
                          manifest += f'[dependencies]\n{dependency}={{path="../{dependency}"}}\n'
                      (crate / 'Cargo.toml').write_text(manifest, encoding='utf-8')
                      (crate / 'src/lib.rs').write_text('pub fn value() {}\n', encoding='utf-8')
                  subprocess.run(['cargo', 'generate-lockfile'], cwd=directory, check=True)
                  subprocess.run(['git', 'init', '--quiet'], cwd=directory, check=True)
                  git = partial(fixture_git, directory)
                  git('add', '.')
                  git('commit', '-qm', 'base')
                  base = git('rev-parse', 'HEAD')
                  for changed, share, expected in [('d/src/lib.rs', '25% (1/4 test packages)', (1, 4, None)),
                                                   ('a/src/lib.rs', '75% (3/4 test packages)', (3, 4, None)),
                                                   ('Cargo.toml', '100% (4/4 test packages)', (4, 4, 'shared input: Cargo.toml')),
                                                   ('.github/workflows/ci.yml', '100% (4/4 test packages)', (4, 4, 'shared input: .github/workflows/ci.yml'))]:
                      path = directory / changed
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(path.read_text(encoding='utf-8') + '\n# changed\n' if path.exists() else '# changed\n', encoding='utf-8')
                      git('add', '.')
                      git('commit', '-qm', 'change')
                      output = directory / '.git/selection'
                      output.write_text('', encoding='utf-8')
                      summary = directory / '.git/summary'
                      summary.write_text('', encoding='utf-8')
                      result = select_packages(directory, {'TEST_EVENT': 'pull_request', 'BASE_REF': base, 'GITHUB_OUTPUT': str(output),
                                                           'GITHUB_STEP_SUMMARY': str(summary)})
                      assert result.returncode == 0, result.stdout + result.stderr
                      assert f'Selection share: {share}' in result.stdout, result.stdout
                      assert f'Selection share: {share}' in summary.read_text(encoding='utf-8'), summary.read_text(encoding='utf-8')
                      assert judging['selection_of'](result.stdout) == expected, (changed, result.stdout)
                      git('reset', '--hard', base)

          selection_reports_its_share_and_trigger_file()
          print('PASS selection_reports_its_share_and_trigger_file')
