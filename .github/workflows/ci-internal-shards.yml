              result, server, files, extracted, outputs, leftovers = download(blob=sharded(zipfile.ZIP_DEFLATED), members='shard-2.tar.zst test-binaries.json')
              assert result.returncode == 0, result.stderr
              assert files == [] and 'fallback=true' in outputs and leftovers == [], (files, outputs)

          def both_downloads_share_one_script_and_keep_the_single_stream_action():
              pin = 'actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093'
              names = list(steps)
              for name, artifact in [('Download test archive', 'test-archive-'), ('Download test setup', 'test-setup-')]:
                  step, single = steps[name], steps[name + ' in one stream']
                  assert step['run'] == steps['Download test archive']['run'] and 'uses' not in step, name
                  assert step['env']['ARTIFACT_NAME'].startswith(artifact), name
                  assert step['env']['GH_TOKEN'] == '$' + '{{ github.token }}'
                  # A shard downloads only its own archive and the binary counts; the setup is one whole bundle.
                  assert step['env'].get('ARTIFACT_MEMBERS') == ('shard-$' + '{{ matrix.shard }}.tar.zst test-binaries.json' if artifact == 'test-archive-' else None), name
                  assert single['uses'].startswith(pin), name
                  # A skipped download sets no output, so the fallback output alone carries the download step's gate.
                  assert single['if'] == '$' + "{{ steps.%s.outputs.fallback == 'true' }}" % step['id'], name
                  assert single['with']['name'] == step['env']['ARTIFACT_NAME'], name
                  assert names.index(name) + 1 == names.index(name + ' in one stream') < names.index('Restore test setup'), names
              assert job['permissions'] == {'contents': 'read', 'actions': 'read'}
              candidates = {step['name']: step for step in document['jobs']['test-prepare']['steps']}['Download test setup candidates']
              assert candidates['run'] == steps['Download test archive']['run'] and 'uses' not in candidates

          for check in [transfer_rate_matches_bytes_and_transfer_seconds,
                        parallel_ranges_extract_and_report_the_transfer, a_server_without_ranges_gets_one_stream,
                        a_corrupted_range_fails_on_the_digest_and_never_extracts, an_unusable_listing_hands_over_to_the_single_stream_action,
                        a_failing_range_hands_the_whole_download_over_without_a_retry,
                        several_runs_land_in_a_directory_each_and_a_run_without_a_bundle_is_skipped,
                        a_run_with_a_corrupt_bundle_is_left_out_and_the_later_runs_still_download,
                        a_shard_fetches_only_its_own_archive_and_the_binary_counts, a_corrupted_member_fails_on_its_checksum_and_never_hands_over,
                        a_compressed_member_hands_the_whole_download_over,
                        both_downloads_share_one_script_and_keep_the_single_stream_action]:
              check()
              print('PASS', check.__name__)

  guards:
    name: CI guard seam proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shared coverage policy
        run: python3 .github/extract-workflow-steps.py
      - name: Toolchain
        working-directory: fixtures/sample
        run: rustup show
      - name: Guards at workflow seam
        shell: python
        run: |
          import ast
          import collections
          import datetime
          import json
          import os
          import pathlib
          import platform
          import re
          import shutil
          import subprocess
          import tempfile
          import textwrap
          from functools import partial

          # The helpers (execute, body, select_packages, fixture_git) keep one owner: the caller checks step.
          workflow = pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          root = pathlib.Path.cwd()
          internal = pathlib.Path('.github/workflows/ci-internal.yml').read_text(encoding='utf-8')
          code = pathlib.Path('.github/ci-internal/caller-checks-at-workflow-seam.py').read_text(encoding='utf-8')
          tree = ast.parse(textwrap.dedent(code))
          globals_needed = {'workflow', 'root', 'credential_names', 'coverage_report_args'}
          tree.body = [node for node in tree.body if isinstance(node, (ast.Import, ast.ImportFrom, ast.FunctionDef))
                       or (isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id in globals_needed
                                                               for target in node.targets))]
          exec(compile(tree, 'caller checks helpers', 'exec'))

          guards = pathlib.Path('.github/workflows/ci-guards.yml').read_text(encoding='utf-8')

          def functions_of(step):
              # Loads the step's imports, constants and function definitions, never its entry point.
              parsed = ast.parse(textwrap.dedent(body(step, guards)))
              parsed.body = [node for node in parsed.body if isinstance(node, (ast.Import, ast.FunctionDef, ast.Assign))]
              namespace = {}
              exec(compile(parsed, step, 'exec'), namespace)
              return namespace

          judging = functions_of('Judge the run')

          def moment(seconds):
              start = datetime.datetime(2026, 10, 30, 2, 0, tzinfo=datetime.timezone.utc)
              return (start + datetime.timedelta(seconds=seconds)).isoformat().replace('+00:00', 'Z')

          def job(name, minutes, conclusion='success', identifier=1, steps=(), start=0):
              # Steps are (name, seconds) pairs that run one after the other from the start of the job.
              spent, listed = 0, []
              for step, took in steps:
                  listed.append({'name': step, 'conclusion': 'success', 'started_at': moment(spent), 'completed_at': moment(spent + took)})
                  spent += took
              return {'id': identifier, 'name': name, 'conclusion': conclusion, 'steps': listed,
                      'started_at': moment(start * 60), 'completed_at': moment((start + minutes) * 60)}

          def run_of(identifier, minutes, event='merge_group', conclusion='success', name='Rust CI', branch='main'):
              # Runs start two hours apart, so a run's predecessors are the runs with smaller identifiers.
              start = identifier * 7200
              return {'id': identifier, 'name': name, 'head_branch': branch, 'html_url': f'https://example.test/runs/{identifier}',
                      'status': 'completed', 'conclusion': conclusion, 'event': event, 'workflow_id': 9, 'created_at': moment(identifier),
                      'run_started_at': moment(start), 'updated_at': moment(start + minutes * 60)}

          def prior_runs(count, rate=10.0, **more):
              # Earlier runs of one band with their measured seconds per unit of work.
              return [run_of(n, 30) for n in range(1, count + 1)], [{'tests': rate} | more] * count

          # A run with this many units of each kind, done by this many jobs: a rate gap of a second or more is far over their stamp error of 2 s per job.
          many = {'tests': 1000, 'compiles': 1000}
          ran_jobs = {'tests': 16, 'compiles': 1}

          def rate_titles(*arguments):
              """The breach titles of one rate judgement: a breach is what these proofs weigh, and the passes have their own proof."""
              return [finding['title'] for finding in judging['rate_finding'](*arguments)[0]]

          def a_rate_more_than_ten_percent_over_its_baseline_files_an_issue():
              prior, measured = prior_runs(5, compiles=2.0)
              findings = judging['rate_finding'](run_of(7, 33.3), {'tests': 11.1, 'compiles': 2.0}, many, ran_jobs, prior, measured, 'amd-epyc-7763-4c', {})[0]
              assert [finding['title'] for finding in findings] == ['CI run slower than its baseline: Test jobs on amd-epyc-7763-4c'], findings
              body = findings[0]['body']
              assert 'Run: https://example.test/runs/7' in body, body
              assert 'Rust CI (merge_group, main) on runner band amd-epyc-7763-4c.' in body, body
              assert '- Test jobs: 11.10 s per test run against a baseline of 10.00 s (+11%, limit +10%)' in body, body
              assert 'Ratchet level: `9/merge_group/amd-epyc-7763-4c/tests`' in body, body
              assert 'Build jobs' not in body, body
              assert 'Latest baseline runs (successful, same workflow, event and runner band):' in body, body
              for n in range(1, 6):
                  assert f'- https://example.test/runs/{n}' in body, body
              for rate in (10.9, 11.0):
                  assert not rate_titles(run_of(8, 30), {'tests': rate}, many, ran_jobs, prior, measured, 'band', {}), rate
              # Above the band's normal spread (the earlier rates widened by 10%) it is also escalated; inside the spread it is only a regression.
              assert findings[0]['labels'] == ['escalation'], findings
              spread = [{'tests': rate} for rate in (8.0, 10.0, 10.0, 12.0, 10.0)]
              inside = judging['rate_finding'](run_of(8, 30), {'tests': 11.1}, many, ran_jobs, prior, spread, 'band', {})[0]
              assert inside[0]['title'] == 'CI run slower than its baseline: Test jobs on band' and inside[0]['labels'] == [], inside
              # Compile units are judged on their own rate, so each kind of work keeps its own issue.
              both = judging['rate_finding'](run_of(8, 30), {'tests': 11.1, 'compiles': 2.22}, many, ran_jobs, prior, measured, 'band', {})[0]
              assert [finding['title'] for finding in both] == ['CI run slower than its baseline: Test jobs on band',
                                                                 'CI run slower than its baseline: Build jobs on band'], both
              assert '- Build jobs: 2.22 s per compile unit against a baseline of 2.00 s (+11%, limit +10%)' in both[1]['body'] \
                  and 'Test jobs' not in both[1]['body'], both

          a_rate_more_than_ten_percent_over_its_baseline_files_an_issue()
          print('PASS a_rate_more_than_ten_percent_over_its_baseline_files_an_issue')

          def the_baseline_needs_three_samples_and_is_their_median():
              slow = run_of(9, 120)
              for count in (0, 1, 2):
                  prior, measured = prior_runs(count)
                  assert not rate_titles(slow, {'tests': 99.0}, many, ran_jobs, prior, measured, 'band', {}), count
              prior, measured = prior_runs(3)
              assert rate_titles(slow, {'tests': 99.0}, many, ran_jobs, prior, measured, 'band', {})
              assert judging['baseline_of']([18.0, 18.0]) is None and judging['baseline_of']([]) is None
              # The median keeps one fast run from lowering the bar.
              history = [run_of(n, 30) for n in range(3, 8)]
              measured = [{'tests': rate} for rate in (3.0, 10.0, 10.0, 10.0, 10.0)]
              assert judging['baseline_of']([3.0, 10.0, 10.0, 10.0, 10.0]) == 10.0
              assert not rate_titles(run_of(9, 30), {'tests': 10.9}, many, ran_jobs, history, measured, 'band', {})
              assert 'baseline of 10.00 s' in judging['rate_finding'](run_of(9, 30), {'tests': 11.1}, many, ran_jobs, history, measured, 'band', {})[0][0]['body']
              # A kind with fewer than three earlier rates has no baseline, whatever the other kinds have.
              prior, measured = prior_runs(5)
              assert not rate_titles(slow, {'tests': 10.0, 'compiles': 99.0}, many, ran_jobs, prior, measured, 'band', {})

          the_baseline_needs_three_samples_and_is_their_median()
          print('PASS the_baseline_needs_three_samples_and_is_their_median')

          def only_runs_that_gate_a_merge_are_judged():
              prior, measured = prior_runs(5)
              for event, name, branch, fires in [('merge_group', 'Rust CI', 'gh-readonly-queue/main/x', True), ('pull_request', 'Rust CI', 'feature', True),
                                                 ('push', 'Rust CI', 'main', True), ('push', 'Rust CI', 'probe', False),
                                                 ('merge_group', 'CodeQL', 'x', False), ('push', 'CodeQL', 'main', False),
                                                 ('schedule', 'Rust CI', 'main', False)]:
                  slow = run_of(9, 60, event, name=name, branch=branch)
                  assert bool(rate_titles(slow, {'tests': 20.0}, many, ran_jobs, prior, measured, 'band', {})) == fires, (event, name, branch)

          only_runs_that_gate_a_merge_are_judged()
          print('PASS only_runs_that_gate_a_merge_are_judged')

          def a_creeping_regression_fires_against_the_stored_ratchet():
              creep = [run_of(n, 30) for n in range(3, 8)]
              measured = [{'tests': rate} for rate in (12.0, 13.0, 14.0, 15.0, 16.0)]
              # The last five alone give a median of 14 and a limit of 15.4; the stored 10 keeps the limit at 11.
              finding = judging['rate_finding'](run_of(9, 30), {'tests': 12.0}, many, ran_jobs, creep, measured, 'band', {'tests': 10.0})[0]
              assert finding and 'against a baseline of 10.00 s (+20%, limit +10%)' in finding[0]['body'], finding
              assert not rate_titles(run_of(9, 30), {'tests': 10.9}, many, ran_jobs, creep, measured, 'band', {'tests': 10.0})
              # A stored level above the recent median never raises the line.
              raised = judging['rate_finding'](run_of(9, 30), {'tests': 16.0}, many, ran_jobs, creep, measured, 'band', {'tests': 30.0})[0]
              assert raised and 'against a baseline of 14.00 s' in raised[0]['body'], raised

          a_creeping_regression_fires_against_the_stored_ratchet()
          print('PASS a_creeping_regression_fires_against_the_stored_ratchet')

          def a_rate_gap_within_the_stamp_error_of_the_executed_jobs_is_not_a_regression():
              # S7759: GitHub stamps a job to the second, 1 s at each boundary, so a work-time gap is measurable only above 2 s per executed job.
              prior, measured = prior_runs(5, rate=19.0)
              run = run_of(9, 30)
              judge = lambda rate, units, jobs, base=(prior, measured): judging['rate_finding'](
                  run, {'tests': rate}, {'tests': units}, {'tests': jobs}, *base, 'band', {})
              fire = lambda *arguments: bool(judge(*arguments)[0])
              # One job: a 2 s gap (+10.5%) is within the bound; 2.1 s fires.
              assert not fire(21.0, 1, 1) and fire(21.1, 1, 1)
              # The bound grows with the executed jobs: 32 s over sixteen jobs is within it, 40 s fires.
              assert not fire(21.0, 16, 16) and fire(21.0, 20, 16)
              # A 20 s workflow that doubles still fires.
              assert fire(40.0, 1, 1, prior_runs(5, rate=20.0))
              # The pass it reports is honest about what it judged: over the limit, but not a measurable regression.
              assert judge(21.0, 1, 1)[1] == [('Test jobs on band', '21.00 s per test run against a baseline of 19.00 s, '
                                                                 'over the 10% limit but not a measurable regression')], judge(21.0, 1, 1)
              assert judge(20.0, 1, 1)[1] == [('Test jobs on band', '20.00 s per test run against a baseline of 19.00 s, inside the 10% limit')]

          a_rate_gap_within_the_stamp_error_of_the_executed_jobs_is_not_a_regression()
          print('PASS a_rate_gap_within_the_stamp_error_of_the_executed_jobs_is_not_a_regression')

          def a_runs_band_is_the_hardware_label_of_its_slowest_labelled_job():
              jobs = [job('Windows check', 40, identifier=1), job('Test shard (1/16)', 30, identifier=2), job('Docs', 5, identifier=3)]
              notes = {1: [], 2: [{'title': 'Runner hardware', 'message': 'runner-band: intel-xeon-8272cl-4c'}], 3: [{'message': 'runner-band: other'}]}
              asked = []
              def annotations_of(item):
                  asked.append(item['id'])
                  return notes[item['id']]
              assert judging['band_of'](jobs, annotations_of) == 'intel-xeon-8272cl-4c' and asked == [1, 2], asked
              assert judging['band_of'](jobs, lambda item: [{'message': 'Node.js 20 is deprecated'}]) == 'unknown'
              assert judging['band_of']([], lambda item: []) == 'unknown'

          a_runs_band_is_the_hardware_label_of_its_slowest_labelled_job()
          print('PASS a_runs_band_is_the_hardware_label_of_its_slowest_labelled_job')

          def a_value_outside_the_spread_of_its_earlier_values_departs():
              depart = lambda value, history, pad=1.0: judging['departure'](value, history, pad)
              assert [depart(value, [10.0, 10.0, 10.0]) for value in (9.0, 10.0, 11.0)] == [None, None, None]
              assert depart(11.01, [10.0, 10.0, 10.0]) == 'above' and depart(8.99, [10.0, 10.0, 10.0]) == 'below'
              # The spread is the whole range of the earlier values, not their median.
              assert depart(12.5, [8.0, 10.0, 12.0]) is None and depart(7.1, [8.0, 10.0, 12.0]) is None
              assert depart(13.1, [8.0, 10.0, 12.0]) == 'above' and depart(6.9, [8.0, 10.0, 12.0]) == 'below'
              # Fewer than three earlier values give no spread.
              assert depart(99.0, [10.0, 10.0]) is None and depart(99.0, []) is None

          a_value_outside_the_spread_of_its_earlier_values_departs()
          print('PASS a_value_outside_the_spread_of_its_earlier_values_departs')

          def a_rate_below_the_normal_spread_or_a_cache_rate_off_its_range_escalates():
              prior, measured = prior_runs(5, compiles=2.0, **{'hit-rate': 99.5})
              run = run_of(7, 30)
              low = judging['range_findings'](run, 'band-x', {'tests': 8.0, 'compiles': 2.0, 'hit-rate': 99.5}, many, ran_jobs, prior, measured)
              assert [finding['title'] for finding in low] == ['Escalation: time per test run outside its normal spread'], low
              assert low[0]['labels'] == ['escalation'], low
              body = low[0]['body']
              assert 'Run: https://example.test/runs/7' in body and 'Rust CI (merge_group, main) on runner band band-x.' in body, body
              assert "8.00 s per test run, below the band's normal spread of 9.00 to 11.00 s" in body, body
              assert all(f'- https://example.test/runs/{n}' in body for n in range(1, 6)), body
              cache = judging['range_findings'](run, 'band-x', {'tests': 10.0, 'hit-rate': 60.0}, many, ran_jobs, prior, measured)
              assert [finding['title'] for finding in cache] == ['Escalation: compile cache hit rate outside its usual range'], cache
              assert 'Compile cache hit rate 60.00%, below its usual range of 89.50% to 100.00%' in cache[0]['body'], cache
              slow = judging['range_findings'](run, 'band-x', {'tests': 10.0, 'compiles': 3.0, 'hit-rate': 99.5}, many, ran_jobs, prior, measured)
              assert [finding['title'] for finding in slow] == [], slow
              # A rate above the spread is the regression finding's to file, so it is not filed twice.
              assert judging['range_findings'](run, 'band-x', {'tests': 12.0}, many, ran_jobs, prior, measured) == []
              # Fewer than three earlier values: nothing stands out yet.
              few, measured = prior_runs(2, **{'hit-rate': 99.5})
              assert judging['range_findings'](run, 'band-x', {'tests': 1.0, 'hit-rate': 1.0}, many, ran_jobs, few, measured) == []

          a_rate_below_the_normal_spread_or_a_cache_rate_off_its_range_escalates()
          print('PASS a_rate_below_the_normal_spread_or_a_cache_rate_off_its_range_escalates')

          def a_rate_below_its_spread_within_the_stamp_error_of_the_executed_jobs_does_not_escalate():
              # S7759: the same bound as the regression's. The earlier rates are 19.0 s, so the spread's lower edge is 17.1 s.
              prior, measured = prior_runs(5, rate=19.0)
              run = run_of(9, 30)
              fire = lambda rate, units, jobs: bool(judging['range_findings'](run, 'band', {'tests': rate}, {'tests': units}, {'tests': jobs}, prior, measured))
              # One job: a 2 s gap below the median is within the bound; 2.5 s escalates.
              assert not fire(17.0, 1, 1) and fire(16.5, 1, 1)
              # The bound grows with the executed jobs: 32 s over sixteen jobs is within it, 40 s escalates.
              assert not fire(17.0, 16, 16) and fire(16.5, 16, 16)

          a_rate_below_its_spread_within_the_stamp_error_of_the_executed_jobs_does_not_escalate()
          print('PASS a_rate_below_its_spread_within_the_stamp_error_of_the_executed_jobs_does_not_escalate')

          def jobs_of_a_run(extra=(), docs=240, shards=20, skip=(), corpus=None, tests=600, test_step='Tests', setup=None):
              named = [('Docs', 5, [('Set up job', 5), ('Build docs', docs)] + ([('Download corpus', corpus)] if corpus else [])), ('Format and lint', 4, [('Lint', 100)]),
                       ('Doctests', 3, []), ('Test shard (1/16)', shards, [(step, took) for step, took in [('Download test archive', setup)] if took] + [(test_step, tests)]), ('Build test archive', 12, [('Build test archive', 500)])]
              found = [job(name, minutes, 'skipped' if name in skip else 'success', identifier=n, steps=steps) for n, (name, minutes, steps) in enumerate(named)]
              return found + list(extra)

          def a_job_or_step_that_appears_disappears_or_grows_without_matching_work_escalates():
              prior = [run_of(n, 30) for n in range(1, 6)]
              before = [jobs_of_a_run()] * 5
              shape = lambda jobs, run=run_of(7, 30), history=before, runs=prior: judging['shape_finding'](run, 'band-x', jobs, runs, history)
              assert shape(jobs_of_a_run()) is None
              # Only the work is judged for the shards and the archive build: they take twice as long with no finding.
              assert shape(jobs_of_a_run(shards=40)) is None
              finding = shape(jobs_of_a_run(corpus=20))
              assert finding['title'] == 'Escalation: jobs or steps changed without matching work', finding
              assert finding['labels'] == ['escalation'], finding
              body = finding['body']
              assert '- Docs / Download corpus appeared' in body and 'Run: https://example.test/runs/7' in body, body
              assert 'on runner band band-x.' in body and all(f'- https://example.test/runs/{n}' in body for n in range(1, 6)), body
              assert 'disappeared' not in body and 'grew' not in body, body
              assert '- New job appeared' in shape(jobs_of_a_run(extra=[job('New job', 3, identifier=9)]))['body']
              gone = shape(jobs_of_a_run(skip=['Doctests']))
              assert '- Doctests disappeared' in gone['body'], gone
              # A step that grows past the earlier range plus 10% (and 30 s) escalates, a small change does not.
              assert shape(jobs_of_a_run(docs=265)) is None
              grown = shape(jobs_of_a_run(docs=275))
              assert '- Docs / Build docs grew to 275 s (earlier: 240 to 240 s)' in grown['body'], grown
              # The shards' seconds outside the step that runs the tests are judged: a download or setup step that grows files a finding, the test step does not.
              settled = [jobs_of_a_run(setup=20)] * 5
              shard = lambda **more: judging['shape_finding'](run_of(7, 30), 'band-x', jobs_of_a_run(**more), prior, settled)
              assert shard(setup=20) is None and shard(setup=20, tests=1200) is None
              assert '- Test shard (1/16) / Download test archive grew to 200 s (earlier: 20 to 20 s)' in shard(setup=200)['body']
              assert '- Test shard (1/16) / Download test archive disappeared' in shard()['body']
              isolated = judging['shape_finding'](run_of(7, 30), 'band-x', jobs_of_a_run(test_step='Isolated tests', tests=1200), prior,
                                                  [jobs_of_a_run(test_step='Isolated tests')] * 5)
              assert isolated is None, isolated
              # A shard that did not run is a changed shard set.
              assert '- Test shard (1/16) disappeared' in shape(jobs_of_a_run(skip=['Test shard (1/16)']))['body']
              # Only a successful run with three earlier runs is compared.
              assert judging['shape_finding'](dict(run_of(7, 30), conclusion='failure'), 'band-x', jobs_of_a_run(skip=['Doctests']), prior, before) is None
              assert judging['shape_finding'](run_of(7, 30), 'band-x', jobs_of_a_run(skip=['Doctests']), prior[:2], before[:2]) is None

          a_job_or_step_that_appears_disappears_or_grows_without_matching_work_escalates()
          print('PASS a_job_or_step_that_appears_disappears_or_grows_without_matching_work_escalates')

          def work_time_is_the_union_of_the_job_intervals_and_the_runner_wait_is_the_rest():
              # Run 7 starts at minute 840 of the fixture clock, so its jobs start there.
              at = 840
              jobs = [job('A', 10, identifier=1, start=at), job('B', 15, identifier=2, start=at + 5), job('C', 10, identifier=3, start=at + 30),
                      job('F', 3, identifier=6, start=at + 32), job('D', 60, 'skipped', identifier=4, start=at), job('E', 60, 'cancelled', identifier=5, start=at)]
              # [0, 20] and [30, 40] minutes: the overlap counts once, the gap between them and the nested job add nothing, skipped and cancelled jobs are not work.
              assert judging['work_of'](jobs) == 30 * 60 and judging['work_of']([]) == 0
              # The run ends when its last job does: 40 minutes of wall time less 30 of work, wherever the run's last update falls.
              assert judging['wait_of'](run_of(7, 50), jobs) == 10 * 60
              assert judging['wait_of'](run_of(7, 20), jobs) == 10 * 60
              assert judging['job_set'](jobs) == {'A', 'B', 'C', 'F'}

          work_time_is_the_union_of_the_job_intervals_and_the_runner_wait_is_the_rest()
          print('PASS work_time_is_the_union_of_the_job_intervals_and_the_runner_wait_is_the_rest')

