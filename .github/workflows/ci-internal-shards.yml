          def identity_of(job, host='Linux', **changes):
              # The outputs of the real identity step for one job: its key and the pattern that finds the keys of that job.
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  env = {'CALLER_REPOSITORY': 'example/caller', 'CALLER_DIRECTORY': '.', 'HOST_OS': host, 'HOST_ARCH': 'X64' if host == 'Linux' else 'ARM64', 'CACHE_JOB': job,
                         'CACHE_INDEX': '0', 'CACHE_CALL': 'consumer', 'CACHE_COVERAGE': 'true', 'CACHE_ENABLED': 'true', 'CACHE_WARM': 'false',
                         'SHARD': '1', 'GITHUB_RUN_ID': '10', 'GITHUB_RUN_ATTEMPT': '1', 'CACHE_TARGET': 'aarch64-unknown-linux-gnu',
                         'GITHUB_EVENT_NAME': 'push', 'GITHUB_REF': 'refs/heads/main', 'CACHE_DEFAULT_BRANCH': 'main',
                         'GITHUB_OUTPUT': str(directory / 'output')} | changes
                  result = execute('Compile cache identity', directory, env)
                  assert result.returncode == 0, result.stdout + result.stderr
                  return dict(line.split('=', 1) for line in (directory / 'output').read_text(encoding='utf-8').splitlines())

          def a_jobs_seeder_pattern_finds_the_snapshots_of_that_job_only():
              jobs = ['tests', 'doctests', 'test-build', 'test-prepare', 'quality', 'docs', 'checks', 'browser', 'browser-tests', 'targets']
              identities = {job: identity_of(job) for job in jobs}
              for job, identity in identities.items():
                  for other, seen in identities.items():
                      assert bool(re.search(identity['seeder'], seen['key'])) == (job == other), (job, other, identity['seeder'], seen['key'])

          a_jobs_seeder_pattern_finds_the_snapshots_of_that_job_only()
          print('PASS a_jobs_seeder_pattern_finds_the_snapshots_of_that_job_only')

          def run_cache_floor(shape, stats, matched, listing, namespace='maestro-compile-v1-', seeder=None, snapshot='true'):
              seeder = seeder or identity_of('tests')['seeder']
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  (directory / 'bin').mkdir()
                  fake = directory / 'bin/gh'
                  # The list answers only for the identity step's namespace, as the cache API filters by key prefix.
                  fake.write_text('#!/bin/sh\n' + ('case "$*" in *key=' + namespace + '\\&*) echo \'' + json.dumps({'actions_caches': [{'key': key} for key in listing]})
                                                    + '\';; *) echo \'{"actions_caches": []}\';; esac\n'
                                                    if listing is not None else 'echo denied >&2\nexit 1\n'), encoding='utf-8')
                  fake.chmod(0o755)
                  (directory / 'sccache-stats').write_text(stats, encoding='utf-8')
                  return execute('Compile cache hit-rate floor', directory, {
                      'PATH': f"{directory / 'bin'}:{os.environ['PATH']}", 'RUNNER_TEMP': str(directory),
                      'GITHUB_REPOSITORY': 'owner/repo', 'GH_TOKEN': 'unused', 'CACHE_SHAPE': shape,
                      'CACHE_MATCHED_KEY': matched, 'CACHE_PREFIX': namespace + 'aaa-', 'CACHE_NAMESPACE': namespace, 'CACHE_SEEDER': seeder,
                      'CACHE_SNAPSHOT': snapshot})

          def stats_of(executed, rate):
              return '\n'.join([f'Compile requests                     {executed + 3}', f'Compile requests executed            {executed}',
                                'Cache hits                           605', 'Cache misses                           0',
                                f'Cache hits rate                   {rate:.2f} %', f'Cache hits rate (Rust)            {rate:.2f} %', ''])

          def a_build_below_the_cache_floor_warns_and_names_its_shape_and_cause():
              prefix = 'maestro-compile-v1-aaa-'
              for rate in (100, 99.67, 90):
                  result = run_cache_floor('tests-coverage', stats_of(610, rate), prefix + '1-tests', [])
                  # A pass names its shape too: it is the identity the guards recover on, and the warning names it on a breach.
                  assert result.returncode == 0 and f'Compile cache hit rate {rate:.2f}% (floor 90%) in shape tests-coverage' in result.stdout, result.stdout + result.stderr
              cases = [('tests-coverage', 40, prefix + '1-tests', [prefix + '1-tests'], 'cold snapshot'),
                       ('tests-coverage', 0, '', ['maestro-compile-v1-bbb-1-1-tests-0-abc', 'maestro-compile-v1-ccc-1-1-docs-0-abc'], 'key change'),
                       ('tests-coverage', 0, '', ['maestro-compile-v1-ccc-1-1-docs-0-abc'], 'no writer'),
                       # Snapshots of the browser tests job are not snapshots of the tests job.
                       ('tests-coverage', 0, '', ['maestro-compile-v1-ccc-1-1-browser-tests-0-abc'], 'no writer'),
                       ('tests-coverage', 0, '', [], 'eviction'),
                       ('tests-coverage', 0, '', None, 'cache list is unavailable'),
                       ('tests-coverage', 89.99, prefix + '1-tests', [], 'cold snapshot')]
              for shape, rate, matched, listing, cause in cases:
                  result = run_cache_floor(shape, stats_of(610, rate), matched, listing)
                  # A merge group never fails on the cache: its own change can invalidate it, and only a default-branch push seeds it again.
                  assert result.returncode == 0, (cause, result.stdout + result.stderr)
                  output = result.stdout + result.stderr
                  assert f'::warning title=Compile cache floor::Compile cache hit rate {rate:.2f}% is below the 90% floor in shape {shape}: {cause}' in output or (
                      cause == 'cache list is unavailable' and 'no snapshot restored' in output and cause in output), (cause, output)
                  assert '::error' not in output, (cause, output)
              # The floor finds each job's own snapshots, not only the coverage ones: five shapes sat at 0% for four days. Jobs that keep none are covered below.
              for job, shape in [('tests', 'tests-plain'), ('quality', 'quality'), ('docs', 'docs'), ('checks', 'checks'), ('browser', 'browser'),
                                 ('browser-tests', 'browser-tests'), ('test-prepare', 'test-prepare'), ('targets', 'targets-clippy-aarch64-unknown-linux-gnu')]:
                  seeder = identity_of(job)['seeder']
                  result = run_cache_floor(shape, stats_of(610, 100), prefix + '1-' + job, [], seeder=seeder)
                  assert result.returncode == 0 and f'Compile cache hit rate 100.00% (floor 90%) in shape {shape}' in result.stdout, (shape, result.stdout + result.stderr)
                  other = f'maestro-compile-v1-bbb-1-1-{job}-0-abc'
                  for listing, cause in [([other], 'key change'), (['maestro-compile-v1-ccc-1-1-other-0-abc'], 'no writer'), ([], 'eviction')]:
                      result = run_cache_floor(shape, stats_of(610, 0), '', listing, seeder=seeder)
                      assert f'is below the 90% floor in shape {shape}: {cause}' in result.stdout, (shape, cause, result.stdout + result.stderr)
              # The key layout belongs to the identity step: a bumped namespace is read from it, not assumed.
              result = run_cache_floor('tests-coverage', stats_of(610, 0), '', ['maestro-compile-v2-bbb-1-1-tests-0-abc'], 'maestro-compile-v2-')
              assert 'floor in shape tests-coverage: key change' in result.stdout, result.stdout + result.stderr
              result = run_cache_floor('tests-coverage', stats_of(0, 0), '', [])
              assert result.returncode == 0 and 'not judged: no cacheable compilation ran' in result.stdout, result.stdout + result.stderr

          a_build_below_the_cache_floor_warns_and_names_its_shape_and_cause()
          print('PASS a_build_below_the_cache_floor_warns_and_names_its_shape_and_cause')

          def leaf_jobs_on_linux_keep_no_snapshot_and_the_jobs_that_feed_the_tests_keep_theirs():
              leaves = [('quality', {}), ('docs', {}), ('doctests', {'SHARD': 'doctests'}), ('browser', {}), ('browser-tests', {}), ('targets', {})]
              for job, changes in leaves:
                  identity = identity_of(job, **changes)
                  assert (identity['snapshot'], identity['writer']) == ('false', 'false'), (job, identity)
                  assert identity_of(job, 'macOS', **changes)['snapshot'] == 'true', job
              for job, changes in [('test-build', {}), ('test-prepare', {}), ('tests', {'CACHE_WARM': 'true', 'SHARD': 'warm'}), ('checks', {})]:
                  identity = identity_of(job, **changes)
                  assert (identity['snapshot'], identity['writer']) == ('true', 'true'), (job, identity)
              for job in ['test-build', 'test-prepare', 'targets']:
                  assert identity_of(job, 'macOS')['writer'] == 'true', job
              assert identity_of('doctests', 'macOS', SHARD='doctests')['writer'] == 'false'
              assert identity_of('test-prepare', GITHUB_EVENT_NAME='merge_group')['writer'] == 'false'
              # A job without a snapshot restores none and is not judged on a hit rate it cannot reach.
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
              for name in ['quality', 'docs', 'tests', 'targets', 'browser', 'browser-tests']:
                  restore = next(step for step in document['jobs'][name]['steps'] if step.get('name') == 'Restore compile cache')
                  assert "steps.cache-identity.outputs.snapshot == 'true'" in restore['if'], name
              for job, changes in leaves:
                  identity = identity_of(job, **changes)
                  result = run_cache_floor(identity['shape'], stats_of(610, 0), '', [], seeder=identity['seeder'], snapshot=identity['snapshot'])
                  assert result.returncode == 0 and 'keeps no snapshot' in result.stdout and '::warning' not in result.stdout, (job, result.stdout + result.stderr)
                  assert '::notice title=Work units::compiles: 610\n' in result.stdout and 'hit-rate' not in result.stdout, (job, result.stdout)

          leaf_jobs_on_linux_keep_no_snapshot_and_the_jobs_that_feed_the_tests_keep_theirs()
          print('PASS leaf_jobs_on_linux_keep_no_snapshot_and_the_jobs_that_feed_the_tests_keep_theirs')

          def one_snapshot_per_kept_shape_fits_under_the_cache_limit():
              # The sizes are the guide's measurement; a shape added or dropped without a new row, or a total over 90% of the limit, fails here.
              guide = (root / 'docs/caller-checks.md').read_text(encoding='utf-8')
              table = guide.split('| Entry | Host | GiB |', 1)[1].split('\n\n', 1)[0]
              measured = {(name, host): float(size) for name, host, size in re.findall(r'\| `([^`]+)` \| (\w+) \| ([0-9.]+) \|', table)}
              maestro = [('tests', 'Linux', {'CACHE_WARM': 'true', 'SHARD': 'warm'}), ('test-build', 'Linux', {}), ('test-prepare', 'Linux', {}),
                         ('quality', 'Linux', {}), ('docs', 'Linux', {}), ('doctests', 'Linux', {'SHARD': 'doctests'}), ('browser', 'Linux', {}),
                         ('browser-tests', 'Linux', {}), ('targets', 'Linux', {'CACHE_TARGET': 'aarch64-unknown-linux-gnu'}),
                         ('test-build', 'macOS', {}), ('test-prepare', 'macOS', {}), ('doctests', 'macOS', {'SHARD': 'doctests'}),
                         ('targets', 'macOS', {'CACHE_TARGET': 'x86_64-apple-darwin'}), ('targets', 'macOS', {'CACHE_TARGET': 'aarch64-apple-darwin'})]
              kept = set()
              for job, host, changes in maestro:
                  identity = identity_of(job, host, **changes)
                  if identity['writer'] == 'true':
                      kept.add((identity['shape'], host))
              # Each host's Cargo git cache is saved by the archive build, and each host's test setup bundle by test preparation.
              kept |= {('cargo-git', host) for host in ('Linux', 'macOS', 'Windows') if identity_of('test-build', host)['writer'] == 'true'}
              kept |= {('test-setup', host) for host in ('Linux', 'macOS') if identity_of('test-prepare', host)['writer'] == 'true'}
              assert set(measured) == kept, (sorted(set(measured) ^ kept))
              assert sum(measured.values()) <= 0.9 * 10, sum(measured.values())

          one_snapshot_per_kept_shape_fits_under_the_cache_limit()
          print('PASS one_snapshot_per_kept_shape_fits_under_the_cache_limit')

          def the_shards_and_the_archive_build_report_their_work_units():
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
