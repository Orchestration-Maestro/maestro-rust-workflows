          def every_job_that_saves_a_snapshot_judges_its_cache_floor_after_its_statistics():
              jobs = dict(re.findall(r'^  ([\w-]+):\n(.*?)(?=^  [\w-]+:\n|\Z)', workflow.split('\njobs:\n', 1)[1], re.MULTILINE | re.DOTALL))
              savers = [name for name, text in jobs.items() if '- name: Save compile cache\n' in text]
              assert savers == ['quality', 'docs', 'test-build', 'test-prepare', 'tests', 'checks', 'targets', 'browser', 'browser-tests'], savers
              holders = [name for name, text in jobs.items() if '- name: Compile cache hit-rate floor\n' in text]
              assert holders == savers, holders
              for name in holders + ['doctests']:
                  text = jobs[name]
                  assert text.index('- name: Compile cache statistics') < text.index('- name: Save compile cache') if name != 'doctests' else True
                  assert 'permissions:\n      contents: read\n      actions: read\n' in text.split('steps:', 1)[0], name
                  if name != 'doctests':
                      assert text.index('- name: Save compile cache') < text.index('- name: Compile cache hit-rate floor'), name
              steps = {name: step_body(jobs[name], 'Compile cache hit-rate floor') for name in holders}
              step = steps['quality']
              for line in ['CACHE_SHAPE: $' + '{{ steps.cache-identity.outputs.shape }}',
                           'CACHE_MATCHED_KEY: $' + '{{ steps.cache-restore.outputs.cache-matched-key }}',
                           'CACHE_PREFIX: $' + '{{ steps.cache-identity.outputs.prefix }}',
                           'CACHE_NAMESPACE: $' + '{{ steps.cache-identity.outputs.namespace }}',
                           'CACHE_SEEDER: $' + '{{ steps.cache-identity.outputs.seeder }}',
                           "if: &sccache-floor-condition job.status == 'success' && steps.cache-statistics.outcome == 'success'",
                           'env: &sccache-floor-env', 'run: &sccache-floor |']:
                  assert line in step, line
              # One owner of the step: the other jobs only alias it, so no shape is judged by a copy.
              for name in holders[1:]:
                  assert steps[name].rstrip('\n') == '        if: *sccache-floor-condition\n        env: *sccache-floor-env\n        run: *sccache-floor', (name, steps[name])
              assert "seeder = r'-\\d+-' + re.escape(os.environ['CACHE_JOB']) + r'-\\d+-'" in workflow
              # The floor reads the key layout from the identity step's outputs, spells none of it, and judges every shape.
              assert 'maestro-compile-v1-' not in step and "'-tests-'" not in step and 'tests-coverage' not in step, step

          every_job_that_saves_a_snapshot_judges_its_cache_floor_after_its_statistics()
          print('PASS every_job_that_saves_a_snapshot_judges_its_cache_floor_after_its_statistics')

          def required_checks_and_documented_defaults_stay_pinned():
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=guards, text=True))
              pinned = json.loads(document['jobs']['guards']['steps'][0]['env']['REQUIRED_CHECKS'])
              names = re.findall(r'^    name: (.+)$', workflow, re.MULTILINE)
              for name in pinned:
                  assert any(name.rstrip('*') in line for line in names), f'ci.yml has no job named {name}'
              # Renaming either job drops a gate silently: the repository ruleset requires exactly these two checks.
              internal_names = re.findall(r'^    name: (.+)$', internal, re.MULTILINE)
              for name in ['Required repository quality', 'Required consumer tests']:
                  assert name in internal_names, name
              guide = ' '.join((root / 'docs/caller-checks.md').read_text(encoding='utf-8').split())
              for heading in ['## CI speed guards', '### Time per unit of work', '### Compile-cache hit-rate floor', '### Selection check',
                              '### Shard balance', '### Test-time limit', '### Required checks', '### Escalations']:
                  assert heading in guide, heading
              inputs = document['on']['workflow_call']['inputs']
              for name, value in inputs.items():
                  if isinstance(value.get('default'), (int, float)):
                      assert f"| `{name}` | {value['default']} |" in guide, name
              # Every input the table lists exists, so a removed input cannot stay documented.
              listed = set(re.findall(r'\| `([a-z-]+)` \|', guide.split('## CI speed guards', 1)[1]))
              assert listed <= set(inputs), listed - set(inputs)
              for source in ['40990557025', '40990555729', '40968689273', '40946549381']:
                  assert source in guide, source
              # The time guard is relative to the run's own baseline; a fixed minutes budget is not allowed.
              assert 'merge-run-budget-minutes' not in guide and 'merge-run-budget-minutes' not in guards
              assert 'not raw wall time' in guide and 'natural growth' in guide and '`Work units`' in guide
              assert 'seconds per test run' in guide and 'seconds per compile unit' in guide
              assert 'work time' in guide and 'runner wait' in guide and 'executed the same jobs' in guide
              # A run's updated_at moves after its last job ends, so the wall time stops at that job (run 41098096027).
              assert 'ends at its last job' in guide and 'updated_at' in guide and '41098096027' in guide
              # The test rate is the seconds of the step that ran the tests, never the whole job, and a job that overlaps another counts in full.
              assert 'S7759' in guide and '2 s per executed job' in guide and 'to the second' in guide and '15 s' not in guide, 'the stamp error bound and its reason'
              assert 'below its spread as well' in guide and 'above it outside the' in guide, 'the stamp bound covers both rate judges'
              assert 'seconds of the step that ran the tests' in guide and '`Isolated tests`' in guide and 'downloads' in guide
              assert 'counts once' not in guide
              assert 'used to return nothing' not in guide and 'warm test shards and Doctests' not in guide
              assert 'median of its rates in the previous five successful runs' in guide and 'plus 10%' in guide
              assert 'runner band' in guide and 'lowest such median' in guide and 'runner-band: <label>' in guide
              # The ratchet is stored in one issue and only the guard lowers it.
              assert 'issue titled "CI time ratchet"' in guide and 'only the guard lowers it' in guide
              # The cache floor warns and its issue is documented; the replayed fan-out is cited as the guards' source.
              assert 'never fails the build' in guide and 'Compile cache below its hit-rate floor' in guide
              assert '`fixtures/guard-fan-out/verdicts.json`' in guide
              # Everything out of the pattern is escalated under one label, with a standing title per departure.
              assert 'label `escalation`' in guide and 'Nothing outside the pattern is absorbed silently' in guide
              for title in ['Escalation: time per test run outside its normal spread', 'Escalation: time per compile unit outside its normal spread',
                            'Escalation: jobs or steps changed without matching work', 'Escalation: compile cache hit rate outside its usual range',
                            'Escalation: test selection share outside its usual range', 'Escalation: runner wait over its median']:
                  assert title in guide, title
              floor = guide.split('### Compile-cache hit-rate floor', 1)[1].split('### Compile snapshots and cache usage', 1)[0].lower()
              assert 'by design' not in floor and not re.search(r'(?<![\d.])0%', floor), 'a seeded shape is never at 0% by design'
              for shape in ['format and lint', 'docs', 'doctests', 'build test archive', 'browser', 'target', 'tests-plain', 'tests-coverage', 'pull-request']:
                  assert shape in floor, shape
              for cause in ['cold snapshot', 'key change', 'no writer', 'eviction']:
                  assert cause in floor, cause
              snapshots = guide.split('### Compile snapshots and cache usage', 1)[1].split('### Selection check', 1)[0]
              for text in ['Escalation: default-branch run did not seed its compile snapshots', 'Repository cache above 90% of its limit', 'cancelled',
                           '`actions/cache/usage`', '`cache-storage-limit-gib`', '10,928,201,953 bytes', '10.18 GiB', '40369902252', '10 GiB',
                           'evicts the oldest snapshots']:
                  assert text in snapshots, text
              assert 'GB' not in snapshots.replace('GiB', ''), 'one unit, GiB, as the finding prints'
              budget = guide.split('Source: no rate is fixed in advance', 1)[1].split('### Compile-cache hit-rate floor', 1)[0]
              assert 'cache usage' in budget and 'storage limit' not in budget and 'cache list' in budget and 'floor annotations' in budget, 'the call budget counts the cache reads'
              assert "github.event.workflow_run.event == 'push'" in guide and "github.event.workflow_run.event == 'merge_group'" in guide

          required_checks_and_documented_defaults_stay_pinned()
          print('PASS required_checks_and_documented_defaults_stay_pinned')
