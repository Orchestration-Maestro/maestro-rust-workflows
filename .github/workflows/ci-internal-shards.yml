          def step_body(job, name):
              # A step's own text: from its name to the next item of the job's step list, named or alias.
              return re.split(r'\n      - ', job.split(f'- name: {name}\n', 1)[1], maxsplit=1)[0]

          def a_step_body_ends_at_the_next_step_even_when_that_step_is_an_alias():
              job = '      - name: Floor\n        run: *floor\n      - *later-check\n\n      - name: Last\n        run: true\n'
              assert step_body(job, 'Floor') == '        run: *floor', step_body(job, 'Floor')
              assert step_body(job, 'Last') == '        run: true\n', step_body(job, 'Last')

          a_step_body_ends_at_the_next_step_even_when_that_step_is_an_alias()
