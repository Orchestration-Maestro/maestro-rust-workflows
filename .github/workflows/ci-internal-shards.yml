name: CI self-test shard count

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shards:
    name: Shard count seam proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shared coverage policy
        run: python3 .github/extract-workflow-steps.py
      - name: Toolchain
        working-directory: fixtures/sample
        run: rustup show
      - name: Shard count at workflow seam
        shell: python
        run: |
          import ast
          import json
          import pathlib
          import re
          import shutil
          import subprocess
          import tempfile
          import textwrap

          # The helpers (execute, declaration, select_packages, fixture_git) keep one owner: the caller checks step.
          source = pathlib.Path('.github/workflows/ci-internal.yml').read_text(encoding='utf-8')
          code = source.split('      - name: Caller checks at workflow seam\n', 1)[1]
          code = code.split('        run: |\n', 1)[1].split('\n  native:', 1)[0]
          tree = ast.parse(textwrap.dedent(code))
          globals_needed = {'workflow', 'root', 'credential_names', 'coverage_report_args'}
          tree.body = [node for node in tree.body if isinstance(node, (ast.Import, ast.ImportFrom, ast.FunctionDef))
                       or (isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id in globals_needed
                                                               for target in node.targets))]
          exec(compile(tree, 'caller checks helpers', 'exec'))

          def shard_count_declaration_is_validated():
              message = '.github/ci.toml: test_shard_count must be a whole number from 1 to 60'
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/sample', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  result, values = declaration(directory)
                  assert result.returncode == 0 and values['test_shard_count'] == '16', result.stderr
                  (directory / '.github').mkdir()
                  path = directory / '.github/ci.toml'
                  for declared, expected in [('', '16'), ('test_shard_count=1', '1'), ('test_shard_count=16', '16'),
                                             ('test_shard_count=32', '32'), ('test_shard_count=60', '60')]:
                      path.write_text('wasm_crates=[]\ncheck_targets=[]\n' + declared + '\n', encoding='utf-8')
                      result, values = declaration(directory)
                      assert result.returncode == 0 and values['test_shard_count'] == expected, (declared, result.stderr)
                  for declared in ['0', '61', '-1', '16.0', '1e1', '"16"', 'true', '[16]', '{}']:
                      path.write_text('wasm_crates=[]\ncheck_targets=[]\ntest_shard_count=' + declared + '\n', encoding='utf-8')
                      result, values = declaration(directory)
                      assert result.returncode != 0 and not values, (declared, result.stdout)
                      assert result.stderr.strip() == message, (declared, result.stderr)
              schema = json.loads((root / '.github/ci.schema.json').read_text(encoding='utf-8'))
              assert schema['properties']['test_shard_count'] == {
                  'description': 'Number of parallel test shards; every shard collects coverage.',
                  'type': 'integer', 'minimum': 1, 'maximum': 60, 'default': 16}
              assert 'test_shard_count' not in schema['required']

          shard_count_declaration_is_validated()
          print('PASS shard_count_declaration_is_validated')

          def shard_count_seen_by(job, step, declared):
              # Layers workflow, job and step env as GitHub does, resolving declaration outputs from a real declaration run.
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/sample', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  if declared is not None:
                      (directory / '.github').mkdir()
                      (directory / '.github/ci.toml').write_text(
                          f'wasm_crates=[]\ncheck_targets=[]\ntest_shard_count={declared}\n', encoding='utf-8')
                  result, outputs = declaration(directory)
                  assert result.returncode == 0, result.stderr
              def resolve(value):
                  match = re.fullmatch(r'\$\{\{ (steps\.config|needs\.declaration)\.outputs\.(\w+) \}\}', str(value))
                  if not match:
                      return str(value)
                  if match[1] == 'steps.config':
                      return outputs[match[2]]
                  return resolve(document['jobs']['declaration']['outputs'][match[2]])
              layers = [document.get('env', {}), document['jobs'][job].get('env', {}),
                        next(s for s in document['jobs'][job]['steps'] if s.get('name') == step).get('env', {})]
              seen = [layer['TEST_SHARD_COUNT'] for layer in layers if 'TEST_SHARD_COUNT' in layer]
              return resolve(seen[-1]) if seen else None

          def declared_shard_count_reaches_every_reader():
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
              assert 'TEST_SHARD_COUNT' not in document.get('env', {}), 'the shard count is no longer fixed for the workflow'
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/sample', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  fixture_git(directory, 'init', '--quiet')
                  fixture_git(directory, 'add', '.')
                  fixture_git(directory, 'commit', '-qm', 'shard count fixture')
                  for declared in [None, 32, 60]:
                      expected = declared or 16
                      output = directory / 'output'
                      output.write_text('', encoding='utf-8')
                      result = select_packages(directory, {
                          'TEST_EVENT': 'push', 'BASE_REF': '', 'GITHUB_OUTPUT': str(output),
                          'TEST_SHARD_COUNT': shard_count_seen_by('declaration', 'Select test packages', declared)})
                      assert result.returncode == 0, result.stderr
                      selected = dict(line.split('=', 1) for line in output.read_text(encoding='utf-8').splitlines())
                      assert json.loads(selected['test_shards']) == list(range(1, expected + 1)), declared
                      assert json.loads(selected['coverage_layout'])['shard_count'] == expected, declared
                      for job, step in [('tests', 'Tests'), ('tests', 'Isolated tests'), ('doctests', 'Tests'),
                                        ('tests-result', 'Merge coverage')]:
                          assert shard_count_seen_by(job, step, declared) == str(expected), (job, step, declared)

          declared_shard_count_reaches_every_reader()
          print('PASS declared_shard_count_reaches_every_reader')

          def union_expects_exactly_the_declared_report_count():
              report = 'SF:/src/lib.rs\nDA:1,1\nend_of_record\n'
              for declared in [None, 32]:
                  expected = declared or 16
                  env = {'TEST_SHARD_COUNT': shard_count_seen_by('tests-result', 'Merge coverage', declared)}
                  for reports, accepted in [(expected, True), (expected - 1, False), (expected + 1, False)]:
                      with tempfile.TemporaryDirectory() as temporary:
                          directory = pathlib.Path(temporary)
                          (directory / 'coverage').mkdir()
                          for shard in range(1, reports + 1):
                              (directory / f'coverage/shard-{shard}.lcov').write_text(report, encoding='utf-8')
                          result = execute('Merge coverage', directory, env)
                          assert (result.returncode == 0) == accepted, (declared, reports, result.stdout + result.stderr)
                          assert accepted or result.stderr.strip() == 'Missing or unexpected shard coverage reports', result.stderr

          union_expects_exactly_the_declared_report_count()
          print('PASS union_expects_exactly_the_declared_report_count')

          def baseline_recorded_with_another_shard_count_is_accepted():
              layout = {'head': 'fixture', 'package_roots': {'selected': 'crates/a', 'unchanged': 'crates/b'}}
              for declared, recorded in [(32, 16), (None, 32), (32, 32)]:
                  current = declared or 16
                  with tempfile.TemporaryDirectory() as temporary:
                      directory = pathlib.Path(temporary)
                      for folder in ['coverage', 'baseline']:
                          (directory / folder).mkdir()
                      (directory / 'baseline/manifest.json').write_text(
                          json.dumps(layout | {'shard_count': recorded, 'checkout_root': '/old/runner/caller'}), encoding='utf-8')
                      for shard in range(1, recorded + 1):
                          (directory / f'baseline/shard-{shard}.lcov').write_text(
                              'SF:/old/runner/caller/crates/b/src/lib.rs\nDA:1,1\nend_of_record\n', encoding='utf-8')
                      for shard in range(1, current + 1):
                          (directory / f'coverage/shard-{shard}.lcov').write_text(
                              'SF:/current/caller/crates/a/src/lib.rs\nDA:1,1\nend_of_record\n', encoding='utf-8')
                      env = {'TEST_SHARD_COUNT': shard_count_seen_by('tests-result', 'Merge coverage', declared),
                             'COVERAGE_SCOPE': 'selected packages: selected', 'TEST_PACKAGES': '["selected"]',
                             'COVERAGE_LAYOUT': json.dumps(layout | {'shard_count': current}),
                             'COVERAGE_CHECKOUT_ROOT': '/current/caller', 'COVERAGE_BASELINE_DIR': str(directory / 'baseline')}
                      result = execute('Merge coverage', directory, env)
                      assert result.returncode == 0 and 'Workspace line coverage (gate): 100.00% (2/2)' in result.stdout, (
                          declared, recorded, result.stdout + result.stderr)
                      (directory / f'baseline/shard-{recorded}.lcov').unlink()
                      result = execute('Merge coverage', directory, env)
                      assert result.returncode != 0, (declared, recorded, result.stdout)
                      assert result.stderr.strip() == 'Missing or unexpected baseline coverage reports', result.stderr

          baseline_recorded_with_another_shard_count_is_accepted()
          print('PASS baseline_recorded_with_another_shard_count_is_accepted')

          def diagnostics_docs_follow_the_declared_shard_count():
              # The artifact name is built from the shard number, so the documented range must follow the declaration.
              guide = ' '.join((root / 'docs/caller-checks.md').read_text(encoding='utf-8').split())
              assert 'The shard field is `1` through the declared `test_shard_count`, or `doctests`' in guide
              assert '`1` through `16`' not in guide

          diagnostics_docs_follow_the_declared_shard_count()
          print('PASS diagnostics_docs_follow_the_declared_shard_count')

          def prepare_declaration_keys_are_validated():
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  shutil.copytree(root / 'fixtures/sample', directory, dirs_exist_ok=True, ignore=shutil.ignore_patterns('target'))
                  (directory / '.github').mkdir()
                  path = directory / '.github/ci.toml'
                  base = 'wasm_crates=[]\ncheck_targets=[]\n'
                  path.write_text(base + 'test_prepare_packages=["sample"]\ntest_prepare_inputs=["tools/**/*.toml", ".config/prepare.sh"]\n', encoding='utf-8')
                  result, values = declaration(directory)
                  assert result.returncode == 0, result.stderr
                  assert json.loads(values['test_prepare_inputs']) == ['tools/**/*.toml', '.config/prepare.sh']
                  path.write_text(base, encoding='utf-8')
                  result, values = declaration(directory)
                  assert result.returncode == 0 and values['test_prepare_inputs'] == '[]', result.stderr
                  for declared, message in [
                      ('test_prepare_packages="sample"', 'test_prepare_packages must be an array of nonempty strings'),
                      ('test_prepare_packages=[1]', 'test_prepare_packages must be an array of nonempty strings'),
                      ('test_prepare_packages=["missing"]', "test_prepare_packages contains unknown package 'missing'"),
                      ('test_prepare_inputs="key.txt"', 'test_prepare_inputs must be an array of nonempty strings'),
                      ('test_prepare_inputs=[1]', 'test_prepare_inputs must be an array of nonempty strings'),
                      ('test_prepare_inputs=[""]', 'test_prepare_inputs must be an array of nonempty strings'),
                      ('test_prepare_inputs=["a\\u0007"]', 'test_prepare_inputs cannot contain control characters or surrogates'),
                      ('test_prepare_inputs=["/etc/passwd"]', 'test_prepare_inputs entries must be repository-relative paths'),
                      ('test_prepare_inputs=["../key.txt"]', 'test_prepare_inputs entries must be repository-relative paths'),
                      ('test_prepare_inputs=["a/../../key.txt"]', 'test_prepare_inputs entries must be repository-relative paths'),
                      ('test_prepare_inputs=["a\\\\b"]', 'test_prepare_inputs entries must be repository-relative paths')]:
                      path.write_text(base + declared + '\n', encoding='utf-8')
                      result, values = declaration(directory)
                      assert result.returncode != 0 and not values, (declared, result.stdout)
                      assert result.stderr.strip() == '.github/ci.toml: ' + message, (declared, result.stderr)
              schema = json.loads((root / '.github/ci.schema.json').read_text(encoding='utf-8'))
              packages = schema['properties']['test_prepare_packages']
              assert packages['type'] == 'array' and packages['items'] == {'type': 'string'} and packages['default'] == []
              inputs = schema['properties']['test_prepare_inputs']
              assert inputs['type'] == 'array' and inputs['items'] == {'type': 'string'} and inputs['default'] == []
              assert not {'test_prepare_packages', 'test_prepare_inputs'} & set(schema['required'])

          prepare_declaration_keys_are_validated()
          print('PASS prepare_declaration_keys_are_validated')

          def prepare_gate_follows_selected_consumers():
              def prepared(directory, event, extra=None):
                  with tempfile.NamedTemporaryFile() as output:
                      result = select_packages(directory, {'TEST_EVENT': event, 'GITHUB_OUTPUT': output.name} | (extra or {}))
                      assert result.returncode == 0, result.stderr
                      return dict(line.split('=', 1) for line in pathlib.Path(output.name).read_text(encoding='utf-8').splitlines())['test_prepare']
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  (directory / '.github').mkdir()
                  members = ['consumer', 'plain']
                  (directory / 'Cargo.toml').write_text('[workspace]\nresolver="2"\nmembers=["consumer", "plain"]\n', encoding='utf-8')
                  for member in members:
                      (directory / member / 'src').mkdir(parents=True)
                      (directory / member / 'src/lib.rs').write_text('', encoding='utf-8')
                      (directory / member / 'Cargo.toml').write_text(f'[package]\nname="{member}"\nversion="0.1.0"\nedition="2021"\n', encoding='utf-8')
                  subprocess.run(['cargo', 'generate-lockfile', '--offline'], cwd=directory, check=True)
                  declared = 'wasm_crates=[]\ncheck_targets=[]\ntest_prepare="echo ready"\ntest_prepare_packages=["consumer"]\n'
                  (directory / '.github/ci.toml').write_text(declared, encoding='utf-8')
                  fixture_git(directory, 'init', '--quiet')
                  fixture_git(directory, 'add', '.')
                  fixture_git(directory, 'commit', '-qm', 'base')
                  base = fixture_git(directory, 'rev-parse', 'HEAD').strip()
                  def change(member, text):
                      (directory / member / 'src/lib.rs').write_text(text, encoding='utf-8')
                      fixture_git(directory, 'commit', '-qam', 'change ' + member)
                  change('plain', '// plain\n')
                  assert prepared(directory, 'pull_request', {'BASE_REF': base}) == '""'
                  change('consumer', '// consumer\n')
                  assert prepared(directory, 'pull_request', {'BASE_REF': base}) == json.dumps('echo ready')
                  assert prepared(directory, 'push', {'BASE_REF': ''}) == json.dumps('echo ready')
                  # A shared input sends a merge group to the full suite, which includes the declared consumer.
                  (directory / 'justfile').write_text('default:\n', encoding='utf-8')
                  fixture_git(directory, 'add', '.')
                  fixture_git(directory, 'commit', '-qm', 'shared input')
                  assert prepared(directory, 'merge_group', {'BASE_REF': base}) == json.dumps('echo ready')
                  # A declaration that names the preparation keys is itself a full-suite change on pull requests.
                  fixture_git(directory, 'checkout', '-q', base)
                  (directory / '.github/ci.toml').write_text(declared.replace('["consumer"]', '["consumer", "plain"]'), encoding='utf-8')
                  fixture_git(directory, 'commit', '-qam', 'declare plain')
                  assert prepared(directory, 'pull_request', {'BASE_REF': base}) == json.dumps('echo ready')
                  # Naming the preparation inputs is a declaration change too.
                  fixture_git(directory, 'checkout', '-q', base)
                  (directory / '.github/ci.toml').write_text(declared + 'test_prepare_inputs=["justfile"]\n', encoding='utf-8')
                  fixture_git(directory, 'commit', '-qam', 'declare inputs')
                  assert prepared(directory, 'pull_request', {'BASE_REF': base}) == json.dumps('echo ready')
                  # Without the list every selection keeps the command.
                  fixture_git(directory, 'checkout', '-q', base)
                  (directory / '.github/ci.toml').write_text(declared.replace('test_prepare_packages=["consumer"]\n', ''), encoding='utf-8')
                  fixture_git(directory, 'commit', '-qam', 'drop the consumer list')
                  base = fixture_git(directory, 'rev-parse', 'HEAD').strip()
                  change('plain', '// plain again\n')
                  assert prepared(directory, 'pull_request', {'BASE_REF': base}) == json.dumps('echo ready')
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
              assert document['jobs']['declaration']['outputs']['test_prepare'] == '$' + '{{ steps.selection.outputs.test_prepare }}'

          prepare_gate_follows_selected_consumers()
          print('PASS prepare_gate_follows_selected_consumers')

          def prepare_steps(document):
              job = document['jobs']['test-prepare']
              return job, {step['name']: step for step in job['steps']}

          def condition(step):
              return step['if'].removeprefix('$' + '{{ ').removesuffix(' }}')

          def cache_identity_follows_the_declared_inputs():
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
              job, steps = prepare_steps(document)
              names = list(steps)
              order = ['Test tools', 'Test setup cache identity', 'Restore test setup cache', 'Prepare test setup',
                       'Save test setup cache', 'Upload test setup']
              assert [names.index(name) for name in order] == sorted(names.index(name) for name in order), names
              declared = "needs.declaration.outputs.test_prepare_inputs != '[]'"
              assert condition(steps['Test setup cache identity']) == declared
              assert condition(steps['Restore test setup cache']) == declared
              assert steps['Restore test setup cache']['with']['key'] == '$' + '{{ steps.setup-identity.outputs.key }}'
              assert 'restore-keys' not in steps['Restore test setup cache']['with']
              assert steps['Prepare test setup']['if'] == "steps.setup-cache.outputs.cache-hit != 'true'"
              save = steps['Save test setup cache']
              assert condition(save) == "steps.cache-identity.outputs.writer == 'true' && steps.setup-cache.outputs.cache-hit != 'true' && " + declared
              assert save['with'] == {'path': '$' + '{{ runner.temp }}/test-setup.tar', 'key': '$' + '{{ steps.setup-identity.outputs.key }}'}
              assert steps['Restore test setup cache']['with']['path'] == save['with']['path']
              assert document['jobs']['declaration']['outputs']['test_prepare_inputs'] == '$' + '{{ steps.config.outputs.test_prepare_inputs }}'
              # The compile cache identity step owns repository, directory, host and compiler; this step reuses its prefix.
              identity = steps['Test setup cache identity']
              assert identity['env']['COMPILE_CACHE_PREFIX'] == '$' + '{{ steps.cache-identity.outputs.prefix }}'
              assert identity['env']['TEST_PREPARE_INPUTS'] == '$' + '{{ needs.declaration.outputs.test_prepare_inputs }}'
              assert not {'CALLER_REPOSITORY', 'CALLER_DIRECTORY', 'HOST_OS', 'HOST_ARCH'} & set(identity['env'])
              assert 'rustc' not in identity['run']
              def key(directory, patterns=('inputs/*.txt',), command='echo ready', extra=None):
                  with tempfile.NamedTemporaryFile() as output:
                      env = {'TEST_PREPARE': command, 'TEST_PREPARE_INPUTS': json.dumps(list(patterns)), 'GITHUB_OUTPUT': output.name,
                             'COMPILE_CACHE_PREFIX': 'maestro-compile-v1-abc-', 'GITHUB_WORKSPACE': '/work'} | (extra or {})
                      result = execute('Test setup cache identity', directory, env)
                      values = dict(line.split('=', 1) for line in pathlib.Path(output.name).read_text(encoding='utf-8').splitlines())
                      return result, values
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  (directory / 'inputs').mkdir()
                  (directory / 'inputs/a.txt').write_text('a1\n', encoding='utf-8')
                  (directory / 'inputs/b.txt').write_text('b1\n', encoding='utf-8')
                  (directory / 'other.txt').write_text('o1\n', encoding='utf-8')
                  result, values = key(directory)
                  assert result.returncode == 0, result.stderr
                  first = values['key']
                  assert first.startswith('maestro-test-setup-v1-'), values
                  assert key(directory)[1]['key'] == first
                  # Pattern order and overlapping patterns do not change the key.
                  both = key(directory, ('inputs/a.txt', 'inputs/*.txt'))[1]['key']
                  assert both == key(directory, ('inputs/*.txt', 'inputs/a.txt'))[1]['key'] == first
                  # A file outside the patterns is not an input.
                  (directory / 'other.txt').write_text('o2\n', encoding='utf-8')
                  assert key(directory)[1]['key'] == first
                  # Content, a new match and a renamed match each change the key.
                  (directory / 'inputs/a.txt').write_text('a2\n', encoding='utf-8')
                  changed = key(directory)[1]['key']
                  assert changed != first
                  (directory / 'inputs/a.txt').write_text('a1\n', encoding='utf-8')
                  assert key(directory)[1]['key'] == first
                  (directory / 'inputs/c.txt').write_text('c1\n', encoding='utf-8')
                  assert key(directory)[1]['key'] != first
                  (directory / 'inputs/c.txt').unlink()
                  (directory / 'inputs/b.txt').rename(directory / 'inputs/d.txt')
                  assert key(directory)[1]['key'] != first
                  (directory / 'inputs/d.txt').rename(directory / 'inputs/b.txt')
                  # Hidden files match recursive patterns, and directories are not hashed as files.
                  (directory / '.config/deep').mkdir(parents=True)
                  (directory / '.config/deep/prepare.sh').write_text('one\n', encoding='utf-8')
                  hidden = key(directory, ('.config/**',))
                  assert hidden[0].returncode == 0, hidden[0].stderr
                  (directory / '.config/deep/prepare.sh').write_text('two\n', encoding='utf-8')
                  assert key(directory, ('.config/**',))[1]['key'] != hidden[1]['key']
                  for name, other in [('command', key(directory, command='echo other')),
                                      ('prefix', key(directory, extra={'COMPILE_CACHE_PREFIX': 'maestro-compile-v1-def-'})),
                                      ('workspace', key(directory, extra={'GITHUB_WORKSPACE': '/other'}))]:
                      assert other[0].returncode == 0 and other[1]['key'] != first, name
                  for patterns, message in [(('inputs/*.missing',), "test_prepare_inputs pattern 'inputs/*.missing' matches no file"),
                                            (('inputs/*.txt', 'nowhere/**'), "test_prepare_inputs pattern 'nowhere/**' matches no file"),
                                            (('inputs',), "test_prepare_inputs pattern 'inputs' matches no file")]:
                      result, values = key(directory, patterns)
                      assert result.returncode != 0 and not values, patterns
                      assert message in result.stderr, (patterns, result.stderr)

          cache_identity_follows_the_declared_inputs()
          print('PASS cache_identity_follows_the_declared_inputs')

          def second_run_with_unchanged_inputs_restores_and_skips():
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
              job, steps = prepare_steps(document)
              with tempfile.TemporaryDirectory() as temporary:
                  cache = pathlib.Path(temporary) / 'cache'
                  cache.mkdir()
                  def run(name, printed, writer, command='echo once >> "$TEST_PREPARE_OUTPUT/count"'):
                      runner = pathlib.Path(temporary) / name
                      checkout = runner / 'caller'
                      checkout.mkdir(parents=True)
                      (checkout / 'key.txt').write_text(printed, encoding='utf-8')
                      env = {'TEST_PREPARE': command, 'TEST_PREPARE_INPUTS': json.dumps(['key.txt']), 'RUNNER_TEMP': str(runner),
                             'COMPILE_CACHE_PREFIX': 'maestro-compile-v1-abc-', 'GITHUB_WORKSPACE': '/work'}
                      with tempfile.NamedTemporaryFile() as output:
                          result = execute('Test setup cache identity', checkout, env | {'GITHUB_OUTPUT': output.name})
                          assert result.returncode == 0, result.stderr
                          key = dict(line.split('=', 1) for line in pathlib.Path(output.name).read_text(encoding='utf-8').splitlines())['key']
                      # The restore step: a hit copies the saved file into place.
                      hit = (cache / key).is_file()
                      if hit:
                          shutil.copyfile(cache / key, runner / 'test-setup.tar')
                      context = {'steps.setup-cache.outputs.cache-hit': 'true' if hit else '',
                                 'steps.cache-identity.outputs.writer': 'true' if writer else 'false',
                                 'needs.declaration.outputs.test_prepare_inputs': json.dumps(['key.txt'])}
                      prepared = evaluate(steps['Prepare test setup']['if'], context)
                      if prepared:
                          result = execute('Prepare test setup', checkout, env)
                          assert result.returncode == 0, result.stdout + result.stderr
                      saved = evaluate(steps['Save test setup cache']['if'], context)
                      if saved:
                          shutil.copyfile(runner / 'test-setup.tar', cache / key)
                      return hit, bool(prepared), bool(saved), runner / 'test-setup.tar'
                  # A pull request reads the cache and never writes it.
                  assert run('pull-request', 'inputs-1', False)[:3] == (False, True, False)
                  assert not list(cache.iterdir())
                  # The first push prepares and saves; the second, with unchanged input files, restores and skips.
                  assert run('push-1', 'inputs-1', True)[:3] == (False, True, True)
                  hit, prepared, saved, tarball = run('push-2', 'inputs-1', True)
                  assert (hit, prepared, saved) == (True, False, False)
                  listing = subprocess.check_output(['tar', '-tf', str(tarball)], text=True)
                  assert 'test-setup/count' in listing
                  assert subprocess.check_output(['tar', '-xOf', str(tarball), 'test-setup/count'], text=True) == 'once\n'
                  # A pull request restores the same bundle without preparing.
                  assert run('pull-request-2', 'inputs-1', False)[:3] == (True, False, False)
                  # Changed inputs miss and prepare again.
                  assert run('push-3', 'inputs-2', True)[:3] == (False, True, True)

          second_run_with_unchanged_inputs_restores_and_skips()
          print('PASS second_run_with_unchanged_inputs_restores_and_skips')

          def every_bundle_reader_restores_on_a_hit():
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
              base = {'cancelled()': False, 'needs.test-build.result': 'success', 'needs.test-prepare.result': 'success',
                      'needs.declaration.outputs.coverage': 'true', 'needs.declaration.outputs.included_tests': 'false',
                      'inputs.advisory-scan': False, 'inputs.fuzz-scan': False, 'github.repository_id': 'caller',
                      'inputs.working-directory': '.', 'matrix.shard': '1'}
              def values(key, warm, **extra):
                  # Longer names first: the evaluator substitutes by prefix.
                  return {'needs.declaration.outputs.test_prepare_inputs': json.dumps(key),
                          'needs.declaration.outputs.test_prepare': json.dumps('prepare'), 'inputs.warm-cache': warm} | base | extra
              prepare = document['jobs']['test-prepare']['if']
              # The warm build prepares, and so restores, only for a caller that declares inputs.
              assert evaluate(prepare, values(['key.txt'], True))
              assert not evaluate(prepare, values([], True))
              assert evaluate(prepare, values(['key.txt'], False))
              assert evaluate(prepare, values([], False))
              assert not evaluate(prepare, values([], False, **{'needs.declaration.outputs.test_prepare': json.dumps('')}))
              assert not evaluate(prepare, values(['key.txt'], True, **{'needs.declaration.outputs.test_prepare': json.dumps('')}))
              tests = document['jobs']['tests']['if']
              for result, expected in [('success', True), ('skipped', True), ('failure', False), ('cancelled', False)]:
                  assert bool(evaluate(tests, values(['key.txt'], True, **{'needs.test-prepare.result': result}))) == expected, result
                  assert bool(evaluate(tests, values(['key.txt'], False, **{'needs.test-prepare.result': result}))) == expected, result
              assert evaluate(tests, values([], True, **{'needs.test-build.result': 'skipped', 'needs.test-prepare.result': 'skipped'}))
              assert not evaluate(tests, values([], False, **{'needs.test-build.result': 'failure'}))
              steps = {step['name']: step for step in document['jobs']['tests']['steps']}
              for name in ['Download test setup', 'Restore test setup']:
                  gate = steps[name]['if']
                  assert evaluate(gate, values([], False))
                  assert evaluate(gate, values(['key.txt'], False))
                  assert evaluate(gate, values(['key.txt'], True, **{'matrix.shard': 'warm'}))
                  assert not evaluate(gate, values([], True, **{'matrix.shard': 'warm'}))
                  assert not evaluate(gate, values(['key.txt'], False, **{'matrix.shard': 'doctests'}))
                  assert not evaluate(gate, values(['key.txt'], False, **{'needs.declaration.outputs.test_prepare': json.dumps('')}))

          every_bundle_reader_restores_on_a_hit()
          print('PASS every_bundle_reader_restores_on_a_hit')

          def docs_list_the_preparation_keys():
