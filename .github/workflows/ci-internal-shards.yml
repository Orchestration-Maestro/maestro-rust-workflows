          GUARD_LOGIN = 'github-actions'

          def issue_tracker(*open_issues):
              """A repository's issues as the guard reads and writes them, standing in for gh: `open_issues` are (title, body) pairs numbered from 1,
              and the issues the guard opens follow them. `gh.issues` holds each one's body and comments, `gh.calls` every call; any other call fails.
              The guard posts with the workflow's token, so `gh.login` is the author every comment it writes carries: GUARD_LOGIN is the login a
              live comment posted by that token showed, so the fixture writes the reader's spelling and never the production constant."""
              issues = [{'number': index + 1, 'title': title, 'body': body, 'comments': [], 'labels': [], 'state': 'open'}
                        for index, (title, body) in enumerate(open_issues)]
              calls = []
              def gh(*argv, body=None):
                  calls.append(argv)
                  # GitHub refuses an issue body or a comment over 65,536 characters, so a fixture write past it fails as the API's write would.
                  if body is not None and len(body) > 65536:
                      raise AssertionError(f'a write of {len(body)} characters passes the 65,536 GitHub accepts')
                  if argv[:2] == ('issue', 'list'):
                      return json.dumps([{'number': issue['number'], 'title': issue['title']} for issue in issues if issue['state'] == 'open'])
                  if argv[:2] == ('issue', 'create'):
                      issues.append({'number': len(issues) + 1, 'title': argv[argv.index('--title') + 1], 'body': body, 'comments': [],
                                     'labels': [argv[index + 1] for index, item in enumerate(argv) if item == '--label'], 'state': 'open'})
                      return f'https://example.test/issues/{len(issues)}\n'
                  if argv[:2] == ('label', 'create'):
                      return ''
                  issue = issues[int(argv[2]) - 1]
                  if argv[:2] == ('issue', 'view'):
                      return json.dumps({'body': issue['body'], 'comments': issue['comments']})
                  if argv[:2] == ('issue', 'edit'):
                      issue['body'] = body
                  elif argv[:2] == ('issue', 'comment'):
                      issue['comments'].append({'author': {'login': gh.login}, 'body': body})
                  elif argv[:2] == ('issue', 'close'):
                      issue['state'] = 'closed'
                  else:
                      raise AssertionError(f'unexpected gh call: {argv}')
                  return ''
              gh.issues, gh.calls, gh.login = issues, calls, GUARD_LOGIN
              return gh

          def listing(*sections):
              """A guard issue body listing (subject, state, first-seen run number, evidence) sections."""
              return judging['listing_body']({subject: (state, f'https://example.test/runs/{first}', evidence) for subject, state, first, evidence in sections})

          def listed(gh, number):
              """What an issue lists after the guard wrote it: (state, first-seen run, first line of the latest evidence) by subject."""
              return {subject: (state, first, evidence.splitlines()[0])
                      for subject, (state, first, evidence) in judging['listing_of'](number, gh.issues[number - 1]['body']).items()}

          def news(gh, number):
              """The comments a guard issue shows: the changes it commented, without the hidden records it rebuilds bodies from."""
              return [comment['body'] for comment in gh.issues[number - 1]['comments'] if not judging['RECORD'].match(comment['body'])]

          def a_repeat_breach_rewrites_its_open_issue_and_only_a_new_subject_comments():
              gh = issue_tracker(('Test shards unbalanced', listing(('Test shard (16/16)', 'Breaching', 1, 'Run: https://example.test/runs/1\nfirst'))),
                                 ('Escalation: already open', listing((None, 'Breaching', 1, 'Run: https://example.test/runs/1\nfirst'))))
              shard = partial(judging['finding'], 'Test shards unbalanced')
              filed = judging['file_issues']([shard('Test shard (16/16)', run_of(2, 39), 'Run: https://example.test/runs/2\nsecond run'),
                                              shard('Test shard (3/16)', run_of(2, 39), 'Run: https://example.test/runs/2\nnew shard')], 'owner/repo', gh)
              assert filed == ['Test shards unbalanced'] and len(gh.issues) == 2, (filed, gh.issues)
              # The open issue is rewritten in place: the repeat keeps the run that first breached it, and the new shard joins the list.
              assert listed(gh, 1) == {'Test shard (16/16)': ('Breaching', 'https://example.test/runs/1', 'Run: https://example.test/runs/2'),
                                       'Test shard (3/16)': ('Breaching', 'https://example.test/runs/2', 'Run: https://example.test/runs/2')}, gh.issues[0]
              # Only the new subject is news, so the run leaves one comment naming it, and one record comment for the subject no body listed.
              assert news(gh, 1) == ['Run: https://example.test/runs/2\nNew subjects: `Test shard (3/16)`.\n'], gh.issues[0]
              assert len(gh.issues[0]['comments']) == 2, gh.issues[0]
              assert all('-R' in call and 'owner/repo' in call for call in gh.calls), gh.calls
              # A repeat of listed subjects only rewrites the numbers: twice in one run is one rewrite and no comment at all, records included.
              gh.calls.clear()
              written = len(gh.issues[0]['comments'])
              judging['file_issues']([shard('Test shard (3/16)', run_of(3, 39), 'Run: https://example.test/runs/3\nagain')] * 2, 'owner/repo', gh)
              assert [call[:3] for call in gh.calls if call[0] == 'issue' and call[1] != 'list'] == [
                  ('issue', 'view', '1'), ('issue', 'edit', '1')], gh.calls
              assert len(gh.issues[0]['comments']) == written and len(news(gh, 1)) == 1, gh.issues[0]
              assert listed(gh, 1)['Test shard (3/16)'][2] == 'Run: https://example.test/runs/3', gh.issues[0]
              # An escalation is labelled, the label is made once for the run, and each departure keeps an issue of its own.
              gh.calls.clear()
              escalate = partial(judging['escalation'], run_of(4, 39), baseline=[], lines=['- departed'])
              filed = judging['file_issues']([escalate('new'), escalate('already open'), escalate('other')], 'owner/repo', gh)
              assert filed == ['Escalation: new', 'Escalation: already open', 'Escalation: other'], filed
              made = [call for call in gh.calls if call[:2] == ('label', 'create')]
              assert len(made) == 1 and made[0][:6] == ('label', 'create', 'escalation', '-R', 'owner/repo', '--force'), made
              assert [(issue['title'], issue['labels']) for issue in gh.issues[2:]] == [('Escalation: new', ['escalation']), ('Escalation: other', ['escalation'])]
              assert listed(gh, 2) == {None: ('Breaching', 'https://example.test/runs/1', 'Run: https://example.test/runs/4')} and not news(gh, 2)
              # An issue written before the guard recorded anything needs no record for a subject its body already lists: a repeat breach of
              # it comments nothing at all and leaves the comment count at zero.
              gh = issue_tracker(('Test shards unbalanced', listing(('Test shard (7/16)', 'Breaching', 1, 'Run: https://example.test/runs/1\nfirst'))))
              assert judging['file_issues']([shard('Test shard (7/16)', run_of(5, 39), 'Run: https://example.test/runs/5\nrepeat')], 'owner/repo', gh) == \
                  ['Test shards unbalanced']
              assert gh.issues[0]['comments'] == [], gh.issues[0]

          a_repeat_breach_rewrites_its_open_issue_and_only_a_new_subject_comments()
          print('PASS a_repeat_breach_rewrites_its_open_issue_and_only_a_new_subject_comments')

          def a_comment_the_guard_did_not_write_never_becomes_its_record():
              # A record is state, so only the comments the guard itself wrote are read: anyone else can carry the marker, and the guard ignores
              # it. A forged record that lists one subject, marks another Passed, adds one, or is not shaped like a record changes nothing.
              both = listing(('Test shard (1/16)', 'Breaching', 1, 'Run: https://example.test/runs/1\nfirst'),
                             ('Test shard (2/16)', 'Breaching', 1, 'Run: https://example.test/runs/1\nsecond'))
              gh = issue_tracker(('Test shards unbalanced', both))
              forged = judging['record_comment']({'Test shard (1/16)': ['Passed', 'https://example.test/runs/1', 'forged'],
                                                 'Test shard (9/16)': ['Breaching', 'https://example.test/runs/1', 'forged']})
              gh.issues[0]['comments'] += [{'author': {'login': 'a-maintainer'}, 'body': forged},
                                           {'author': {'login': 'another-bot[bot]'}, 'body': forged},
                                           {'author': None, 'body': forged},
                                           {'author': {'login': 'a-maintainer'}, 'body': '<!-- ci-guards record: {"Test shard (1/16)": []} -->\n'}]
              shard = partial(judging['finding'], 'Test shards unbalanced')
              judging['file_issues']([shard('Test shard (2/16)', run_of(2, 39), 'Run: https://example.test/runs/2\nagain')], 'owner/repo', gh)
              # The forged subject never joins the listing, the forged pass never stands, and the listed subject it left out stays listed.
              assert listed(gh, 1) == {'Test shard (1/16)': ('Breaching', 'https://example.test/runs/1', 'Run: https://example.test/runs/1'),
                                       'Test shard (2/16)': ('Breaching', 'https://example.test/runs/1', 'Run: https://example.test/runs/2')}, gh.issues[0]
              assert not news(gh, 1), gh.issues[0]
              # A repeat of a listed subject records nothing: both subjects sit in the body the guard read, so its record stays empty and the
              # forged markers are the only ones there.
              assert judging['read_back'](1, 'owner/repo', gh)[1] == {}, gh.issues[0]
              # A comment the guard itself wrote is a record, and the reader reports the workflow's login as GUARD_LOGIN, so the fixture's own
              # records are read back with no help from the production constant.
              gh = issue_tracker(('Test shards unbalanced', both))
              gh.issues[0]['comments'].append({'author': {'login': GUARD_LOGIN},
                                               'body': judging['record_comment']({'Test shard (9/16)': ['Breaching', 'https://example.test/runs/1', 'held']})})
              assert set(judging['read_back'](1, 'owner/repo', gh)[1]) == {'Test shard (9/16)'}, gh.issues[0]

          a_comment_the_guard_did_not_write_never_becomes_its_record()
          print('PASS a_comment_the_guard_did_not_write_never_becomes_its_record')

          def a_recovery_comments_once_every_listed_subject_has_passed_and_never_closes():
              both = listing(('a::one', 'Breaching', 1, 'Run: https://example.test/runs/1\nslow'), ('b::two', 'Breaching', 1, 'Run: https://example.test/runs/1\nslow'))
              gh = issue_tracker(('Test over 30 seconds', both))
              def passing(number, *tests):
                  return judging['recovery']('Test over 30 seconds', run_of(number, 39), {test: 'it ran without crossing a slow mark' for test in tests})
              # One subject passing while another still breaches is a number, not news.
              assert judging['file_issues']([passing(2, 'a::one')], 'owner/repo', gh) == ['Test over 30 seconds']
              assert listed(gh, 1)['a::one'] == ('Passed', 'https://example.test/runs/1', 'Run: https://example.test/runs/2') and not news(gh, 1)
              # The last breaching subject passing is the recovery, commented once with the run that passed.
              judging['file_issues']([passing(3, 'b::two')], 'owner/repo', gh)
              assert [comment.splitlines()[0] for comment in news(gh, 1)] == ['Run: https://example.test/runs/3'], gh.issues[0]
              assert 'passed this guard: every subject listed here has passed' in news(gh, 1)[0], gh.issues[0]
              # Later passes only move the latest run, and a breach of a listed subject is a number too.
              judging['file_issues']([passing(4, 'a::one', 'b::two')], 'owner/repo', gh)
              judging['file_issues']([judging['finding']('Test over 30 seconds', 'a::one', run_of(5, 39), 'Run: https://example.test/runs/5\nslow')], 'owner/repo', gh)
              assert len(news(gh, 1)) == 1 and listed(gh, 1)['a::one'] == ('Breaching', 'https://example.test/runs/1', 'Run: https://example.test/runs/5')
              # A breach is news again once it passes: the recovery after it is commented.
              judging['file_issues']([passing(6, 'a::one')], 'owner/repo', gh)
              assert [comment.splitlines()[0] for comment in news(gh, 1)] == ['Run: https://example.test/runs/3', 'Run: https://example.test/runs/6']
              # A pass of a subject the issue does not list, or of a kind with no open issue, says nothing and opens nothing.
              gh.calls.clear()
              assert judging['file_issues']([passing(7, 'c::three'), judging['recovery']('Test shards unbalanced', run_of(7, 39), {'Test shard (1/16)': 'inside'})],
                                            'owner/repo', gh) == []
              assert [call[:2] for call in gh.calls if call[1] != 'list'] == [('issue', 'view')] and len(gh.issues) == 1, gh.calls
              assert len(news(gh, 1)) == 2, 'the guard closes no issue of a kind, and this run folded no duplicate in'

          a_recovery_comments_once_every_listed_subject_has_passed_and_never_closes()
          print('PASS a_recovery_comments_once_every_listed_subject_has_passed_and_never_closes')

          def a_body_the_guard_did_not_write_fails_the_run_and_is_never_overwritten():
              gh = issue_tracker(('Repository cache above 90% of its limit', 'Written by hand.\r\n'))
              try:
                  judging['file_issues']([judging['finding']('Repository cache above 90% of its limit', None, run_of(2, 39), 'Run: https://example.test/runs/2\nfull')],
                                         'owner/repo', gh)
              except RuntimeError as error:
                  assert 'issue #1 lists no guard subjects; close it' in str(error), error
              else:
                  raise AssertionError('a body the guard did not write was accepted')
              assert gh.issues[0]['body'] == 'Written by hand.\r\n' and not [call for call in gh.calls if call[1] in ('edit', 'comment', 'create')], gh.calls
              # A body that went through the web editor keeps its sections: the guard reads it back unchanged.
              written = listing((None, 'Breaching', 1, 'Run: https://example.test/runs/1\nfull'))
              assert judging['listing_of'](1, written.replace('\n', '\r\n')) == judging['listing_of'](1, written) == {
                  None: ('Breaching', 'https://example.test/runs/1', 'Run: https://example.test/runs/1\nfull')}

          a_body_the_guard_did_not_write_fails_the_run_and_is_never_overwritten()
          print('PASS a_body_the_guard_did_not_write_fails_the_run_and_is_never_overwritten')

          def a_listing_past_the_body_limit_drops_its_earliest_passed_subjects():
              evidence = 'Run: https://example.test/runs/1\n' + 'x' * 500
              passed = [(f'a::passed{index:02}', 'Passed', 1, evidence) for index in range(60)]
              breaching = [(f'a::breaching{index:02}', 'Breaching', 1, evidence) for index in range(40)]
              gh = issue_tracker(('Test over 30 seconds', listing(*passed, *breaching)))
              slow = partial(judging['finding'], 'Test over 30 seconds', run=run_of(2, 39), body=evidence)
              new = [f'a::new{index:02}' for index in range(20)]
              judging['file_issues']([slow(subject) for subject in new], 'owner/repo', gh)
              # The body stays under GitHub's 65,536-character limit: every breaching subject stays listed, and the earliest passed ones leave first.
              assert len(gh.issues[0]['body']) <= 65536, len(gh.issues[0]['body'])
              left = listed(gh, 1)
              kept = [subject for subject, _, _, _ in passed if subject in left]
              assert 0 < len(kept) < len(passed) and kept == [subject for subject, _, _, _ in passed][-len(kept):], kept
              assert all(subject in left for subject, _, _, _ in breaching) and all(subject in left for subject in new), left
              assert news(gh, 1) == ['Run: https://example.test/runs/2\nNew subjects: ' + ', '.join(f'`{subject}`' for subject in new) + '.\n']
              # A passed subject the guard recorded comes back as passed when the body has room again, never as the breach it was first listed
              # with: the record follows the state it last wrote, so a pruned recovery stays passed and a run never fails on a subject it already
              # recovered.
              gh = issue_tracker(('Test over 30 seconds', listing(('a::old', 'Breaching', 1, evidence))))
              broke = [f'a::broke{index:02}' for index in range(100)]
              more = [f'a::more{index:02}' for index in range(60)]
              judging['file_issues']([slow(subject) for subject in broke], 'owner/repo', gh)
              assert len(judging['read_back'](1, 'owner/repo', gh)[1]) == len(broke), gh.issues[0]
              judging['file_issues']([judging['recovery']('Test over 30 seconds', run_of(3, 39), {subject: 'it passed' for subject in broke[:60]})],
                                     'owner/repo', gh)
              judging['file_issues']([slow(subject) for subject in more], 'owner/repo', gh)
              dropped = [subject for subject in broke[:60] if subject not in listed(gh, 1)]
              assert dropped and all(listed(gh, 1)[subject][0] == 'Passed' for subject in broke[:60] if subject in listed(gh, 1)), gh.issues[0]
              judging['file_issues']([slow('a::again')], 'owner/repo', gh)
              assert len(gh.issues[0]['body']) <= 65536, len(gh.issues[0]['body'])
              left = {subject: state for subject, (state, _, _) in listed(gh, 1).items()}
              assert not [subject for subject in dropped if left.get(subject, 'Passed') != 'Passed'], left
              assert left['a::again'] == 'Breaching' and all(left[subject] == 'Breaching' for subject in more), left
              # The record follows the state it last wrote, which is what lets the next run put a dropped subject back as passed.
              assert judging['read_back'](1, 'owner/repo', gh)[1]['a::broke00'][0] == 'Passed', gh.issues[0]
              # Breaching subjects alone past the limit fail the run and open nothing, since a subject still breaching is never dropped.
              gh = issue_tracker()
              try:
                  judging['file_issues']([slow(f'a::many{index:03}') for index in range(120)], 'owner/repo', gh)
              except RuntimeError as error:
                  assert 'more breaching subjects than one issue body holds' in str(error), error
              else:
                  raise AssertionError('a body past the limit was written')
              assert not gh.issues, gh.issues

          a_listing_past_the_body_limit_drops_its_earliest_passed_subjects()
          print('PASS a_listing_past_the_body_limit_drops_its_earliest_passed_subjects')

          def a_record_past_the_comment_limit_posts_as_many_comments_as_it_needs():
              # One write records a section per subject it adds and per subject whose state it changes, so a run that judges many subjects
              # records more than one comment of 65,536 characters holds: each write posts as many record comments as it needs, and the
              # reader merges them back, so no section is lost.
              evidence = 'Run: https://example.test/runs/1\n' + 'x' * 500
              gh = issue_tracker(('Test over 30 seconds', listing(('a::old', 'Breaching', 1, evidence))))
              # A run that read the issue before another run added these wrote a body without them, and the record kept them as breaching.
              stale = [f'a::stale{index:03}' for index in range(100)]
              gh.issues[0]['comments'].append({'author': {'login': GUARD_LOGIN}, 'body': judging['record_comment'](
                  {subject: ['Breaching', 'https://example.test/runs/1', evidence] for subject in stale})})
              fresh = [f'a::fresh{index:03}' for index in range(100)]
              slow = partial(judging['finding'], 'Test over 30 seconds', run=run_of(2, 39), body=evidence)
              judging['file_issues']([judging['recovery']('Test over 30 seconds', run_of(2, 39), {subject: 'it passed' for subject in stale})]
                                     + [slow(subject) for subject in fresh], 'owner/repo', gh)
              # Every write stayed within the limit the fixture enforces, and the record lost no section: the 100 recovered subjects read
              # back as passed and the 100 new ones as breaching, though the body has room for the breaching ones alone.
              record = judging['read_back'](1, 'owner/repo', gh)[1]
              assert set(record) == set(stale) | set(fresh), sorted(set(record) ^ (set(stale) | set(fresh)))
              assert [record[subject][0] for subject in stale] == ['Passed'] * 100, record['a::stale000']
              assert [record[subject][0] for subject in fresh] == ['Breaching'] * 100, record['a::fresh000']
              assert len(gh.issues[0]['body']) <= 65536 and all(subject in listed(gh, 1) for subject in fresh), listed(gh, 1)
              # The sections needed more than one record comment, and none of them is a change announcement.
              records = [comment for comment in gh.issues[0]['comments'] if judging['RECORD'].match(comment['body'])]
              assert len(records) > 1 and len(records) == len([comment for comment in records if comment['author']['login'] == GUARD_LOGIN])
              assert news(gh, 1) == ['Run: https://example.test/runs/2\nNew subjects: ' + ', '.join(f'`{subject}`' for subject in fresh) + '.\n'], \
                  news(gh, 1)

          a_record_past_the_comment_limit_posts_as_many_comments_as_it_needs()
          print('PASS a_record_past_the_comment_limit_posts_as_many_comments_as_it_needs')

          def fake_repository(minutes=30, bands=None, shard_minutes=None, required=None, shard_logs=None, selections=None, event='merge_group',
                                  ratchet=None, floor=None, newer=0, pace=None, build=None, steps=None, extra_jobs=None,
                                  seeding=None, conclusion='success', cancelled=(), usage_gb=3.0, open_issues=None):
              """Serves the REST calls judge makes for run 7, its earlier runs and the stored ratchet; `newer` runs finish after run 7.

              `pace` maps a run to (shard duration factor, test runs per shard) and `build` to (build duration factor, compile units, cache hit rate);
              `steps` maps (run, job name) to its (step, seconds) pairs; `extra_jobs` maps a run to the names of jobs it ran besides the usual ones;
              `floor` maps a run to the cache-floor warning of each named job (every run then ran the floor step in those jobs, and a job whose value is
              None passed it in the shape `SHAPES` gives it);
              `seeding` is (the jobs that save a snapshot, the cache entries run 7 left): every run then reports those saves and leaves one entry
              per saving job, except run 7; `conclusion` and `cancelled` set how run 7 and which of its jobs ended; `usage_gb` is the repository cache in use;
              `open_issues` maps the title of each open issue to its body. Runs after run 7 are five times slower per unit."""
              ratchet = {} if ratchet is None else ratchet
              counts = collections.Counter()
              names = required or ['Caller declaration', 'Format and lint', 'Docs', 'Build test archive', 'Doctests',
                                   'Tests (ubuntu-latest)', 'Dependency, source and coverage checks']
              shard_minutes = shard_minutes or [26 + n % 4 for n in range(16)]
              pace = {identifier: (5, 100) for identifier in range(8, 20)} | (pace or {})
              build = build or {}
              logs = {}
              def wall_of(identifier):
                  return minutes if identifier == 7 else 200 if identifier > 7 else 30
              def jobs_for(identifier):
                  base = identifier * 1000
                  factor, _ = pace.get(identifier, (1, 100))
                  built, _, _ = build.get(identifier, (1, 600, 99.5))
                  # A run ends at its last job: the jobs start inside the run, after the wait that makes up the rest of its wall time.
                  begin = identifier * 120 + max(wall_of(identifier) - max([5 * built] + [took * factor for took in shard_minutes]), 0)
                  found = [job(name, 5 * built if name == 'Build test archive' else 5, identifier=base + index, start=begin,
                               steps=(steps or {}).get((identifier, name), [('Set up job', 5), ('Build docs', 240)] if name == 'Docs' else [])
                               + ([('Compile cache hit-rate floor', 1)] if name in {judged for named in (floor or {}).values() for judged in named} else [])
                               + ([('Compile cache statistics', 1)] + [('Save compile cache', 1)] * (name in seeding[0]) if seeding and name in
                                  ('Format and lint', 'Docs', 'Build test archive') else []),
                               conclusion='cancelled' if identifier == 7 and name in cancelled else 'success')
                           for index, name in enumerate(names)]
                  for index, took in enumerate(shard_minutes):
                      found.append(job(f'Test shard ({index + 1}/16)', took * factor, identifier=base + 100 + index, start=begin,
                                       steps=(steps or {}).get((identifier, f'Test shard ({index + 1}/16)'), []) + [('Tests', took * factor * 60)]))
                      logs[base + 100 + index] = (shard_logs or {}).get((identifier, index), 'Summary [1.0s] 1 test run\n')
                  for index, warned in (floor or {}).get(identifier, {}).items():
                      # A job that warned prints no passing line.
                      logs[base + names.index(index)] = '' if warned else f'Compile cache hit rate 99.50% (floor 90%) in shape {SHAPES[index]}\n'
                  found += [job(extra, 5, identifier=base + 200 + index, start=begin) for index, extra in enumerate((extra_jobs or {}).get(identifier, []))]
                  declaration = next(item for item in found if item['name'] == 'Caller declaration') if 'Caller declaration' in names else None
                  if declaration:
                      selected, total, trigger = (selections or {}).get(identifier, (51, 51, 'newer run') if identifier > 7 else (1, 51, None))
                      logs[declaration['id']] = (f'2026-10-30T02:00:00.1234567Z Full-suite fallback: {trigger}\n' if trigger else '') + (
                          f'2026-10-30T02:00:01.1234567Z Selected package count: {selected}/{total}\n')
                  return found
              runs = {identifier: run_of(identifier, wall_of(identifier), event, conclusion if identifier == 7 else 'success')
                      for identifier in range(1, 8 + newer)}
              stored = []
              for identifier in range(1, 8):
                  left = seeding[1] if seeding and identifier == 7 else len(seeding[0]) if seeding else 0
                  stored += [{'key': f'maestro-compile-v1-{n:064x}-{identifier}-1-docs-0-abc', 'ref': 'refs/heads/main', 'size_in_bytes': 100 * 1024**2,
                              'created_at': moment(identifier)} for n in range(left)]
              # Other workflows of the repository share the listing; their wide selections must not count.
              decoys = [dict(run_of(identifier, 30, event), workflow_id=3) for identifier in range(101, 105)]
              for decoy in decoys:
                  selections = dict(selections or {}) | {decoy['id']: (51, 51, 'other workflow')}
              def gh(*argv, body=None):
                  text = ' '.join(argv)
                  if m := re.search(r'actions/runs/(\d+)/jobs', text):
                      counts['jobs'] += 1
                      return json.dumps([{'jobs': jobs_for(int(m[1]))}])
                  if m := re.search(r'actions/jobs/(\d+)/logs', text):
                      counts['logs'] += 1
                      counts[f'logs of run {int(m[1]) // 1000}'] += 1
                      jobs_for(int(m[1]) // 1000)
                      return logs[int(m[1])]
                  if m := re.search(r'actions/runs/(\d+)$', text):
                      return json.dumps(runs[int(m[1])])
                  if m := re.search(r'check-runs/(\d+)/annotations', text):
                      counts['annotations'] += 1
                      identifier, index = int(m[1]) // 1000, int(m[1]) % 1000
                      label = (bands or {}).get(identifier)
                      notes = [{'title': 'Runner hardware', 'message': f'runner-band: {label}', 'annotation_level': 'notice'}] if label else []
                      if 100 <= index < 100 + len(shard_minutes):
                          notes += work_units(f'tests: {pace.get(identifier, (1, 100))[1]}')
                      if index < len(names) and names[index] == 'Build test archive':
                          _, compiles, hit_rate = build.get(identifier, (1, 600, 99.5))
                          notes += work_units(f'compiles: {compiles}; hit-rate: {hit_rate}')
                      warning = (floor or {}).get(identifier, {}).get(names[index]) if index < len(names) else None
                      if warning:
                          notes.append({'title': 'Compile cache floor', 'message': warning, 'annotation_level': 'warning'})
                      return json.dumps(notes)
                  if re.search(r'actions/cache/usage$', text):
                      counts['usage'] += 1
                      return json.dumps({'active_caches_size_in_bytes': int(usage_gb * 1024**3), 'active_caches_count': len(stored)})
                  if re.search(r'actions/cache/storage-limit$', text):
                      # GitHub refuses the job token this read although it holds Actions read (Maestro run 41873062666).
                      raise RuntimeError(f'gh {argv[0]} {argv[1]} failed: gh: Resource not accessible by integration (HTTP 403)')
                  if m := re.search(r'actions/caches\?(\S+)', text):
                      counts['caches'] += 1
                      listed = [item for item in stored if 'ref=' not in m[1] or f"ref={item['ref']}" in m[1]]
                      return json.dumps([{'actions_caches': sorted(listed, key=lambda item: item['size_in_bytes'], reverse=True) if 'sort=size_in_bytes' in m[1] else listed}])
                  if re.search(r'actions/workflows/', text):
                      raise AssertionError('a required workflow is not listed under its own id: ' + text)
                  if m := re.search(r'actions/runs\?event=(\w+)&status=(\w+)', text):
                      assert m[1] == event, text
                      counts['runs'] += 1
                      newest = sorted(list(runs.values()) + decoys, key=lambda item: item['id'], reverse=True)
                      return json.dumps({'workflow_runs': newest})
                  # The ratchet is the one issue titled 'CI time ratchet'; its body holds the levels in a json block.
                  if argv[:2] == ('issue', 'list') and '--search' in argv:
                      return json.dumps([{'number': 99, 'title': 'CI time ratchet', 'body': ratchet['body']}] if 'body' in ratchet else [])
                  if argv[:2] == ('issue', 'create') and argv[argv.index('--title') + 1] == 'CI time ratchet':
                      ratchet['body'] = body
                      return ''
                  if argv[:3] == ('issue', 'edit', '99'):
                      ratchet['body'] = body
                      return ''
                  if argv[:2] == ('issue', 'list'):
                      return json.dumps([{'number': 50 + index, 'title': title} for index, title in enumerate(open_issues or {})])
                  if argv[:2] == ('issue', 'view'):
                      return json.dumps({'body': list((open_issues or {}).values())[int(argv[2]) - 50], 'comments': []})
                  if argv[:2] == ('issue', 'edit'):
                      edited.append((argv[2], body))
                      return ''
                  if argv[:2] == ('issue', 'create'):
                      created.append((argv[argv.index('--title') + 1], body))
                      return ''
                  if argv[:2] == ('issue', 'comment'):
                      comments.append((argv[2], body))
                      return ''
                  if argv[:2] == ('label', 'create'):
                      return ''
                  raise AssertionError(f'unexpected gh call: {text}')
              created, comments, edited = [], [], []
              gh.counts = counts
              gh.comments, gh.edited = comments, edited
              return gh, created

          def stored_levels(ratchet):
              return json.loads(re.search(r'```json\n(.*?)\n```', ratchet['body'], re.DOTALL)[1])['levels']

          def stored_ratchet(levels):
              return {'body': 'The guards keep the lowest median rate of each level here.\n\n```json\n' + json.dumps({'levels': levels}) + '\n```\n'}

          SETTINGS = {'window': 5, 'ceiling': 25.0, 'margin': 1.5, 'slow': 30.0, 'cache_limit': 10.0, 'required': [
              'Caller declaration', 'Format and lint', 'Docs', 'Build test archive', 'Test shard (*', 'Doctests',
              'Tests (ubuntu-latest)', 'Dependency, source and coverage checks']}

          # The compile cache shape each named job judges, as ci.yml's cache identity gives it.
          SHAPES = {'Caller declaration': 'declaration', 'Format and lint': 'quality', 'Docs': 'docs',
                    'Build test archive': 'tests-coverage', 'Doctests': 'doctests', 'Tests (ubuntu-latest)': 'tests-coverage',
                    'Dependency, source and coverage checks': 'checks'}

          # With the default shards a run spends 16.5 s per test run (440 shard minutes over 16 shards of 100 tests) and 0.5 s per compile unit.
          TESTS_RATE, COMPILES_RATE = 16.5, 0.5

          def judge_passes_each_subject_it_judged_once_per_open_kind():
              # One passing test in a shard log, so a listed slow test is judged and passed by the same run.
              passed_log = '2026-10-30T02:53:23.4168865Z         PASS [   1.2s] crate one\n     Summary [10.0s] 1 test run: 1 passed\n'
              def breaching(subject):
                  return listing((subject, 'Breaching', 1, 'Run: https://example.test/runs/1\nbroke'))
              open_issues = {'CI run slower than its baseline': breaching('Test jobs on unknown'), 'Compile cache below its hit-rate floor': breaching('docs'),
                             'Test shards unbalanced': breaching('Test shard (3/16)'), 'Test over 30 seconds': breaching('crate one')}
              gh, _ = fake_repository(ratchet={}, floor={7: {'Docs': None}}, shard_logs={(7, 3): passed_log}, open_issues=open_issues)
              findings = judging['judge']('7', 'owner/repo', gh, SETTINGS)
              # One pass per open kind, carrying every subject of it the run judged and passed.
              assert [finding['kind'] for finding in findings] == list(open_issues) and all(finding['recovery'] for finding in findings), findings
              passed = {finding['kind']: finding['passed'] for finding in findings}
              for kind, subject in [('CI run slower than its baseline', 'Test jobs on unknown'), ('Compile cache below its hit-rate floor', 'docs'),
                                    ('Test shards unbalanced', 'Test shard (3/16)'), ('Test over 30 seconds', 'crate one')]:
                  assert passed[kind][subject].startswith('Run: https://example.test/runs/7\nRust CI (merge_group, main) passed this guard: '), passed[kind]
              assert all('every subject listed here has passed' in finding['body'] for finding in findings), findings
              # The pass reports what the run judged, not the limit it did not cross.
              assert '16.50 s per test run against a baseline of 16.50 s, inside the 10% limit' in passed['CI run slower than its baseline']['Test jobs on unknown']
              assert 'its compile cache hit rate stayed over the floor' in passed['Compile cache below its hit-rate floor']['docs']
              # The subject that breached is never also passed, even when another job of the run judged it and passed: the run says it is still broken.
              gh, _ = fake_repository(ratchet={}, open_issues=open_issues, pace={7: (1.11, 100)})
              findings = judging['judge']('7', 'owner/repo', gh, SETTINGS)
              assert [finding['title'] for finding in findings if not finding.get('recovery')] == ['CI run slower than its baseline: Test jobs on unknown'], findings
              slower = next(finding['passed'] for finding in findings if finding.get('recovery') and finding['kind'] == 'CI run slower than its baseline')
              assert list(slower) == ['Build jobs on unknown'], slower
              cold = 'Compile cache hit rate 40.00% is below the 90% floor in shape docs: cold snapshot'
              gh, _ = fake_repository(ratchet={}, open_issues=open_issues, floor={7: {'Format and lint': cold, 'Docs': None}})
              findings = judging['judge']('7', 'owner/repo', gh, SETTINGS)
              assert [finding['title'] for finding in findings if not finding.get('recovery')] == ['Compile cache below its hit-rate floor: docs'], findings
              assert 'Compile cache below its hit-rate floor' not in [finding['kind'] for finding in findings if finding.get('recovery')], findings
              # A pass with no open issue says nothing at all.
              gh, _ = fake_repository(ratchet={})
              assert judging['judge']('7', 'owner/repo', gh, SETTINGS) == []
              # Two shards over the margin are one imbalance and one silence: the shard that is not blamed has not passed.
              over = [26] * 14 + [45, 50]
              gh, _ = fake_repository(ratchet={}, shard_minutes=over, open_issues={'Test shards unbalanced': breaching('Test shard (15/16)')})
              findings = judging['judge']('7', 'owner/repo', gh, SETTINGS)
              assert [finding['title'] for finding in findings if not finding.get('recovery')] == ['Test shards unbalanced: Test shard (16/16)'], findings
              assert list(findings[1]['passed']) == [f'Test shard ({n}/16)' for n in range(1, 15)], findings[1]
              # And a recovery is a rewrite and a comment on each issue whose listed subjects all passed: nothing is opened and nothing is closed.
              gh, created = fake_repository(ratchet={}, open_issues=open_issues)
              judging['file_issues'](judging['judge']('7', 'owner/repo', gh, SETTINGS), 'owner/repo', gh)
              assert created == [] and [number for number, _ in gh.edited] == ['50', '52'], (created, gh.edited)
              assert [number for number, body in gh.comments if not judging['RECORD'].match(body)] == ['50', '52'] and \
                  all('every subject listed here has passed' in body for _, body in gh.comments if not judging['RECORD'].match(body)), gh.comments

          judge_passes_each_subject_it_judged_once_per_open_kind()
          print('PASS judge_passes_each_subject_it_judged_once_per_open_kind')

          def recorded_repository(record, tracker, shards):
              """Serves judge one recorded run as a merge group with no earlier runs: its test shards, its slow and passing tests in one shard's log,
              and the jobs that judged their compile cache; issue calls go to `tracker`. A shard of the verdicts (`shards`), a test or a cache shape
              that the record leaves out did not run in it, so the run neither breaches nor passes it."""
              identifier = record['id']
              run = {'id': identifier, 'name': 'Rust CI', 'head_branch': 'gh-readonly-queue/main', 'html_url': f'https://example.test/runs/{identifier}',
                     'status': 'completed', 'conclusion': 'success', 'event': 'merge_group', 'workflow_id': 9,
                     'created_at': moment(0), 'run_started_at': moment(0)}
              blamed = {record['blamed'][0]: record['blamed'][1]} if record['blamed'] else {}
              median = record['blamed'][2] if record['blamed'] else 2.4
              minutes = {f'Test shard ({n}/16)': median for n in range(1, 17)} | record['balanced'] | blamed
              ran = [name for name in minutes if name in blamed or name in record['balanced'] or name not in shards]
              jobs = [job(name, minutes[name], identifier=index + 1, steps=[('Tests', minutes[name] * 60)]) for index, name in enumerate(ran)]
              tests = [f'SLOW [> {mark:.3f}s] (─────) {test}' for test, mark in record['slow'].items()] + [f'PASS [   1.2s] {test}' for test in record['fast']]
              logs, notes = {1: '\n'.join(tests + ['Summary [1.0s] 1 test run', ''])}, {}
              judged = {name: shape for shape, name in record['warm'].items()} | {name: None for lines in record['cold'].values() for name, _ in lines}
              for index, (name, shape) in enumerate(judged.items(), start=100):
                  jobs.append(job(name, 5, identifier=index, steps=[('Compile cache hit-rate floor', 1)]))
                  logs[index] = f'Compile cache hit rate 99.50% (floor 90%) in shape {shape}\n' if shape else ''
                  notes[index] = [{'title': 'Compile cache floor', 'message': message} for lines in record['cold'].values() for owner, message in lines if owner == name]
              def gh(*argv, body=None):
                  text = ' '.join(argv)
                  if argv[0] != 'api':
                      return tracker(*argv, body=body)
                  if re.search(r'actions/runs/\d+/jobs', text):
                      return json.dumps([{'jobs': jobs}])
                  if re.search(r'actions/runs/\d+$', text):
                      return json.dumps(run)
                  if found := re.search(r'check-runs/(\d+)/annotations', text):
                      return json.dumps(notes.get(int(found[1]), []))
                  if found := re.search(r'actions/jobs/(\d+)/logs', text):
                      return logs.get(int(found[1]), 'Summary [1.0s] 1 test run\n')
                  if text.endswith('actions/cache/usage'):
                      return json.dumps({'active_caches_size_in_bytes': 0, 'active_caches_count': 0})
                  if 'actions/runs?' in text:
                      return json.dumps({'workflow_runs': [run]})
                  raise AssertionError(f'unexpected gh call: {text}')
              return gh

          def one_cause_keeps_one_issue_per_kind_through_the_recorded_fan_out():
              # The verdicts the guards posted on eleven Maestro issues over two days, replayed run by run through judge and file_issues.
              verdicts = json.loads((root / 'fixtures/guard-fan-out/verdicts.json').read_text(encoding='utf-8'))['runs']
              shards = {record['blamed'][0] for record in verdicts if record['blamed']} | {name for record in verdicts for name in record['balanced']}
              tracker = issue_tracker()
              for record in verdicts:
                  gh = recorded_repository(record, tracker, shards)
                  judging['file_issues'](judging['judge'](str(record['id']), 'owner/repo', gh, SETTINGS | {'required': []}), 'owner/repo', gh)
              # The slow browser build opened four slow-test issues and a second shard issue, and the cold snapshot five floor issues: here each cause is one issue.
              assert [issue['title'] for issue in tracker.issues] == ['Test over 30 seconds', 'Test shards unbalanced', 'Compile cache below its hit-rate floor'], \
                  [issue['title'] for issue in tracker.issues]
              slow, unbalanced, floor = (listed(tracker, number) for number in (1, 2, 3))
              def run(identifier):
                  return f'https://example.test/runs/{identifier}'
              browser = 'maestro-tooling::integration browser_author_build::'
              # Each subject is listed once, in place: its state, the run that first breached it and the last run that judged it.
              assert slow == {f'{browser}browser_author_check_preserves_adjacent_locks': ('Breaching', run(42230640970), f'Run: {run(42397121794)}'),
                              f'{browser}browser_author_bootstraps_from_empty_build_state': ('Breaching', run(42273102165), f'Run: {run(42397121794)}'),
                              f'{browser}browser_author_trunk_rejects_stale_lock_without_writes': ('Breaching', run(42291900908), f'Run: {run(42397121794)}'),
                              f'{browser}browser_assets_follow_relative_selected_identity': ('Breaching', run(42296204759), f'Run: {run(42397121794)}')}, slow
              assert unbalanced == {'Test shard (1/16)': ('Breaching', run(42245672751), f'Run: {run(42393174958)}'),
                                    'Test shard (2/16)': ('Passed', run(42273102165), f'Run: {run(42332174644)}')}, unbalanced
              assert floor == {'test-prepare': ('Breaching', run(42273102165), f'Run: {run(42397121794)}'),
                               'tests-plain': ('Breaching', run(42285912771), f'Run: {run(42397121794)}'),
                               'targets-clippy-aarch64-unknown-linux-gnu': ('Passed', run(42285912771), f'Run: {run(42342558647)}'),
                               'browser': ('Passed', run(42285912771), f'Run: {run(42343453409)}'),
                               'docs': ('Passed', run(42300656449), f'Run: {run(42342558647)}')}, floor
              # A comment marks a change only: a new subject, or the run after which none is breaching. The recorded issues held 5 to 26 comments each.
              changes = [[(comment.splitlines()[0].removeprefix(f'Run: {run("")}'), 'new' if 'New subjects' in comment else 'recovered')
                          for comment in [comment['body'] for comment in issue['comments']] if not judging['RECORD'].match(comment)]
                         for issue in tracker.issues]
              assert changes == [[('42245672751', 'recovered'), ('42273102165', 'new'), ('42291900908', 'new'), ('42296204759', 'new'),
                                  ('42310443432', 'recovered'), ('42318972038', 'recovered'), ('42334480205', 'recovered')],
                                 [('42273102165', 'new')],
                                 [('42285912771', 'new'), ('42300656449', 'new'), ('42310443432', 'recovered'), ('42321201850', 'recovered'),
                                  ('42343453409', 'recovered')]], changes

          one_cause_keeps_one_issue_per_kind_through_the_recorded_fan_out()
          print('PASS one_cause_keeps_one_issue_per_kind_through_the_recorded_fan_out')

          def two_runs_that_read_before_either_opened_keep_one_issue():
              # Two merge groups finished together (maestro runs 42464709437 and 42464708050): both judged the kind before either had
              # opened its issue, so both opened one and the second stayed open, never updated again. The lower number holds the kind,
              # the duplicate points at it and keeps its own copy of the run's findings, and a later run folds the duplicate in and closes it.
              shard = partial(judging['finding'], 'Test shards unbalanced')
              def blamed(number, minutes, median, shard_number):
                  return shard(f'Test shard ({shard_number}/16)', run_of(number, 26),
                               f'Run: https://example.test/runs/{number}\nIt took {minutes} min against a median shard of {median} min.\n')
              def passing(number, subject):
                  return judging['recovery']('Test shards unbalanced', run_of(number, 39), {subject: 'it ran without crossing a slow mark'})
              gh = issue_tracker()
              before_either = judging['open_numbers']('owner/repo', gh)
              assert judging['file_issues']([blamed(7, 6.3, 2.4, 1)], 'owner/repo', gh, before_either) == ['Test shards unbalanced']
              judging['file_issues']([blamed(8, 5.2, 2.5, 2)], 'owner/repo', gh, before_either)
              # The issue that became the kind's keeps both runs' subjects, and only the subject the second run added is news.
              assert listed(gh, 1) == {'Test shard (1/16)': ('Breaching', 'https://example.test/runs/7', 'Run: https://example.test/runs/7'),
                                       'Test shard (2/16)': ('Breaching', 'https://example.test/runs/8', 'Run: https://example.test/runs/8')}, gh.issues[0]
              assert news(gh, 1) == ['Run: https://example.test/runs/8\nNew subjects: `Test shard (2/16)`.\n'], gh.issues[0]
              # The duplicate the losing run opened stays open with its own copy and a pointer to the issue that holds the kind: a write built
              # from another run's read can drop a subject, so only a later run that reads the survivor back closes it.
              assert [(issue['number'], issue['state']) for issue in gh.issues] == [(1, 'open'), (2, 'open')], gh.issues
              assert [int(number) for number in re.findall(r'#(\d+)', ' '.join(news(gh, 2)))] == [1], gh.issues[1]
              assert set(listed(gh, 2)) == {'Test shard (2/16)'}, gh.issues[1]
              judging['file_issues']([passing(11, 'Test shard (2/16)')], 'owner/repo', gh)
              assert [issue['number'] for issue in gh.issues if issue['state'] == 'open'] == [1], gh.issues
              assert set(listed(gh, 1)) == {'Test shard (1/16)', 'Test shard (2/16)'}, gh.issues[0]
              # A run that is the only one judging its kind closes nothing.
              gh = issue_tracker()
              judging['file_issues']([blamed(9, 6.3, 2.4, 3)], 'owner/repo', gh, judging['open_numbers']('owner/repo', gh))
              assert [(issue['number'], issue['state']) for issue in gh.issues] == [(1, 'open')] and not [call for call in gh.calls if call[:2] == ('issue', 'close')], gh.calls

          two_runs_that_read_before_either_opened_keep_one_issue()
          print('PASS two_runs_that_read_before_either_opened_keep_one_issue')

          def overlapping_writes_to_one_issue_lose_no_subject():
              # Three merge groups finished together: all three judged the kind before any issue existed, so each opened one. The third read
              # the surviving issue before the second had written it, so it wrote the body it read and the second run's subject left that
              # body. The record the guard writes first still lists it, and the next run puts it back before closing anything.
              shard = partial(judging['finding'], 'Test shards unbalanced')
              def blamed(number, shard_number):
                  return shard(f'Test shard ({shard_number}/16)', run_of(number, 26),
                               f'Run: https://example.test/runs/{number}\nIt took 6 min against a median shard of 2 min.\n')
              gh = issue_tracker()
              started = judging['open_numbers']('owner/repo', gh)
              judging['file_issues']([blamed(7, 1)], 'owner/repo', gh, started)
              read_before_the_write = {'body': gh.issues[0]['body'], 'comments': list(gh.issues[0]['comments'])}
              judging['file_issues']([blamed(8, 2)], 'owner/repo', gh, started)
              stale = []
              def gh_read_before_the_write(*argv, body=None):
                  # The third run's view of the surviving issue returns what it read before the second run wrote over it.
                  if argv[:2] == ('issue', 'view') and argv[2] == '1' and not stale:
                      stale.append(argv)
                      return json.dumps(read_before_the_write)
                  return gh(*argv, body=body)
              gh_read_before_the_write.issues, gh_read_before_the_write.calls = gh.issues, gh.calls
              judging['file_issues']([blamed(9, 3)], 'owner/repo', gh_read_before_the_write, started)
              assert stale, 'the third run read the surviving issue'
              # The survivor's body misses the second run's subject, and the record holds it, so no run has to read a duplicate again. The record
              # holds what the body cannot: the subjects no body listed when a write added them.
              assert set(listed(gh, 1)) == {'Test shard (1/16)', 'Test shard (3/16)'}, gh.issues[0]
              assert set(listed(gh, 2)) == {'Test shard (2/16)'}, gh.issues[1]
              assert set(judging['read_back'](1, 'owner/repo', gh)[1]) == {'Test shard (2/16)', 'Test shard (3/16)'}, gh.issues[0]
              assert [issue['number'] for issue in gh.issues if issue['state'] == 'open'] == [1, 2, 3], gh.issues
              # A later run folds every duplicate's subjects into the survivor, records them, and only then closes the duplicates.
              judging['file_issues']([judging['recovery']('Test shards unbalanced', run_of(11, 39), {'Test shard (1/16)': 'it ran without crossing a slow mark'})],
                                     'owner/repo', gh)
              assert [issue['number'] for issue in gh.issues if issue['state'] == 'open'] == [1], gh.issues
              assert set(listed(gh, 1)) == {'Test shard (1/16)', 'Test shard (2/16)', 'Test shard (3/16)'}, gh.issues[0]
              assert listed(gh, 1)['Test shard (2/16)'][:2] == ('Breaching', 'https://example.test/runs/8'), gh.issues[0]
              # A duplicate older than the run folds in the same way, whether or not this run opened an issue.
              gh = issue_tracker(('Test shards unbalanced', listing(('Test shard (1/16)', 'Breaching', 1, 'Run: https://example.test/runs/1\nfirst'))),
                                 ('Test shards unbalanced', listing(('Test shard (2/16)', 'Breaching', 2, 'Run: https://example.test/runs/2\nsecond'))))
              assert judging['open_numbers']('owner/repo', gh) == {'Test shards unbalanced': [1, 2]}
              judging['file_issues']([blamed(10, 3)], 'owner/repo', gh, judging['open_numbers']('owner/repo', gh))
              assert [issue['number'] for issue in gh.issues if issue['state'] == 'open'] == [1], gh.issues
              assert set(listed(gh, 1)) == {'Test shard (1/16)', 'Test shard (2/16)', 'Test shard (3/16)'}, gh.issues[0]

          overlapping_writes_to_one_issue_lose_no_subject()
          print('PASS overlapping_writes_to_one_issue_lose_no_subject')

          def a_stale_writer_cannot_erase_a_subject_whose_duplicate_closed():
              # Two merge groups finished together and both opened the kind's issue, so the second number holds its own findings as a
              # duplicate. A third run created its duplicate before either issue existed, read the surviving issue, and wrote the body it read
              # only after a later run had folded the second in and closed it. That write dropped the folded subject, and a closed duplicate
              # lists nothing again. The record the guard keeps holds what every write listed, so the next run puts the subject back.
              shard = partial(judging['finding'], 'Test shards unbalanced')
              def blamed(number, shard_number):
                  return shard(f'Test shard ({shard_number}/16)', run_of(number, 26),
                               f'Run: https://example.test/runs/{number}\nIt took 6 min against a median shard of 2 min.\n')
              gh = issue_tracker(('Test shards unbalanced', listing(('Test shard (1/16)', 'Breaching', 1, 'Run: https://example.test/runs/1\nfirst'))),
                                 ('Test shards unbalanced', listing(('Test shard (2/16)', 'Breaching', 2, 'Run: https://example.test/runs/2\nsecond'))))
              before_the_fold = {'body': gh.issues[0]['body'], 'comments': list(gh.issues[0]['comments'])}
              # A later run folds the duplicate in, records what the fold lists, and closes the duplicate.
              judging['file_issues']([blamed(11, 3)], 'owner/repo', gh)
              assert [issue['number'] for issue in gh.issues if issue['state'] == 'open'] == [1], gh.issues
              assert set(listed(gh, 1)) == {'Test shard (1/16)', 'Test shard (2/16)', 'Test shard (3/16)'}, gh.issues[0]
              # The third run read no open issue, so it opens its own and writes the surviving issue it read before the fold.
              frozen = []
              def gh_read_before_the_fold(*argv, body=None):
                  if argv[:2] == ('issue', 'view') and argv[2] == '1' and not frozen:
                      frozen.append(argv)
                      return json.dumps(before_the_fold)
                  return gh(*argv, body=body)
              judging['file_issues']([blamed(12, 4)], 'owner/repo', gh_read_before_the_fold, {})
              assert frozen, 'the third run read the surviving issue before the fold'
              # The write from that read drops both subjects the fold listed, and the closed duplicate cannot list them again.
              assert set(listed(gh, 1)) == {'Test shard (1/16)', 'Test shard (4/16)'}, gh.issues[0]
              assert gh.issues[1]['state'] == 'closed', gh.issues
              # The next run rebuilds the body from the record the guard keeps, so every subject is listed again where it was.
              judging['file_issues']([blamed(13, 5)], 'owner/repo', gh)
              assert set(listed(gh, 1)) == {f'Test shard ({number}/16)' for number in (1, 2, 3, 4, 5)}, gh.issues[0]
              assert listed(gh, 1)['Test shard (2/16)'][:2] == ('Breaching', 'https://example.test/runs/2'), gh.issues[0]
              assert set(judging['read_back'](1, 'owner/repo', gh)[1]) == {f'Test shard ({number}/16)' for number in (2, 3, 4, 5)}, gh.issues[0]
              assert [issue['number'] for issue in gh.issues if issue['state'] == 'open'] == [1], gh.issues

          a_stale_writer_cannot_erase_a_subject_whose_duplicate_closed()
          print('PASS a_stale_writer_cannot_erase_a_subject_whose_duplicate_closed')

