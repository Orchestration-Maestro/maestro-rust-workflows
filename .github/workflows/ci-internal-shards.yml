          import hashlib
          import http.server
          import io
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          import threading
          import zipfile

          workflow = pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=workflow, text=True))
          job = document['jobs']['tests']
          steps = {step['name']: step for step in job['steps']}
          payload = os.urandom(5 * 1024 * 1024)

          def archive():
              buffer = io.BytesIO()
              with zipfile.ZipFile(buffer, 'w') as bundle:
                  bundle.writestr('test-binaries.tar.zst', payload)
              return buffer.getvalue()

          # The test archive artifact: one archive per shard and the count of test binaries in each.
          shard_payload, manifest = os.urandom(3 * 1024 * 1024), b'{"shard-1.tar.zst": 3, "shard-2.tar.zst": 2}'

          def sharded(compression=zipfile.ZIP_STORED):
              buffer = io.BytesIO()
              with zipfile.ZipFile(buffer, 'w', compression) as bundle:
                  bundle.writestr('shard-1.tar.zst', payload)
                  bundle.writestr('shard-2.tar.zst', shard_payload)
                  bundle.writestr('test-binaries.json', manifest)
              return buffer.getvalue()

          def stored_bytes(blob, member):
              # Where the member's bytes sit in the zip: after its local header, its name and its extra field.
              with zipfile.ZipFile(io.BytesIO(blob)) as bundle:
                  entry = bundle.getinfo(member)
              start = entry.header_offset + 30 + len(entry.filename.encode()) + int.from_bytes(blob[entry.header_offset + 28:entry.header_offset + 30], 'little')
              return start, start + entry.compress_size

          class Storage(http.server.BaseHTTPRequestHandler):
              def log_message(self, *args):
                  pass

              def do_GET(self):
                  server = self.server
                  path = self.path.split('?')[0]
                  server.requests.append((path, self.headers.get('Range'), self.headers.get('Authorization')))
                  listing = re.fullmatch(r'/repos/o/r/actions/runs/(\d+)/artifacts', path)
                  if listing:
                      if server.listing_fails:
                          return self.send_error(500)
                      digest = 'sha256:' + hashlib.sha256(server.blob).hexdigest() if server.digest else None
                      run = int(listing[1])
                      artifacts = [] if run in server.without_artifact else [{'id': run + 2, 'name': 'test-archive-root', 'size_in_bytes': len(server.blob),
                                                                               'expired': False, 'digest': digest}]
                      return self.reply(200, json.dumps({'artifacts': artifacts}).encode())
                  if re.fullmatch(r'/repos/o/r/actions/artifacts/\d+/zip', path):
                      self.send_response(302)
                      self.send_header('Location', f'http://127.0.0.1:{server.server_port}/blob?run={int(path.split("/")[-2]) - 2}')
                      self.send_header('Content-Length', '0')
                      return self.end_headers()
                  assert path == '/blob', path
                  requested = self.headers.get('Range')
                  if requested and server.ranges:
                      start, end = map(int, re.fullmatch(r'bytes=(\d+)-(\d+)', requested).groups())
                      body = bytearray(server.blob[start:end + 1])
                      if (server.corrupt or int(re.search(r'run=(\d+)', self.path)[1]) in server.corrupt_runs) and start > 0:
                          body[0] ^= 0xff
                      if server.corrupt_at is not None and start <= server.corrupt_at <= end:
                          body[server.corrupt_at - start] ^= 0xff
                      if server.fault == 'fail' and start > 0:
                          return self.send_error(500)
                      if server.fault == 'ignored' and start > 0:
                          return self.reply(200, bytes(body))
                      if server.fault == 'short' and start > 0:
                          body = body[:-1]
                      return self.reply(206, bytes(body), {'Content-Range': f'bytes {start}-{end}/{len(server.blob)}'})
                  self.reply(200, server.blob)

              def reply(self, status, body, headers=None):
                  self.send_response(status)
                  self.send_header('Content-Length', str(len(body)))
                  for name, value in (headers or {}).items():
                      self.send_header(name, value)
                  self.end_headers()
                  self.wfile.write(body)

          def download(ranges=True, corrupt=False, digest=True, listing_fails=False, fault=None, run_ids='', without_artifact=(), corrupt_runs=(),
                       blob=None, members='', corrupt_at=None):
              server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), Storage)
              server.blob, server.requests, server.corrupt_at = blob or archive(), [], corrupt_at
              server.handle_error = lambda *arguments: None  # a client that gave up on a range resets its connection
              server.ranges, server.corrupt, server.digest, server.listing_fails, server.fault = ranges, corrupt, digest, listing_fails, fault
              server.without_artifact, server.corrupt_runs = without_artifact, corrupt_runs
              threading.Thread(target=server.serve_forever, daemon=True).start()
              try:
                  with tempfile.TemporaryDirectory() as temporary:
                      base = pathlib.Path(temporary)
                      (base / 'runner').mkdir()
                      (base / 'out').mkdir()
                      env = {**os.environ, 'GH_TOKEN': 'secret-token', 'GITHUB_API_URL': f'http://127.0.0.1:{server.server_port}',
                             'GITHUB_REPOSITORY': 'o/r', 'GITHUB_RUN_ID': '7', 'ARTIFACT_NAME': 'test-archive-root',
                             'ARTIFACT_PATH': str(base / 'out'), 'RUNNER_TEMP': str(base / 'runner'), 'GITHUB_OUTPUT': str(base / 'output'),
                             'ARTIFACT_RUN_IDS': run_ids, 'ARTIFACT_MEMBERS': members}
                      (base / 'output').write_text('', encoding='utf-8')
                      result = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', steps['Download test archive']['run']],
                                              env=env, capture_output=True, text=True)
                      files = sorted(str(path.relative_to(base / 'out')) for path in (base / 'out').rglob('*') if path.is_file())
                      extracted = (base / 'out/test-binaries.tar.zst').read_bytes() if files == ['test-binaries.tar.zst'] else b''
                      outputs = (base / 'output').read_text(encoding='utf-8').split()
                      leftovers = list((base / 'runner').iterdir())
                      return result, server, files, extracted, outputs, leftovers
              finally:
                  server.shutdown()

          def line(result):
              found = re.findall(r'^artifact-download name=(\S+) bytes=(\d+) seconds=(\d+\.\d\d) mb_per_second=\d+\.\d\d streams=(\d+)$', result.stdout, re.MULTILINE)
              assert len(found) == 1, result.stdout
              return found[0]

          def transfer_rate_matches_bytes_and_transfer_seconds():
              for options in [{}, {'ranges': False}, {'listing_fails': True}]:
                  result, server, files, extracted, outputs, leftovers = download(**options)
                  assert result.returncode == 0, result.stderr
                  _, size, seconds, streams = line(result)
