              assert found == [{'filter': 'test(=kept)', 'seconds': 210, 'issues': [3661]},
                               {'filter': 'test(=unnamed)', 'seconds': 210, 'issues': []},
                               {'filter': 'test(=closed)', 'seconds': 180, 'issues': [3700]}], found
              assert exceptions['nextest_exceptions']('[profile.default]\nslow-timeout = "60s"\n', 120) == []

          exceptions_over_the_hang_limit_are_found_with_their_issues()
          print('PASS exceptions_over_the_hang_limit_are_found_with_their_issues')

          def an_exception_without_an_open_issue_is_refused():
              found = exceptions['nextest_exceptions'](NEXTEST, 120)
              states = {3661: 'OPEN', 3700: 'CLOSED'}
              assert exceptions['exception_findings'](found, states.get) == [
                  'the 210-second exception for test(=unnamed) names no issue; put its issue number in the comment above slow-timeout',
                  'the 180-second exception for test(=closed) is refused: #3700 is closed, so fix the test and remove the exception']
              assert exceptions['exception_findings'](found[:1], {3661: 'OPEN'}.get) == []
              assert exceptions['exception_findings']([{'filter': 'f', 'seconds': 150, 'issues': [1, 2]}], {1: 'CLOSED', 2: 'OPEN'}.get) == []

          an_exception_without_an_open_issue_is_refused()
          print('PASS an_exception_without_an_open_issue_is_refused')

          def exception_check_fails_the_job_when_an_issue_is_closed():
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  (directory / 'bin').mkdir()
                  fake = directory / 'bin/gh'
                  fake.write_text('#!/bin/sh\ncase "$3" in 3661) echo \'{"state":"OPEN"}\';; *) echo \'{"state":"CLOSED"}\';; esac\n', encoding='utf-8')
                  fake.chmod(0o755)
                  config = directory / 'nextest.toml'
                  env = os.environ | {'PATH': f"{directory / 'bin'}:{os.environ['PATH']}", 'REPOSITORY': 'owner/repo',
                                      'NEXTEST_CONFIG': str(config), 'HANG_LIMIT_SECONDS': '120'}
                  def check():
                      return subprocess.run(['python3', '-c', body('Test-time exceptions', guards)], env=env, cwd=directory,
                                            capture_output=True, text=True)
                  result = check()
                  assert result.returncode == 0 and 'no exceptions to check' in result.stdout, result.stdout + result.stderr
                  config.write_text(NEXTEST, encoding='utf-8')
                  result = check()
                  assert result.returncode == 1, result.stdout + result.stderr
                  assert 'is refused: #3700 is closed' in result.stdout and '3 test-time exceptions, 2 refused' in result.stdout, result.stdout
                  config.write_text('\n'.join(NEXTEST.splitlines()[:7]) + '\n', encoding='utf-8')
                  result = check()
                  assert result.returncode == 0 and '1 test-time exceptions, 0 refused' in result.stdout, result.stdout + result.stderr

          exception_check_fails_the_job_when_an_issue_is_closed()
          print('PASS exception_check_fails_the_job_when_an_issue_is_closed')

          def run_cache_floor(shape, stats, matched, listing):
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  (directory / 'bin').mkdir()
                  fake = directory / 'bin/gh'
                  fake.write_text('#!/bin/sh\n' + ('echo \'' + json.dumps({'actions_caches': [{'key': key} for key in listing]}) + '\'\n'
                                                    if listing is not None else 'echo denied >&2\nexit 1\n'), encoding='utf-8')
                  fake.chmod(0o755)
                  (directory / 'sccache-stats').write_text(stats, encoding='utf-8')
                  return execute('Compile cache hit-rate floor', directory, {
                      'PATH': f"{directory / 'bin'}:{os.environ['PATH']}", 'RUNNER_TEMP': str(directory),
                      'GITHUB_REPOSITORY': 'owner/repo', 'GH_TOKEN': 'unused', 'CACHE_SHAPE': shape,
                      'CACHE_MATCHED_KEY': matched, 'CACHE_PREFIX': 'maestro-compile-v1-aaa-'})

          def stats_of(executed, rate):
              return '\n'.join([f'Compile requests                     {executed + 3}', f'Compile requests executed            {executed}',
                                'Cache hits                           605', 'Cache misses                           0',
                                f'Cache hits rate                   {rate:.2f} %', f'Cache hits rate (Rust)            {rate:.2f} %', ''])

          def a_warm_build_below_the_cache_floor_warns_and_names_its_cause():
              prefix = 'maestro-compile-v1-aaa-'
              for rate in (100, 99.67, 90):
                  result = run_cache_floor('tests-coverage', stats_of(610, rate), prefix + '1-tests', [])
                  assert result.returncode == 0 and f'Compile cache hit rate {rate:.2f}% (floor 90%)' in result.stdout, result.stdout + result.stderr
              cases = [('tests-coverage', 40, prefix + '1-tests', [prefix + '1-tests'], 'cold snapshot'),
                       ('tests-coverage', 0, '', ['maestro-compile-v1-bbb-1-1-tests-0-abc', 'maestro-compile-v1-ccc-1-1-docs-0-abc'], 'key change'),
                       ('tests-coverage', 0, '', ['maestro-compile-v1-ccc-1-1-docs-0-abc'], 'eviction'),
                       ('tests-coverage', 0, '', [], 'eviction'),
                       ('tests-coverage', 0, '', None, 'cache list is unavailable'),
                       ('tests-coverage', 89.99, prefix + '1-tests', [], 'cold snapshot')]
              for shape, rate, matched, listing, cause in cases:
                  result = run_cache_floor(shape, stats_of(610, rate), matched, listing)
                  # A merge group never fails on the cache: its own change can invalidate it, and only a default-branch push seeds it again.
                  assert result.returncode == 0, (cause, result.stdout + result.stderr)
                  output = result.stdout + result.stderr
                  assert f'::warning title=Compile cache floor::Compile cache hit rate {rate:.2f}% is below the 90% floor: {cause}' in output or (
                      cause == 'cache list is unavailable' and 'no snapshot restored' in output and cause in output), (cause, output)
                  assert '::error' not in output, (cause, output)
              for shape, executed in [('tests-plain', 610), ('tests-coverage', 0)]:
                  result = run_cache_floor(shape, stats_of(executed, 0), '', [])
                  assert result.returncode == 0 and 'not judged' in result.stdout, (shape, result.stdout + result.stderr)

          a_warm_build_below_the_cache_floor_warns_and_names_its_cause()
          print('PASS a_warm_build_below_the_cache_floor_warns_and_names_its_cause')

          def the_cache_floor_runs_after_the_statistics_in_the_build_job_only():
              jobs = dict(re.findall(r'^  ([\w-]+):\n(.*?)(?=^  [\w-]+:\n|\Z)', workflow.split('\njobs:\n', 1)[1], re.MULTILINE | re.DOTALL))
              holders = [name for name, text in jobs.items() if '- name: Compile cache hit-rate floor\n' in text]
              assert holders == ['test-build'], holders
              text = jobs['test-build']
              assert text.index('- name: Compile cache statistics') < text.index('- name: Compile cache hit-rate floor')
              step = text.split('- name: Compile cache hit-rate floor\n', 1)[1].split('\n      - name: ', 1)[0]
              for line in ['CACHE_SHAPE: $' + '{{ steps.cache-identity.outputs.shape }}',
                           'CACHE_MATCHED_KEY: $' + '{{ steps.cache-restore.outputs.cache-matched-key }}',
                           'CACHE_PREFIX: $' + '{{ steps.cache-identity.outputs.prefix }}',
                           "if: job.status == 'success' && steps.cache-statistics.outcome == 'success'"]:
                  assert line in step, line
              assert 'permissions:\n      contents: read\n      actions: read\n' in text.split('steps:', 1)[0]
              assert "output.write(f'prefix={prefix}\\nkey={prefix}{suffix}\\nwriter={str(writer).lower()}\\nshape={shape}\\n')" in workflow

          the_cache_floor_runs_after_the_statistics_in_the_build_job_only()
          print('PASS the_cache_floor_runs_after_the_statistics_in_the_build_job_only')

          def required_checks_and_documented_defaults_stay_pinned():
              document = json.loads(subprocess.check_output(['yq', '-o=json', '-'], input=guards, text=True))
              pinned = json.loads(document['jobs']['guards']['steps'][0]['env']['REQUIRED_CHECKS'])
              names = re.findall(r'^    name: (.+)$', workflow, re.MULTILINE)
              for name in pinned:
                  assert any(name.rstrip('*') in line for line in names), f'ci.yml has no job named {name}'
              # Renaming either job drops a gate silently: the repository ruleset requires exactly these two checks.
              internal_names = re.findall(r'^    name: (.+)$', internal, re.MULTILINE)
              for name in ['Required repository quality', 'Required consumer tests']:
                  assert name in internal_names, name
              guide = ' '.join((root / 'docs/caller-checks.md').read_text(encoding='utf-8').split())
              for heading in ['## CI speed guards', '### Merge-run time budget', '### Compile-cache hit-rate floor', '### Selection check',
                              '### Shard balance', '### Test-time limit', '### Required checks']:
                  assert heading in guide, heading
              inputs = document['on']['workflow_call']['inputs']
              for name, value in inputs.items():
                  if isinstance(value.get('default'), (int, float)):
                      assert f"| `{name}` | {value['default']} |" in guide, name
              # Every input the table lists exists, so a removed input cannot stay documented.
              listed = set(re.findall(r'\| `([a-z-]+)` \|', guide.split('## CI speed guards', 1)[1]))
              assert listed <= set(inputs), listed - set(inputs)
              for name in ['accept-level', 'accept-seconds', 'accept-reason']:
                  assert name in inputs and f'`{name}`' in guide, name
              for source in ['40990557025', '40990555729', '40968689273', '40946549381']:
                  assert source in guide, source
              # The time guard is relative to the run's own baseline; a fixed minutes budget is not allowed.
              assert 'merge-run-budget-minutes' not in guide and 'merge-run-budget-minutes' not in guards
              assert 'median wall time of the previous five successful runs' in guide and 'plus 10%' in guide
              assert 'runner band' in guide and 'lowest such median' in guide and 'runner-band: <label>' in guide
              # The ratchet is stored in one issue and raised only by an explicit accept with a reason.
              assert 'issue titled "CI time ratchet"' in guide and 'only an accept with a reason raises it' in guide
              # The cache floor warns; the guards file one issue for it. The slow-test issues have no cap.
              assert 'never fails the build' in guide and 'Compile cache below its hit-rate floor' in guide
              assert 'one issue for every test' in guide

          required_checks_and_documented_defaults_stay_pinned()
          print('PASS required_checks_and_documented_defaults_stay_pinned')
