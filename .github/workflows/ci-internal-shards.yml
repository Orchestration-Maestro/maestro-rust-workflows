          def judge_escalates_what_stands_out_of_the_pattern():
              docs = [('Set up job', 5), ('Build docs', 240)]
              cases = [({'steps': {(7, 'Docs'): docs + [('Download corpus', 20)]}}, 'Escalation: jobs or steps changed without matching work'),
                       ({'steps': {(n, 'Test shard (1/16)'): [('Download test archive', 200 if n == 7 else 20)] for n in range(1, 8)}}, 'Escalation: jobs or steps changed without matching work'),
                       ({'pace': {7: (0.5, 100)}, 'minutes': 15.5}, 'Escalation: time per test run outside its normal spread'),
                       ({'build': {7: (1, 600, 60.0)}}, 'Escalation: compile cache hit rate outside its usual range'),
                       ({'selections': {7: (51, 51, 'shared input: Cargo.toml')}}, 'Escalation: test selection share outside its usual range')]
              for changed, title in cases:
                  gh, _ = fake_repository(**changed)
                  findings = judging['judge']('7', 'owner/repo', gh, SETTINGS)
