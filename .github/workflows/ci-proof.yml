name: macOS file-access diagnostics

on:
  push:
    branches: [ci/228-merge-proof]
    paths: [.github/workflows/ci.yml, .github/workflows/ci-proof.yml]

permissions:
  contents: read

jobs:
  maestro:
    name: macOS file-access diagnostics
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: maestro
      checkout-repository: Orchestration-Maestro/maestro
      checkout-ref: c9123bbff124ddd802c46b4fe568fbf5e8d72453
      concurrency-key: macos-diagnostics
      test-event: merge_group
