name: Maestro coverage proof

on:
  push:
    branches: [ci/228-merge-proof]
    paths: [.github/workflows/ci.yml, .github/workflows/ci-proof.yml]

permissions:
  contents: read

jobs:
  warm:
    name: Warm Maestro coverage cache
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: maestro
      checkout-repository: Orchestration-Maestro/maestro
      checkout-ref: 7a86f43b58ab6f613266c6290b68765e79daebd5
      concurrency-key: maestro-warm
      warm-cache: true

  maestro:
    needs: warm
    if: always()
    name: Maestro partitioned coverage
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: maestro
      checkout-repository: Orchestration-Maestro/maestro
      checkout-ref: b47360ed727388c16a4d61d459f0cf99d2bc88f6
      concurrency-key: maestro-proof
      test-event: merge_group

  selected:
    name: Maestro selected-package tests
    needs: warm
    if: always()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: maestro
      checkout-repository: Orchestration-Maestro/maestro
      checkout-ref: b47360ed727388c16a4d61d459f0cf99d2bc88f6
      checkout-base-ref: 7a86f43b58ab6f613266c6290b68765e79daebd5
      concurrency-key: maestro-selected
      test-event: merge_group

  comparison:
    name: Maestro single coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: workflow
      - name: Checkout Maestro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Orchestration-Maestro/maestro
          ref: b47360ed727388c16a4d61d459f0cf99d2bc88f6
          path: maestro
      - name: Extract workflow steps
        run: python3 workflow/.github/extract-workflow-steps.py
      - name: Free instrumented build space
        run: bash -e -o pipefail "$PROOF_STEPS/Free instrumented build space"
      - name: Toolchain
        working-directory: maestro
        run: bash -e -o pipefail "$PROOF_STEPS/Test toolchain"
      - name: Coverage tools
        timeout-minutes: 10
        run: bash -e -o pipefail "$PROOF_STEPS/Coverage tools"
      - name: Caller tools
        timeout-minutes: 10
        working-directory: maestro
        run: |
          bash -e -o pipefail "$PROOF_STEPS/Search tools"
          bash -e -o pipefail "$PROOF_STEPS/Mise bootstrap"
          while read -r bin; do export PATH="$bin:$PATH"; done < "$GITHUB_PATH"
          bash -e -o pipefail "$PROOF_STEPS/Test tools"
      - name: Single-job coverage baseline
        timeout-minutes: 45
        working-directory: maestro
        env:
          CARGO_COVERAGE_MIN_LINES: 80
        run: |
          start=$SECONDS
          bash -e -o pipefail "$PROOF_STEPS/Isolated tests"
          echo "Single-job coverage seconds: $((SECONDS - start))"
