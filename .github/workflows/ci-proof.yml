name: Maestro macOS key-frame proof

on:
  push:
    branches: [ci/228-merge-proof]
    paths: [.github/workflows/ci-proof.yml]

permissions:
  contents: read

jobs:
  maestro:
    name: Native macOS key frames
    runs-on: macos-15
    defaults:
      run:
        shell: bash
        working-directory: maestro
    env:
      TEST_PACKAGES: '["maestro-chat", "maestro-tools"]'
      COLLECT_COVERAGE: 'false'
      SHARD: '1'
      TEST_SHARD_COUNT: '1'
    steps:
      - name: Checkout workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: workflow
      - name: Checkout Maestro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Orchestration-Maestro/maestro
          ref: 42b64df183003b390b04a7aa68eccad6712ef393
          path: maestro
      - name: Extract workflow steps
        working-directory: .
        run: python3 workflow/.github/extract-workflow-steps.py
      - name: Test toolchain
        run: bash -e -o pipefail "$PROOF_STEPS/Test toolchain"
      - name: Test runner
        run: bash -e -o pipefail "$PROOF_STEPS/Coverage tools"
      - name: Search tools
        run: bash -e -o pipefail "$PROOF_STEPS/Search tools"
      - name: Native tests
        timeout-minutes: 45
        run: bash -e -o pipefail "$PROOF_STEPS/Isolated tests"
