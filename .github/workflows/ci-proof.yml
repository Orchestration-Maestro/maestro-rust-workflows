name: Maestro coverage proof

on:
  pull_request:
    paths: [.github/workflows/ci.yml, .github/workflows/ci-proof.yml]

permissions:
  contents: read

# Throwaway selection A/B for #138; never merged.
jobs:
  undeclared:
    name: Selection A, undeclared skill-pack change
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: maestro
      checkout-repository: Orchestration-Maestro/maestro
      checkout-ref: 3d5fbeb6ac5c1f8c11538bc0c72f7df93e766497
      checkout-base-ref: 88b71ca9e90df0665e942b0f1a6b771a909b7123
