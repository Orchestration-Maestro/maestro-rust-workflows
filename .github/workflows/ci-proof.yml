name: Windows wait-boundary diagnostics

on:
  push:
    branches: [ci/228-merge-proof]
    paths: [.github/workflows/ci.yml, .github/workflows/ci-proof.yml]

permissions:
  contents: read

jobs:
  maestro:
    name: Windows wait-boundary diagnostics
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: maestro
      checkout-repository: Orchestration-Maestro/maestro
      checkout-ref: 2fc7e82191bb0075c08177661deece214f03f12b
      concurrency-key: windows-diagnostics
      test-event: merge_group
