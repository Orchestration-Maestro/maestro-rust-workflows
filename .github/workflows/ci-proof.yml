name: Maestro coverage proof

on:
  pull_request:
    paths: [.github/workflows/ci.yml, .github/workflows/ci-proof.yml]

permissions:
  contents: read

jobs:
  maestro:
    name: Maestro partitioned coverage
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: maestro
      checkout-repository: Orchestration-Maestro/maestro
      checkout-ref: 7c0157ec7f57b86df19d1cf5f091b8714ab041e0
      concurrency-key: maestro-proof
      test-event: merge_group

  comparison:
    name: Maestro single coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: workflow
      - name: Checkout Maestro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Orchestration-Maestro/maestro
          ref: 7c0157ec7f57b86df19d1cf5f091b8714ab041e0
          path: maestro
      - name: Extract workflow steps
        shell: python
        run: |
          import os
          import pathlib
          import re
          import textwrap
          workflow = pathlib.Path('workflow/.github/workflows/ci.yml').read_text(encoding='utf-8')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'proof-steps'
          directory.mkdir()
          for step in workflow.split('      - name: ')[1:]:
              name = step.splitlines()[0]
              match = re.search(r'^        run: (?:&[\w-]+ )?\|\n((?:          .*\n|\n)+)', step, re.MULTILINE)
              if match:
                  (directory / name).write_text(textwrap.dedent(match[1]), encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'PROOF_STEPS={directory}\n')
      - name: Free instrumented build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Toolchain
        working-directory: maestro
        run: |
          rustup show
          rustup component add llvm-tools-preview
      - name: Coverage tools
        timeout-minutes: 10
        run: bash -e -o pipefail "$PROOF_STEPS/Coverage tools"
      - name: Caller tools
        timeout-minutes: 10
        working-directory: maestro
        run: |
          bash -e -o pipefail "$PROOF_STEPS/Search tools"
          bash -e -o pipefail "$PROOF_STEPS/Mise bootstrap"
          while read -r bin; do export PATH="$bin:$PATH"; done < "$GITHUB_PATH"
          bash -e -o pipefail "$PROOF_STEPS/Test tools"
      - name: Single-job coverage baseline
        timeout-minutes: 45
        working-directory: maestro
        env:
          CARGO_COVERAGE_MIN_LINES: 80
        run: |
          start=$SECONDS
          bash -e -o pipefail "$PROOF_STEPS/Isolated tests"
          echo "Single-job coverage seconds: $((SECONDS - start))"
