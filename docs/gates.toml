# The gates the README lists, one entry each, rendered into its three
# tables by `just docs`. kind: always, default or opt-in. `switch` is the
# input that turns a default gate off, or how an opt-in gate is turned on.
# Every proof names a test; a test checks that it exists.

[[gate]]
name = "Formatting, Clippy, tests"
kind = "always"
fails = "`cargo fmt --check`; Clippy with every warning denied, plus `todo!()` and `dbg!()`; unit, integration and doc tests"
standard = "SST-001"
proofs = [
  "example_gate_replays_ci_step_bodies_against_every_fixture",
  "a_failing_consumer_command_fails_the_step_with_its_own_status",
]

[[gate]]
name = "Strict rustdoc"
kind = "always"
fails = "A public item without documentation, or a broken intra-doc link or other rustdoc warning in any item, private ones included"
standard = "North Star, Maintainability"
proofs = [
  "strict_rustdoc_fails_the_run_when_cargo_doc_does",
  "a_broken_private_doc_fails_the_second_strict_rustdoc_build",
  "example_gate_replays_ci_step_bodies_against_every_fixture",
]

[[gate]]
name = "Line coverage"
kind = "always"
fails = "Below `coverage-threshold`, `90` by default and never lower (COV-001)"
standard = "North Star, Quality, COV-001"
proofs = [
  "line_coverage_below_the_threshold_fails_the_run",
  "ci_validates_toolchain_threshold_and_artifact_identity",
  "example_gate_replays_ci_step_bodies_against_every_fixture",
]

[[gate]]
name = "Advisories"
kind = "always"
fails = "A RustSec vulnerability, or a yanked, unsound or unmaintained crate"
standard = "SST-002"
proofs = ["scanners_propagate_findings_execution_errors_and_missing_tools"]

[[gate]]
name = "Secret scan"
kind = "always"
fails = "A secret anywhere in the source revision; the report is redacted"
standard = "SEC-001, SST-003"
proofs = ["scanners_propagate_findings_execution_errors_and_missing_tools"]

[[gate]]
name = "Declared MSRV"
kind = "always"
fails = "A workspace member without `rust-version`, one the selected compiler cannot satisfy, or a workspace that does not compile with the oldest compiler its declarations allow"
standard = "North Star, Quality"
proofs = [
  "the_declared_msrv_must_be_real_and_reachable",
  "the_declared_msrv_is_the_compiler_the_workspace_is_checked_with",
]

[[gate]]
name = "Feature combinations"
kind = "always"
fails = "A declared feature that does not compile alone, the default set, no features, or all features together; not a powerset or every feature added to defaults"
standard = "North Star, Quality"
proofs = [
  "every_declared_feature_is_compiled_and_a_broken_one_fails",
  "real_features_reject_broken_isolated_and_combined_builds",
  "dev_only_git_dependencies_allow_features_without_changing_lock_bytes",
  "dev_dependency_feature_unification_cannot_hide_broken_features",
  "a_new_lock_package_is_refused_and_original_bytes_restored",
  "cargo_hack_failure_still_restores_original_lock_bytes",
  "a_midway_manifest_edit_failure_restores_every_snapshotted_file",
]

[[gate]]
name = "Release build"
kind = "always"
fails = "A release build or release-mode test failure, a binary that does not rebuild to the same digest, one without PIE, RELRO, BIND_NOW and a non-executable stack, or one missing its embedded dependency list"
standard = "SCH-008, SCH-009"
proofs = ["the_release_build_must_be_reproducible_and_auditable_or_fail"]

[[gate]]
name = "Payload and SBOMs"
kind = "always"
fails = "A lockfile that changes during SBOM generation, an invalid CycloneDX or SPDX document, or a payload whose checksums do not verify"
standard = "SCH-003, SCH-004"
proofs = [
  "release_payload_carries_both_sbom_formats_and_auditable_binaries",
  "sbom_staging_rejects_malformed_data_and_emits_verifiable_payload",
]

[[gate]]
name = "Input validation"
kind = "always"
fails = "Any input the workflow cannot prove safe, before a job does any work: paths, versions, keys, publication boundaries"
standard = "SEC-002, SEC-003"
proofs = [
  "ci_rejects_unsafe_paths_and_symlinks",
  "ci_validates_toolchain_threshold_and_artifact_identity",
]

[[gate]]
name = "Mutation testing"
kind = "default"
switch = "`mutation-test: false`"
fails = "A surviving or timed-out mutant in the change: a pull request mutates its diff, a push or tag its own commit; shard evidence must be complete"
standard = "North Star, Quality"
proofs = [
  "mutation_testing_scopes_a_pull_request_to_its_diff",
  "mutation_testing_scopes_a_push_to_its_own_commit",
  "disabled_and_default_plans_never_invoke_cargo_mutants",
  "automatic_counts_choose_only_nonempty_complete_shards",
  "real_pinned_listings_partition_nested_push_diff_with_config_exclusions",
  "internal_shard_selftest_has_a_behavior_equivalent_two_shard_diff",
  "aggregation_merges_only_complete_identity_and_outcome_evidence",
  "aggregation_refuses_missing_duplicate_foreign_or_partial_results",
  "the_required_status_fails_unless_every_result_succeeded",
  "example_gate_replays_ci_step_bodies_against_every_fixture",
]

[[gate]]
name = "Unused dependencies"
kind = "default"
switch = "`unused-dependencies: false`"
fails = "A declared dependency no source file uses"
standard = "SCH-010"
proofs = [
  "unused_dependencies_and_recorded_audits_fail_the_run_when_their_tool_does",
]

[[gate]]
name = "`unsafe` ban"
kind = "default"
switch = "`unsafe-policy: allow`"
fails = "An `unsafe` block in your crates; dependencies are unaffected"
standard = "SST-001"
proofs = ["clippy_denies_leftover_scaffolding_at_every_level"]

[[gate]]
name = "SARIF reports"
kind = "default"
switch = "`sarif-reports: false`"
fails = "A Clippy or secret-scan SARIF report that is missing or empty; the organization's check shows the findings in code scanning"
standard = "SST-003"
proofs = [
  "sarif_reports_are_written_only_when_asked_and_never_empty",
  "sarif_reports_upload_from_the_organizations_check_alone",
]

[[gate]]
name = "Public API compatibility"
kind = "default"
switch = "`api-compatibility: false`"
fails = "A pull request that breaks a library's public API without `!` after the type in its title; not applicable to a push, a project without a library or Rust older than 1.93"
standard = "North Star, Quality"
proofs = [
  "an_undeclared_break_fails_the_pull_request",
  "a_declared_break_and_what_has_no_api_are_not_checked",
]

[[gate]]
name = "Dependency policy"
kind = "always"
fails = "A violation of DEP-001, the organization's policy the gate renders at run time: a duplicate version not excused in `maestro-quality.toml`, a wildcard, a source other than crates.io and the organization's git repositories `maestro-quality.toml` allows, a yanked or unmaintained crate, or a licence outside the reviewed list and `LICENSE_ALLOWLIST`; a committed `deny.toml`. No repository opts out: `license-policy: off` is refused"
standard = "SCH-010, DEP-001"
proofs = [
  "ci_validates_the_licence_and_unsafe_policies_before_any_work",
  "the_organization_allowlist_adds_licences_and_a_committed_policy_is_refused",
  "the_organization_dependency_policy_applies_to_every_repository",
  "a_dependency_policy_exception_allows_only_the_organization_git_repositories",
]

[[gate]]
name = "Recorded dependency audits"
kind = "default"
switch = "`dependency-audit: false`"
fails = "A dependency neither audited nor exempted, or a ledger without one of the six imports VET-001 requires"
standard = "SCH-007, VET-001"
proofs = [
  "unused_dependencies_and_recorded_audits_fail_the_run_when_their_tool_does",
]

[[gate]]
name = "Wider Clippy"
kind = "opt-in"
switch = "`clippy-level: pedantic` or `nursery`"
standard = "SST-001"
proofs = ["clippy_denies_leftover_scaffolding_at_every_level"]

[[gate]]
name = "Platform portability"
kind = "opt-in"
switch = "`platforms: macos windows linux-arm`; `cargo test` on each pinned runner, held by the required status"
standard = "North Star, Quality"
proofs = [
  "named_platforms_become_a_matrix_of_pinned_runners",
  "requested_platforms_must_pass_for_the_required_status",
]

[[gate]]
name = "Source rules"
kind = "always"
fails = "A finding of ARC, SIZE, NAME, DOC, LIB, TST, WSP or LNT: an import cycle, a door that does more than declare, a file or line past its limit, a name out of form, a lint not denied"
standard = "ARC, SIZE, NAME, DOC, LIB, TST, WSP and LNT"
proofs = [
  "an_import_cycle_between_two_files_is_refused_by_name",
  "a_door_holding_a_function_is_refused_and_a_listing_door_passes",
  "a_path_past_a_door_re_export_is_refused",
  "declared_layers_refuse_an_import_within_or_against_the_order",
  "layers_declared_for_a_root_no_target_has_are_refused",
  "a_seam_serving_one_outside_caller_is_refused_unless_excused",
  "a_binary_root_beyond_declarations_and_a_short_main_is_refused",
  "path_attributes_and_rust_includes_are_refused_while_include_str_passes",
  "the_quality_file_refuses_unknown_tables_and_unreasoned_exceptions",
  "oversized_files_and_lines_are_refused_and_three_hundred_is_reported",
  "package_names_follow_the_form_and_publishable_ones_the_prefix",
  "badly_named_tests_and_one_word_test_modules_are_refused",
  "a_file_without_a_module_comment_is_refused",
  "printing_from_a_library_is_refused_and_from_a_binary_allowed",
  "a_library_depending_on_anyhow_is_refused_but_a_binary_is_not",
  "sleeping_in_a_test_is_refused_unless_excused",
  "more_than_one_plain_integration_test_crate_is_refused",
  "workspace_members_inherit_their_settings_and_dependencies",
  "edition_resolver_and_lockfile_are_held",
  "tightened_limits_apply_and_loosened_ones_are_refused",
  "a_manifest_without_the_organization_lints_is_refused_until_written",
  "a_clippy_toml_looser_than_the_organization_s_is_refused",
  "clippy_knows_every_organization_lint_and_applies_it",
]

[[gate]]
name = "Repository hygiene"
kind = "always"
fails = "A marker without its issue, a pending snapshot, a large file, a mode or link fault, a missing README, LICENSE or CHANGELOG, a file named against its kind, a word a glossary never uses, a wide shell line"
standard = "HYG-001 to HYG-007, SIZE-003"
proofs = [
  "unlinked_markers_in_comments_are_refused_and_linked_ones_pass",
  "snapshots_large_files_modes_and_links_are_refused",
  "a_readme_a_licence_and_a_changelog_are_required",
  "file_names_follow_the_form_of_their_kind",
  "words_a_glossary_never_uses_are_refused_everywhere_but_records",
  "wide_shell_lines_and_justfiles_are_refused",
]

[[gate]]
name = "Managed files"
kind = "always"
fails = "A managed file whose bytes differ from the gate's rendering, missing ones included, or a file sync wrote before its tool took the organization's configuration at run time"
standard = "The generated files of every repository"
proofs = [
  "init_writes_every_managed_file_and_the_check_finds_them_equal",
  "a_managed_file_changed_by_hand_is_refused_and_sync_writes_it_back",
  "the_managed_files_step_refuses_a_difference_in_ci",
  "the_home_may_change_the_files_it_is_the_source_of",
  "tool_pins_of_the_repository_s_own_are_refused_with_the_replacement",
]

[[gate]]
name = "Commit hooks"
kind = "always"
fails = "A commit hook that fails over every file, a root justfile out of `just --fmt` among them"
standard = "The universal set, UNI"
proofs = [
  "the_hooks_step_runs_prek_over_every_file_and_skips_what_ci_runs_itself",
  "a_root_justfile_of_any_casing_is_held_to_just_s_own_format",
  "a_step_runs_locally_the_way_a_commit_hook_runs_it",
  "every_step_of_the_ci_job_runs_locally_or_says_why_not",
  "every_rendered_hook_runs_a_pinned_version_and_this_repository_runs_them_all",
  "the_rendered_hooks_run_in_a_fresh_clone_on_the_toolbelt_setup_installs",
]

[[gate]]
name = "Pull request rules"
kind = "always"
fails = "New lines under their coverage floor, or a feat or fix pull request that touches no test"
standard = "COV-002, PRL-001, PRL-002"
proofs = [
  "new_lines_that_never_run_are_refused_past_the_allowance",
  "a_feature_without_a_test_is_refused_and_a_large_change_reported",
]

[[gate]]
name = "Performance budget"
kind = "opt-in"
switch = "`[performance] benches` in maestro-quality.toml"
standard = "PRF-001"
proofs = [
  "a_benchmark_past_its_budget_is_refused_unless_excused",
  "nothing_is_measured_without_a_bench_a_base_or_the_pinned_gungraun",
]

[[gate]]
name = "Semantic-version compatibility"
kind = "opt-in"
switch = "`semver-check: true` on `publish-crate.yml`; off for a first publication, which has no baseline"
standard = "North Star, Quality"
proofs = ["semver_check_fails_the_publication_when_cargo_semver_checks_does"]

[[gate]]
name = "Signed build provenance"
kind = "opt-in"
switch = "`attest-binaries.yml`, see below"
standard = "SCH-001, SCH-002"
proofs = [
  "attestation_signs_only_bytes_it_verified_itself",
  "provenance_attestation_is_isolated_and_reverifies_the_payload",
]

[[gate]]
name = "Undefined-behaviour audit"
kind = "opt-in"
switch = "`unsafe-audit.yml`, Miri on nightly, see below"
standard = "SST-006"
proofs = [
  "the_undefined_behaviour_audit_refuses_to_pass_without_running_anything",
]

[[gate]]
name = "Fuzz regression"
kind = "opt-in"
switch = "`fuzz.yml`, bounded, from the committed corpus"
standard = "SST-006"
proofs = [
  "nightly_workflows_reject_every_malformed_input_before_touching_a_toolchain",
]

[[gate]]
name = "Release evidence"
kind = "opt-in"
switch = "`publish-evidence.yml`, release reports on a protected-tag GitHub Release"
standard = "SEC-008"
proofs = [
  "evidence_upload_requires_verified_files_and_the_existing_release",
  "evidence_publication_refuses_unverifiable_or_escaping_reports",
]
